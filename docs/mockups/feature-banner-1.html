<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Home · панель фичи в чате — 4 варианта</title>
<!--
  Макет: панель фичи в чате (волна 3 «Обзор фич»).
  Привязка: эпик 9919bd75-0b1c-4fda-8196-72354cbcba29, шаг М2 (lane front).
  Записка: feature-banner-1.md, токены: feature-banner-1-tokens.md.
  Файл самодостаточный: без внешних ресурсов. Сырые цвета живут ТОЛЬКО в блоке
  переменных ниже (копия theme.css); вся вёрстка — через var(--c-*).
-->
<style>
/* ===== Токены: копия frontend/src/lib/theme.css (светлая/тёмная).
   Единственное место с сырыми значениями; ниже — только var(--c-*). ===== */
:root {
  --c-bg-main:#F4F0E8; --c-bg-panel:#EDE7DC; --c-bg-card:#FBF8F2; --c-bg-white:#FFFFFF;
  --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E;
  --c-on-accent:#FBF8F2;
  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-divider:#DDD4C4; --c-dashed:#D0C6B4;
  --c-progress-track:#D8CFBE; --c-overlay:rgba(23,19,15,.42);
  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;
  --c-warning:#C9923E; --c-warning-bg:#FBEFE0; --c-warning-text:#8A6A28;
  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F; --c-danger-border:#F5C6BF;
  --c-info:#3E7CA6; --c-info-bg:#E7EFF5;
  --c-nav-ink:#2A251F; --c-on-nav-ink:#F4ECE1;
  --c-msg-bg:rgba(251,248,242,.42);
  --shadow-focus:0 0 0 3px rgba(217,119,87,.14);
  --shadow-card:0 2px 8px rgba(60,50,35,.05);
  --shadow-island:0 1px 2px rgba(60,50,35,.06),0 6px 20px rgba(60,50,35,.10);
  --shadow-dropdown:0 8px 28px rgba(60,50,35,.16);
  --shadow-modal:0 24px 60px rgba(23,19,15,.40);
  --shadow-sheet:0 -8px 28px rgba(60,50,35,.18);
  --shadow-thumb:0 1px 3px rgba(42,37,31,.12);
  --font-sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-serif:'PT Serif',Georgia,serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"] {
  --c-bg-main:#201C18; --c-bg-panel:#272320; --c-bg-card:#2E2A25; --c-bg-white:#2E2A25;
  --c-bg-selected:#38332D; --c-bg-inset:#1B1815;
  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072;
  --c-on-accent:#201C18;
  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C;
  --c-border:#3D3830; --c-border-light:#34302A; --c-divider:#454037; --c-dashed:#4A443B;
  --c-progress-track:#5C544A; --c-overlay:rgba(0,0,0,.62);
  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;
  --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E;
  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72; --c-danger-border:#5A2E26;
  --c-info:#5FA0CC; --c-info-bg:#1E2A33;
  --c-nav-ink:#EDE6DB; --c-on-nav-ink:#201C18;
  --c-msg-bg:rgba(46,42,37,.42);
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-island:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --shadow-dropdown:0 10px 32px rgba(0,0,0,.55);
  --shadow-modal:0 24px 60px rgba(0,0,0,.6);
  --shadow-sheet:0 -10px 32px rgba(0,0,0,.55);
  --shadow-thumb:0 1px 3px rgba(0,0,0,.45);
}

* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--c-bg-main); color:var(--c-text-primary); font:13px/1.45 var(--font-sans); overflow-x:hidden; }
/* Раздел 0 токенов: сброс UA у кнопок */
button { font:inherit; color:inherit; background:none; border:none; margin:0; padding:0; cursor:pointer; text-align:left; }
button:focus-visible, [tabindex]:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
.mono { font-family:var(--font-mono); }
.be { display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; color:var(--c-warning-text);
  background:var(--c-warning-bg); border-radius:6px; padding:0 6px; white-space:nowrap; vertical-align:middle; }

/* ===== Пульт макета (не часть продукта) ===== */
.mk { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:10px 14px; background:var(--c-bg-panel); border-bottom:1px solid var(--c-border); }
.mk h1 { margin:0; font-size:15px; font-weight:600; color:var(--c-text-heading); width:100%; }
.mk .grp { display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-width:0; }
.mk .lbl { font-size:10px; color:var(--c-text-muted); text-transform:uppercase; letter-spacing:.05em; }
.pills { display:inline-flex; flex-wrap:wrap; gap:2px; padding:2px; background:var(--c-bg-selected); border-radius:9px; }
.pills button { color:var(--c-text-secondary); padding:4px 9px; border-radius:7px; font-size:12px; }
.pills button.on { background:var(--c-bg-white); color:var(--c-text-heading); box-shadow:var(--shadow-thumb); font-weight:600; }
.note { padding:8px 14px 0; font-size:12.5px; color:var(--c-text-secondary); max-width:1240px; }
.note b { color:var(--c-text-heading); }
.meter { padding:4px 14px 8px; font:11px/1.4 var(--font-mono); color:var(--c-text-muted); }
.meter.ok b { color:var(--c-success-text); } .meter.bad b { color:var(--c-danger-text); }

/* ===== Рамка приложения ===== */
#stage { padding:0 14px 20px; }
#stage.w360 { max-width:388px; }
@media (max-width:719px) { #stage { padding:0; } .app.m { border:none; border-radius:0; } }
.app { position:relative; display:flex; gap:8px; padding:8px; height:760px; background:var(--c-bg-main);
  border:1px solid var(--c-border); border-radius:14px; overflow:hidden; }
.app.m { padding:0; gap:0; height:720px; border-radius:14px; }
.list { width:270px; flex-shrink:0; background:var(--c-bg-white); border-radius:14px; box-shadow:var(--shadow-island); padding:10px 8px; overflow:hidden; }
.app.m .list { display:none; }
.list .h { font-weight:600; color:var(--c-text-heading); padding:2px 8px 8px; }
.list .it { display:block; width:100%; padding:8px; border-radius:8px; color:var(--c-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list .it.on { background:var(--c-bg-selected); font-weight:600; }
.list .it small { display:block; font-size:11px; color:var(--c-text-muted); overflow:hidden; text-overflow:ellipsis; }
.chat { position:relative; flex:1; min-width:0; display:flex; flex-direction:column; }

/* Шапка чата */
.ch { display:flex; align-items:center; gap:10px; padding:8px 16px 10px; flex-shrink:0; min-width:0; }
.app.m .ch { padding:8px 8px 8px 4px; background:var(--c-bg-card); border-bottom:1px solid var(--c-border-light); }
.ch .bk { width:40px; height:40px; display:none; align-items:center; justify-content:center; color:var(--c-text-secondary); border-radius:8px; flex-shrink:0; }
.app.m .ch .bk { display:inline-flex; }
.av { display:inline-flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0;
  background:var(--c-accent-light); color:var(--c-accent); font-weight:700; }
.ch .av { width:40px; height:40px; font-size:14px; }
.ch .tt { min-width:0; flex:1; }
.ch .t1 { font:700 18px/1.25 var(--font-serif); color:var(--c-accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ch .t1 span { font-weight:400; color:var(--c-text-secondary); font-size:15px; }
.ch .t2 { display:flex; align-items:center; gap:6px; margin-top:2px; min-width:0; font-size:12px; color:var(--c-text-secondary); }
.ch .t2 .sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.stepchip { display:inline-flex; align-items:center; gap:3px; font-size:11px; color:var(--c-info); background:var(--c-info-bg); border-radius:6px; padding:0 6px; white-space:nowrap; flex-shrink:0; }
.backlink { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--c-text-secondary); padding:4px 6px; border-radius:8px; white-space:nowrap; flex-shrink:0; }
.backlink:hover { background:var(--c-bg-selected); color:var(--c-text-primary); }
.app.m .backlink { min-height:40px; }

/* Дорожки: верхняя (плашка), лента, композер. Все три центрируются ОДНОЙ
   колонкой .col: CHAT_MAX_W 950 + поле CHAT_GUTTER 16 с обеих сторон. Полоса
   прокрутки ленты резервируется симметрично (scrollbar-gutter both-edges) — и у
   дорожек без прокрутки тоже, иначе колонки разойдутся на ширину полосы. */
.lane { flex-shrink:0; overflow-y:hidden; scrollbar-gutter:stable both-edges; }
.feed { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; scrollbar-gutter:stable both-edges; position:relative; }
.col { max-width:950px; margin:0 auto; padding:0 16px; box-sizing:content-box; }
.app.m .col { padding:0 16px; }
.colin { width:100%; }
.lane.top .col { padding-top:2px; }
.lane.top:empty { display:none; }

/* Лента */
.msg { margin:12px 0; }
.msg.u { display:flex; justify-content:flex-end; }
.msg.u .b { background:var(--c-accent-light); color:var(--c-text-primary); border-radius:14px 14px 4px 14px; padding:8px 12px; max-width:78%; }
.msg.a .b { background:var(--c-msg-bg); border-radius:12px; padding:8px 4px; color:var(--c-text-primary); }
.msg.a .who { font-size:11px; color:var(--c-text-muted); margin-bottom:2px; }
.toolline { font:11px var(--font-mono); color:var(--c-text-muted); padding:4px 0; }

/* Композер */
.lane.bot { padding:6px 0 10px; }
.cmp { display:flex; align-items:center; gap:8px; background:var(--c-bg-white); border:1px solid var(--c-border); border-radius:14px;
  padding:10px 12px; min-height:48px; color:var(--c-text-muted); box-shadow:var(--shadow-card); }
.cmp.focus { box-shadow:var(--shadow-focus); border-color:var(--c-accent-muted); color:var(--c-text-primary); }
.cmp .ph { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ===== Общие кирпичи панели ===== */
.glyph { width:13px; height:13px; flex-shrink:0; display:inline-block; }
.dots { display:inline-flex; align-items:center; gap:3px; flex-shrink:0; }
.dots i { width:6px; height:6px; border-radius:3px; background:var(--c-progress-track); display:block; }
.dots i.d { background:var(--c-success); }
.dots i.a { width:16px; background:var(--c-text-heading); }
.dots i.a.wait { background:var(--c-info); } .dots i.a.stop { background:var(--c-danger); }
.dots i.x { background:none; box-shadow:inset 0 0 0 1px var(--c-dashed); }
.tone-wait { color:var(--c-info); font-weight:600; }
.tone-stop { color:var(--c-danger-text); font-weight:600; }
.tone-done { color:var(--c-success-text); }
.tone-closed, .tone-mute { color:var(--c-text-muted); }
.role { font:11px var(--font-mono); color:var(--c-text-secondary); background:var(--c-bg-selected); border-radius:6px; padding:0 5px; white-space:nowrap; flex-shrink:0; }
.role.key { color:var(--c-accent); background:var(--c-accent-light); font-weight:700; }
.rolebtn { display:inline-flex; align-items:center; cursor:help; border-radius:6px; flex-shrink:0; }
.ppl { display:inline-flex; align-items:center; flex-shrink:0; }
.ppl .av { width:20px; height:20px; font-size:9px; box-shadow:0 0 0 2px var(--c-bg-card); background:var(--c-bg-selected); color:var(--c-text-secondary); }
.ppl .av + .av { margin-left:-5px; }
.ppl .av.me { background:var(--c-accent-light); color:var(--c-accent); }
.lnk { display:inline-flex; align-items:center; gap:4px; color:var(--c-accent); font-weight:600; font-size:12px; border-radius:8px; padding:4px 8px; white-space:nowrap; flex-shrink:0; }
.lnk:hover { background:var(--c-accent-light); }
.lnk.mute { color:var(--c-text-secondary); font-weight:400; }
.lnk.mute:hover { background:var(--c-bg-selected); color:var(--c-text-primary); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; height:26px; padding:0 10px; border-radius:8px; font-size:12px; font-weight:600; white-space:nowrap; flex-shrink:0; }
.btn.pri { background:var(--c-accent); color:var(--c-on-accent); }
.btn.pri:hover { filter:brightness(1.05); }
.btn.info { background:var(--c-info); color:var(--c-on-accent); }
.btn.gh { border:1px solid var(--c-border); color:var(--c-text-secondary); background:var(--c-bg-white); }
.btn.gh:hover { background:var(--c-bg-selected); color:var(--c-text-primary); }
.chev { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; color:var(--c-text-muted); border-radius:8px; flex-shrink:0; }
.chev:hover { background:var(--c-bg-selected); color:var(--c-text-primary); }
.chev svg { transition:transform .15s; }
.chev[aria-expanded="true"] svg { transform:rotate(180deg); }
.skel { background:var(--c-bg-selected); border-radius:6px; height:10px; display:block; animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.5; } }
@media (prefers-reduced-motion:reduce) { .skel { animation:none; } .chev svg { transition:none; } }
.reason { border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.45; display:flex; gap:8px; align-items:flex-start; }
.reason.wait { background:var(--c-info-bg); color:var(--c-text-primary); }
.reason.stop { background:var(--c-danger-bg); color:var(--c-text-primary); }
.reason b { font-weight:700; color:var(--c-text-heading); }
.reason.stop b { color:var(--c-danger-text); }
.reason .txt { flex:1; min-width:0; }
.kv { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-size:12px; color:var(--c-text-secondary); }
.kv .k { color:var(--c-text-muted); }
.sep { color:var(--c-text-muted); }

/* ===== Вариант А · «Строка» ===== */
.va { border-radius:10px; background:var(--c-bg-card); border:1px solid var(--c-border-light); }
.va.t-wait { background:var(--c-info-bg); border-color:transparent; }
.va.t-stop { background:var(--c-danger-bg); border-color:transparent; }
.va.t-done, .va.t-closed { background:var(--c-bg-inset); border-color:transparent; }
.va .row { display:flex; align-items:center; gap:8px; min-height:34px; padding:3px 4px 3px 10px; min-width:0; }
.va .row > .hit { display:flex; align-items:center; gap:8px; flex:1; min-width:0; align-self:stretch; border-radius:8px; }
.va .ttl { font-weight:700; color:var(--c-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:30px; flex:0 1 auto; }
.va .st { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1 1 auto; font-size:12px; color:var(--c-text-secondary); }
.va .st b { font-weight:600; color:var(--c-text-heading); }
.va.t-done .ttl, .va.t-closed .ttl { color:var(--c-text-secondary); }
.va .more { padding:2px 10px 10px 10px; display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--c-border-light); margin-top:2px; padding-top:10px; }
.va.t-wait .more, .va.t-stop .more, .va.t-done .more, .va.t-closed .more { border-top-color:var(--c-divider); }
.va .full { font:700 15px/1.3 var(--font-serif); color:var(--c-text-heading); }
.va .acts { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.app.m .va .row { min-height:44px; padding:2px 2px 2px 10px; gap:6px; }
.app.m .va .row > .hit { min-height:40px; }
.app.m .va .ttl { display:none; }
.app.m .va .alarm { display:flex; align-items:center; gap:8px; padding:0 4px 4px 10px; }
.app.m .va .alarm .txt { flex:1; min-width:0; font-size:12px; color:var(--c-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ===== Вариант Б · «Карточка в ленте» ===== */
.vb-sticky.open { position:static; }
.vb-sticky { position:sticky; top:0; z-index:2; padding:8px 0 4px; background:linear-gradient(var(--c-bg-main) 75%, transparent); }
.vb { border-radius:12px; background:var(--c-bg-white); border:1px solid var(--c-border-light); box-shadow:var(--shadow-card); position:relative; overflow:hidden; }
.vb::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c-progress-track); }
.vb.t-run::before { background:var(--c-text-heading); }
.vb.t-wait::before { background:var(--c-info); } .vb.t-stop::before { background:var(--c-danger); }
.vb.t-done::before { background:var(--c-success); } .vb.t-closed::before { background:var(--c-dashed); }
.vb .hd { display:flex; align-items:center; gap:8px; padding:8px 6px 8px 14px; min-width:0; }
.vb .hd .hit { display:flex; align-items:center; gap:8px; flex:1; min-width:0; border-radius:8px; }
.vb .eyebrow { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--c-text-muted); flex-shrink:0; }
.vb .ttl { font:700 14px/1.3 var(--font-serif); color:var(--c-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.tag { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; border-radius:999px; padding:1px 8px; white-space:nowrap; flex-shrink:0; background:var(--c-bg-selected); color:var(--c-text-heading); }
.tag.wait { background:var(--c-info-bg); color:var(--c-text-primary); }
.tag.wait::before { content:''; width:6px; height:6px; border-radius:3px; background:var(--c-info); }
.tag.stop { background:var(--c-danger-bg); color:var(--c-danger-text); box-shadow:inset 0 0 0 1px var(--c-danger); }
.tag.done { background:var(--c-success-bg); color:var(--c-success-text); }
.tag.closed { color:var(--c-text-secondary); font-weight:400; }
.vb .bd { padding:2px 12px 12px 14px; display:flex; flex-direction:column; gap:10px; }
.pipe { display:grid; grid-template-columns:repeat(7,1fr); gap:0; position:relative; padding-top:2px; }
.pipe .s { display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; min-width:0; border-radius:8px; padding:2px 0; }
.pipe .s::before { content:''; position:absolute; top:9px; left:-50%; width:100%; height:2px; background:var(--c-progress-track); z-index:0; }
.pipe .s:first-child::before { display:none; }
.pipe .s.d::before, .pipe .s.a::before { background:var(--c-success); }
.pipe .s.x::before { background:none; border-top:2px dashed var(--c-dashed); height:0; }
.pipe .n { width:14px; height:14px; border-radius:7px; background:var(--c-bg-white); box-shadow:inset 0 0 0 2px var(--c-progress-track); position:relative; z-index:1; }
.pipe .d .n { background:var(--c-success); box-shadow:none; }
.pipe .a .n { background:var(--c-text-heading); box-shadow:0 0 0 3px var(--c-bg-selected); }
.pipe .a.wait .n { background:var(--c-info); box-shadow:0 0 0 3px var(--c-info-bg); }
.pipe .a.stop .n { background:var(--c-danger); box-shadow:0 0 0 3px var(--c-danger-bg); }
.pipe .x .n { box-shadow:inset 0 0 0 2px var(--c-dashed); }
.pipe .l { font-size:10px; color:var(--c-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.pipe .a .l { color:var(--c-text-heading); font-weight:700; }
.pipe .a.wait .l { color:var(--c-info); } .pipe .a.stop .l { color:var(--c-danger-text); }
.app.m .pipe .s:not(.a) .l { visibility:hidden; }
.app.m .pipe .a .l { overflow:visible; }
.now { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--c-text-secondary); flex-wrap:wrap; }
.now b { color:var(--c-text-heading); font-weight:600; }
.vb .acts { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }

const TIPTEXT = 'Ключевой чат фичи — отсюда её запустили и ведут: здесь план, решения, приёмка и мерж. Остальные чаты фичи — исполнители шагов.';
function showTip() {
  const app = document.getElementById('app');
  const el = app.querySelector('[data-tipkey]');
  app.querySelector('.tip')?.remove();
  if (!el) return;
  const ar = app.getBoundingClientRect(), r = el.getBoundingClientRect();
  const tip = document.createElement('div'); tip.className = 'tip'; tip.id = 'tipkey'; tip.setAttribute('role', 'tooltip'); tip.textContent = TIPTEXT;
  app.appendChild(tip);
  const left = Math.max(8, Math.min(r.left - ar.left, ar.width - tip.offsetWidth - 8));
  let top = r.bottom - ar.top + 6;
  if (top + tip.offsetHeight > ar.height - 8) top = r.top - ar.top - tip.offsetHeight - 6;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}

// Замер: плашка vs колонка ленты vs композер (то же правило, что проверяет Playwright)
function measure() {
  const app = document.getElementById('app');
  const b = app.querySelector('[data-banner]'), col = app.querySelector('[data-col]'), cmp = app.querySelector('[data-cmp]');
  const r = e => e ? e.getBoundingClientRect() : null;
  const rb = r(b), rc = r(col), rm = r(cmp);
  const hs = document.documentElement.scrollWidth > window.innerWidth;
  const out = { banner: rb && { l: Math.round(rb.left), w: Math.round(rb.width) }, column: rc && { l: Math.round(rc.left), w: Math.round(rc.width) }, composer: rm && { l: Math.round(rm.left), w: Math.round(rm.width) }, hscroll: hs, inHeader: S.v === 'C' };
  let ok, txt;
  if (!rb) { ok = !hs; txt = 'Плашки нет (чат вне фичи)'; }
  else if (S.v === 'C') { ok = !hs && rb.right <= app.getBoundingClientRect().right; txt = `Пилюля в шапке: ${Math.round(rb.width)} px, в ленте ничего · колонка ${Math.round(rc.width)} px`; }
  else { ok = Math.abs(rb.left - rc.left) < 1 && Math.abs(rb.width - rc.width) < 1 && Math.abs(rm.width - rc.width) < 1 && !hs; txt = `Плашка ${Math.round(rb.left)}…${Math.round(rb.right)} (${Math.round(rb.width)}) · колонка ${Math.round(rc.left)}…${Math.round(rc.right)} (${Math.round(rc.width)}) · композер ${Math.round(rm.width)}`; }
  out.ok = ok;
  const m = document.getElementById('meter');
  m.className = 'meter ' + (ok ? 'ok' : 'bad');
  m.innerHTML = `Замер: ${txt} · гориз. прокрутки ${hs ? 'есть' : 'нет'} · <b>${ok ? 'ширина = колонке ✓' : 'расходится ✗'}</b>`;
  window.__fb = out;
  return out;
}
window.__measure = measure;
window.__set = (patch) => { Object.assign(S, patch); render(); return measure(); };

// ===== Действия =====
let toastT;
function toast(t) { S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = ''; render(); }, 2600); }
function act(a, el) {
  switch (a) {
    case 'toggle': S.open = !S.open; break;
    case 'dfold': S.dCollapsed = !S.dCollapsed; S.open = !S.dCollapsed; break;
    case 'sheet': S.sheet = !S.sheet; S.pop = false; break;
    case 'pop': S.pop = !S.pop; break;
    case 'close': S.sheet = false; S.pop = false; break;
    case 'page': S.page = { tab: el.dataset.tab || 'Хронология', stage: el.dataset.stage != null ? +el.dataset.stage : null }; S.sheet = false; S.pop = false; break;
    case 'closePage': S.page = null; break;
    case 'goKey': if (S.role !== 'key') { S.prevRole = S.role; S.role = 'key'; S.back = true; S.fi = 0; S.open = false; S.sheet = false; S.pop = false; toast('Открыт ключевой чат фичи. «← Ш2 · фронт» вернёт обратно.'); } break;
    case 'goBack': if (S.role === 'key') { S.role = S.prevRole || 'exec'; S.back = false; S.sheet = false; S.pop = false; } break;
    case 'goExec': S.role = 'exec'; S.back = false; S.sheet = false; S.pop = false; toast('Открыт чат Киры · Ш2 · фронт'); break;
    case 'goMark': S.sheet = false; S.pop = false; toast('Открылся бы чат Марка (задача «Мерж»)'); break;
    case 'reply': S.focus = true; S.sheet = false; S.pop = false; break;
    case 'task': S.sheet = false; S.pop = false; toast('Открылась бы задача «Шаг 2 · фронт» в «Задачах»'); break;
    case 'merge': S.modal = true; S.sheet = false; S.pop = false; break;
    case 'closeModal': S.modal = false; break;
    case 'doMerge': S.modal = false; S.st = 'merging'; toast('Мерж запущен · исполнитель Марк'); break;
    case 'switch': S.fi = S.fi ? 0 : 1; break;
    case 'retry': S.st = 'loading'; render(); setTimeout(() => { S.st = 'run'; render(); }, 900); return;
  }
  render();
}
document.addEventListener('click', e => {
  const k = e.target.closest('.mk [data-k]');
  if (k) { S[k.dataset.k] = k.dataset.v; Object.assign(S, { open: false, sheet: false, pop: false, page: null, modal: false, fi: 0, back: false, tip: null, focus: false, toast: '' }); render(); return; }
  const tk = e.target.closest('[data-tipkey]');
  if (tk) { S.tip = S.tip === 'click' ? null : 'click'; S.tip ? showTip() : document.querySelector('.tip')?.remove(); e.stopPropagation(); return; }
  const a = e.target.closest('[data-act]');
  if (a && document.getElementById('app').contains(a)) { act(a.dataset.act, a); return; }
  if (S.pop && !e.target.closest('.pop')) { S.pop = false; render(); }
  if (S.tip && !e.target.closest('.tip')) { S.tip = null; document.querySelector('.tip')?.remove(); }
});
document.addEventListener('mouseover', e => { const tk = e.target.closest('[data-tipkey]'); if (tk && !S.tip) { S.tip = 'hover'; showTip(); } });
document.addEventListener('mouseout', e => { const tk = e.target.closest('[data-tipkey]'); if (tk && S.tip === 'hover') { S.tip = null; document.querySelector('.tip')?.remove(); } });
document.addEventListener('focusin', e => { if (e.target.closest('[data-tipkey]')) { S.tip = 'focus'; showTip(); } });
document.addEventListener('focusout', e => { if (e.target.closest('[data-tipkey]') && S.tip === 'focus') { S.tip = null; document.querySelector('.tip')?.remove(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.tip) { S.tip = null; document.querySelector('.tip')?.remove(); return; }
  if (S.modal) S.modal = false; else if (S.page) S.page = null; else if (S.sheet || S.pop) { S.sheet = false; S.pop = false; } else if (S.open) S.open = false; else return;
  render();
});
window.addEventListener('resize', render);
// Начальное состояние из адреса: #v=A&st=wait&role=key&theme=dark&w=w360
(function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ['v', 'st', 'role', 'theme', 'w']) if (h.get(k) && OPTS[k].some(([v]) => v === h.get(k))) S[k] = h.get(k);
  if (h.get('open')) S.open = true;
})();
render();
</script>
