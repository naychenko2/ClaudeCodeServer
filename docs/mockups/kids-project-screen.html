<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Детский режим — экран проекта-предмета по живым компонентам · макет v2</title>
<!--
  Детская сторона v2 (задача 8cc32b3f, 19.11). Эпик 45af8178-8435-4746-8f13-bd3cc781585e; макетом пользуются
  шаги Ф1a–Ф1i: они берут НАСТОЯЩИЕ WorkspacePage, PanelZone/PanelRail, ProjectRail, ChatPanel/ChatHeaderBar,
  ChatItemView и Composer и только скрывают лишнее по childSurface. Поэтому макет срисован с продукта
  (стенд из основного дерева, 19.11, 1280/768/360, обе темы) и с кода этих компонентов, а не придуман.
  Отличия от взрослого экрана — только допустимые: на рельсе 5 панелей; композер без режимов, модели,
  «/» и «@»; в ленте нет плана хода и Todo; в доке проектов только предметы. Плюс строка «Уроки видит папа».
  Записка — kids-project-screen-proposal.md. Окно настроек — kids-settings-window.html (две панели, итог).
  Только var(--c-*) из theme.css; сырой hex — лишь в блоке темы.
  Якорь адреса повторяет пульт: #scr=project&pn=files&w=mob&t=dark
-->
<style>
/* ===== Тема: frontend/src/lib/theme.css ===== */
:root, [data-theme="light"] {
  --c-bg-main:#F4F0E8; --c-bg-panel:#EDE7DC; --c-bg-card:#FBF8F2; --c-bg-white:#FFFFFF;
  --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E;
  --c-on-accent:#FBF8F2; --c-on-dark:#FFFFFF;
  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5; --c-accent-soft:#E8A990;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-divider:#DDD4C4; --c-dashed:#D0C6B4;
  --c-track:#D8CFBE; --c-smoke:#B4A899;
  --c-overlay:rgba(23,19,15,.42); --c-msg-bg:rgba(251,248,242,.42);
  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;
  --c-warning:#C9923E; --c-warning-bg:#FBEFE0; --c-warning-text:#8A6A28;
  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F; --c-danger-border:#F5C6BF;
  --c-info:#3E7CA6; --c-info-bg:#E7EFF5;
  --c-rose:#B0527C; --c-rose-text:#8E3D62;
  --c-plan:#6C5CB0; --c-plan-light:#EEEBF8; --c-plan-text:#4E4196;
  --shadow-focus:0 0 0 3px rgba(217,119,87,.14);
  --shadow-card:0 2px 8px rgba(60,50,35,.05);
  --shadow-island:0 1px 2px rgba(60,50,35,.06),0 6px 20px rgba(60,50,35,.10);
  --shadow-lift-soft:0 -1px 2px rgba(60,50,35,.06),0 -3px 10px rgba(60,50,35,.08);
  --shadow-modal:0 24px 60px rgba(23,19,15,.40);
  --shadow-peek:0 2px 6px rgba(60,50,35,.14),0 20px 48px rgba(23,19,15,.32);
  --shadow-button:0 4px 14px rgba(217,119,87,.30);
  --shadow-thumb:0 1px 3px rgba(42,37,31,.12);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(217,119,87,.13),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.10),transparent 60%);
  /* GROUP_COLORS из design.ts — палитра аватаров-инициалов, от темы не зависит */
  --group-blue:#3E7CA6; --group-violet:#8E4A82; --group-green:#3F7A4F; --group-orange:#C2693B; --group-indigo:#4B6BB0; --group-khaki:#7A7250;
}
[data-theme="dark"] {
  --c-bg-main:#201C18; --c-bg-panel:#272320; --c-bg-card:#2E2A25; --c-bg-white:#2E2A25;
  --c-bg-selected:#38332D; --c-bg-inset:#1B1815;
  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072;
  --c-on-accent:#201C18;
  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C; --c-accent-soft:#9A5E48;
  --c-border:#3D3830; --c-border-light:#34302A; --c-divider:#454037; --c-dashed:#4A443B;
  --c-track:#453F37; --c-smoke:#7E7566;
  --c-overlay:rgba(0,0,0,.62); --c-msg-bg:rgba(46,42,37,.38);
  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;
  --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E;
  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72; --c-danger-border:#5A302A;
  --c-info:#5FA0CC; --c-info-bg:#1E2A33;
  --c-rose:#D683A6; --c-rose-text:#E7A3C0;
  --c-plan:#9385D8; --c-plan-light:#2A2540; --c-plan-text:#B0A4E6;
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-island:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.45);
  --shadow-lift-soft:0 -1px 2px rgba(0,0,0,.30),0 -4px 12px rgba(0,0,0,.35);
  --shadow-modal:0 28px 70px rgba(0,0,0,.65);
  --shadow-peek:0 2px 8px rgba(0,0,0,.50),0 24px 56px rgba(0,0,0,.68);
  --shadow-button:0 4px 16px rgba(227,138,106,.34);
  --shadow-thumb:0 1px 3px rgba(0,0,0,.45);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(227,138,106,.11),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.08),transparent 60%);
}

*{box-sizing:border-box}
body{margin:0;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--c-bg-inset);color:var(--c-text-primary)}
button{font-family:inherit}
svg.i{display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.muted{font-size:12px;color:var(--c-text-muted);line-height:1.45}
.serif{font-family:'PT Serif',Georgia,serif}
.mono{font-family:'JetBrains Mono','Courier New',monospace}

/* Пульт (не продукт) */
.pult{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--c-bg-panel);border-bottom:1px solid var(--c-border);font-size:12px;color:var(--c-text-secondary)}
.pult b{color:var(--c-text-heading);margin-right:4px}
.pult .grp{display:flex;align-items:center;gap:4px}
.pill{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--c-bg-selected);flex-wrap:wrap}
.pill button{border:none;cursor:pointer;background:transparent;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--c-text-secondary)}
.pill button[aria-pressed="true"]{background:var(--c-bg-white);color:var(--c-text-heading);box-shadow:var(--shadow-thumb)}
.stage{padding:24px 16px 32px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow-x:auto}

/* Холст (CanvasBackdrop): кадр окна */
.frame{position:relative;isolation:isolate;flex-shrink:0;height:820px;overflow:hidden;background:var(--c-bg-main);display:flex;flex-direction:column;box-shadow:var(--shadow-peek);border-radius:12px}
.frame::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--canvas-glow)}
.frame.m{height:740px}

/* Шапка приложения (HubHeader / TB): 52 на десктопе, 56 на телефоне */
.tb{flex-shrink:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px}
.tab .tb{padding:0 10px}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--c-accent);color:var(--c-on-accent);flex-shrink:0}
.brand{font-family:'PT Serif',Georgia,serif;font-size:18px;color:var(--c-text-heading);white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;color:var(--c-text-muted);min-width:0}
.crumb .pn{font-size:15px;font-weight:600;color:var(--c-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--c-on-dark);font-size:12px;font-weight:700;flex-shrink:0;background:var(--group-indigo)}

/* Тело рабочего экрана: капсула слева, центр, капсула справа (DesktopWorkspace) */
.ws{flex:1;min-height:0;display:flex;padding:8px 0 16px;gap:0;position:relative}
.zone{display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.cap{font-size:7px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);width:40px;text-align:center;margin-bottom:-8px}
/* RailCapsule: 40, bgMain, рамка C.border с трёх сторон, скругление ISLAND.radius 14 к центру */
.rc{width:40px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;background:var(--c-bg-main);border:1px solid var(--c-border);box-shadow:var(--shadow-island)}
.rc.l{border-left:none;border-radius:0 14px 14px 0}
.rc.r{border-right:none;border-radius:14px 0 0 14px}
.rsep{width:20px;height:1px;background:var(--c-border);margin:1px 0}
/* IconButton md: 32, R.md 8; active — C.accentMuted / C.accent */
.ib{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--c-text-muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0;position:relative;padding:0}
.ib:hover{background:var(--c-bg-selected);color:var(--c-text-primary)}
.ib[aria-pressed="true"]{background:var(--c-accent-muted);color:var(--c-accent)}
.ib.lg{width:40px;height:40px}
.ib:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
/* Иконка проекта (variant media): активная — кольцо 1px bgMain + 3px accent */
.pj{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-family:'PT Serif',Georgia,serif;font-size:11px;font-weight:700;border:none;cursor:pointer;position:relative;padding:0}
.pj[aria-current="true"]{box-shadow:0 0 0 1px var(--c-bg-main),0 0 0 3px var(--c-accent)}
/* CountBadge: 14, FS 9, угол top -6 right -7 */
.cnt{position:absolute;top:-6px;right:-7px;min-width:14px;height:14px;padding:0 3px;border-radius:999px;font-size:9px;font-weight:700;line-height:14px;text-align:center;color:var(--c-on-accent);background:var(--c-accent);border:1.5px solid var(--c-bg-main);box-sizing:content-box}
.cnt.warn{background:var(--c-warning)}
.rc.r .cnt{right:-3px}
/* RailFlyout — подпись сбоку по наведению */
.fly{position:absolute;white-space:nowrap;padding:6px 10px;border-radius:10px;background:var(--c-bg-white);border:1px solid var(--c-border);box-shadow:var(--shadow-dropdown,var(--shadow-island));font-size:12px;font-weight:600;color:var(--c-text-heading);z-index:6}
.fly .h{display:block;font-weight:400;color:var(--c-text-muted);font-size:11px;margin-top:2px}

.pal-info{background:var(--c-info-bg);color:var(--c-info)}
.pal-rose{background:color-mix(in srgb,var(--c-rose) 14%,var(--c-bg-card));color:var(--c-rose-text)}
.pal-success{background:var(--c-success-bg);color:var(--c-success-text)}

/* Остров панели (PanelShell → Island + IslandHeader 40) */
.island{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--c-bg-panel);border:1px solid var(--c-border-light);border-radius:14px;box-shadow:var(--shadow-island)}
.ihead{flex-shrink:0;height:40px;display:flex;align-items:center;gap:7px;padding:0 6px 0 12px;border-bottom:1px solid var(--c-border);background:var(--c-bg-main);font-size:13px;font-weight:600;color:var(--c-text-heading)}
.ihead .sp{flex:1}
.ibody{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.panel{width:340px;flex-shrink:0;align-self:flex-start;max-height:100%}
.hbtn{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:9px;border:none;background:var(--c-accent-light);color:var(--c-accent);font-size:12px;font-weight:600;cursor:pointer}

/* Кнопки (Button) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-bg-white);font-size:13px;font-weight:600;color:var(--c-text-secondary);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge.neutral{background:var(--c-bg-inset);color:var(--c-text-muted)}
.badge.warn{background:var(--c-warning-bg);color:var(--c-warning-text)}
.badge.info{background:var(--c-info-bg);color:var(--c-info)}
.pav{border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:var(--c-on-dark);font-weight:700;line-height:1}
.face{width:52px;height:52px;border-radius:12px;border:1px solid var(--c-border-light);display:grid;place-items:center;color:var(--c-on-dark);font-family:'PT Serif',Georgia,serif;font-size:22px;flex-shrink:0}

/* Чат (ChatPanel): центр БЕЗ острова — лента прямо на холсте, CHAT_MAX_W 950 по центру */
.center{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;padding:0 8px}
/* ChatHeaderBar, hero-шапка на холсте: padding 12 18 10, лицо 52, заголовок PT Serif 28/500 */
.hero{flex-shrink:0;width:100%;max-width:950px;margin:0 auto;border-bottom:1px solid var(--c-border-light)}
.hero .row{display:flex;align-items:center;gap:8px;padding:12px 18px 10px;flex-wrap:wrap}
.hero .tt{flex:1;min-width:240px;display:flex;align-items:center;gap:12px}
.hero h1{margin:0;font-family:'PT Serif',Georgia,serif;font-size:28px;font-weight:500;letter-spacing:-.01em;line-height:1.25;color:var(--c-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-muted);margin-top:3px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Строка «Уроки видит папа» — слот contextBar шапки (у ребёнка строки контекста нет, место свободно) */
.watch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-secondary)}
.hero .watch{padding:0 18px 10px}
.mwatch{flex-shrink:0;padding:4px 14px;border-bottom:1px solid var(--c-border)}
.rpill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--c-bg-inset);font-size:12px;color:var(--c-text-secondary);white-space:nowrap}
.rpill b{color:var(--c-text-heading)}
.rpill .bar{width:36px;height:4px;border-radius:999px;background:var(--c-track);overflow:hidden}
.rpill .bar i{display:block;height:100%;width:60%;background:var(--c-success)}
.stopsig{color:var(--c-danger-text)}

.feed{flex:1;min-height:0;overflow:auto;padding:16px 0 8px}
.col{max-width:950px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:14px}
.m .col{padding:0 16px}
/* Пузырь человека: bgWhite, borderLight, SHADOW.card, 18 18 4 18, 12 17, 14 */
.u{align-self:flex-end;max-width:80%;background:var(--c-bg-white);border:1px solid var(--c-border-light);box-shadow:var(--shadow-card);border-radius:18px 18px 4px 18px;padding:12px 17px;font-size:14px;line-height:1.55;color:var(--c-text-primary)}
/* Ответ: лист C.msgBg, R.xl 12, 9 12; аватар 28 — float-лид */
.a{background:var(--c-msg-bg);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.6;color:var(--c-text-heading);display:flow-root}
.a .pav{float:left;margin:1px 9px 2px -3px}
.att{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;border-radius:10px;background:var(--c-bg-card);border:1px solid var(--c-border-light);font-size:12px}
.card{border:1px solid var(--c-border-light);border-radius:12px;background:var(--c-bg-white)}
.ch{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--c-divider);font-size:13px;font-weight:600;color:var(--c-text-heading)}
.cb{padding:10px 13px;display:flex;flex-direction:column;gap:10px}
.road{position:relative;height:52px;border-radius:10px;background:var(--c-bg-inset)}
.road .p{position:absolute;top:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--c-on-dark)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:12.5px;color:var(--c-text-secondary)}
.tool b{color:var(--c-text-heading);font-weight:600}

/* Composer: белая карточка R.xxl 14 + нижняя губа (composerLip) */
.composer{flex-shrink:0;width:100%;max-width:950px;margin:0 auto;padding:0 24px}
.m .composer{padding:0 16px 10px}
.cbox{position:relative;z-index:2;display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:14px;border:1px solid var(--c-border);background:var(--c-bg-white)}
.m .cbox{padding:8px 10px}
.cbox .ph{flex:1;font-size:14px;color:var(--c-text-muted);min-height:34px;display:flex;align-items:center}
.cb32{width:32px;height:32px;border-radius:9px;border:none;background:none;color:var(--c-text-muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}
.cb34{width:34px;height:34px;border-radius:9px;border:none;background:var(--c-bg-selected);color:var(--c-text-muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0}
.m .cb32{width:36px;height:36px}
.m .cb34{width:38px;height:38px}
.cb34.send{background:var(--c-accent);color:var(--c-on-accent)}
.lip{display:flex;align-items:center;gap:4px;height:53px;margin-top:-12px;padding:15px 8px 4px;background:var(--c-bg-main);border:1px solid var(--c-border-light);border-top:none;border-radius:0 0 14px 14px;box-shadow:var(--shadow-island)}
.m .lip{height:auto;margin-top:7px;padding:0 2px;background:none;border:none;box-shadow:none}
.lip .cb32{width:32px;height:32px}
.lip .note{margin-left:auto;font-size:11px;color:var(--c-text-muted);padding-right:4px}

/* Строки панелей */
.tr{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;border-radius:8px;font-size:13px;color:var(--c-text-primary)}
.m .tr{min-height:44px}
.tr.in{padding-left:28px}
.tr .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr:hover{background:var(--c-bg-selected)}
.strip{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--c-bg-inset);font-size:12px;color:var(--c-text-secondary)}
.strip.blue{background:var(--c-info-bg);color:var(--c-info)}
.strip.warn{background:var(--c-warning-bg);color:var(--c-warning-text)}
.inp{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-bg-white);font-size:13px;color:var(--c-text-muted)}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px;background:var(--c-bg-white);border:1px solid var(--c-border-light)}
.task .bx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--c-border);flex-shrink:0;margin-top:1px;display:grid;place-items:center}
.task.done .bx{background:var(--c-success);border-color:var(--c-success);color:var(--c-on-accent)}
.task.done .tt{text-decoration:line-through;color:var(--c-text-muted)}
.task .tt{font-size:13px;font-weight:600;color:var(--c-text-heading)}
.ctx{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--c-bg-white);border:1px solid var(--c-border-light);font-size:13px}
.chatrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--c-text-primary)}
.chatrow[aria-current="true"]{background:var(--c-bg-selected)}
.chatrow .n{font-weight:600;color:var(--c-text-heading)}

/* Телефон: шапка 56 — «‹ предмет» и вкладки панелей сегментом (как в продукте) */
.m .tb{height:56px;padding:0 6px 0 4px;gap:4px}
.seg{display:flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--c-bg-selected);margin-left:auto}
.seg button{height:40px;min-width:40px;border:none;border-radius:9px;background:none;color:var(--c-text-muted);display:grid;place-items:center;cursor:pointer;padding:0 8px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--c-bg-white);color:var(--c-text-heading);box-shadow:var(--shadow-thumb);display:flex;gap:6px}
.mtool{flex-shrink:0;height:56px;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px solid var(--c-border-light)}
.mtool .tt{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.mtool .nm{font-family:'PT Serif',Georgia,serif;font-size:16px;font-weight:600;color:var(--c-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.mpanel{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.mhead{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--c-text-heading);padding:2px 2px 4px}
.menu{position:absolute;right:8px;top:54px;z-index:6;min-width:200px;padding:5px;border-radius:12px;background:var(--c-bg-white);border:1px solid var(--c-border);box-shadow:var(--shadow-island)}
.menu .mi{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--c-text-primary)}

/* Главная (хаб-страница на холсте) */
.home{flex:1;min-width:0;overflow:auto;padding:16px 24px}
.m .home{padding:16px}
.hwrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hello{font-family:'PT Serif',Georgia,serif;font-size:28px;font-weight:500;color:var(--c-text-heading);line-height:1.25}
.secl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tab .tiles{grid-template-columns:repeat(2,1fr)}
.m .tiles{grid-template-columns:1fr}
.tile{display:flex;align-items:center;gap:12px;padding:14px;background:var(--c-bg-white);border:1px solid var(--c-border-light);border-radius:14px;box-shadow:var(--shadow-card);text-align:left;cursor:pointer;color:inherit}
.tile .tl{font-size:14px;font-weight:600;color:var(--c-text-heading)}
.glyph{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;font-family:'PT Serif',Georgia,serif;font-size:14px;font-weight:700}
.glyph.sm{width:28px;height:28px;border-radius:8px;font-size:11px}

/* Записка */
.notes{max-width:1280px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:13px;line-height:1.5}
.notes .nb{padding:16px;border-radius:14px;background:var(--c-bg-card);border:1px solid var(--c-border-light)}
.notes h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--c-text-secondary)}
.notes ul{margin:0;padding-left:18px}
@media (max-width:900px){.notes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pult" id="pult"></div>
<div class="stage" id="stage"></div>
<script>
/* Иконки — lucide, те же, что в panelCatalog.ts и Composer.tsx */
const P = {
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  chats:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  files:'<path d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z"/><path d="M3 5a2 2 0 0 0 2 2h3"/><path d="M3 3v13a2 2 0 0 0 2 2h3"/>',
  knowledge:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  notes:'<path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/>',
  context:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  tasks:'<rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  wave:'<path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/>', up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  phrases:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 8h10M7 12h6"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', down:'<path d="m6 9 6 6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>', left:'<path d="m15 18-6-6 6-6"/>',
  more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v15"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  pen:'<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>', send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  stop:'<path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86z"/><path d="M12 8v4M12 16h.01"/>',
};
const ic = (n, s = 16) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

const KID = 'Маша', CURATOR = 'папа';
const SUBJ = [
  { id:'math', label:'Математика', glyph:'2+2', c:'info', tutor:'Сова Ульяна', ini:'СУ', bg:'--group-blue', hw:1 },
  { id:'rus', label:'Русский язык', glyph:'Аа', c:'rose', tutor:'Кот Учёный', ini:'КУ', bg:'--group-violet', hw:0 },
  { id:'world', label:'Окружающий мир', glyph:'ОМ', c:'success', tutor:'Лесовичок Тимофей', ini:'ЛТ', bg:'--group-green', hw:1 },
];
const cur = SUBJ[0];
const LESSONS = [['Задача про пешеходов', 'сейчас'], ['Дроби: половина и четверть', 'вчера'], ['Таблица на 7', '17 ноября']];
/* Порядок на рельсе: «Задачи» вторыми — тогда на телефоне они в верхней строке, а не в «Ещё» */
const PANELS = [['files','Файлы','files'],['tasks','Задачи','tasks'],['knowledge','Знания','knowledge'],['notes','Заметки','notes'],['context','Контекст','context']];
const S = { scr:'project', pn:'none', w:'desk', t:'light' };
location.hash.slice(1).split('&').forEach((kv) => { const [k, v] = kv.split('='); if (k && v && k in S) S[k] = decodeURIComponent(v); });
const PULT = [
  ['scr','Экран',[['project','Урок'],['home','Главная']]],
  ['pn','Панель',[['none','Закрыта'],['chats','Чаты (слева)']].concat(PANELS.map(([k, l]) => [k, l]))],
  ['w','Ширина',[['desk','1280'],['tab','768'],['mob','360']]],
  ['t','Тема',[['light','Светлая'],['dark','Тёмная']]],
];
function renderPult() { document.getElementById('pult').innerHTML = PULT.map(([k, t, o]) => `<div class="grp"><b>${t}</b><div class="pill">${o.map(([v, l]) => `<button aria-pressed="${S[k] === v}" onclick="set('${k}','${v}')">${l}</button>`).join('')}</div></div>`).join(''); }
function set(k, v) { S[k] = v; location.hash = Object.entries(S).map(([a, b]) => `${a}=${b}`).join('&'); render(); }
const M = () => S.w === 'mob', T = () => S.w === 'tab';
const g = (s, sm) => `<span class="glyph pal-${s.c}${sm ? ' sm' : ''}">${s.glyph}</span>`;
const av = (s, n = 28) => `<span class="pav" style="width:${n}px;height:${n}px;background:var(${s.bg});font-size:${Math.round(n * .36)}px">${s.ini}</span>`;
const timePill = `<span class="rpill" title="Время уроков на сегодня">Ещё <b>35 мин</b><span class="bar"><i></i></span></span>`;
const watchLine = `${ic('eye', 14)}<span>Уроки видит ${CURATOR}</span>`;

/* ===== Шапка приложения ===== */
function topbar() {
  if (M()) {
    const tabs = [['chats','Чаты','chats']].concat(PANELS.slice(0, 3));
    const open = S.pn === 'none' ? 'chats' : S.pn;
    const inMore = !tabs.some(([k]) => k === open);
    return `<div class="tb"><button class="ib lg" aria-label="На главную">${ic('left', 18)}</button><span class="crumb" style="min-width:0;flex-shrink:1"><span class="pn">${cur.label}</span></span>
      <div class="seg" role="tablist" aria-label="Панели">${tabs.map(([k, l, i]) => `<button role="tab" aria-pressed="${open === k}" aria-label="${l}">${ic(i, 18)}${open === k ? l : ''}</button>`).join('')}<button aria-label="Ещё" aria-pressed="${inMore}">${ic('more', 18)}</button></div></div>`;
  }
  const crumb = S.scr === 'project' ? `${ic('right', 14)}<span class="pj pal-${cur.c}" style="width:22px;height:22px;border-radius:6px;font-size:9px">${cur.glyph}</span><span class="pn">${cur.label}</span>` : '';
  return `<div class="tb"><span class="logo">${ic('home', 16)}</span>${T() ? '' : '<span class="brand">Home AI</span>'}<span class="crumb">${crumb}</span><span style="flex:1"></span><span class="me" title="${KID}">М</span></div>`;
}

/* ===== Левая зона: ПАНЕЛИ (Чаты) и ПРОЕКТЫ (только предметы) ===== */
function leftZone() {
  const chatsOn = S.pn === 'chats';
  return `<div class="zone" style="position:relative">
    <span class="cap">Панели</span><div class="rc l"><button class="ib" aria-label="Чаты" aria-pressed="${chatsOn}">${ic('chats')}</button></div>
    <span class="cap">Проекты</span><div class="rc l">${SUBJ.map((s) => `<button class="pj pal-${s.c}" aria-label="${s.label}" ${S.scr === 'project' && s === cur ? 'aria-current="true"' : ''}>${s.glyph}${s.hw ? '<span class="cnt warn">1</span>' : ''}</button>`).join('')}</div>
    ${S.scr === 'project' && S.pn === 'none' && !T() ? `<div class="fly" style="left:48px;top:102px">${cur.label}<span class="h">1 задание на завтра</span></div>` : ''}
  </div>`;
}
/* ===== Правая зона: ПАНЕЛИ — пять панелей ребёнка ===== */
function rightZone() {
  return `<div class="zone"><span class="cap">Панели</span><div class="rc r">${PANELS.map(([k, l, i]) => `<button class="ib" aria-label="${l}" aria-pressed="${S.pn === k}">${ic(i)}${k === 'tasks' ? '<span class="cnt">1</span>' : ''}</button>`).join('')}</div></div>`;
}

/* ===== Шапка урока (ChatHeaderBar) ===== */
function chatHead() {
  if (M()) return `<div class="mtool"><button class="ib lg" aria-label="Назад к списку" style="margin-left:-8px">${ic('left', 18)}</button>
      <div class="tt">${av(cur)}<div style="min-width:0"><div class="nm">${cur.tutor}${ic('down', 14)}</div><div class="meta" style="margin-top:0">${LESSONS[0][0]}</div></div></div>
      <button class="ib lg stopsig" aria-label="Мне неприятно — позвать взрослого">${ic('stop', 18)}</button></div>
    <div class="mwatch watch">${watchLine}<span style="flex:1"></span><span class="rpill" style="height:22px">35 мин</span></div>`;
  return `<div class="hero"><div class="row"><div class="tt"><span class="face" style="background:var(${cur.bg})">${cur.ini}</span>
      <div style="min-width:0;flex:1"><h1>${cur.tutor}</h1><div class="meta"><span class="glyph pal-${cur.c}" style="width:16px;height:16px;border-radius:4px;font-size:7px">${cur.glyph}</span>${cur.label} · ${LESSONS[0][0]}</div></div></div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:auto">${timePill}<button class="ib stopsig" aria-label="Мне неприятно — позвать взрослого">${ic('stop', 18)}</button></div></div>
    <div class="watch">${watchLine}</div></div>`;
}

/* ===== Лента (ChatItemView): реплики, виджет, вопрос с кнопками, карточка правки файла ===== */
function feed() {
  return `<div class="feed"><div class="col">
    <div class="a">${av(cur)}Привет, ${KID}! Вижу твою домашку. Давай начнём с задачи 3 про пешеходов.</div>
    <div class="u"><div class="att">${ic('image', 14)}Домашка 19 ноября.jpg</div>Давай разберём</div>
    <div class="a">${av(cur)}Посмотри, как они идут навстречу. Нажми «Пуск» и следи, где они встретятся.</div>
    <div class="card"><div class="ch">Пешеходы на дороге · 18 км</div><div class="cb">
      <div class="road"><span class="p" style="left:10%;background:var(--group-blue)">4</span><span class="p" style="left:78%;background:var(--group-orange)">5</span></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primary">Пуск</button><span class="muted">Прошло: 1 час · между ними 9 км</span></div></div></div>
    <div class="a">${av(cur)}Через сколько часов они встретятся?</div>
    <div class="card"><div class="cb"><div class="opts">${['1 час', '2 часа', '3 часа'].map((x) => `<button class="btn">${x}</button>`).join('')}</div></div></div>
    <div class="u">2 часа</div>
    <div class="a">${av(cur)}Верно! Я записала решение в твой файл, загляни.</div>
    <div class="card"><div class="tool">${ic('pen', 14)}<b>Изменён файл</b><span class="mono" style="font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Домашка/Задача 3 — решение.md</span><span style="flex:1"></span>${ic('right', 14)}</div></div>
  </div></div>`;
}
/* ===== Поле ввода (Composer): без режима, модели, собеседника, «/» и «@»; в губе остаётся «+» ===== */
function composer() {
  return `<div class="composer"><div class="cbox"><span class="ph">Напиши ответ…</span>
      <button class="cb32" aria-label="Быстрые фразы">${ic('phrases')}</button><button class="cb32" aria-label="Голосовой ввод">${ic('mic')}</button><button class="cb34" aria-label="Режим разговора">${ic('wave')}</button></div>
    <div class="lip"><button class="cb32" aria-label="Прикрепить файл">${ic('plus')}</button></div></div>`;
}

/* ===== Тела панелей ===== */
function panelBody(k) {
  if (k === 'chats') return `${LESSONS.map(([n, d], i) => `<div class="chatrow" ${i === 0 ? 'aria-current="true"' : ''}>${av(cur, 24)}<div style="flex:1;min-width:0"><div class="n">${n}</div><div class="muted">${d}</div></div></div>`).join('')}
    <span class="muted" style="padding:4px 6px">Твои уроки по предмету. Старые не удаляются — к ним можно вернуться.</span>`;
  if (k === 'files') return `<div class="strip blue">${ic('eye', 14)}Эту папку видят: ты, папа, Ольга</div>
    <div style="display:flex;gap:6px"><button class="btn" style="flex:1">${ic('upload', 14)}Загрузить</button><button class="ib" aria-label="Новый файл">${ic('plus')}</button><button class="ib" aria-label="Поиск">${ic('search')}</button></div>
    <div class="tr">${ic('down', 12)}${ic('folder', 15)}<span class="n"><b>Материалы</b></span><span class="badge neutral">${ic('lock', 10)}только чтение</span></div>
    <div class="tr in">${ic('file', 15)}<span class="n">Таблица умножения.pdf</span>${ic('lock', 13)}</div>
    <div class="tr">${ic('down', 12)}${ic('folder', 15)}<span class="n">Домашка</span></div>
    <div class="tr in">${ic('image', 15)}<span class="n">Домашка 19 ноября.jpg</span></div>
    <div class="tr in">${ic('file', 15)}<span class="n">Задача 3 — решение.md</span><span class="badge info">изменён</span></div>
    <div class="tr">${ic('file', 15)}<span class="n">Что я не поняла.md</span></div>
    <div class="tr" style="border-top:1px solid var(--c-border-light);border-radius:0;margin-top:4px">${ic('trash', 15)}<span class="n">Корзина</span><span class="badge neutral">2</span></div>`;
  if (k === 'knowledge') return `<div class="strip">${ic('lock', 14)}Только читать: что знает Сова Ульяна</div><div class="inp">${ic('search', 14)}Найти в знаниях…</div>
    ${[['Таблица умножения.pdf', 'Материалы'], ['Правила задач на движение', 'Материалы'], ['Домашка 19 ноября.jpg', 'твой файл · распознан текст']].map(([n, s]) => `<div class="tr" style="min-height:44px">${ic('knowledge', 15)}<span class="n">${n}<br><span class="muted">${s}</span></span></div>`).join('')}
    <span class="muted">Сюда попадает всё из папки предмета, кроме корзины. Добавить знания — загрузи файл в «Файлы».</span>`;
  if (k === 'notes') return `<button class="btn">${ic('plus', 14)}Новая заметка</button>
    ${[['Что я не поняла', 'сегодня'], ['Слова на завтра', 'вчера']].map(([n, d]) => `<div class="tr" style="min-height:44px">${ic('notes', 15)}<span class="n">${n}<br><span class="muted">${d}</span></span></div>`).join('')}
    <span class="muted">Заметки лежат в папке предмета — их видят те же, кто видит папку.</span>`;
  if (k === 'context') return `<div class="strip">${ic('eye', 14)}Только посмотреть, что сейчас видит Сова Ульяна</div>
    <div class="ctx">${av(cur)}<div style="flex:1"><b style="color:var(--c-text-heading)">Сова Ульяна</b><div class="muted">репетитор предмета</div></div></div>
    <div class="ctx">${ic('image')}<span style="flex:1">Домашка 19 ноября.jpg</span><span class="badge neutral">в уроке</span></div>
    <div class="ctx">${ic('folder')}<span style="flex:1">Папка «Математика»</span><span class="badge neutral">весь урок</span></div>
    <span class="muted">Модель и настройки урока выбирает взрослый — здесь их нет.</span>`;
  return `<div class="strip warn">${ic('tasks', 14)}1 задание на завтра</div>
    <div class="task"><span class="bx"></span><div style="flex:1"><div class="tt">Задачи 3–5 на движение</div><div class="muted">к 20 ноября · от папы</div></div><button class="btn" style="height:28px">${ic('send', 13)}В урок</button></div>
    <div class="task"><span class="bx"></span><div style="flex:1"><div class="tt">Выучить таблицу на 7</div><div class="muted">к 22 ноября · сама добавила</div></div></div>
    <div class="task done"><span class="bx">${ic('check', 12)}</span><div style="flex:1"><div class="tt">Прочитать с. 42</div><div class="muted">сделано вчера</div></div></div>`;
}
const panelMeta = (k) => k === 'chats' ? ['Чаты', 'chats'] : PANELS.find(([x]) => x === k).slice(1);
const headBtn = (k) => ({ chats:'Чат', notes:'Заметка', tasks:'Задание' })[k];
function panel(k, style = '') {
  const [l, i] = panelMeta(k);
  return `<div class="island panel" style="${style}"><div class="ihead">${ic(i, 15)}<span>${l}</span><span class="sp"></span>${headBtn(k) ? `<button class="hbtn">${ic('plus', 12)}${headBtn(k)}</button>` : ''}<button class="ib" style="width:28px;height:28px" aria-label="Закрыть">${ic('x', 14)}</button></div><div class="ibody">${panelBody(k)}</div></div>`;
}

/* ===== Главная ===== */
function homeBody() {
  return `<div class="hwrap">
    <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div class="hello">Привет, ${KID}</div><div style="font-size:14px;color:var(--c-text-secondary);margin-top:4px">Уроки открыты до 19:30.</div></div>${timePill}</div>
    <div class="watch">${watchLine}</div>
    <div class="secl">Домашние задания</div>
    <div class="island" style="background:var(--c-bg-white)"><div class="ibody" style="padding:6px">
      ${[[SUBJ[0], 'Задачи 3–5 на движение', 'к завтра', 'warn'], [SUBJ[2], 'Нарисовать круговорот воды', 'к пятнице', 'neutral']].map(([s, t, d, tone]) => `<div class="task" style="border:none;align-items:center">${g(s, true)}<div style="flex:1;min-width:0"><div class="tt">${t}</div><div class="muted">${s.label}</div></div><span class="badge ${tone}">${d}</span></div>`).join('')}
    </div></div>
    <div class="secl">Предметы</div>
    <div class="tiles">${SUBJ.map((s) => `<button class="tile">${g(s)}<div style="min-width:0;flex:1"><div class="tl">${s.label}</div><div class="muted" style="display:flex;align-items:center;gap:6px;margin-top:4px">${av(s, 18)}${s.tutor}</div></div>${s.hw ? '<span class="badge warn">домашка</span>' : ''}</button>`).join('')}</div>
  </div>`;
}

/* ===== Сборка по ширине ===== */
function screen() {
  if (M()) {
    if (S.scr === 'home') return `<div class="tb"><span class="logo" style="margin-left:10px">${ic('home', 16)}</span><span class="brand">Уроки</span><span style="flex:1"></span><span class="me" style="margin-right:8px">М</span></div><div class="home">${homeBody()}</div>`;
    const open = S.pn === 'none' ? 'chats' : S.pn;
    let body;
    if (S.pn === 'none') body = `${chatHead()}<div style="flex:1;min-height:0;display:flex;flex-direction:column">${feed()}${composer()}</div>`;
    else { const [l, i] = panelMeta(open); body = `<div class="mpanel"><div class="mhead">${ic(i, 18)}${l}</div>${panelBody(open)}</div>`; }
    return `${topbar()}${body}`;
  }
  if (S.scr === 'home') return `${topbar()}<div class="ws">${leftZone()}<div class="home">${homeBody()}</div></div>`;
  const chat = `<div class="center">${chatHead()}${feed()}${composer()}</div>`;
  const pnl = S.pn === 'none' ? '' : S.pn;
  if (T()) {
    /* 768: панель — попап-превью над раскладкой (SHADOW.peek) у своей рельсы, без затемнения */
    const peek = !pnl ? '' : pnl === 'chats'
      ? panel('chats', 'position:absolute;left:48px;top:8px;width:320px;max-height:70%;box-shadow:var(--shadow-peek);z-index:5')
      : panel(pnl, 'position:absolute;right:48px;top:8px;width:320px;max-height:calc(100% - 24px);box-shadow:var(--shadow-peek);z-index:5');
    return `${topbar()}<div class="ws">${leftZone()}${chat}${rightZone()}${peek}</div>`;
  }
  const leftP = pnl === 'chats' ? panel('chats', 'margin-left:8px;width:300px') : '';
  const rightP = pnl && pnl !== 'chats' ? panel(pnl, 'margin-right:8px') : '';
  return `${topbar()}<div class="ws">${leftZone()}${leftP}${chat}${rightP}${rightZone()}</div>`;
}
function notes() {
  return `<div class="notes">
    <div class="nb"><h4>Как во взрослом экране</h4><ul><li>Шапка приложения 52, капсулы рельс 40 у краёв окна, кнопки 32</li><li>Чат на холсте: островом только шапка, лента и поле — колонкой 950</li><li>Панель — остров 340 рядом (1280) или попап поверх (768); на 360 — вкладки в шапке</li></ul></div>
    <div class="nb"><h4>Что скрыто у ребёнка</h4><ul><li>Хаб-вкладки, «Стена», поиск по проектам, уведомления, круглешок AI</li><li>Режим, модель, собеседник, «/», «@», «Обсудить с командой», «⋯» в губе</li><li>План хода и Todo в ленте; на рельсе — только пять панелей</li></ul></div>
    <div class="nb"><h4>Что добавлено</h4><ul><li>Строка «Уроки видит папа» — в слоте строки контекста под шапкой урока</li><li>Время уроков пилюлей и стоп-сигнал — в правой группе шапки</li><li>Счётчик домашки на иконке предмета (CountBadge, warning)</li></ul></div></div>`;
}
function render() {
  document.documentElement.setAttribute('data-theme', S.t);
  renderPult();
  const W = { desk:1280, tab:768, mob:360 }[S.w];
  document.getElementById('stage').innerHTML = `<div class="frame${M() ? ' m' : ''}${T() ? ' tab' : ''}" data-theme="${S.t}" style="width:${W}px" data-frame="kid">${screen()}</div>${notes()}`;
}
render();
</script>
</body>
</html>
