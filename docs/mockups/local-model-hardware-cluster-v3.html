<style>

const lvlBy = (th, v) => { if (v == null) return 'none'; const [w, d] = th;

// ===== Показатели узла: плитки (порядок фиксирован), уровень, «ближе всех к пределу», счётчик пропусков =====

    det:`<b>${n.ram.used}</b> из ${n.ram.tot} ГБ · температура: датчика нет`, miss:0, pct:true });
  n.disks.forEach((d, j) => { const tl = lvlBy(diskTh(d.crit), d.t), fl = lvlBy(FILL, d.used);
    out.push({ name:d.name, short: j ? 'Сист.' : 'Диск', ic:'HardDrive', label:'заполнен', v:d.used, unit:'%', lv:worst([tl, fl]), th:FILL, seed:5 + j, pct:true,
      det: d.t == null ? (d.noSensor ? 'температура: датчика нет' : 'температура: нет данных') : `температура <b>${Math.round(d.t)}</b> °C`,

function engMiss(n) { return engines(n).reduce((a, e) => a + (e.kind === 'vllm' && e.prefix == null ? 1 : 0), 0); }
function nodeInfo(n) {

  const c = cs[0] && cs[0].lv === 'ok' ? (cs.find(x => x.unit === '°C') ?? cs[0]) : cs[0];

const fmtV = x => x.v == null ? (x.noSensor ? '<span class="na">датчика нет</span>' : '<span class="na">нет данных</span>') : `${Math.round(x.v)} ${x.unit}`;

// ===== Мини-график (Sparkline) — как в v2 =====
function hist(cur, seed, n, rise, off) {
  const f = i => 1.6 * Math.sin(i / (n / 9) + seed) + 0.8 * Math.sin(i / 2.3 + seed * 1.7) + (rise ? (i / (n - 1) - 1) * rise : 0);
  const cut = Math.round(n * 0.86), last = off ? cut - 1 : n - 1;
  return Array.from({ length:n }, (_, i) => off && i >= cut ? null : cur + f(i) - f(last));
}
function spark(x, off) {
  if (x.v == null) return '<div class="spark-na"></div>';
  const N = 90, W = 120, H = 24, rise = x.lv === 'danger' ? 7 : x.lv === 'warn' ? 4 : 0;
  const pts = hist(x.v, x.seed, N, rise, off), vs = pts.filter(v => v != null), lo = Math.min(...vs) - 1, hi = Math.max(...vs) + 1;
  const X = i => i * W / (N - 1), Y = v => H - 2 - (v - lo) / (hi - lo) * (H - 4);
  const col = off ? '--c-text-muted' : x.lv === 'danger' ? '--c-danger' : x.lv === 'warn' ? '--c-warning' : '--c-success';
  const li = pts.reduce((a, v, i) => v != null ? i : a, 0);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="за 15 минут">
    <polyline points="${pts.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(' ')}" fill="none" stroke="var(${col})" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${X(li)}" cy="${Y(pts[li])}" r="2.5" fill="var(${col})" vector-effect="non-scaling-stroke"/></svg>`;
}
function tile(x, off) {
  const l = off ? 'none' : x.lv, tint = l === 'warn' || l === 'danger' ? l : '';
  const tt = x.th ? (x.pct ? `Предупреждение с ${x.th[0]} %, опасность с ${x.th[1]} %` : `Предупреждение с ${x.th[0] ?? '—'} °C, опасность с ${x.th[1]} °C`) : '';
  return `<div class="tile ${tint}" title="${tt}">${icon(x.ic, 52, 'wm', 1.5)}
    <div class="tn"><span class="dot d-${l}"></span><span>${x.name}</span></div>
    <div class="tv t-${l}">${fmtV(x)}</div>${x.label ? `<div class="tl">${x.label}</div>` : ''}
    ${spark(x, off)}${x.det ? `<div class="td">${x.det}</div>` : ''}</div>`;
}

// ===== Сводка фермы (общая для А и шапки Б) =====
function farmSum(infos) {
  const live = infos.filter(i => !i.down), dn = infos.length - live.length;
  const L = worst(live.map(i => i.lv).filter(l => l !== 'none'));
  const top = live.filter(i => i.c).sort((a, b) => (RANK[b.lv] - RANK[a.lv]) || ((a.c.th[1] - a.c.v) - (b.c.th[1] - b.c.v)))[0];
  const miss = live.reduce((a, i) => a + i.miss, 0);
  const parts = [];
  if (top) parts.push(`${L === 'ok' ? 'Ближе всех к пределу' : L === 'danger' ? 'Опасно' : 'Горячо'} — <b>${top.n.key}</b> · ${top.c.name.toLowerCase()}: <b>${fmtV(top.c)}</b>`);
  if (dn) parts.push(`${dn === 1 ? '1 узел молчит' : dn + ' узла молчат'}`);
  if (miss) parts.push(missTxt(miss));
  return { L, html:`<div class="sum">${parts.join(' · ')}</div>`, dn };
}

// Молчащий узел не даёт плашке сказать «всё в норме»: живые в норме, но ферма — нет
const farmPill = fs => fs.dn && fs.L !== 'danger' ? `<span class="pill p-warn">${fs.dn === 1 ? 'узел молчит' : 'узлы молчат'}</span>` : lvPill(fs.L);

// ===== Вариант А · сводка + детализация =====
function nodeCard(info, list) {
  const n = info.n, off = info.down, sel = S.node === n.key, l = info.lv;
  const big = off ? '<span class="na">не отвечает</span>' : info.c ? `<span class="t-${info.c.lv}">${fmtV(info.c)}</span>` : '<span class="na">нет данных</span>';
  const what = off ? `с ${n.since}` : info.c ? info.c.name.toLowerCase() : '';
  return `<button class="nc ${l === 'warn' || l === 'danger' ? l : ''} ${sel ? 'sel' : ''} ${off ? 'stale' : ''}" data-node="${n.key}" aria-pressed="${sel}"
      aria-label="Узел ${n.key}: ${LVTXT[l]}">
    <div class="nh"><span class="dot d-${l}"></span><span>${n.key}</span></div>
    ${list ? '' : `<div class="role">${n.role}</div>`}
    <div class="big">${big}</div><div class="what">${list ? `${n.role.split(' · ')[0]} · ` : ''}${what}</div>
    <div class="eng">${off ? 'данные устарели' : engLine(n)}</div>
    ${info.miss && !off ? `<div class="role na"${list ? ' style="grid-column:1 / span 2"' : ''}>${info.miss} без данных</div>` : ''}</button>`;
}
const rolesLine = infos => `<div class="roles">${infos.map(i => `<span><b>${i.n.key}</b> — ${i.n.short}</span>`).join('')}</div>`;
function variantA(infos) {
  const fs = farmSum(infos), list = S.w < 360, sel = infos.find(i => i.n.key === S.node);
  return `<div class="card"><div class="ch"><h3>Ферма</h3>${farmPill(fs)}</div>${fs.html}
      <div class="farm ${list ? 'list' : ''}" role="group" aria-label="Узлы фермы">${infos.map(i => nodeCard(i, list)).join('')}</div>
      ${rolesLine(infos)}</div>
    <div class="chev">▾ подробно — узел <b>${sel.n.key}</b></div>
    ${nodeDetail(sel, true)}`;
}

// ===== Вариант Б · вкладка на узел =====
function variantB(infos) {
  const fs = farmSum(infos), sel = infos.find(i => i.n.key === S.node);
  const seg = `<span class="seg node" role="tablist" aria-label="Узел">${infos.map(i => `<span role="tab" class="${i.n.key === S.node ? 'on' : ''}" data-node="${i.n.key}" aria-selected="${i.n.key === S.node}"><i class="dot d-${i.lv}"></i>${i.n.key}</span>`).join('')}</span>`;
  const others = infos.filter(i => i.n.key !== S.node && (i.lv === 'warn' || i.lv === 'danger' || i.down));
  const oth = others.length ? `<div class="others">Ещё на ферме:${others.map(i => `<span class="pill ${i.down ? 'p-mute' : i.lv === 'danger' ? 'p-danger' : 'p-warn'}" data-node="${i.n.key}" role="button" tabindex="0">${i.n.key} — ${LVTXT[i.lv]} →</span>`).join('')}</div>` : '';
  return `${seg}${oth}${nodeDetail(sel, false)}`;
}

// ===== Вариант В · стены узлов =====
function wall(info, wide) {
  const n = info.n, off = info.down, l = info.lv;
  const line = (lab, val, lv) => `<div class="wl"><span>${lab}</span><b class="t-${off ? 'none' : lv}">${val}</b></div>`;
  const gp = n.gpus.length ? n.gpus.map(g => { const x = info.ss.find(s => s.name === `Карта ${g.i + 1}`);
      return line(`Карта ${g.i + 1} · ${x.v != null && g.mem == null ? 'ядро' : 'память'}`, `${Math.round(x.v)}°${g.thermal && !off ? ' ↓' : ''}`, x.lv); }).join('')
    : '<div class="wl"><span class="na">карт нет</span></div>';
  const cpu = info.ss.find(s => s.name === 'Процессор'), ram = info.ss.find(s => s.name === 'Оперативная память');
  const disks = info.ss.filter(s => s.ic === 'HardDrive');
  return `<div class="wall ${!off && (l === 'warn' || l === 'danger') ? l : ''} ${off ? 'stale' : ''}">
    <div class="wh"><span class="dot d-${l}"></span>${n.key}</div><div class="role">${n.role}</div>
    <div class="st">${off ? `<span class="pill p-mute">молчит с ${n.since.slice(0, 5)}</span>` : lvPill(l, true)}</div>
    <div class="wsec"><div class="wt">Карты</div>${gp}</div>
    <div class="wsec"><div class="wt">Узел</div>
      ${line('Процессор', cpu.v == null ? '<span class="na">датчика нет</span>' : `${Math.round(cpu.v)}° · ${n.cpu.load} %`, cpu.lv)}
      ${line('ОЗУ', `${ram.v} %`, 'ok')}
      ${disks.map(d => line(wide ? d.name : d.short, `${d.v} %`, d.lv)).join('')}</div>
    <div class="wsec"><div class="wt">${n.eng2 ? `${ENGNAME[n.eng.kind]} + LLM` : ENGNAME[n.eng.kind]}</div><div class="wl"><span>${off ? '<span class="na">данные устарели</span>' : engLine(n).replace(/ · /g, '<br>')}</span></div></div>
    ${info.miss && !off ? `<div class="wsec"><div class="wl"><span class="na">${info.miss} без данных</span></div></div>` : ''}</div>`;
}
function variantC(infos) {
  const fs = farmSum(infos), scroll = S.w < 380;
  return `<div class="card" style="padding:10px 12px"><div class="ch" style="margin:0"><h3>Ферма</h3>${farmPill(fs)}</div>${fs.html.replace('class="sum"', 'class="sum" style="margin:2px 0 0"')}</div>
    ${scroll ? '<div class="swipe">Листайте вбок — узлы не помещаются рядом</div>' : ''}
    <div class="walls ${scroll ? 'scroll' : ''}">${infos.map(i => wall(i, scroll)).join('')}</div>
    ${rolesLine(infos)}
    <div class="card stub"><div class="ch"><h3>Подробно</h3><i>касание стены → карточки карт и график узла</i></div></div>`;
}

// ===== Обвязка панели =====
const TABS = [['LLM','MessageSquareText'], ['Медиа','Clapperboard'], ['Стенды','Cpu']];
function island(body, dot) {
  const mob = S.w < 380;
  const tabs = `<span class="seg">${TABS.map(([t, ic]) => `<span class="${t === 'Стенды' ? 'on' : ''}">${icon(ic, 12)}${t}${t === 'Стенды' && dot ? `<i class="tabdot d-${dot}"></i>` : ''}</span>`).join('')}</span>`;
  return `<div class="isl ${mob ? 'sheet' : ''}" style="width:${S.w}px">${mob ? '<div class="grab"></div>' : ''}
    <div class="hd">${mob ? 'Локальные модели' : tabs}<span class="x">✕</span></div>
    <div class="body">${mob ? `<div>${tabs}</div>` : ''}${body}</div></div>`;
}
const VARIANTS = {
  A: { title:'А · сводка + детализация', fn:variantA,
    cap:'Сверху карточка «Ферма»: три карточки узлов (точка, ближайший к пределу показатель, строка движка). Касание узла — ниже раскрываются его детали: та же раскладка, что у сегодняшней вкладки, плюс карточка движка. На 320 карточки узлов идут списком.' },
  B: { title:'Б · вкладка на узел', fn:variantB,
    cap:'Под вкладками — переключатель узлов с точкой уровня у каждого. Содержимое — сегодняшняя вкладка для выбранного узла плюс движок. Чтобы не пропустить чужую тревогу, под переключателем строка «Ещё на ферме: ai — опасность →».' },
  C: { title:'В · стены рядом', fn:variantC,
    cap:'Три стены узлов в ряд, в каждой — короткий список: карты, процессор, ОЗУ, диски, движок. На рельсе 380 колонка — около 110 px, подписи уходят над значением. На телефоне стены не помещаются — лента с прокруткой вбок. Подробности — по касанию стены (тот же экран, что в А).' },
};
function render() {
  const st = STATES[S.st], farm = st.make(), infos = ORDER.map(k => nodeInfo(farm[k]));
  const L = worst(infos.filter(i => !i.down).map(i => i.lv).filter(l => l !== 'none'));
  const dot = L === 'warn' || L === 'danger' ? L : null, V = VARIANTS[S.v];
  const ths = S.th === 'both' ? ['light', 'dark'] : [S.th];
  document.getElementById('root').innerHTML = ths.map(th => `<div class="col" data-theme="${th}">
    <h2>${V.title} — ${th === 'light' ? 'светлая' : 'тёмная'} тема</h2>
    <p class="note"><b>${st.title}.</b> ${st.cap}<br>${S.w < 380 ? `Мобильный лист ${S.w} CSS px: вкладки — строкой в теле.` : 'Остров рельса 380 px.'}</p>
    <div>${island(V.fn(infos), dot)}<p class="pcap">${V.cap}</p></div></div>`).join('');
  document.querySelectorAll('[data-node]').forEach(b => b.onclick = () => { S.node = b.dataset.node; render(); });
  bar();
}
function tog(id, key, opts) {
  document.getElementById(id).innerHTML = opts.map(([v, t]) => `<button class="${S[key] === v ? 'on' : ''}" data-v="${v}">${t}</button>`).join('');
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => { S[key] = key === 'w' ? +b.dataset.v : b.dataset.v; render(); });
}
function bar() {
  tog('tV', 'v', Object.entries(VARIANTS).map(([k, v]) => [k, v.title.split(' · ')[0]]));
  tog('tSt', 'st', Object.entries(STATES).map(([k, v]) => [k, v.title]));
  tog('tTh', 'th', [['light','Светлая'], ['dark','Тёмная'], ['both','Обе']]);
  tog('tW', 'w', [[380,'Рельс 380'], [360,'Телефон 360'], [320,'Узкий 320']]);
}
render();
</script>
</body>
</html>
