[Service]
# Решение Андрея 2026-09-19 по итогам эксперимента: размышления с бюджетом 512 + фраза перехода
# (--reasoning-config в .env стенда vLLM).
Environment=THINKING_MODE=budget THINKING_BUDGET=512
# Прунинг старых выводов инструментов и тел Write/Edit. PRUNE_INPUTS включён после повторов
# 2026-09-22 с честным лимитом вывода: метка в истории на письмо модели не влияет (12 из 12
# запросов — полноценный текст), прежняя тревога о подражании была обрывом по лимиту 2500.
# PRUNE_THINKING выключен: серия по нему невалидна по той же причине, ставить заново.
Environment=PRUNE_TOOL_RESULTS=on PRUNE_INPUTS=on
