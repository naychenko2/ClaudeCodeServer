function stageTime(k) {
  const live = { cut:['19.10 · 17:20 – 17:55','≈ 35 мин'], plan:['19.10 · 17:58 – 18:30','≈ 30 мин'],
    prod:['с 20.10 · 10:05','≈ 4 ч 50 мин'], review:['с 20.10 · 11:20','≈ 1 ч 15 мин'] };
  const done = { cut:live.cut, plan:live.plan, prod:['20.10 · 10:05 – 15:40','≈ 5 ч 20 мин'], review:['20.10 · 11:20 – 15:58','≈ 1 ч 40 мин'],
    qa:['20.10 · 16:00 – 16:25','≈ 25 мин'], final:['20.10 · 16:28 – 16:55','≈ 25 мин'],
    merge: S.fs === 'merged' ? ['20.10 · 17:35 – 17:38','≈ 3 мин'] : S.fs === 'merging' ? ['с 20.10 · 17:35',''] : ['',''] };
  if (S.fs === 'closed' && k === 'review') return ['20.10 · 11:20 – 15:20','≈ 1 ч 30 мин'];
  if (S.fs === 'closed' && k === 'prod') return ['20.10 · 10:05 – 15:10','≈ 5 ч'];
  return (isDone() ? done : live)[k] || ['',''];
}

function timeline() {
  const st = stageStatus(S.fs);
  const curIdx = st.findIndex(s => ['active','wait','stop'].includes(s));
  const node = (g, i) => {
    const s = st[i];
    const [when, dur] = stageTime(g.k);
    const cur = i === curIdx;
    const stTxt = { active:'идёт', par:'идёт вместе с производством', wait:'<span style="color:var(--c-info)">ждёт вас</span>', stop:'<span style="color:var(--c-danger-text)">стоит</span>', todo:'впереди', skip:'пропущен' }[s] || '';
    const body = [];
    const known = s !== 'todo' && s !== 'skip';
    // Кто работал: персона и роль; у будущего этапа исполнителя ещё нет — не выдумываем
    if (known) body.push(`<div class="line">${g.who.filter(w => !(g.k === 'prod' && false)).map(w => who(w)).join('')}${g.k === 'prod' ? '' : ''}</div>`);
    if (g.k === 'cut' && known) body.push(`<div class="line">Разрез принят: 4 шага, бэк и фронт.</div>`);
    if (g.k === 'plan' && known) body.push(`<div class="line">План принят: Ш1–Ш4, сначала бэк, потом фронт.</div>`);
    if (g.k === 'prod') {
      if (s === 'wait') body.push(`<div class="mark w" data-t="wait-mark">${fg('wait', 12)}<span><b>Кира ждёт вашего ответа · 40 мин</b> · с 16:12</span><button class="btn xs gh" data-act="chat" data-id="k3">${ic('msg', 12)}Ответить</button></div>`);
      if (s === 'stop') body.push(`<div class="mark e">${fg('stop', 12)}<span><b>Остановилась 25 мин назад</b> · Ш3 · ошибка 529</span><button class="btn xs gh" data-act="chat" data-id="k3">${ic('msg', 12)}Чат Киры</button></div>`);
      if (!known) body.push(`<div class="empty sm" data-t="no-steps"><h3>Шагов пока нет</h3><p>Появятся, когда Егор составит план.</p></div>`);
      else body.push(STEPS.map(stepView).map(stepRow).join(''));
    }
    if (g.k === 'review' && known) {
      const rows = isDone()
        ? [['Ш1','принят с первого раза'],['Ш2','принят со 2-го витка','1'],['Ш3','принят с 3-го витка','2'],['Ш4','принят с первого раза']]
        : [['Ш1','принят с первого раза'],['Ш2','принят со 2-го витка','1'],['Ш3','вернул 2 раза · виток 3 ждёт сдачи','2'],['Ш4','ещё не сдан']];
      body.push(rows.map(([c, t, r]) => `<div class="line"><span class="code">${c}</span><span>${t}</span>${r ? `<span class="ret">${ic('ret', 12)}возвратов ${r}</span>` : ''}</div>`).join(''));
    }
    if (g.k === 'qa' && known) body.push(`<div class="line">Проверила фичу целиком: принято с замечаниями <span class="sev min">minor 2</span></div>`);
    if (g.k === 'final' && known) body.push(`<div class="line">Принял финал в 16:55.</div>`);
    if (g.k === 'merge') {
      if (s === 'wait') body.push(`<div class="mark w new" data-t="merge-wait">${fg('merge', 12)}<span><b>Ждёт вашего согласия · 40 мин</b> · с 16:55 ${be()}</span></div><div class="line">Мерж сделает ${who('mark')} отдельной задачей.</div>`);
      else if (s === 'active') body.push(`<div class="line">Сливает ветку в master · задача «Мерж · ${TITLE_SHORT}» <button class="btn xs gh" data-act="chat" data-id="mk">${ic('msg', 12)}Чат Марка</button></div>`);
      else if (s === 'done') body.push(`<div class="line">Смержил в master в 17:38.</div>`);
    }
    // Пустые: этап ещё не начат / пропущен
    if (s === 'todo' && g.k !== 'prod') body.push(`<div class="line" style="color:var(--c-text-muted)">${{cut:'Начнётся с запуска фичи.', plan:'Начнётся после разреза.', review:'Начнётся, когда сдадут первый шаг.', qa:'Начнётся после ревью всех шагов.', final:'Начнётся после проверки.', merge:'Начнётся с вашего согласия после финала.'}[g.k]}</div>`);
    if (s === 'skip') body.push(`<div class="line" style="color:var(--c-text-muted)">Пропущен: фича закрыта без мержа.</div>`);
    const durHtml = dur ? `<span class="dur q" tabindex="0" data-tip="Приблизительно: сумма работы задач этапа — от старта исполнителя до сдачи. Ожидание и простой внутри не вычитаются, параллельные задачи складываются." aria-label="Длительность ${dur}, приблизительно">${dur}</span>` : '';
    return `<div class="tln ${s} ${cur ? 'cur' : ''}" id="n-${g.k}" data-t="stage-${g.k}"><span class="dotx"></span><div class="card">
      <div class="tlh"><span class="nm">${g.n}</span><span class="st" style="color:var(--c-text-muted)">${s === 'done' ? '' : stTxt}</span>${durHtml}</div>
      ${when ? `<div class="tlw">${when}</div>` : ''}
      <div class="tlb">${body.join('')}</div></div></div>`;
  };
  return `<div data-t="timeline">
    <div class="tlnote">${ic('info', 13)}<span>Порядок этапов, их состояние и кто работал — точные. Длительность со знаком «≈» — по задачам этапа. Ревью идёт по шагам, поэтому пересекается с производством.</span></div>
    <div class="tl">${STAGES.map(node).join('')}</div></div>`;
}
function stepRow(s) {
  const o = !!S.openSteps[s.c];
  return `<button class="rowb" data-act="step" data-id="${s.c}" aria-expanded="${o}" data-t="step-${s.c}">
      <span class="chv ${o ? 'o' : ''}">${ic('chevR', 12)}</span><span class="code">${s.c}</span><span class="tx">${s.n}</span>
      <span class="rx">${av(s.who)}${roleChip(PER[s.who].role)}${s.tours.length > 1 ? `<span title="витков">↺${s.tours.length}</span>` : ''}<span class="tst ${s.st}">${TST[s.st]}</span></span></button>
    ${o ? `<div class="tours" data-t="tours-${s.c}">${s.tours.length
      ? s.tours.map(t => `<div class="tour"><span class="k">${t.w}</span><span class="r">${t.r}</span><span class="sev ${t.sev[0]}">${t.sev[1]}</span></div>`).join('') +
        `<div class="tour"><span class="k">итого</span><span class="r">${PER[s.who].n} · ${s.dur || '—'}</span><span></span></div>` +
        (s.chat ? `<button class="btn xs gh" data-act="chat" data-id="${s.chat}">${ic('msg', 12)}Чат шага</button>` : '')
      : '<div class="tour"><span class="k">—</span><span class="r">Шаг не начат: Кира возьмёт его после Ш3.</span><span></span></div>'}</div>` : ''}`;
}

/* ============ Вкладка «Чаты» ============ */
function chatRow(c) {
  const p = PER[c.who];
  const avTip = `Модель чата: ${p.full}`;
  const keyTip = 'Ключевой чат — здесь куратор ведёт фичу: сюда приходят доклады исполнителей и вопросы к вам. Его название не меняется, пока фича жива.';
  const wd = S.fs === 'wait' && c.id === 'k3';
  return `<div class="chrow ${c.key ? 'key' : ''} ${c.arch ? 'arch' : ''}" data-t="chat-${c.id}">
    <button class="avb" data-tip="${esc(avTip)}" aria-label="${esc(p.n + '. ' + avTip)}" data-t="model-${c.id}">${avChip(c.who)}</button>
    <button class="open" data-act="chat" data-id="${c.id}"><span class="tx"><b>${c.n}</b><span>${p.n} · ${c.t}${wd ? ' · ждёт вашего ответа' : ''}</span></span>${roleChip(c.role)}</button>
    ${wd ? '<span class="wd" aria-hidden="true"></span>' : ''}
    ${c.key ? `<button class="keyl" data-tip="${esc(keyTip)}" aria-label="Ключевой чат. ${esc(keyTip)}" data-t="key-label">ключевой</button>` : ''}
  </div>`;
}
function chatsTab() {
  const all = chatsFor(), live = all.filter(c => !c.arch), arch = all.filter(c => c.arch);
  return `<div data-t="chats">
    <div class="stl">Чаты фичи · ${live.length} ${be('роль и модель: проекция')}</div>
    ${live.map(chatRow).join('')}
    ${arch.length ? `<button class="archb" data-act="arch" aria-expanded="${S.archOpen}" data-t="arch"><span class="chv ${S.archOpen ? 'o' : ''}" style="width:28px;justify-content:center">${ic('chevR', 12)}</span><span style="flex:1">Архивные · ${arch.length}</span>${be()}</button>${S.archOpen ? arch.map(chatRow).join('') : ''}` : ''}
    ${S.fs === 'empty' ? '<div class="hint" style="margin-top:8px">Чаты исполнителей появятся, когда фича начнётся.</div>' : ''}</div>`;
}

/* ============ Вкладка «Задачи» ============ */
function tasksTab() {
  const all = tasksFor();
  if (!all.length) return `<div class="empty" data-t="tasks-empty"><span class="ci">${ic('tasks', 20)}</span><h3>Задач нет</h3><p>Фича создана, но конвейер ещё не запускался.</p></div>`;
  const cnt = k => all.filter(t => t.st === k).length;
  const chips = [['all','все', all.length]].concat(['r','w','x','d','t'].filter(k => cnt(k)).map(k => [k, TST[k], cnt(k)]));
  const f = chips.some(c => c[0] === S.taskF) ? S.taskF : 'all';
  const shown = all.filter(t => f === 'all' || t.st === f);
  return `<div data-t="tasks"><div class="cnts" role="group" aria-label="Фильтр задач">${chips.map(([k, t, n]) => `<button class="cnt" aria-pressed="${f === k}" data-act="taskF" data-id="${k}">${t} ${n}</button>`).join('')}</div>
    ${shown.map(t => `<button class="rowb" data-act="openTasks">${av(t.who)}<span class="tx">${t.n}</span><span class="rx">${roleChip(t.role)}<span class="tst ${t.st}">${TST[t.st]}</span></span></button>`).join('')}
    <div class="hint" style="margin-top:8px">Клик открывает задачу в «Задачах» — страница фичи скроется и вернётся по плашке.</div></div>`;
}

/* ============ Вкладка «События» ============ */
function eventsTab() {
  const ev = eventsFor();
  const LIM = 8;
  const shown = S.evAll ? ev : ev.slice(0, LIM);
  let day = '', out = '';
  shown.forEach(e => {
    if (e.d !== day) { day = e.d; out += `<div class="evday">${e.d === '20.10' ? 'Сегодня, 20.10' : 'Вчера, 19.10'}</div>`; }
    out += `<div class="ev ${e.hm ? 'hm' : ''}"><span class="t">${e.t}</span>${av(e.who, 16)}<span><b class="n">${PER[e.who].n}</b> ${e.tx}${e.chat ? ` · <button class="lk" data-act="chat" data-id="${e.chat}">чат</button>` : ''}</span></div>`;
  });
  return `<div data-t="events">${out}${ev.length > LIM ? `<button class="btn xs gh" data-act="evAll" style="margin-top:8px" data-t="ev-all">${S.evAll ? 'Свернуть' : 'Показать все · ' + ev.length}</button>` : ''}</div>`;
}

/* ============ Вкладка «Метрики» (только текущие данные) ============ */
function metricsTab() {
  if (S.fs === 'empty') return `<div class="empty" data-t="met-empty"><span class="ci">${ic('info', 20)}</span><h3>Считать пока нечего</h3><p>Метрики появятся с первой задачей исполнителя.</p></div>`;
  const done = isDone();
  const cell = (l, v, h, cls = '') => `<div class="mc"><div class="l">${l}</div><div class="v ${cls}">${v}</div>${h ? `<div class="h">${h}</div>` : ''}</div>`;
  const waitNow = S.fs === 'wait' ? '40 мин' : S.fs === 'merge' ? '40 мин' : '—';
  const st = stageStatus(S.fs);
  const durRows = STAGES.map((g, i) => { const [, d] = stageTime(g.k); return `<tr><td>${g.n}${st[i] === 'par' ? '<span class="sub">идёт вместе с производством</span>' : ''}</td><td class="${d ? 'n' : 'n m'}">${d || (st[i] === 'skip' ? 'пропущен' : st[i] === 'todo' ? 'впереди' : st[i] === 'wait' ? 'ждёт вас' : '—')}</td></tr>`; }).join('');
  return `<div data-t="metrics">
    <div class="mgrid">
      ${cell(S.fs === 'merged' ? 'Шла' : 'Идёт', S.fs === 'merged' ? '1 дн 0 ч' : S.fs === 'closed' ? '22 ч' : '23 ч', 'от создания эпика')}
      ${cell('Ждёт вас сейчас', waitNow, waitNow === '—' ? 'никто не ждёт' : S.fs === 'merge' ? 'согласие на мерж' : 'вопрос Киры', waitNow === '—' ? '' : 'w')}
      ${cell('Шаги', done ? '4 из 4' : '2 из 4', 'приняты ревью')}
      ${cell('С первого раза', done ? '2 из 4' : '1 из 3', 'шагов без возврата')}
      ${cell('Возвраты', '3', 'ревью 3 · проверка 0 · финал 0')}
      ${cell('Задач', String(tasksFor().length), done ? 'все закрыты' : `в работе ${tasksFor().filter(t => ['r','w','x'].includes(t.st)).length}`)}
    </div>
    <div class="stl">Длительность этапов · ≈ по задачам</div>
    <table class="tbl" data-t="met-stages">${durRows}</table>
    <div class="stl">Самый долгий шаг</div>
    <table class="tbl"><tr><td><span class="code">Ш3</span> Галерея шаблонов<span class="sub">Кира · фронт · ${done ? '3 витка, принят с 3-го' : '3-й виток идёт'}</span></td><td class="n">${done ? '≈ 1 ч 30 мин' : '≈ 1 ч 10 мин'}</td></tr></table>
    <div class="stl">Состав ${be('роль: проекция')}</div>
    <table class="tbl" data-t="met-team">
      <tr><td>${who('denis')}</td><td class="n">2 шага · принято 2 · возвратов 1</td></tr>
      <tr><td>${who('kira')}</td><td class="n">2 шага · принято ${done ? 2 : 0} · возвратов 2</td></tr>
      <tr><td>${who('gleb')}</td><td class="n">${done ? 7 : 5} витков ревью</td></tr>
      ${done && S.fs !== 'closed' ? `<tr><td>${who('vera')}</td><td class="n">1 проверка</td></tr>` : ''}
      <tr><td>${who('egor')}</td><td class="n">план, 4 шага</td></tr>
      <tr><td>${who('alex')}</td><td class="n">${done && S.fs !== 'closed' ? 'разрез и финал' : 'разрез'}</td></tr>
      ${['merging','merged'].includes(S.fs) ? `<tr><td>${who('mark')}</td><td class="n">мерж</td></tr>` : ''}
      <tr><td>${who('sofya')}</td><td class="n">ведёт фичу</td></tr>
    </table></div>`;
}

/* ============ Страница ============ */
function stateBody() {
  if (S.fs === 'loading') return `<div style="display:flex;flex-direction:column;gap:10px" data-t="loading" aria-busy="true">${[60,40].map(w => `<div class="sk" style="width:${w}%"></div>`).join('')}<div class="sk" style="height:38px;margin-top:6px"></div>${[92,84,70,88,76].map(w => `<div class="sk" style="width:${w}%"></div>`).join('')}</div>`;
  if (S.fs === 'error') return `<div class="notice dn" data-t="error">${ic('alert', 16)}<div><b>Не удалось загрузить фичу.</b>Сервер не ответил; список и чаты работают как обычно.<div style="margin-top:8px"><button class="btn xs gh" data-act="retry">${ic('rotate', 12)}Повторить</button></div></div></div>`;
  if (S.fs === 'off') return `<div class="notice in" data-t="off">${ic('plug', 16)}<div><b>Подсистема задач выключена на этом сервере</b>Страница фичи недоступна, чаты работают как обычно.</div></div>`;

}
function tabPanel() {

export function TemplatesGallery() {

function emptyCenter() {

function plaque() {

  const others = [['o1','Голосовой режим 2 — куратор','sofya','1 ч'],['o2','Почему падает сборка','me','вчера'],['o3','Идеи на неделю','mayya','пн']];

    <div class="grpttl">Остальные</div>${others.map(([id, n, w, t]) => `<button class="crow ${S.win === 'chat' && S.chatId === id ? 'on' : ''}" data-act="chat" data-id="${id}">${av(w)}<span class="nm">${n}</span><span class="tm">${t}</span></button>`).join('')}</div></div>`;

      <div class="ft"><button class="btn sm gh" data-act="chat" data-id="mk">${ic('msg', 13)}Открыть чат Марка</button><button class="btn sm pri" data-act="modalX">Готово</button></div>`,
    mergeFail:`<h3>Мерж не запущен</h3>
      <div class="notice dn" data-t="merge-409">${ic('alert', 16)}<div><b>Worktree фичи не найден на диске.</b>Фича осталась в состоянии «ждёт согласия на мерж»; ничего не изменилось.</div></div>
      <div class="ft"><button class="btn sm gh" data-act="chat" data-id="cur">${ic('msg', 13)}Ключевой чат</button><button class="btn sm pri" data-act="modalX">Понятно</button></div>`,
  }[S.modal];
  return `<div class="ovl" data-act="ovl" data-t="modal"><div class="modal" role="dialog" aria-modal="true">${M}</div></div>`;
}

/* ============ Рендер ============ */
function render() {
  hideTip();
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('nomarks', !S.marks);
  const pill = (k, list) => `<div class="pills">${list.map(([v, t]) => `<button class="${S[k] === v ? 'on' : ''}" data-set="${k}" data-v="${v}">${t}</button>`).join('')}</div>`;
  document.getElementById('mk').innerHTML = `<h1>AI Home · страница фичи · финал</h1>
    <span class="grp"><span class="lbl">Состояние</span>${pill('fs', FS_LIST)}</span>
    <span class="grp"><span class="lbl">Тема</span>${pill('theme', [['light','светлая'],['dark','тёмная']])}</span>
    <span class="grp"><span class="lbl">Ширина</span>${pill('dev', [['d','1280'],['m','360']])}</span>
    <span class="grp"><span class="lbl">Название</span>${pill('longT', [[false,'короткое'],[true,'длинное']])}</span>
    <span class="grp"><span class="lbl">Ответ мержа</span>${pill('mergeResp', [['ok','200'],['409','409']])}</span>
    <span class="grp"><span class="lbl">Пометки бэка</span>${pill('marks', [[true,'вкл'],[false,'выкл']])}</span>
    <span class="grp"><button class="btn xs gh" data-act="resetWin">Вернуть страницу</button></span>`;
  document.getElementById('note').innerHTML = '<b>Один макет на утверждение.</b> Над вкладками — шапка как у файла, мета и блок «ждёт вас». Вкладки: «Хронология» (по умолчанию: этапы, шаги, витки, кто работал) · «Чаты» · «Задачи» · «События» · «Метрики» (только текущие данные). ' +
    'Пунктир — элемента сейчас нет; ' + be() + ' — новое поле ответа без хранилища. Клик по чату или кнопке рельсы скрывает страницу; плашка возвращает её с той же вкладкой. Esc закрывает.';
  let html;
  if (!isM()) {
    html = `<div class="app" id="frame"><div class="rail" data-t="rail">
      <button class="rb ${S.rail === 'chats' ? 'on' : ''}" data-act="rail" data-id="chats" data-tip="Чаты" aria-label="Чаты">${ic('msg', 16)}</button>
      <button class="rb ${S.rail === 'files' ? 'on' : ''}" data-act="rail" data-id="files" data-tip="Файлы" aria-label="Файлы">${ic('file', 16)}</button>
      <div class="sep"></div>
      <button class="rb ${S.win === 'tasks' ? 'on' : ''}" data-act="rail" data-id="tasks" data-tip="Задачи" aria-label="Задачи">${ic('tasks', 16)}</button>
      <button class="rb ${S.win === 'notes' ? 'on' : ''}" data-act="rail" data-id="notes" data-tip="Заметки" aria-label="Заметки">${ic('notes', 16)}</button></div>
      ${sidePanel()}${centerPane()}${modalHtml()}${S.toast ? `<div class="toast" data-t="toast" role="status">${S.toast}</div>` : ''}</div>`;
  } else {
    const scr = S.win === 'list' || S.win === 'none' ? sidePanel() : centerPane();
    html = `<div class="app m" id="frame">${scr}${modalHtml()}${S.toast ? `<div class="toast" data-t="toast" role="status">${S.toast}</div>` : ''}</div>`;
  }
  const keep = document.getElementById('pbody')?.scrollTop || 0;
  document.getElementById('app').innerHTML = html;
  const pb = document.getElementById('pbody');
  if (pb) { pb.scrollTop = keep; pb.onscroll = hideTip; }
  document.querySelector('.tab[aria-selected="true"]')?.scrollIntoView({ block:'nearest', inline:'nearest' });
}
let toastT;
function toast(t) { S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 2600); }

/* ============ Подсказки: наведение (мышь), фокус (клавиатура), тап (палец) ============ */
const tipEl = document.getElementById('tip');
let tipFor = null;
function showTip(el) {
  const t = el.dataset.tip; if (!t) return;
  tipFor = el; tipEl.textContent = t; tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = Math.min(Math.max(8, r.left), window.innerWidth - 8 - w);
  let top = r.bottom + 6; if (top + h > window.innerHeight - 8) top = r.top - 6 - h;
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
}
function hideTip() { tipFor = null; tipEl.hidden = true; }
const canHover = matchMedia('(hover: hover)').matches;
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el && canHover && !isM() && el !== tipFor) showTip(el); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && el === tipFor && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el && el.matches(':focus-visible')) showTip(el); });
document.addEventListener('focusout', e => { if (e.target.closest('[data-tip]') === tipFor) hideTip(); });

/* ============ Действия ============ */
document.addEventListener('click', e => {
  const set = e.target.closest('[data-set]');
  if (set) { const k = set.dataset.set; let v = set.dataset.v; if (k === 'marks' || k === 'longT') v = v === 'true';
    S[k] = v; if (k === 'fs' || k === 'dev') { S.win = 'feature'; S.menu = false; S.modal = null; S.rail = 'chats'; }
    if (k === 'fs') { S.taskF = 'all'; S.evAll = false; }
    render(); return; }
  // Тап по элементу с подсказкой без действия (метка «ключевой», аватар с чипом, «≈») — показать/спрятать подсказку
  const tipOnly = e.target.closest('[data-tip]:not([data-act])');
  // На десктопе подсказка уже поднята наведением — клик её не прячет; на таче тап переключает.
  if (tipOnly) { if (tipFor === tipOnly && (isM() || !canHover)) hideTip(); else showTip(tipOnly); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { hideTip(); if (S.menu) { S.menu = false; render(); } return; }
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'ovl' && e.target !== a) return;
  if (act !== 'menu') S.menu = false;
  switch (act) {
    case 'menu': S.menu = !S.menu; break;
    case 'close': S.win = isM() ? 'list' : 'none'; break;
    case 'toList': S.win = 'list'; break;
    case 'openFeature': S.win = 'feature'; S.rail = 'chats'; break;
    case 'resetWin': S.win = 'feature'; S.rail = 'chats'; S.modal = null; break;
    case 'chat': S.modal = null; S.win = 'chat'; S.chatId = id; S.rail = 'chats'; break;
    case 'rail': if (id === 'chats') { S.rail = 'chats'; if (isM()) S.win = 'list'; }
      else if (id === 'files') { S.rail = 'files'; if (isM()) S.win = 'file'; }
      else S.win = id; break;
    case 'openFile': S.win = 'file'; break;
    case 'closeFile': S.win = isM() ? 'list' : 'none'; break;
    case 'openTasks': S.win = 'tasks'; break;
    case 'tab': S.tab = id; break;
    case 'step': S.openSteps[id] = !S.openSteps[id]; break;
    case 'arch': S.archOpen = !S.archOpen; break;
    case 'evAll': S.evAll = !S.evAll; break;
    case 'taskF': S.taskF = id; break;
    case 'copyBranch': toast('Ветка скопирована: ' + FEAT.branch); break;
    case 'merge': S.modal = 'merge'; break;
    case 'mergeOk': S.merging = true; render();
      setTimeout(() => { S.merging = false;
        if (S.mergeResp === '409') { S.modal = 'mergeFail'; }
        else { S.modal = 'mergeDone'; S.fs = 'merging';
          setTimeout(() => { if (S.fs === 'merging' && !S.modal) { S.fs = 'merged'; toast('Фича смержена в master'); render(); } }, 3500); }
        render(); }, 700);
      return;
    case 'modalX': case 'ovl':
      S.modal = null;
      if (S.fs === 'merging') setTimeout(() => { if (S.fs === 'merging' && !S.modal) { S.fs = 'merged'; toast('Фича смержена в master'); render(); } }, 3000);
      break;
    case 'retry': S.fs = 'loading'; render(); setTimeout(() => { S.fs = 'run'; render(); }, 900); return;
  }
  render();
  if (act === 'tab') document.getElementById('tab-' + id)?.focus({ preventScroll:true });
});
document.addEventListener('keydown', e => {
  const tab = e.target.closest?.('.tab');
  if (tab && ['ArrowRight','ArrowLeft','Home','End'].includes(e.key)) {
    const ks = tabsDef().map(t => t.k), i = ks.indexOf(S.tab);
    const n = e.key === 'ArrowRight' ? (i + 1) % ks.length : e.key === 'ArrowLeft' ? (i - 1 + ks.length) % ks.length : e.key === 'Home' ? 0 : ks.length - 1;
    e.preventDefault(); S.tab = ks[n]; render(); document.getElementById('tab-' + S.tab)?.focus(); return;
  }
  if (e.key !== 'Escape') return;
  if (!tipEl.hidden) { hideTip(); return; }
  if (S.modal) S.modal = null; else if (S.menu) S.menu = false; else if (S.win === 'feature') S.win = isM() ? 'list' : 'none'; else return;
  render();
});
render();
</script>
</body>
</html>
