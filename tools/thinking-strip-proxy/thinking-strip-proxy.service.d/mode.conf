[Service]
# Решение Андрея 2026-09-19 по итогам эксперимента: размышления с бюджетом 512 + фраза перехода
# (--reasoning-config в .env стенда vLLM).
Environment=THINKING_MODE=budget THINKING_BUDGET=512
# Прунинг старых выводов инструментов. PRUNE_INPUTS и PRUNE_THINKING намеренно НЕ включены:
# живой прогон 2026-09-22 показал, что модель подражает плейсхолдеру в своём собственном тексте
# (записала файл строкой «[Old tool input content cleared]»). Подробности — в README.
Environment=PRUNE_TOOL_RESULTS=on
