# Шаблон YAML для ai-toolkit (AD-026). Рендерится воркером в каталог прогона перед стартом
# обучения. Параметры v1 — константы; правка — только через ADR с новой версией шаблона.
#
# Конвенция ai-toolkit (ostris): config — это описание одной работы job. Рендер подставляет
# training_folder, name и trigger; всё остальное — из этого шаблона.
job: extension
config:
  name: "ccs-<slug>-<run_id>"
  process:
    - type: sd_trainer
      training_folder: "<out_dir>"
      device: cuda:0
      model:
          # arch="qwen_image_2" — единственный поддерживаемый ai-toolkit вариант на a949f21
          arch: "qwen_image_2"
          # name_or_path: путь к локальным весам UNet (Comfy-Org/Qwen-Image-2.1 — симлинк)
          name_or_path: "models/qwen_image_2.1_int8_convrot.safetensors"
          # extras_name_or_path: репо для конфигов и процессора (Qwen/Qwen-Image-2.1 —
          # кэш прогревается install.sh, скачивание при первом старте через br0/HTTPS_PROXY)
          extras_name_or_path: "Qwen/Qwen-Image-2.1"
          quantize: true
          qtype: "uint3|ostris/accuracy_recovery_adapters/qwen_image_torchao_uint3.safetensors"
          quantize_te: true
          qtype_te: "qfloat8"
          low_vram: true
      datasets:
          - folder_path: "<dataset_dir>"
            caption_ext: "txt"
            caption_dropout_rate: 0.05
            shuffle_tokens: false
            cache_latents_to_disk: true
            resolution: [512, 768, 1024]
      train:
          steps: <steps>
          batch_size: 1
          gradient_accumulation: 1
          train_unet: true
          train_text_encoder: false
          cache_text_embeddings: true
          gradient_checkpointing: true
          noise_scheduler: "flowmatch"
          optimizer: "adamw8bit"
          lr: 1.0e-4
          dtype: bf16
      network:
          type: "lora"
          linear: 16
          linear_alpha: 16
      save:
          dtype: bf16
          save_every: 250
          max_step_saves_to_keep: 1
          push_to_hub: false
      sample:
          prompts: []
          sample_every: 0   # ADR: пробные картинки в продукте выключены
          walk_seed: true
          guidance_scale: 3
          sample_steps: 25
      meta:
          name: "ccs-<slug>-<run_id>"
          version: '1.0'