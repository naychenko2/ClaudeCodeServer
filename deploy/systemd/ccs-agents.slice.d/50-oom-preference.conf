# ManagedOOMMemoryPressure=kill на ccs-agents.slice — предохранитель второго
# рубежа: oomd следит за PSI САМОГО slice (порог 80 %, длительность общая из
# oomd.conf — 20 с) и при затяжном стойле убивает целиком самый давящий scope.
#
# Порог 80 %, а не дефолтные 60 %: инцидент 15.10 (14:17 UTC) — slice упёрся в
# MemoryMax=18G в основном за счёт файлового кэша (file ≈ 7,9G, anon ≈ 0,9G),
# reclaim у потолка дал PSI 63,7 % дольше 20 с, и oomd убил ход при отсутствии
# настоящего thrash. Длительность на slice не задаётся, поэтому подняли только порог.
#
# Работает только в паре с 50-memory-limits.conf БЕЗ MemoryHigh: с дросселем
# PSI внутри slice был искусственным и предохранитель срабатывал на него
# (2 из 9 убийств 19–21.09). Без дросселя давление в slice появляется лишь при
# настоящем thrash у потолка MemoryMax, и тогда убить scope — правильно.
#
# Первый рубеж — ядро по MemoryMax (убивает один процесс, не scope). Третий,
# сессионный — user@.service, см. deploy/systemd/system/.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
