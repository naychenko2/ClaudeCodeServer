# Защита ccs.service от oomd: ManagedOOMPreference=omit запрещает oomd выбирать
# бэкенд жертвой при нехватке памяти. Бьём агентов (ccs-agents.slice, см.
# ccs-agents.slice.d/), а не прод.
#
# Этот drop-in заменяет ручной `systemctl --user set-property ccs.service
# ManagedOOMPreference=omit`. Хранится в user/, а не user.control/, чтобы быть
# частью git и переживать `daemon-reload`.
[Service]
ManagedOOMPreference=omit
