<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Детский режим — окно «Настройки детского режима» · макет v1</title>
<!--
  Макет окна «Настройки детского режима». Эпик 45af8178-8435-4746-8f13-bd3cc781585e, задача-макет f25a3426
  (role=design). Макетом пользуются будущие шаги фичи: вынос редактора из UserManagementModal в отдельное
  окно (stepRef назначит план) и новые поля профиля (класс предмета, режимы репетитора).
  Записка с рекомендацией и текстами интерфейса — kids-settings-window-proposal.md.
  Основа: ADR-041 (редакции 2–4: предметы, знания, одно согласие на профиль), прошлые макеты kids-tutors.html.

  Устройство файла — как у kids-tutors.html:
    1) ТЕМА — значения --c-* дословно из frontend/src/lib/theme.css. Сырой hex живёт только там.
    2) КОМПОНЕНТЫ — классы с именами живых компонентов (.btn = Button, .field = Field, .tabs = Tabs,
       .seg = SegmentedControl, .toggle = Toggle, .notice = Notice, .cbrow = Checkbox), только var(--c-*)
       и шкалы FS/SP/R. Новых цветов и новых ступеней шкал макет не вводит.
    3) ПРОТОТИП — состояние в JS. Пульт сверху — рычаги макета, не продукт.
  Якорь адреса повторяет пульт: #v=B&s=filled&t=dark&w=mob&sec=tutors
-->
<style>
/* ===== 1. Тема: frontend/src/lib/theme.css ===== */
:root, [data-theme="light"] {
  --c-bg-main:#F4F0E8; --c-bg-panel:#EDE7DC; --c-bg-card:#FBF8F2; --c-bg-white:#FFFFFF;
  --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E;
  --c-on-accent:#FBF8F2; --c-on-dark:#FFFFFF;
  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5; --c-accent-soft:#E8A990;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-divider:#DDD4C4; --c-dashed:#D0C6B4;
  --c-track:#D8CFBE; --c-smoke:#B4A899;
  --c-overlay:rgba(23,19,15,.42); --c-msg-bg:rgba(251,248,242,.42);
  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;
  --c-warning:#C9923E; --c-warning-bg:#FBEFE0; --c-warning-text:#8A6A28;
  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F; --c-danger-border:#F5C6BF;
  --c-info:#3E7CA6; --c-info-bg:#E7EFF5;
  --c-rose:#B0527C; --c-rose-text:#8E3D62;
  --c-plan:#6C5CB0; --c-plan-light:#EEEBF8; --c-plan-text:#4E4196;
  --shadow-focus:0 0 0 3px rgba(217,119,87,.14);
  --shadow-card:0 2px 8px rgba(60,50,35,.05);
  --shadow-island:0 1px 2px rgba(60,50,35,.06),0 6px 20px rgba(60,50,35,.10);
  --shadow-modal:0 24px 60px rgba(23,19,15,.40);
  --shadow-peek:0 2px 6px rgba(60,50,35,.14),0 20px 48px rgba(23,19,15,.32);
  --shadow-button:0 4px 14px rgba(217,119,87,.30);
  --shadow-thumb:0 1px 3px rgba(42,37,31,.12);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(217,119,87,.13),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.10),transparent 60%);
  /* GROUP_COLORS из design.ts — палитра аватаров-инициалов, от темы не зависит */
  --group-blue:#3E7CA6; --group-violet:#8E4A82; --group-green:#3F7A4F; --group-orange:#C2693B; --group-indigo:#4B6BB0; --group-khaki:#7A7250;
}
[data-theme="dark"] {
  --c-bg-main:#201C18; --c-bg-panel:#272320; --c-bg-card:#2E2A25; --c-bg-white:#2E2A25;
  --c-bg-selected:#38332D; --c-bg-inset:#1B1815;
  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072;
  --c-on-accent:#201C18;
  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C; --c-accent-soft:#9A5E48;
  --c-border:#3D3830; --c-border-light:#34302A; --c-divider:#454037; --c-dashed:#4A443B;
  --c-track:#453F37; --c-smoke:#7E7566;
  --c-overlay:rgba(0,0,0,.62); --c-msg-bg:rgba(46,42,37,.38);
  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;
  --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E;
  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72; --c-danger-border:#5A302A;
  --c-info:#5FA0CC; --c-info-bg:#1E2A33;
  --c-rose:#D683A6; --c-rose-text:#E7A3C0;
  --c-plan:#9385D8; --c-plan-light:#2A2540; --c-plan-text:#B0A4E6;
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-island:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.45);
  --shadow-modal:0 28px 70px rgba(0,0,0,.65);
  --shadow-peek:0 2px 8px rgba(0,0,0,.50),0 24px 56px rgba(0,0,0,.68);
  --shadow-button:0 4px 16px rgba(227,138,106,.34);
  --shadow-thumb:0 1px 3px rgba(0,0,0,.45);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(227,138,106,.11),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.08),transparent 60%);
}

/* ===== 3. Компоненты ===== */
*{box-sizing:border-box}
body{margin:0;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--c-bg-inset);color:var(--c-text-primary)}
.serif{font-family:'PT Serif',Georgia,serif}
.mono{font-family:'JetBrains Mono','Courier New',monospace}
button,input,textarea,select{font-family:inherit}
svg.i{display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Пульт прототипа (не продукт) */
.pult{position:sticky;top:0;z-index:2000;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--c-bg-panel);border-bottom:1px solid var(--c-border);font-size:12px;color:var(--c-text-secondary)}
.pult b{font-weight:600;color:var(--c-text-heading);margin-right:4px}
.pult .grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pill{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--c-bg-selected);flex-wrap:wrap}
.pill button{border:none;cursor:pointer;background:transparent;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--c-text-secondary)}
.pill button[aria-pressed="true"]{background:var(--c-bg-white);box-shadow:var(--shadow-thumb);color:var(--c-text-heading)}
.stage{padding:24px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:24px;overflow-x:auto}
.cap{font-size:12px;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;align-self:center}

/* Окно устройства: CanvasBackdrop */
.frame{position:relative;isolation:isolate;flex-shrink:0;height:860px;border-radius:14px;overflow:hidden;background:var(--c-bg-main);color:var(--c-text-primary);display:flex;flex-direction:column;box-shadow:var(--shadow-peek)}
.frame.short{height:auto}
.frame::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--canvas-glow)}
.frame.m{height:760px}

/* Button (ui/Button.tsx) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;transition:background .12s,box-shadow .12s;color:inherit;text-decoration:none}
.btn:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.btn.sm{min-height:32px;padding:7px 13px;font-size:13px;border-radius:10px}
.btn.md{min-height:40px;padding:11px 16px;font-size:14px;border-radius:12px}
.btn.primary{background:var(--c-accent);color:var(--c-on-accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--c-bg-panel);color:var(--c-text-secondary)}
.btn.secondary:hover{background:var(--c-bg-selected)}
.btn.ghost{background:transparent;border:1px solid var(--c-border);color:var(--c-text-secondary)}
.btn.ghost:hover{background:var(--c-bg-selected)}
.btn.ghostAccent{background:var(--c-accent-light);border:1px solid var(--c-accent-muted);color:var(--c-accent)}
.btn.danger{background:transparent;border:1px solid var(--c-danger-border);color:var(--c-danger-text)}
.btn.danger:hover{background:var(--c-danger-bg)}
.btn.dashed{background:transparent;border:1.5px dashed var(--c-dashed);color:var(--c-accent)}
.btn.link{background:none;padding:0;min-height:40px;color:var(--c-accent);font-weight:600;font-size:13px}
.btn.full{width:100%}
.ib{width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--c-text-muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.ib:hover{background:var(--c-bg-selected);color:var(--c-text-primary)}
.ib:focus-visible{outline:none;box-shadow:var(--shadow-focus)}

/* Badge / Notice */
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.4;white-space:nowrap}
.badge.neutral{background:var(--c-bg-inset);color:var(--c-text-muted)}
.badge.success{background:var(--c-success-bg);color:var(--c-success-text)}
.badge.warning{background:var(--c-warning-bg);color:var(--c-warning-text)}
.badge.danger{background:var(--c-danger-bg);color:var(--c-danger-text)}
.badge.info{background:var(--c-info-bg);color:var(--c-info)}
.badge.plan{background:var(--c-plan-light);color:var(--c-plan-text)}
.notice{display:flex;align-items:flex-start;gap:8px;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.45;border:1px solid}
.notice .tx{flex:1;min-width:0}
.notice .tt{font-weight:600;margin-bottom:2px}
.notice .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.notice.warning{background:var(--c-warning-bg);color:var(--c-warning-text);border-color:var(--c-warning)}
.notice.danger{background:var(--c-danger-bg);color:var(--c-danger-text);border-color:var(--c-danger-border)}
.notice.info{background:var(--c-info-bg);color:var(--c-text-primary);border-color:var(--c-info)}
.notice.info .ic{color:var(--c-info)}

/* Checkbox / Toggle / Segmented */
.cbrow{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:14px;color:var(--c-text-primary);background:none;border:none;padding:0;text-align:left}
.cbrow .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--c-border);display:grid;place-items:center;color:var(--c-on-accent);flex-shrink:0;background:var(--c-bg-white)}
.cbrow[aria-checked="true"] .box{background:var(--c-accent);border-color:var(--c-accent)}
.cbrow:disabled{cursor:not-allowed;opacity:.5}
.toggle{width:42px;height:25px;border-radius:25px;padding:3px;background:var(--c-track);border:none;cursor:pointer;flex-shrink:0}
.toggle i{display:block;width:19px;height:19px;border-radius:50%;background:var(--c-bg-white);box-shadow:var(--shadow-thumb)}
.toggle[aria-checked="true"]{background:var(--c-success)}
.toggle[aria-checked="true"] i{margin-left:17px}
.tz{min-width:44px;min-height:40px;display:grid;place-items:center}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:var(--c-bg-inset);flex-wrap:wrap}
.seg button{min-height:34px;border:none;background:transparent;border-radius:9px;padding:0 12px;font-size:13px;font-weight:600;color:var(--c-text-secondary);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c-bg-white);color:var(--c-text-heading);box-shadow:var(--shadow-thumb)}
.m .seg button{min-height:40px}

/* Field */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--c-text-secondary)}
.field .hint{font-size:12px;color:var(--c-text-muted);line-height:1.4}
.inp{height:40px;width:100%;padding:0 12px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-bg-white);color:var(--c-text-primary);font-size:14px;display:flex;align-items:center;gap:8px}
textarea.inp{height:auto;min-height:76px;padding:10px 12px;line-height:1.5;resize:vertical;display:block}
.inp.sel{justify-content:space-between;cursor:pointer}
.inp.sel .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inp.warn{border-color:var(--c-warning)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m .row2{grid-template-columns:1fr;gap:8px}

/* Tabs (ui/Tabs.tsx size="md") */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--c-border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tab{height:38px;padding:0 10px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--c-text-secondary);display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex-shrink:0}
.tab[aria-selected="true"]{color:var(--c-text-heading);border-bottom-color:var(--c-accent)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--c-warning)}
.m .tab{height:44px;padding:0 12px}

/* Modal: десктоп — карточка R.modal, мобила — bottom-sheet R.sheet */
.overlay{position:absolute;inset:0;background:var(--c-overlay);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{max-height:100%;height:100%;display:flex;flex-direction:column;background:var(--c-bg-card);border-radius:20px;box-shadow:var(--shadow-modal);overflow:hidden;position:relative}
.m .overlay{padding:24px 0 0;align-items:flex-end}
.m .modal{width:100%;border-radius:22px 22px 0 0}
.grab{width:36px;height:4px;border-radius:999px;background:var(--c-track);margin:8px auto 0;flex-shrink:0}
.mhead{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:16px 16px 12px 24px;border-bottom:1px solid var(--c-border-light)}
.m .mhead{padding:8px 8px 12px 16px}
.mhead .ttl{flex:1;min-width:0}
.mhead .t1{font-family:'PT Serif',Georgia,serif;font-size:22px;font-weight:500;color:var(--c-text-heading);line-height:1.2}
.m .mhead .t1{font-size:18px}
.mhead .t2{font-size:12px;color:var(--c-text-muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mbody{flex:1;min-height:0;overflow:auto;padding:16px 24px 24px}
.m .mbody{padding:12px 16px 16px}
.mfoot{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:12px 16px 12px 24px;border-top:1px solid var(--c-border-light);background:var(--c-bg-card)}
.m .mfoot{padding:12px 16px}
.mfoot .dirty{flex:1;font-size:12px;color:var(--c-text-muted);display:flex;align-items:center;gap:6px}
.mfoot .dirty i{width:8px;height:8px;border-radius:50%;background:var(--c-accent);display:inline-block}

/* Аватар / глиф / палитра предметов (ключ → пара C.*, как kids-tutors.html) */
.pav{border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:var(--c-on-dark);font-weight:700;line-height:1;user-select:none}
.glyph{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;font-family:'PT Serif',Georgia,serif;font-size:15px;font-weight:700;line-height:1;white-space:nowrap}
.glyph.sm{width:24px;height:24px;border-radius:6px;font-size:11px}
.pal-info{background:var(--c-info-bg);color:var(--c-info)}
.pal-rose{background:color-mix(in srgb,var(--c-rose) 14%,var(--c-bg-card));color:var(--c-rose-text)}
.pal-success{background:var(--c-success-bg);color:var(--c-success-text)}
.pal-warning{background:var(--c-warning-bg);color:var(--c-warning-text)}
.pal-accent{background:var(--c-accent-light);color:var(--c-accent)}

/* Разделы */
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 12px}
.sech h3{margin:0;font-family:'PT Serif',Georgia,serif;font-size:18px;font-weight:500;color:var(--c-text-heading)}
.sech p{margin:4px 0 0;font-size:13px;color:var(--c-text-muted);line-height:1.45;max-width:560px}
.lbl{font-size:10px;font-weight:600;color:var(--c-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 8px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--c-border-light);border-radius:14px;background:var(--c-bg-white);box-shadow:var(--shadow-card)}
.card.pad{padding:16px}
.m .card.pad{padding:12px}
.muted{font-size:12px;color:var(--c-text-muted);line-height:1.45}

/* Строка предмета */
.subj{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 12px;min-height:64px}
.subj+.subj{border-top:1px solid var(--c-border-light)}
.subj .nm{font-size:14px;font-weight:600;color:var(--c-text-heading)}
.subj .meta{font-size:12px;color:var(--c-text-muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.subj .who{display:flex;align-items:center;gap:8px;min-width:0;width:190px}
.subj .who .tn{font-size:13px;color:var(--c-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj.off .nm,.subj.off .glyph{opacity:.55}
.subj.sel{background:var(--c-bg-selected)}
.m .subj .who{display:none}

/* Репетиторы */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.m .tgrid{grid-template-columns:1fr}
.tcard{display:flex;flex-direction:column;gap:8px;padding:16px;text-align:left;cursor:pointer;border:1px solid var(--c-border-light);border-radius:14px;background:var(--c-bg-white);box-shadow:var(--shadow-card);color:inherit}
.tcard[aria-pressed="true"]{border-color:var(--c-accent);box-shadow:var(--shadow-focus)}
.m .tcard{flex-direction:row;align-items:center;padding:12px}
.tcard .tn{font-size:14px;font-weight:600;color:var(--c-text-heading)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--c-border);background:var(--c-bg-white);font-size:13px;font-weight:600;color:var(--c-text-secondary);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c-accent-light);border-color:var(--c-accent-muted);color:var(--c-accent)}
.m .chip{min-height:40px}
.avedit{display:flex;gap:16px;align-items:center}
.m .avedit{flex-direction:column;align-items:flex-start;gap:12px}

/* Маршруты */
.rgroup{border:1px solid var(--c-border-light);border-radius:14px;background:var(--c-bg-white);overflow:hidden}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
.rrow+.rrow{border-top:1px solid var(--c-border-light)}
.rrow .rn{font-size:14px;font-weight:600;color:var(--c-text-heading)}
.rrow .rm{font-size:12px;color:var(--c-text-muted)}
.rrow.locked .rn,.rrow.locked .rm{opacity:.6}
.consent{border:1px solid var(--c-border);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:flex-start;background:var(--c-bg-white)}
.consent.on{border-color:var(--c-success);background:var(--c-success-bg)}
.consent.off{border-color:var(--c-warning);background:var(--c-warning-bg)}
.consent .ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--c-bg-card)}
.consent.on .ci{color:var(--c-success-text)}
.consent.off .ci{color:var(--c-warning-text)}
.consent .ct{font-size:15px;font-weight:600;color:var(--c-text-heading)}
.consent .cd{font-size:13px;color:var(--c-text-secondary);margin-top:4px;line-height:1.45}
.m .consent{flex-direction:column;gap:8px;padding:12px}
.risk{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.risk li{display:flex;gap:10px;font-size:13px;line-height:1.45;color:var(--c-text-primary)}
.risk li .rk{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}

/* Неделя: 7 полос × 24 часа */
.week{display:flex;flex-direction:column;gap:6px}
.wd{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--c-text-secondary);font-weight:600}
.bar{position:relative;height:18px;border-radius:6px;background:var(--c-bg-inset);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--c-success)}
.bar i.b{background:var(--c-info)}
.hours{display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:10px;color:var(--c-text-muted)}
.hours div:last-child{display:flex;justify-content:space-between}
.win{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--c-border-light);border-radius:12px;background:var(--c-bg-white)}
.win .sw{width:10px;height:36px;border-radius:999px;background:var(--c-success);flex-shrink:0}
.win .sw.b{background:var(--c-info)}
.win .wt{font-size:15px;font-weight:600;color:var(--c-text-heading)}
.daychips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.daychips span{min-width:28px;height:22px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:600;display:grid;place-items:center;background:var(--c-bg-inset);color:var(--c-text-muted)}
.daychips span.on{background:var(--c-accent-light);color:var(--c-accent)}

/* Обзор */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tiles.t3{grid-template-columns:repeat(2,1fr)}
.m .tiles{grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:12px 16px;border-radius:14px;background:var(--c-bg-white);border:1px solid var(--c-border-light);display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:11px;font-weight:600;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:'PT Serif',Georgia,serif;font-size:22px;color:var(--c-text-heading);line-height:1.15}
.tile .s{font-size:12px;color:var(--c-text-muted)}
.meter{height:6px;border-radius:999px;background:var(--c-track);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--c-success)}
.hero{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;background:var(--c-bg-white);border:1px solid var(--c-border-light);box-shadow:var(--shadow-card)}
.hero .hn{font-family:'PT Serif',Georgia,serif;font-size:22px;color:var(--c-text-heading)}
.todo{display:flex;flex-direction:column}
.todo .ti{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:56px}
.todo .ti+.ti{border-top:1px solid var(--c-border-light)}
.todo .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--c-bg-inset);color:var(--c-text-secondary);flex-shrink:0}
.todo .num.done{background:var(--c-success-bg);color:var(--c-success-text)}

/* Вариант B: две панели */
.split{flex:1;min-height:0;display:grid;grid-template-columns:268px 1fr}
.split.narrow{grid-template-columns:216px 1fr}
.nav{border-right:1px solid var(--c-border-light);background:var(--c-bg-panel);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 10px;border-radius:12px;border:none;background:none;cursor:pointer;text-align:left;color:var(--c-text-primary);width:100%}
.navitem:hover{background:var(--c-bg-selected)}
.navitem[aria-current="page"]{background:var(--c-bg-card);box-shadow:var(--shadow-card)}
.navitem .ni{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--c-bg-inset);color:var(--c-text-secondary);flex-shrink:0}
.navitem[aria-current="page"] .ni{background:var(--c-accent-light);color:var(--c-accent)}
.navitem .nt{flex:1;min-width:0}
.navitem .n1{font-size:14px;font-weight:600;color:var(--c-text-heading)}
.navitem .n2{font-size:12px;color:var(--c-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .n2.w{color:var(--c-warning-text)}
.navitem .n2.d{color:var(--c-danger-text)}
.navkid{display:flex;align-items:center;gap:12px;padding:8px 10px 16px;border-bottom:1px solid var(--c-border-light);margin-bottom:8px}
.pane{overflow:auto;padding:24px 32px 32px}
.pane>*{max-width:760px}
.split.narrow .pane{padding:20px}
.m .nav{border-right:none;background:none;padding:8px 12px;gap:4px}
.m .navitem{background:var(--c-bg-white);border:1px solid var(--c-border-light);min-height:60px}
.crumb{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--c-text-muted);margin-bottom:12px}

/* Вариант C: мастер */
.stepper{display:flex;align-items:center;gap:4px;padding:12px 24px;border-bottom:1px solid var(--c-border-light);overflow-x:auto;flex-shrink:0}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--c-text-muted);white-space:nowrap;padding:4px 8px 4px 4px;border-radius:999px;border:none;background:none;cursor:pointer;min-height:36px}
.step .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--c-bg-inset);color:var(--c-text-secondary)}
.step.done .sn{background:var(--c-success-bg);color:var(--c-success-text)}
.step.cur{background:var(--c-accent-light);color:var(--c-accent)}
.step.cur .sn{background:var(--c-accent);color:var(--c-on-accent)}
.stepline{width:16px;height:1px;background:var(--c-divider);flex-shrink:0}
.mprog{padding:8px 16px 12px;border-bottom:1px solid var(--c-border-light);flex-shrink:0}
.mprog .mp{display:flex;justify-content:space-between;font-size:12px;color:var(--c-text-muted);margin-bottom:6px}
.mprog .mp b{color:var(--c-text-heading)}

/* Скелетон / пустые */
.sk{border-radius:10px;background:var(--c-bg-inset);animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.5}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:32px 16px;border:1.5px dashed var(--c-dashed);border-radius:16px}
.empty .eg{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--c-accent-light);color:var(--c-accent)}
.empty .et{font-family:'PT Serif',Georgia,serif;font-size:18px;color:var(--c-text-heading)}
.empty .ed{font-size:13px;color:var(--c-text-muted);max-width:380px;line-height:1.45}

/* Диалог согласия поверх окна (Modal width MODAL_W.consent = 520) */
.dlgwrap{position:absolute;inset:0;background:var(--c-overlay);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.m .dlgwrap{padding:24px 0 0;align-items:flex-end}
.dlg{width:520px;max-height:100%;overflow:auto;background:var(--c-bg-card);border-radius:20px;box-shadow:var(--shadow-modal);display:flex;flex-direction:column}
.m .dlg{width:100%;border-radius:22px 22px 0 0}
.dlg .dh{padding:20px 24px 8px;font-family:'PT Serif',Georgia,serif;font-size:20px;color:var(--c-text-heading)}
.dlg .db{padding:0 24px 16px;display:flex;flex-direction:column;gap:16px}
.dlg .df{padding:12px 24px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--c-border-light)}
.m .dlg .dh,.m .dlg .db,.m .dlg .df{padding-left:16px;padding-right:16px}
.m .dlg .df{flex-direction:column-reverse}

/* «Управление пользователями»: строка пользователя */
.users{width:620px;background:var(--c-bg-card);border-radius:20px;box-shadow:var(--shadow-modal);overflow:hidden;margin:24px auto}
.m .users{width:100%;margin:0;border-radius:0;box-shadow:none}
.urow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--c-border-light);flex-wrap:wrap}
.urow .un{font-size:14px;font-weight:600;color:var(--c-text-heading)}
.urow .ue{font-size:12px;color:var(--c-text-muted)}
.urow .kid{flex-basis:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-left:52px}
.m .urow .kid{padding-left:0}

/* Записка под рамкой */
.notes{max-width:1280px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:13px;line-height:1.5}
.notes .nb{padding:16px;border-radius:14px;background:var(--c-bg-card);border:1px solid var(--c-border-light)}
.notes h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--c-text-secondary)}
.notes ul{margin:0;padding-left:18px}
.notes .rec{border-color:var(--c-accent);background:var(--c-accent-light)}
@media (max-width:900px){.notes{grid-template-columns:1fr}}
</style>

const ic = (n, s = 16) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24">${P[n]}</svg>`;

/* ===== Данные ===== */
const KID = { name: 'Маша', login: 'masha', grade: '4 класс' };

    ['cloud', 'info', 'Облачному поставщику (DeepSeek, GLM и другим) уходит переписка Маши.'],
    ['cpu', 'success', 'Локальная модель слабее держит правила безопасности и стоп-сигнал.'],
    ['refresh', 'neutral', 'Если модель не ответит, урок сам перейдёт на другую модель или аккаунт из цепочки.'],
    ['users', 'warning', 'Лимиты подписок общие со взрослыми: уроки Маши тратят и ваши лимиты.'],
  ];
  const tone = (t) => ({ plan:'background:var(--c-plan-light);color:var(--c-plan-text)', info:'background:var(--c-info-bg);color:var(--c-info)', success:'background:var(--c-success-bg);color:var(--c-success-text)', neutral:'background:var(--c-bg-inset);color:var(--c-text-secondary)', warning:'background:var(--c-warning-bg);color:var(--c-warning-text)' }[t]);
  return `<div class="dlgwrap"><div class="dlg" role="dialog" aria-labelledby="dlgt">${M() ? '<div class="grab"></div>' : ''}
    <div class="dh" id="dlgt">Разрешить Маше любые модели?</div>
    <div class="db"><div class="muted" style="font-size:13px">Согласие одно — на все предметы и помощника правил. Отозвать можно в любой момент в «Моделях и согласии».</div>
      <ul class="risk">${risk.map(([i, t, x]) => `<li><span class="rk" style="${tone(t)}">${ic(i, 14)}</span><span>${x}</span></li>`).join('')}</ul>
      <div class="card pad" style="padding:8px 12px">${cb(true, '<span><b>Понимаю риски и беру их на себя</b></span>')}</div></div>
    <div class="df"><button class="btn md ghost">Отмена</button><button class="btn md primary">Разрешить</button></div></div></div>`;
}

/* ===== Вариант A · Вкладки (Modal MODAL_W.wide) ===== */
function variantA() {
  const tabs = `<div class="tabs" style="padding:0 ${M() ? 8 : 24}px">${SECS.map(([k, l]) => `<button class="tab" aria-selected="${activeKey() === k}">${l}${k === 'models' && waiting().length ? '<span class="dot"></span>' : ''}</button>`).join('')}</div>`;
  const w = S.w === 'desk' ? 720 : S.w === 'tab' ? 720 : '100%';
  return `<div class="overlay"><div class="modal" style="width:${typeof w === 'number' ? w + 'px' : w}">${head()}${S.s === 'error' ? '' : tabs}<div class="mbody">${S.s === 'error' ? errorBody() : curSec()}</div>${foot()}${consentDialog()}</div></div>`;
}

/* ===== Вариант B · Две панели (Modal size="fullscreen" на десктопе и планшете) ===== */
function navList() {
  return `<div class="navkid"><span class="pav" style="width:44px;height:44px;background:var(--group-indigo);font-size:16px">М</span><div><div style="font-size:15px;font-weight:600;color:var(--c-text-heading)">${KID.name}</div><div class="muted">${KID.grade} · <span style="color:var(--c-success-text)">режим включён</span></div></div></div>
    ${SECS.map(([k, l, i]) => { const [h, tone] = navHint(k); return `<button class="navitem" ${!M() && activeKey() === k ? 'aria-current="page"' : ''} ${S.s === 'error' ? 'disabled style="opacity:.5"' : ''}><span class="ni">${ic(i, 16)}</span><span class="nt"><span class="n1" style="display:block">${l}</span><span class="n2 ${tone}" style="display:block">${S.s === 'error' ? '—' : h}</span></span>${M() ? ic('right', 18) : ''}</button>`; }).join('')}`;
}
function variantB() {
  if (M()) {
    const listScreen = S.ms === 'list';
    const title = listScreen ? '' : `<div style="display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid var(--c-border-light)"><button class="ib" aria-label="Назад к разделам">${ic('left', 20)}</button><span style="font-size:15px;font-weight:600;color:var(--c-text-heading)">${(SECS.find(([k]) => k === activeKey()) || [])[1]}</span></div>`;
    return `<div class="overlay" style="padding:0"><div class="modal" style="width:100%;border-radius:0">${listScreen ? head() : head().replace('<div class="grab"></div>', '')}
      ${listScreen ? `<div class="mbody" style="padding:8px 4px">${navList()}</div>` : `${title}<div class="mbody">${S.s === 'error' ? errorBody() : curSec()}</div>`}${foot()}${consentDialog()}</div></div>`;
  }
  return `<div class="modal" style="width:100%;border-radius:0;box-shadow:none">${head()}<div class="split${S.w === 'tab' ? ' narrow' : ''}"><nav class="nav" aria-label="Разделы настроек">${navList()}</nav><div class="pane">${S.s === 'error' ? errorBody() : curSec()}</div></div>${foot()}${consentDialog()}</div>`;
}

/* ===== Вариант C · Мастер по шагам (Modal MODAL_W.wide) ===== */
function variantC() {
  const steps = SECS.filter(([k]) => k !== 'overview').concat([['overview', 'Проверка', 'check']]);
  const cur = steps.findIndex(([k]) => k === activeKey());
  const stepper = M()
    ? `<div class="mprog"><div class="mp"><span>Шаг ${cur + 1} из ${steps.length}</span><b>${steps[cur][1]}</b></div><div class="meter"><i style="width:${(cur + 1) / steps.length * 100}%;background:var(--c-accent)"></i></div></div>`
    : `<div class="stepper">${steps.map(([k, l], i) => `${i ? '<span class="stepline"></span>' : ''}<button class="step ${i < cur ? 'done' : ''} ${i === cur ? 'cur' : ''}"><span class="sn">${i < cur ? ic('check', 12) : i + 1}</span>${i === cur ? l : `<span style="position:absolute;left:-9999px">${l}</span>`}</button>`).join('')}</div>`;
  const nav = S.s === 'error' ? '' : `<div class="mfoot">${cur > 0 ? `<button class="btn md ghost">${ic('left', 16)}Назад</button>` : ''}<span class="dirty"></span>${M() ? '' : '<button class="btn md secondary">Сохранить и выйти</button>'}<button class="btn md primary">${cur === steps.length - 1 ? 'Сохранить' : 'Дальше'}${cur === steps.length - 1 ? '' : ic('right', 16)}</button></div>`;
  const w = M() ? '100%' : '720px';
  return `<div class="overlay"><div class="modal" style="width:${w}">${head()}${S.s === 'error' ? '' : stepper}<div class="mbody">${S.s === 'error' ? errorBody() : curSec()}</div>${nav}${consentDialog()}</div></div>`;
}

/* ===== «Управление пользователями» — строка с галочкой ===== */
function usersPanel() {
  const on = S.s !== 'empty' || true;
  const w = waiting().length;
  const status = S.s === 'empty' ? '<span class="badge neutral">предметов нет</span>' : S.s === 'error' ? '<span class="badge danger">не загрузилось</span>' : w ? `<span class="badge warning">${w} ждут согласия</span>` : '<span class="badge success">3 предмета</span>';
  return `<div class="users"><div class="mhead"><div class="ttl"><div class="t1">Пользователи</div></div><button class="ib" aria-label="Закрыть">${ic('x', 18)}</button></div>
    <div class="urow"><span class="pav" style="width:40px;height:40px;background:var(--group-indigo);font-size:15px">М</span><div style="flex:1;min-width:0"><div class="un">${KID.name}</div><div class="ue">@${KID.login} · песочница</div></div><span class="badge neutral">user</span>
      <div class="kid">${cb(on, 'Детский режим')}${status}<span style="flex:1"></span><button class="btn sm ghostAccent">${ic('gear', 14)}Настройки детского режима</button></div></div>
    <div class="urow"><span class="pav" style="width:40px;height:40px;background:var(--group-khaki);font-size:15px">О</span><div style="flex:1;min-width:0"><div class="un">Ольга</div><div class="ue">@olga · песочница</div></div><span class="badge neutral">user</span>
      <div class="kid">${cb(false, 'Детский режим')}</div></div>
    <div class="urow"><span class="pav" style="width:40px;height:40px;background:var(--group-orange);font-size:15px">А</span><div style="flex:1;min-width:0"><div class="un">Андрей</div><div class="ue">@andrey · машина сервера</div></div><span class="badge plan">admin</span>
      <div class="kid">${cb(false, 'Детский режим', true)}<span class="muted">Только для пользователей в песочнице</span></div></div>
  </div>`;
}

/* ===== Записка под рамкой ===== */
const NOTES = {
  A: { plus:['Знакомо: так же устроен живой ChildProfileEditor и «Персоны»','Одно окно 720 — дешевле всего в реализации','Всё видно на десктопе в два клика'],
       minus:['Шесть вкладок не влезают в 360 — половина уезжает за край, «Безопасность» не найти','Предмет и его репетитор — в разных вкладках, связь теряется (ровно то, на что жаловался Андрей)','Подробный предмет внутри вкладки — третий уровень вложенности'] },
  B: { plus:['Разделы видны все сразу, с живой подсказкой: «2 ждут согласия», «45 мин · 2 окна»','На телефоне — привычный список настроек: раздел → назад; ничего не прячется за краем','Репетиторы — отдельный раздел первого уровня: найти их можно не зная, что они «внутри предмета»','Растёт без перестройки: «Студия» волны 2 — ещё одна строка'],
       minus:['На десктопе — полноэкранное окно (size="fullscreen"), а не карточка','Чуть дороже A: свой список разделов и экран «назад» на мобиле','Один «Сохранить» на всё окно — нужна склейка PUT профиля и PUT репетиторов'] },
  C: { plus:['Идеален для первой настройки: ведёт за руку, ничего не пропустишь','Шаг «Проверка» — сводка перед сохранением'],
       minus:['Плох для правки: чтобы сменить лимит, листаешь шаги','Нельзя сохранить «половину» — или выход с потерей, или «Сохранить и выйти» на каждом шаге','Две трети времени Андрей будет править, а не настраивать с нуля'] },
};
function notesBlock() {
  return `<div class="notes">${['A', 'B', 'C'].map((v) => `<div class="nb ${v === 'B' ? 'rec' : ''}"><h4>${{ A:'A · Вкладки', B:'B · Две панели — рекомендую', C:'C · Мастер' }[v]}</h4>
    <b>Плюсы</b><ul>${NOTES[v].plus.map((x) => `<li>${x}</li>`).join('')}</ul><b>Минусы</b><ul>${NOTES[v].minus.map((x) => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`;
}

/* ===== Сборка ===== */
function render() {
  document.documentElement.setAttribute('data-theme', S.t);
  renderPult();
  const W = { desk:1280, tab:820, mob:360 }[S.w];
  const cls = `frame${M() ? ' m' : ''}`;
  const body = { A:variantA, B:variantB, C:variantC }[S.v]();
  document.getElementById('stage').innerHTML =
    `<div class="cap">Шаг 1 · «Управление пользователями»: только галочка и вход в окно</div>
     <div class="${cls} short" data-theme="${S.t}" style="width:${W}px">${usersPanel()}</div>
     <div class="cap">Шаг 2 · окно «Настройки детского режима» — вариант ${S.v}</div>
     <div class="${cls}" data-theme="${S.t}" style="width:${W}px" data-frame="settings-${S.v}">${body}</div>
     ${notesBlock()}`;
}
render();
</script>
</body>
</html>
