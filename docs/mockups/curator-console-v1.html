<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт куратора — табло фич, экран фичи, шаг · макет v1</title>
<style>
/* ===== Токены: значения из frontend/src/lib/theme.css, семантика — C.* из design.ts ===== */
:root {
  --c-bg-main:#F4F0E8; --c-bg-panel:#EDE7DC; --c-bg-card:#FBF8F2; --c-bg-white:#FFFFFF;
  --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E;
  --c-on-accent:#FBF8F2; --c-on-dark:#FFFFFF;
  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5; --c-accent-soft:#E8A990;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-divider:#DDD4C4; --c-dashed:#D0C6B4; --c-track:#D8CFBE;
  --c-progress-track:#D8CFBE;
  --c-overlay:rgba(23,19,15,.42);
  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;
  --c-warning:#C9923E; --c-warning-bg:#FBEFE0; --c-warning-text:#8A6A28; --c-on-warning:#201C18;
  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F; --c-danger-border:#F5C6BF;
  --c-info:#3E7CA6; --c-info-bg:#E7EFF5;
  --c-diff-add-bg:#E8F5E9; --c-diff-add-text:#1B5E20; --c-diff-rem-bg:#FFEBEE; --c-diff-rem-text:#B71C1C;
  --shadow-focus:0 0 0 3px rgba(217,119,87,.14);
  --shadow-card:0 2px 8px rgba(60,50,35,.05);
  --shadow-island:0 1px 2px rgba(60,50,35,.06),0 6px 20px rgba(60,50,35,.10);
  --shadow-dropdown:0 8px 28px rgba(60,50,35,.16);
  --shadow-modal:0 24px 60px rgba(23,19,15,.40);
  --shadow-peek:0 2px 6px rgba(60,50,35,.14),0 20px 48px rgba(23,19,15,.32);
  --shadow-sheet:0 -8px 40px rgba(23,19,15,.22);
  --shadow-button:0 4px 14px rgba(217,119,87,.30);
  --shadow-thumb:0 1px 3px rgba(42,37,31,.12);
  --shadow-press:inset 0 1px 3px rgba(60,50,35,.12);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(217,119,87,.13),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.10),transparent 60%);
}
[data-theme="dark"] {
  --c-bg-main:#201C18; --c-bg-panel:#272320; --c-bg-card:#2E2A25; --c-bg-white:#2E2A25;
  --c-bg-selected:#38332D; --c-bg-inset:#1B1815;
  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072;
  --c-on-accent:#201C18; --c-on-dark:#FFFFFF;
  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C; --c-accent-soft:#9A5E48;
  --c-border:#3D3830; --c-border-light:#34302A; --c-divider:#454037; --c-dashed:#4A443B; --c-track:#453F37;
  --c-progress-track:#5C544A;
  --c-overlay:rgba(0,0,0,.62);
  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;
  --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E; --c-on-warning:#201C18;
  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72; --c-danger-border:#5A302A;
  --c-info:#5FA0CC; --c-info-bg:#1E2A33;
  --c-diff-add-bg:#1E2E1E; --c-diff-add-text:#8FCB79; --c-diff-rem-bg:#33201E; --c-diff-rem-text:#EE8A72;
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-island:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.45);
  --shadow-dropdown:0 10px 32px rgba(0,0,0,.55);
  --shadow-modal:0 28px 70px rgba(0,0,0,.65);
  --shadow-peek:0 2px 8px rgba(0,0,0,.50),0 24px 56px rgba(0,0,0,.68);
  --shadow-sheet:0 -10px 46px rgba(0,0,0,.55);
  --shadow-button:0 4px 16px rgba(227,138,106,.34);
  --shadow-thumb:0 1px 3px rgba(0,0,0,.45);
  --shadow-press:inset 0 1px 4px rgba(0,0,0,.38);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(227,138,106,.11),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.08),transparent 60%);
}
* { box-sizing:border-box; }
html,body { margin:0; }
body {
  background:var(--c-bg-main); color:var(--c-text-primary);
  font-family:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif; font-size:13px; line-height:1.45;
}
button { font:inherit; }
.serif { font-family:"PT Serif",Georgia,serif; letter-spacing:-.01em; }
.mono { font-family:"JetBrains Mono","Courier New",monospace; }

/* ===== Обвязка макета (не часть продукта) ===== */
.mk {
  position:sticky; top:0; z-index:2000; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
  padding:10px 16px; background:var(--c-bg-panel); border-bottom:1px solid var(--c-border);
}
.mk h1 { margin:0; font-size:15px; font-weight:600; color:var(--c-text-heading); }
.mk .grp { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.mk .lbl { font-size:11px; color:var(--c-text-muted); text-transform:uppercase; letter-spacing:.05em; }
.pills { display:inline-flex; flex-wrap:wrap; gap:2px; padding:2px; background:var(--c-bg-selected); border-radius:9px; }
.pills button {
  border:none; background:transparent; color:var(--c-text-secondary); padding:4px 10px; border-radius:7px;
  font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
}
.pills button.on { background:var(--c-bg-white); color:var(--c-text-heading); box-shadow:var(--shadow-thumb); font-weight:600; }

/* ===== Приложение ===== */
.stage { padding:16px; display:flex; justify-content:center; }
.app { width:100%; max-width:1180px; position:relative; }
.app.m {
  width:360px; height:760px; border:1px solid var(--c-border); border-radius:28px; overflow:hidden;
  transform:translateZ(0); /* фиксированные слои (шторки) — внутри «телефона» */
  background:var(--c-bg-main);
}
.app.m .scroll { height:100%; overflow:auto; }
.canvas { background:var(--canvas-glow), var(--c-bg-main); min-height:100%; padding:8px 16px 32px; }
.app.m .canvas { padding:0 0 0; }

.hub { display:flex; align-items:center; gap:12px; height:52px; padding:0 4px; }
.app.m .hub { height:56px; padding:0 14px; background:var(--c-bg-main); border-bottom:1px solid var(--c-border); position:sticky; top:0; z-index:5; }
.hub .ttl { font-size:22px; color:var(--c-text-heading); margin:0; font-weight:700; }
.app.m .hub .ttl { font-size:18px; }
.hub .sp { flex:1; }
.hub .who { font-size:12px; color:var(--c-text-muted); }
.crumb { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--c-text-muted); margin:0 0 8px; }
.app.m .crumb { padding:8px 14px 0; }
.back {
  border:none; background:transparent; color:var(--c-text-secondary); cursor:pointer; padding:6px 8px; margin-left:-8px;
  border-radius:8px; display:inline-flex; align-items:center; gap:4px; font-size:13px; min-height:32px;
}
.back:hover { background:var(--c-bg-selected); color:var(--c-text-primary); }
.app.m .back { min-height:40px; }

.island { background:var(--c-bg-panel); border:1px solid var(--c-border-light); border-radius:14px; box-shadow:var(--shadow-island); }
.isl-h { display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; background:var(--c-bg-inset); border-radius:14px 14px 0 0; border-bottom:1px solid var(--c-border-light); }
.isl-h h3 { margin:0; font-size:13px; font-weight:600; color:var(--c-text-heading); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.isl-h .aux { font-size:11px; color:var(--c-text-muted); }
.isl-b { padding:14px; }
.app.m .island { border-radius:14px; margin:0 8px 8px; }

/* Кнопки — Button из ui/ (primary / secondary / ghost / danger; sm 32 / md 40) */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; cursor:pointer;
  font-weight:600; font-size:13px; padding:7px 13px; border-radius:10px; min-height:32px; white-space:nowrap;
  transition:background .15s, color .15s, opacity .15s;
}
.btn.md, .app.m .btn { font-size:14px; padding:10px 16px; border-radius:12px; min-height:40px; }
.btn.xs { font-size:12px; padding:0 9px; min-height:24px; height:24px; border-radius:8px; }
.btn.primary { background:var(--c-accent); color:var(--c-on-accent); box-shadow:var(--shadow-button); }
.btn.secondary { background:var(--c-bg-panel); color:var(--c-text-secondary); }
.btn.ghost { background:transparent; color:var(--c-text-secondary); border:1px solid var(--c-border); }
.btn.ghost:hover, .btn.secondary:hover { color:var(--c-text-primary); background:var(--c-bg-selected); }
.btn.danger { background:var(--c-danger); color:var(--c-on-accent); }
.btn:active { box-shadow:var(--shadow-press); }
.btn:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
.btn[disabled] { opacity:.45; cursor:not-allowed; box-shadow:none; }
.btn.full { width:100%; }

/* Статусные тона: цвет + форма глифа (дальтонизм) */
.t-wait   { --tc:var(--c-info);         --tt:var(--c-info);         --tb:var(--c-info-bg); }
.t-loop   { --tc:var(--c-warning);      --tt:var(--c-warning-text); --tb:var(--c-warning-bg); }
.t-crash, .t-reopen { --tc:var(--c-danger); --tt:var(--c-danger-text); --tb:var(--c-danger-bg); }
.t-run    { --tc:var(--c-text-heading); --tt:var(--c-text-heading); --tb:var(--c-bg-selected); }
.t-frozen { --tc:var(--c-text-muted);   --tt:var(--c-text-secondary); --tb:var(--c-bg-selected); }
.t-done   { --tc:var(--c-success);      --tt:var(--c-success-text); --tb:var(--c-success-bg); }
.g { flex-shrink:0; display:inline-block; vertical-align:-2px; }
.pulse { animation:pulse 1.6s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
@keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:.9; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation:none; opacity:.5; } }

/* ===== Табло фич ===== */
.sum { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:8px; }
.app.m .sum { grid-template-columns:1fr 1fr; padding:8px 8px 0; }
.kpi { background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:12px; padding:10px 12px; }
.kpi .v { font-size:22px; font-weight:700; color:var(--c-text-heading); line-height:1.15; font-variant-numeric:tabular-nums; }
.kpi .k { font-size:11px; color:var(--c-text-muted); }
.kpi .h { font-size:11px; color:var(--c-text-secondary); margin-top:2px; }
.kpi.bad .v { color:var(--c-warning-text); }
.app.m .kpi:last-child { grid-column:1 / -1; }

.attn { display:flex; flex-direction:column; gap:6px; }
.attn button {
  display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; cursor:pointer;
  background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:10px; padding:9px 12px; color:var(--c-text-primary);
}
.attn button:hover { background:var(--c-bg-selected); }
.attn .s { color:var(--c-text-secondary); font-size:12px; }
.attn .g { margin-top:2px; }

.boardgrid { display:grid; grid-template-columns:1fr 340px; gap:8px; align-items:start; }
.app.m .boardgrid { display:block; }
.group-h { display:flex; align-items:center; gap:8px; margin:14px 2px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--c-text-muted); }
.group-h:first-child { margin-top:2px; }
.group-h .n { background:var(--c-bg-selected); color:var(--c-text-secondary); border-radius:999px; padding:0 7px; font-size:11px; }
.group-h button { margin-left:auto; }
.app.m .group-h { margin:14px 16px 8px; }
.cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.app.m .cards { grid-template-columns:1fr; padding:0 8px; }

/* Карточка фичи — она же шапка экрана фичи (крупнее) */
.fc {
  background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:14px; box-shadow:var(--shadow-card);
  padding:12px 14px; text-align:left; width:100%; color:var(--c-text-primary); cursor:pointer; display:block;
  transition:box-shadow .15s, border-color .15s;
}
button.fc:hover { box-shadow:var(--shadow-island); border-color:var(--c-border); }
button.fc:active { box-shadow:var(--shadow-press); }
button.fc:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
.fc .top { display:flex; align-items:flex-start; gap:8px; }
.fc .name { flex:1; min-width:0; font-weight:600; font-size:14px; color:var(--c-text-heading); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fc .stl { font-size:13px; color:var(--tt); font-weight:600; margin:2px 0 8px 22px; }
.fc .stl .q { color:var(--c-text-secondary); font-weight:400; }
.fc .met { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--c-text-secondary); margin-top:10px; }
.fc .met b { color:var(--c-text-heading); font-weight:600; font-variant-numeric:tabular-nums; }
.fc .met .bad b { color:var(--c-warning-text); }
.fc .ask { margin-top:10px; display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--c-info); background:var(--c-info-bg); border-radius:8px; padding:6px 10px; }
.fc .ask.danger { color:var(--c-danger-text); background:var(--c-danger-bg); }
.fc .ask.warn { color:var(--c-warning-text); background:var(--c-warning-bg); }
.fc.done { opacity:.85; }
.fc.lg { cursor:default; padding:16px 18px; border-radius:14px; }
.fc.lg .name { font-size:22px; font-weight:700; font-family:"PT Serif",Georgia,serif; white-space:normal; }
.fc.lg .stl { font-size:14px; margin-left:24px; }
.app.m .fc.lg .name { font-size:18px; }

.avs { display:flex; }
.av {
  width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  color:var(--c-on-dark); font-size:10px; font-weight:700; border:2px solid var(--c-bg-card); margin-left:-6px;
}
.av:first-child { margin-left:0; }
.av.lg { width:28px; height:28px; font-size:11px; margin:0; border:none; }

.ruler { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; margin-left:22px; }
.ruler .seg { height:4px; border-radius:999px; background:var(--c-border); }
.ruler .seg.past { background:var(--c-text-muted); opacity:.55; }
.ruler .seg.cur { background:var(--tc); }
.ruler .lab { grid-row:2; font-size:11px; color:var(--tt); white-space:nowrap; font-weight:600; margin-top:2px; }
.fc.lg .ruler { margin-left:24px; }

.prog { display:inline-flex; align-items:center; gap:6px; }
.bar { display:inline-block; width:64px; height:4px; background:var(--c-progress-track); border-radius:999px; overflow:hidden; position:relative; vertical-align:middle; }
.bar i { position:absolute; left:0; top:0; bottom:0; background:var(--c-success); border-radius:999px; }
.bar s { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--c-text-muted); }

/* Плашка решения: заменяет верх шапки */
.plate { border-radius:14px 14px 0 0; padding:14px 18px; margin:-16px -18px 14px; border-bottom:1px solid; }
.plate.info    { background:var(--c-info-bg);    border-color:var(--c-info);   --pc:var(--c-info); }
.plate.warning { background:var(--c-warning-bg); border-color:var(--c-warning);--pc:var(--c-warning-text); }
.plate.danger  { background:var(--c-danger-bg);  border-color:var(--c-danger-border); --pc:var(--c-danger-text); }
.plate.neutral { background:var(--c-bg-selected);border-color:var(--c-border); --pc:var(--c-text-secondary); }
.plate .pt { display:flex; align-items:center; gap:8px; font-weight:700; color:var(--pc); font-size:15px; }
.plate .pw { margin-left:auto; font-size:12px; font-weight:600; color:var(--pc); white-space:nowrap; }
.plate .pr { margin:6px 0 10px; color:var(--c-text-primary); max-width:72ch; }
.plate .pb { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.plate .why { font-size:12px; color:var(--c-text-secondary); margin-top:8px; display:flex; gap:6px; }
.app.m .plate .pw { display:none; }

/* Мобильная плашка снизу */
.dock {
  position:sticky; bottom:0; z-index:6; margin-top:12px; padding:12px 14px 14px; border-top:1px solid;
  box-shadow:var(--shadow-sheet); border-radius:22px 22px 0 0;
}
.dock.info    { background:var(--c-info-bg);    border-color:var(--c-info);   --pc:var(--c-info); }
.dock.warning { background:var(--c-warning-bg); border-color:var(--c-warning);--pc:var(--c-warning-text); }
.dock.danger  { background:var(--c-danger-bg);  border-color:var(--c-danger-border); --pc:var(--c-danger-text); }
.dock.neutral { background:var(--c-bg-selected);border-color:var(--c-border); --pc:var(--c-text-secondary); }
.dock .pt { display:flex; align-items:center; gap:8px; font-weight:700; color:var(--pc); font-size:14px; }
.dock .pw { font-size:12px; color:var(--pc); margin:2px 0 8px 24px; font-weight:600; }
.dock .pr { font-size:12px; color:var(--c-text-primary); margin:0 0 10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.dock .pb { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.dock .pb .btn:first-child { grid-column:1 / -1; }

/* ===== Экран фичи ===== */
.fgrid { display:grid; grid-template-columns:1fr 300px; gap:8px; align-items:start; margin-top:8px; }
.app.m .fgrid { display:block; margin-top:0; }
.col { display:flex; flex-direction:column; gap:8px; }
.app.m .col { gap:0; }

.digest { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.digest li { display:flex; gap:8px; align-items:flex-start; }
.digest .dot { width:7px; height:7px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--c-border); }
.digest li.new .dot { background:var(--c-accent); }
.digest li.new { color:var(--c-text-heading); }
.digest li:not(.new) { color:var(--c-text-secondary); }

.cv-wrap { overflow-x:auto; }
.cv svg { display:block; width:100%; min-width:640px; height:auto; }
.cv text { font-family:"Hanken Grotesk","Segoe UI",sans-serif; }
.hit { cursor:pointer; }
.hit:hover + .hl, .hl:hover { opacity:1; }
.cv-cap { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:12px; color:var(--c-text-secondary); margin-top:6px; }
.legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--c-text-muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--c-border-light); }
.legend span { display:inline-flex; align-items:center; gap:5px; }

.vc { list-style:none; margin:0; padding:0; position:relative; }
.vc li { position:relative; padding:0 0 12px 30px; }
.vc li:before { content:""; position:absolute; left:10px; top:20px; bottom:0; width:var(--w,2px); margin-left:calc(var(--w,2px) / -2 + 1px); background:var(--lc,var(--c-text-muted)); opacity:.5; border-radius:2px; }
.vc li:last-child:before { display:none; }
.vc li.todo:before { background:none; border-left:2px dashed var(--c-dashed); opacity:1; }
.vc .gw { position:absolute; left:0; top:1px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.vc .row { display:flex; align-items:center; gap:8px; min-height:24px; }
.vc .nm { font-weight:600; color:var(--c-text-heading); }
.vc li.past .nm, .vc li.todo .nm { font-weight:400; color:var(--c-text-muted); }
.vc .cur-box { margin-top:6px; background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--c-text-secondary); }
.badge { display:inline-flex; align-items:center; gap:3px; border-radius:999px; padding:0 7px; font-size:11px; font-weight:600; background:var(--c-bg-selected); color:var(--c-text-secondary); border:none; cursor:pointer; min-height:20px; }
.badge.hot { background:var(--c-warning-bg); color:var(--c-warning-text); }
.badge.dng { background:var(--c-danger-bg); color:var(--c-danger-text); }

function glyph(k, s=14){
  const v = `width="${s}" height="${s}" viewBox="0 0 16 16" class="g"`;
  switch(k){
    case 'crash': case 'stuck': return `<svg ${v}><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" style="fill:var(--c-danger)"/></svg>`;
    case 'reopen': return `<svg ${v}><rect x="3" y="3" width="10" height="10" rx="1.5" style="fill:none;stroke:var(--c-danger);stroke-width:2"/><path d="M6 8h4" style="stroke:var(--c-danger);stroke-width:2;stroke-linecap:round"/></svg>`;
    case 'wait': return `<svg ${v}><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z" style="fill:var(--c-info)"/></svg>`;
    case 'loop': return `<svg ${v}><path d="M12.6 9.2A4.8 4.8 0 1 1 11.3 4.4" style="fill:none;stroke:var(--c-warning);stroke-width:2.2;stroke-linecap:round"/><path d="M9.2 2.6 12.6 3.4 11.8 6.8" style="fill:none;stroke:var(--c-warning);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/></svg>`;
    case 'run': return `<svg ${v}><circle cx="8" cy="8" r="6.5" class="pulse" style="fill:none;stroke:var(--c-text-heading);stroke-width:1.5"/><circle cx="8" cy="8" r="3.5" style="fill:var(--c-text-heading)"/></svg>`;
    case 'done': return `<svg ${v}><circle cx="8" cy="8" r="7" style="fill:var(--c-success)"/><path d="M4.8 8.2 7 10.3l4.3-4.6" style="fill:none;stroke:var(--c-bg-card);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/></svg>`;
    case 'frozen': return `<svg ${v}><rect x="3.5" y="2.5" width="3" height="11" rx="1" style="fill:var(--c-text-muted)"/><rect x="9.5" y="2.5" width="3" height="11" rx="1" style="fill:var(--c-text-muted)"/></svg>`;
    case 'past': return `<svg ${v}><circle cx="8" cy="8" r="6.5" style="fill:var(--c-bg-selected);stroke:var(--c-text-muted);stroke-width:1"/><path d="M5.3 8.1 7.1 9.9l3.6-3.8" style="fill:none;stroke:var(--c-text-muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"/></svg>`;
    default: return `<svg ${v}><circle cx="8" cy="8" r="6" style="fill:none;stroke:var(--c-dashed);stroke-width:1.5;stroke-dasharray:2.5 2"/></svg>`;
  }
}

const av = (k, lg) => `<span class="av${lg?' lg':''}" style="background:${P[k].c}" title="${P[k].n}">${P[k].n.slice(0,1)}</span>`;
const btn = (label, v, a, extra='') => v==='disabled'
  ? `<button class="btn ghost" disabled ${extra}>${label}</button>`
  : `<button class="btn ${v}" data-a="${esc(a)}" ${extra}>${label}</button>`;

function fcText(f){
  if (f.fc.early) return `<span class="mut">рано для прогноза</span>`;
  if (f.fc.paused) return `<span class="mut">на паузе — не считается</span>`;
  if (f.fc.done) return `<span>смержено</span>`;
  return `<b>${f.fc.lo}–${f.fc.hi}</b> · ${f.fc.conf}`;
}
function ruler(f){
  const t = TONE[f.st];
  return `<div class="ruler ${t}">${PH.map((p,i)=>`<span class="seg ${i<f.phase?'past':i===f.phase?'cur':''}"></span>`).join('')}
    <span class="lab" style="grid-column:${Math.min(f.phase+1,5)} / span 2">${PH[f.phase]}</span></div>`;
}
function progress(f){
  if (!f.tot) return `<span class="mut">шагов нет</span>`;
  const pct = Math.round(f.acc/f.tot*100);
  const mark = f.plan ? `<s style="left:${Math.round(f.plan/f.tot*100)}%" title="план был ${f.plan}"></s>` : '';
  return `<span class="prog"><span class="bar"><i style="width:${pct}%"></i>${mark}</span> принято <b>${f.acc} из ${f.tot}</b>${f.plan?` <span class="mut">· план был ${f.plan}</span>`:''}</span>`;
}

/* ---------- Карточка фичи (табло) = шапка экрана фичи (lg) ---------- */
function card(id, lg){
  const f = F[id], t = TONE[f.st];
  const ppl = f.people.map(p=>p[0]);
  const plate = lg && f.plate && !S.mobile ? plateHtml(f) : '';
  const tag = lg ? 'div' : 'button';
  const askTone = f.st==='crash'||f.st==='reopen' ? ' danger' : f.st==='loop' ? ' warn' : '';
  return `<${tag} class="fc ${t}${lg?' lg':''}${f.st==='done'?' done':''}" ${lg?'':`data-a="open:${id}"`}>
    ${plate}
    <div class="top">${glyph(f.st, lg?16:14)}<span class="name">${esc(f.title)}</span>
      ${ppl.length?`<span class="avs">${ppl.map(k=>av(k)).join('')}</span>`:''}</div>
    <div class="stl">${f.head} · ${f.state} <span class="q">${f.dur}</span></div>
    ${ruler(f)}
    <div class="met">
      <span>${progress(f)}</span>
      <span>прогноз ${fcText(f)}</span>
      <span class="${f.rpsBad?'bad':''}">возвратов на шаг <b>${f.rps}</b></span>
      <span class="${f.moveBad?'bad':''}">${f.moveBad?'<b>'+f.move+'</b>':f.move}</span>
    </div>
    ${!lg && f.ask ? `<div class="ask${askTone}">${glyph(f.st==='loop'?'loop':f.st==='crash'?'crash':f.st==='reopen'?'reopen':'wait',12)}<span>${f.ask}</span></div>`:''}
    ${lg && f.heavy ? `<div class="risk" style="margin-top:12px">${IC.warn}<span><b>Уходит в тяжёлую.</b> ${f.heavy}</span></div>`:''}
  </${tag}>`;
}
function plateHtml(f){
  const p = f.plate;
  let btns = p.btns.map(b=>btn(b[0], b[1], b[2])).join('');
  let why = p.why || '';
  if (f.accept){
    const ready = S.ack.ci && S.ack.lesson;
    btns = (ready ? btn('Принять','primary','dlg:accept') : btn('Принять','disabled','')) + btn('Вернуть','ghost','dlg:return');
    if (!ready) why = `«Принять» недоступно: не готовы пункты чек-листа — ${[!S.ack.ci&&'CI по ветке',!S.ack.lesson&&'урок не записан'].filter(Boolean).join(', ')}.`;
  }
  return `<div class="plate ${p.tone}">
    <div class="pt">${glyph(f.st==='run'?'wait':f.st,16)}<span>${p.title}</span><span class="pw">${p.wait}</span></div>
    <div class="pr">${p.reason}</div>
    <div class="pb">${btns}</div>
    ${why?`<div class="why">${IC.info}<span>${why}</span></div>`:''}
  </div>`;
}
function dockHtml(f){
  const p = f.plate; if (!p) return '';
  let bs = p.btns.filter(b=>b[1]!=='disabled');
  if (f.accept){ const ready = S.ack.ci && S.ack.lesson; bs = [[ 'Принять', ready?'primary':'disabled', 'dlg:accept'],['Вернуть','ghost','dlg:return']]; }
  return `<div class="dock ${p.tone}">
    <div class="pt">${glyph(f.st,16)}<span>${p.title}</span></div>
    <div class="pw">${p.wait}</div>
    <div class="pr">${p.reason}</div>
    <div class="pb">${bs.slice(0,3).map(b=>btn(b[0],b[1],b[2])).join('')}</div>
  </div>`;
}

/* ---------- Конвейер (горизонтальный, SVG) ---------- */
function conveyor(f){
  const c = f.conv, y = 78, xs = PH.map((_,i)=>58+i*128.8);
  let s = `<defs>
    <marker id="ah-m" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--c-text-muted)"/></marker>
    <marker id="ah-w" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--c-warning)"/></marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--c-danger)"/></marker>
  </defs>`;
  for (let i=0;i<5;i++){
    const p = c.passes[i], x1 = xs[i]+18, x2 = xs[i+1]-18;
    if (p>0){
      const w = Math.min(2+(p-1)*3, 10);
      s += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" style="stroke:var(--c-text-muted);stroke-width:${w};stroke-linecap:round;opacity:.5"/>`;
      if (p>1) s += `<text x="${(x1+x2)/2}" y="${y-10}" text-anchor="middle" style="fill:var(--c-text-secondary);font-size:11px;font-weight:600">×${p} прохода</text>`;
    } else s += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" style="stroke:var(--c-dashed);stroke-width:1.5;stroke-dasharray:4 4"/>`;
  }
  if (c.self>0){
    const x = xs[2], col = c.hot?'var(--c-warning)':'var(--c-text-muted)', w = Math.min(1.5+c.self*.35, 6);
    const d = `M${x-12},${y+14} C${x-40},${y+62} ${x+40},${y+62} ${x+12},${y+14}`;
    s += `<path d="${d}" style="fill:none;stroke:${col};stroke-width:${w};opacity:${c.hot?1:.6}" marker-end="url(#ah-${c.hot?'w':'m'})"/>`;
    s += `<text x="${x}" y="${y+74}" text-anchor="middle" style="fill:${c.hot?'var(--c-warning-text)':'var(--c-text-secondary)'};font-size:12px;font-weight:700">↺${c.self} кругов ревью</text>`;
    s += `<path d="${d}" class="hit" data-a="sheet:loop" style="fill:none;stroke:transparent;stroke-width:22"/>`;
    s += `<rect x="${x-58}" y="${y+62}" width="116" height="18" class="hit" data-a="sheet:loop" style="fill:transparent"/>`;
  }
  c.loops.forEach(l=>{
    const x1 = xs[l.from], x2 = xs[l.to]+20, col = l.danger?'var(--c-danger)':l.n>=3?'var(--c-warning)':'var(--c-text-muted)';
    const d = `M${x1},${y+18} C${x1},${y+112} ${x2},${y+112} ${x2},${y+20}`;
    s += `<path d="${d}" style="fill:none;stroke:${col};stroke-width:${1.5+l.n};${l.danger?'stroke-dasharray:6 4;':''}opacity:${l.danger||l.n>=3?1:.6}" marker-end="url(#ah-${l.danger?'d':l.n>=3?'w':'m'})"/>`;
    s += `<text x="${(x1+x2)/2}" y="${y+98}" text-anchor="middle" style="fill:${l.danger?'var(--c-danger-text)':'var(--c-text-secondary)'};font-size:12px;font-weight:700">↺${l.n} ${l.danger?'после мержа':'возврат'}</text>`;
    s += `<path d="${d}" class="hit" data-a="sheet:loop" style="fill:none;stroke:transparent;stroke-width:22"/>`;
  });
  PH.forEach((p,i)=>{
    const st = c.st[i], x = xs[i], cur = i===f.phase && st!=='done';
    s += `<text x="${x}" y="${y-28}" text-anchor="middle" style="fill:${cur?'var(--c-text-heading)':'var(--c-text-muted)'};font-size:12px;font-weight:${cur?700:400}">${p}</text>`;
    if (st==='done') s += `<circle cx="${x}" cy="${y}" r="15" style="fill:var(--c-bg-selected);stroke:var(--c-text-muted);stroke-width:1"/><path d="M${x-5},${y} l3.5,3.5 l6.5,-7" style="fill:none;stroke:var(--c-text-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>`;
    else if (st==='todo') s += `<circle cx="${x}" cy="${y}" r="15" style="fill:var(--c-bg-card);stroke:var(--c-dashed);stroke-width:1.5;stroke-dasharray:3 3"/>`;
    else s += `<circle cx="${x}" cy="${y}" r="16" style="fill:var(--c-bg-card);stroke:var(--tc);stroke-width:2"/><g transform="translate(${x-9},${y-9})">${glyph(st,18)}</g>`;
    if (cur){
      const w = Math.max(84, f.mark.length*6.6+20);
      const clickable = ['wait','crash','loop','reopen','frozen'].includes(st);
      s += `<g ${clickable?'class="hit" data-a="sheet:stuck"':''}>
        <rect x="${x-w/2}" y="${y-66}" width="${w}" height="22" rx="11" style="fill:var(--tb);stroke:var(--tc);stroke-width:1"/>
        <text x="${x}" y="${y-51}" text-anchor="middle" style="fill:var(--tt);font-size:11.5px;font-weight:700">${f.mark}${clickable?' ›':''}</text></g>`;
    }
  });
  return `<div class="cv-wrap cv ${TONE[f.st]}"><svg viewBox="0 0 760 196" role="img" aria-label="Конвейер фичи">${s}</svg></div>`;
}
/* ---------- Конвейер вертикальный (мобила) ---------- */
function conveyorV(f){
  const c = f.conv;
  return `<ul class="vc ${TONE[f.st]}">${PH.map((p,i)=>{
    const st = c.st[i], cur = i===f.phase && st!=='done';
    const w = c.passes[i] ? Math.min(2+(c.passes[i]-1)*3,10) : 2;
    const g = st==='done' ? glyph('past',18) : st==='todo' ? glyph('todo',18) : glyph(st,18);
    let badges = '';
    if (i===2 && c.self) badges += `<button class="badge${c.hot?' hot':''}" data-a="sheet:loop">↺${c.self}</button>`;
    c.loops.filter(l=>l.to===i).forEach(l=>badges += `<button class="badge${l.danger?' dng':l.n>=3?' hot':''}" data-a="sheet:loop">↺${l.n} ${l.danger?'после мержа':'возврат'}</button>`);
    const box = cur ? `<div class="cur-box"><b style="color:var(--tt)">${f.mark}</b><br>${f.lines.length?f.lines.map(l=>`${l[0]} ${l[1]} из ${l[2]}`).join(' · '):'шагов пока нет'}
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">${['wait','crash','loop','reopen','frozen'].includes(st)?btn('Что случилось','ghost','sheet:stuck'):''}${f.lines.length?btn('Шаги','ghost','sheet:lines'):''}</div></div>` : '';
    return `<li class="${st==='done'?'past':st==='todo'?'todo':'cur'}" style="--w:${w}px"><span class="gw">${g}</span>
      <div class="row"><span class="nm">${p}</span>${c.passes[i]>1?`<span class="mut">×${c.passes[i]}</span>`:''}${badges}</div>${box}</li>`;
  }).join('')}</ul>`;
}

  return `<div class="lines" style="margin-top:12px">${f.lines.map((l,li)=>{

    const cells = Array.from({length:l[2]},(_,i)=>{

      const g = key ? glyph(f.st,12) : done ? glyph('past',12) : cur ? glyph('run',12) : glyph('todo',12);
      return `<button class="step${r>=3?' hot':''}" data-a="step" title="${n}">${g}<b>${n}</b>${r>1&&(done||cur)?`<span style="color:${r>=3?'var(--c-warning-text)':'inherit'}">↺${r}</span>`:''}</button>`;
    }).join('');
    return `<div class="ln"><span class="lnn">${l[0]} · ${l[1]} из ${l[2]}</span>${cells}</div>`;
  }).join('')}</div>`;
}

const DLG = {

    cons:['Шаги в работе не прерываются: новый порядок действует со следующего шага.','«История медиа-генераций» уступит слот — её прогноз сдвинется на +30–50 мин.'], ok:'Поднять' }),
  prioDown: f => ({ t:'Опустить приоритет?', lead:`Соседние фичи получат слоты раньше «${f.title}».`, prio:'down',
    cons:['Шаги в работе не прерываются.',`Прогноз «${f.title}» сдвинется на +1–2 ч.`,'«Мультиперсонаж» и «Уборка карты» получат слот раньше.'], ok:'Опустить' }),
  freeze: f => ({ t:f.st==='frozen'?'Изменить причину паузы':'Заморозить фичу?', lead:'Исполнители остановятся после сохранения работы, прогноз встанет на паузу.', reason:'Причина — её увидят команда и дублёр', reasonPh:'Например: ждём ответа Яндекса по квоте',
    cons:[`${f.people.filter(p=>/делает|доработка/.test(p[1])).length||2} шага в работе будут остановлены — наработки сохранятся в ветке.`,'Освободятся локальные слоты: соседние фичи двинутся быстрее.','Прогноз этой фичи не считается до возобновления.'], ok:'Заморозить' }),
  resume: f => ({ t:'Возобновить фичу?', lead:'Шаги вернутся тем же исполнителям, причина паузы уйдёт в ленту времени.', info:true,
    cons:['Остановленные шаги B3 (Денис) и F2 (Кира) продолжат с последнего коммита.','Ветка отстала от master на 46 коммитов — первым шагом будет ребейз.','Прогноз пересчитается за 1–2 принятых шага.'], ok:'Возобновить' }),
  recut: f => ({ t:'Переразрезать фичу?', lead:'Александр получит задачу на новый разрез с вашей причиной. Цена — около 25 мин сильной модели.', reason:'Что не так с текущим разрезом', reasonPh:'Например: в критериях шагов нет поворотов головы',
    cons:[`Шаги в работе (${f.people.filter(p=>/делает|доработка/.test(p[1])).map(p=>P[p[0]].n).join(', ')||'—'}) будут остановлены до нового разреза.`,'Принятые шаги останутся, не начатые — пересоберутся по новому разрезу.','Прогноз сбросится в «рано для прогноза», пока нет нового плана и 3 принятых шагов.'], ok:'Позвать архитектора' }),
  accept: f => ({ t:'Подтвердить приёмку?', lead:'Вердикт Александра «принято» остаётся как есть — ваша отметка встаёт рядом.', info:true,
    cons:['Марку уйдёт запрос на мерж; условия проверит сервер. Выкатки с этого экрана нет.','После мержа появится пункт «smoke на master».'], ok:'Принять' }),
  return: f => ({ t:'Вернуть на доработку?', lead:'Вернёте вы — запись пойдёт с вашей подписью, вердикт ревьюера не перезаписывается.', reason:'Что исправить', reasonPh:'Конкретно и проверяемо', cat:true,
    cons:[`Шаг вернётся исполнителю, начнётся следующий круг.`,'Прогноз сдвинется на +1–2 ч.'], ok:'Вернуть' }),
  grant: f => ({ t:'Дать доступ к стенду vLLM?', lead:'Денису на шаг B7: чтение метрик :8000, без прав перезапуска.', info:true,

    cons:['Фича вернётся в «Производство», откроется новый круг.','Мерж исправления — снова через ревью Глеба и запрос Марку.'], ok:'Поручить Денису' }),
  revert: f => ({ t:'Откатить мерж?', lead:'Это запрос Марку, а не действие: условия отката проверит сервер.', reason:'Почему откатываем', reasonPh:'Например: регрессия на master, чинить дольше часа',
    cons:['«Уборка карты» использует ProjectHeader.tsx из этой фичи — ей понадобится ребейз.','Фича вернётся в «Производство» целиком.'], ok:'Отправить запрос Марку' }),
  lesson: f => ({ t:'Записать урок', lead:'Урок уйдёт в память команды и закроет пункт чек-листа.', reason:'Урок', reasonPh:'Что сделать иначе в следующий раз', ok:'Записать', ck:'lesson' }),
};
function dlgHtml(){
  const f = F[S.fid], d = DLG[S.dlg](f);
  const order = ['history','stats','bg','hands','multi','pult','cleanup','voice'];
  let extra = '';
  if (d.prio){
    const i = order.indexOf(S.fid), j = d.prio==='up' ? Math.max(0,i-1) : Math.min(order.length-1,i+1);
    const nw = order.slice(); nw.splice(i,1); nw.splice(j,0,S.fid);
    extra = `<label class="fl">Новый порядок у куратора</label><ul class="prio">${nw.map((k,n)=>`<li class="${k===S.fid?'me':n===i?'moved':''}"><span class="no">${n+1}</span>${glyph(F[k].st,12)}<span>${esc(F[k].title)}</span>${k===S.fid?`<span class="mut" style="margin-left:auto">было ${i+1}</span>`:''}</li>`).join('')}</ul>`;
  }
  if (d.who) extra = `<div class="who-list">${[['alex','Архитектор: уточнить критерий','≈25 мин · сильная'],['kira','Другой исполнитель','≈40 мин · средняя'],['kuz','Локальный исполнитель','≈60 мин · бесплатно, очередь'],['gleb','Ревьюер: посмотреть раньше очереди','≈10 мин · средняя']]
    .map((w,n)=>`<label><input type="radio" name="who" ${n===0?'checked':''}>${av(w[0],true)}<span><b>${P[w[0]].n}</b><br><span class="mut">${w[1]}</span></span><span class="pr">${w[2]}</span></label>`).join('')}</div>`;
  const cat = d.cat ? `<label class="fl" for="dcat">Категория</label><select id="dcat"><option>Разрез</option><option>Исполнитель</option><option>Критерии шага</option><option>Другое</option></select>` : '';
  const reason = d.reason ? `<label class="fl" for="dreason">${d.reason} <span class="mut">· обязательно</span></label><textarea id="dreason" rows="3" placeholder="${d.reasonPh}"></textarea>` : '';
  const cons = d.cons ? `<div class="cons${d.info?' info':''}"><div class="cap">${d.info?'Что произойдёт':'Последствия'}</div><ul>${d.cons.map(c=>`<li>${c}</li>`).join('')}</ul></div>` : '';
  return `<div class="ov" data-a="close"></div><div class="dlg${d.who||d.prio?'':' confirm'}" role="dialog" aria-label="${esc(d.t)}">
    <h2>${d.t}</h2><p class="lead">${d.lead}</p>${extra}${cat}${reason}${cons}
    <div class="acts">${btn('Отмена','ghost','close')}<button class="btn primary" data-a="confirm" id="dok" ${d.reason?'disabled':''}>${d.ok}</button></div></div>`;
}

/* ======================= Рендер ======================= */
function render(){
  document.documentElement.setAttribute('data-theme', S.theme);
  const app = document.getElementById('app');
  app.className = 'app' + (S.mobile ? ' m' : '');
  let scr = S.screen==='board' ? screenBoard() : S.screen==='feature' ? screenFeature() : screenStep();
  const hub = `<div class="hub"><h2 class="ttl serif">Пульт куратора</h2><span class="sp"></span>${S.mobile?'':'<span class="who">Андрей · 8 фич в работе</span>'}</div>`;
  const inner = `<div class="canvas">${hub}${scr}</div>`;
  app.innerHTML = (S.mobile ? `<div class="scroll">${inner}</div>` : inner)
    + (S.sheet ? sheetHtml() : '') + (S.dlg ? dlgHtml() : '') + (S.toast ? `<div class="toast" role="status">${S.toast}</div>` : '');
  renderBar();
}
function renderBar(){
  const pills = (id, items, cur, key) => document.getElementById(id).innerHTML =
    items.map(i=>`<button class="${cur===i[0]?'on':''}" data-mk="${key}:${i[0]}">${i[1]}</button>`).join('');
  pills('mk-screen', [['board','Табло фич'],['feature','Экран фичи'],['step','Шаг']], S.screen, 'screen');
  const curState = (STATES.find(s=>s[2]===S.fid)||[])[0];
  document.getElementById('mk-state').innerHTML = STATES.map(s=>`<button class="${curState===s[0]?'on':''}" data-mk="state:${s[0]}">${glyph(s[0]==='accept'||s[0]==='noplan'?'wait':s[0],11)}${s[1]}</button>`).join('');
  pills('mk-theme', [['light','Светлая'],['dark','Тёмная']], S.theme, 'theme');
  pills('mk-width', [['desk','Десктоп'],['m','Мобильный 360']], S.mobile?'m':'desk', 'width');
}
let toastT;
function toast(t){ S.toast = t; render(); clearTimeout(toastT); toastT = setTimeout(()=>{ S.toast=null; render(); }, 2600); }

document.addEventListener('click', e=>{
  const mk = e.target.closest('[data-mk]');
  if (mk){
    const [k,v] = mk.dataset.mk.split(':');
    if (k==='screen') S.screen = v;
    if (k==='state'){ S.fid = STATES.find(s=>s[0]===v)[2]; if (S.screen==='board') S.screen='feature'; S.linesOpen = v==='done'; }
    if (k==='theme') S.theme = v;
    if (k==='width') S.mobile = v==='m';
    S.sheet = S.dlg = null; S.menu = false; render(); return;
  }
  const el = e.target.closest('[data-a]');
  if (!el){ if (S.menu){ S.menu=false; render(); } return; }
  const a = el.dataset.a, i = a.indexOf(':'), k = i<0?a:a.slice(0,i), v = i<0?'':a.slice(i+1);
  if (k!=='menu') S.menu = false;
  switch(k){
    case 'nav': S.screen = v; S.sheet = S.dlg = null; break;
    case 'open': S.fid = v; S.screen = 'feature'; S.linesOpen = F[v].st==='done'; break;
    case 'step': S.screen = 'step'; S.sheet = S.dlg = null; if (v==='chat'||v==='orch'){ S.tab='chat'; S.chatWith = v==='orch'?'orch':'exec'; } else S.tab='rounds'; break;
    case 'sheet': S.sheet = v; break;
    case 'dlg': S.dlg = v; S.sheet = null; break;
    case 'close': S.sheet = S.dlg = null; break;
    case 'menu': S.menu = !S.menu; break;
    case 'lines': S.linesOpen = !S.linesOpen; break;
    case 'grp': if (v==='paused') S.showPaused = !S.showPaused; else S.showDone = !S.showDone; break;
    case 'ck': S.ack[v] = true; break;
    case 'tab': S.tab = v; break;
    case 'chat': S.chatWith = v; break;
    case 'send': { const inp = document.getElementById('chatin'); if (inp && inp.value.trim()){ S.chat[S.chatWith].push(['me','Вы',inp.value.trim()]); } break; }
    case 'toast': toast(v); return;
    case 'confirm': {
      const d = DLG[S.dlg](F[S.fid]); if (d.ck) S.ack[d.ck] = true;
      S.dlg = null; toast(`Готово: ${d.ok.toLowerCase()} — запись в ленте фичи`); return;
    }
  }
  render();
});
document.addEventListener('input', e=>{
  if (e.target.id==='dreason'){ const ok = document.getElementById('dok'); if (ok) ok.disabled = !e.target.value.trim(); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && (S.sheet||S.dlg||S.menu)){ S.sheet = S.dlg = null; S.menu = false; render(); }
  if (e.key==='Enter' && e.target.id==='chatin'){ document.querySelector('[data-a="send"]').click(); }
});
render();
</script>
</body>
</html>
