<!--
  Макет к записке features-overview-proposal.md. Код продукта не правится.
  Привязка: эпика фичи ещё нет, шагов ещё нет. Это проработка вариантов до разреза.
  Пометка .new (пунктир C.accentMuted) — то, чего в продукте сейчас нет.
-->
<style>
/* ===== Токены: значения из frontend/src/lib/theme.css, семантика — C.* из design.ts ===== */
:root {
  --c-bg-main:#F4F0E8; --c-bg-panel:#EDE7DC; --c-bg-card:#FBF8F2; --c-bg-white:#FFFFFF;
  --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E;
  --c-on-accent:#FBF8F2;
  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-divider:#DDD4C4; --c-dashed:#D0C6B4;
  --c-progress-track:#D8CFBE; --c-overlay:rgba(23,19,15,.42);
  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;
  --c-warning:#C9923E; --c-warning-bg:#FBEFE0; --c-warning-text:#8A6A28;
  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F;
  --c-info:#3E7CA6; --c-info-bg:#E7EFF5;
  --shadow-focus:0 0 0 3px rgba(217,119,87,.14);
  --shadow-card:0 2px 8px rgba(60,50,35,.05);
  --shadow-island:0 1px 2px rgba(60,50,35,.06),0 6px 18px rgba(60,50,35,.06);
  --shadow-dropdown:0 8px 28px rgba(60,50,35,.16);
  --shadow-sheet:0 -8px 28px rgba(60,50,35,.18);
  --shadow-thumb:0 1px 3px rgba(42,37,31,.12);
}
[data-theme="dark"] {
  --c-bg-main:#201C18; --c-bg-panel:#272320; --c-bg-card:#2E2A25; --c-bg-white:#2E2A25;
  --c-bg-selected:#38332D; --c-bg-inset:#1B1815;
  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072;
  --c-on-accent:#201C18;
  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C;
  --c-border:#3D3830; --c-border-light:#34302A; --c-divider:#454037; --c-dashed:#4A443B;
  --c-progress-track:#5C544A; --c-overlay:rgba(0,0,0,.62);
  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;
  --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E;
  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72;
  --c-info:#5FA0CC; --c-info-bg:#1E2A33;
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-island:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --shadow-dropdown:0 10px 32px rgba(0,0,0,.55);
  --shadow-sheet:0 -10px 32px rgba(0,0,0,.55);
  --shadow-thumb:0 1px 3px rgba(0,0,0,.45);
}
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--c-bg-main); color:var(--c-text-primary);
  font-family:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif; font-size:13px; line-height:1.45; }
button { font:inherit; color:inherit; }
button:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
.serif { font-family:"PT Serif",Georgia,serif; }
.mono { font-family:"JetBrains Mono","Courier New",monospace; }
.new { outline:1.5px dashed var(--c-accent-muted); outline-offset:2px; }
.nonew .new { outline:none; }

/* ===== Обвязка макета (не часть продукта) ===== */
.mk { position:sticky; top:0; z-index:100; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
  padding:10px 16px; background:var(--c-bg-panel); border-bottom:1px solid var(--c-border); }
.mk h1 { margin:0; font-size:15px; font-weight:600; color:var(--c-text-heading); }
.mk .grp { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.mk .lbl { font-size:10px; color:var(--c-text-muted); text-transform:uppercase; letter-spacing:.05em; }
.pills { display:inline-flex; flex-wrap:wrap; gap:2px; padding:2px; background:var(--c-bg-selected); border-radius:9px; }
.pills button { border:none; background:transparent; color:var(--c-text-secondary); padding:4px 10px; border-radius:7px; font-size:12px; cursor:pointer; }
.pills button.on { background:var(--c-bg-white); color:var(--c-text-heading); box-shadow:var(--shadow-thumb); font-weight:600; }
.mkbtn { border:1px solid var(--c-border); background:var(--c-bg-white); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; color:var(--c-text-primary); }
.mkbtn:hover { background:var(--c-bg-selected); }
.note { max-width:1200px; margin:10px auto 0; padding:0 16px; font-size:12px; color:var(--c-text-secondary); }
.note b { color:var(--c-text-heading); }

/* ===== Окно продукта ===== */
.stage { padding:14px 16px 40px; display:flex; justify-content:center; }
.app { position:relative; width:100%; max-width:1200px; height:760px; border:1px solid var(--c-border); border-radius:14px;
  background:var(--c-bg-main); overflow:hidden; display:flex; gap:8px; padding:8px; transform:translateZ(0); }
.app.m { width:360px; height:760px; border-radius:28px; padding:0; gap:0; display:block; }

/* Рельса панелей (PanelZone) */
.rail { width:40px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:4px; }
.rail .sep { width:20px; height:1px; background:var(--c-divider); margin:4px 0; }
.rb { position:relative; width:34px; height:34px; border:none; border-radius:8px; background:transparent; color:var(--c-text-secondary);
  display:flex; align-items:center; justify-content:center; cursor:pointer; }
.rb:hover { background:var(--c-bg-selected); }
.rb.on { background:var(--c-bg-white); color:var(--c-accent); box-shadow:var(--shadow-thumb); }
.rb .bdg { position:absolute; right:1px; top:1px; min-width:15px; height:15px; border-radius:999px; padding:0 4px; font-size:10px; font-weight:700;
  background:var(--c-info); color:var(--c-on-accent); display:flex; align-items:center; justify-content:center; }

/* Острова */
.isl { background:var(--c-bg-white); border-radius:14px; box-shadow:var(--shadow-island); overflow:hidden; display:flex; flex-direction:column; min-height:0; }
.side { width:340px; flex-shrink:0; }
.center { flex:1; min-width:0; position:relative; }
.app.m .isl { border-radius:0; box-shadow:none; width:auto; height:100%; }

/* ===== Шапка панели ===== */
.ph { display:flex; align-items:center; gap:6px; padding:12px 12px 8px 14px; }
.ph .ttl { font-family:"PT Serif",Georgia,serif; font-size:16px; font-weight:700; color:var(--c-text-heading); margin-right:auto; }
.ib { width:28px; height:28px; border:none; background:transparent; border-radius:8px; color:var(--c-text-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.ib:hover { background:var(--c-bg-selected); color:var(--c-text-primary); }
.app.m .ib { width:40px; height:40px; }
.gbtn { display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 9px; border:1px solid var(--c-border-light); border-radius:8px;
  background:var(--c-bg-card); color:var(--c-text-primary); font-size:12px; cursor:pointer; position:relative; }
.gbtn:hover { background:var(--c-bg-selected); }
.app.m .gbtn { height:40px; }
.scroll { flex:1; overflow:auto; min-height:0; padding:0 10px 14px; }

/* Меню (ui/Menu) */
.menu { position:absolute; z-index:50; background:var(--c-bg-white); border:1px solid var(--c-border); border-radius:12px;
  box-shadow:var(--shadow-dropdown); padding:5px; min-width:200px; }
.mi { display:flex; align-items:center; gap:8px; width:100%; border:none; background:transparent; padding:7px 10px; border-radius:8px; font-size:13px; cursor:pointer; text-align:left; color:var(--c-text-primary); }
.mi:hover { background:var(--c-bg-selected); }
.mi.on { font-weight:600; color:var(--c-text-heading); }
.mi .ck { margin-left:auto; color:var(--c-accent); }
.app.m .mi { min-height:40px; }

/* Чипы-фильтры */
.chips { display:flex; gap:6px; padding:0 12px 10px 14px; overflow-x:auto; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.fch { flex-shrink:0; display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px; border-radius:999px; font-size:12px;
  border:1px solid var(--c-border-light); background:var(--c-bg-card); color:var(--c-text-secondary); cursor:pointer; white-space:nowrap; }
.fch:hover { background:var(--c-bg-selected); }
.fch.on { background:var(--c-accent-light); border-color:var(--c-accent-muted); color:var(--c-text-heading); font-weight:600; }
.fch .n { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--c-text-muted); }
.fch.zero { opacity:.55; }
.app.m .fch { height:36px; }

/* Секции списка */
.sec { display:flex; align-items:center; gap:6px; width:100%; border:none; background:transparent; padding:10px 6px 5px; font-size:10px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--c-text-muted); cursor:default; text-align:left; }
.sec.tg { cursor:pointer; }
.sec.tg:hover { color:var(--c-text-secondary); }
.sec .n { font-family:"JetBrains Mono",monospace; letter-spacing:0; }
.sec .hint { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400; font-size:11px; }

/* ===== Строка чата (ChatCard, упрощённо) ===== */
.cc { position:relative; display:flex; align-items:center; gap:9px; width:100%; border:none; background:transparent; border-radius:10px; padding:7px 9px;
  cursor:pointer; text-align:left; margin:1px 0; min-height:44px; }
.cc:hover { background:var(--c-bg-card); }
.cc.on { background:var(--c-bg-selected); }
.cc .av { width:26px; height:26px; }
.cc .w { min-width:0; flex:1; }
.cc .t { font-size:13px; font-weight:600; color:var(--c-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cc.on .t { font-weight:700; }
.cc .s { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--c-text-muted); white-space:nowrap; overflow:hidden; }
.cc .s .ft { display:inline-flex; align-items:center; gap:4px; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.cc .tm { font-size:11px; color:var(--c-text-muted); flex-shrink:0; align-self:flex-start; margin-top:2px; }
.cc.tint-run { animation:flow 2.6s ease-in-out infinite; }
.cc.tint-wait { background:var(--c-info-bg); }
.cc.tint-stop { background:var(--c-danger-bg); }
.cc.unread { animation:breathe 3.2s ease-in-out infinite; }
@keyframes flow { 0%,100% { background:var(--c-bg-white); } 50% { background:var(--c-bg-selected); } }
@keyframes breathe { 0%,100% { background:var(--c-bg-white); } 50% { background:var(--c-bg-card); } }
.role { font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--c-text-secondary); background:var(--c-bg-selected); border-radius:6px; padding:0 5px; flex-shrink:0; }
.role.key { background:var(--c-accent-light); color:var(--c-accent); font-weight:700; }
.muted .cc .t { color:var(--c-text-secondary); font-weight:500; }

.av { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--c-bg-selected); color:var(--c-text-heading);
  display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
.av.sm { width:18px; height:18px; font-size:10px; }

/* ===== Вариант А: группа фичи в списке чатов ===== */
.fg { margin:4px 0 2px; }
.fgh { display:grid; grid-template-columns:14px 14px 1fr auto; grid-template-rows:auto auto; column-gap:7px; row-gap:3px; align-items:center;
  width:100%; border:1px solid var(--c-border-light); background:var(--c-bg-card); border-radius:10px; padding:8px 10px; cursor:pointer; text-align:left; }
.fgh:hover { border-color:var(--c-border); }
.fgh .chev { color:var(--c-text-muted); display:flex; transition:transform .15s; }
.fg.open .fgh .chev { transform:rotate(90deg); }
.fgh .nm { font-size:13px; font-weight:700; color:var(--c-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fgh .cnt { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--c-text-muted); white-space:nowrap; }
.fgh .l2 { grid-column:3 / 5; display:flex; align-items:center; gap:7px; min-width:0; }
.fgh .st { font-size:11.5px; color:var(--c-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fgh.att-wait { border-left:3px solid var(--c-info); }
.fgh.att-stop { border-left:3px solid var(--c-danger); }
.kids { margin:2px 0 6px 13px; padding-left:9px; border-left:1px solid var(--c-divider); }
.closed .fgh { background:transparent; border-color:transparent; padding-top:5px; padding-bottom:5px; }
.closed .fgh .nm { color:var(--c-text-secondary); font-weight:600; }
.closed .fgh:hover { background:var(--c-bg-card); }

/* ===== Мини-рельса этапов ===== */
.mr { display:inline-flex; align-items:center; gap:2px; flex-shrink:0; }
.mr i { display:block; width:8px; height:5px; border-radius:999px; background:var(--c-progress-track); }
.mr i.d { background:var(--c-success); }
.mr i.x { background:transparent; box-shadow:inset 0 0 0 1px var(--c-dashed); }
.mr i.a { width:15px; }
.mr i.a.run { background:var(--c-text-heading); }
.mr i.a.wait { background:var(--c-info); }
.mr i.a.stop { background:var(--c-danger); }
.mr i.a.loop { background:var(--c-warning); }
.mr.gone i, .mr.gone i.d { background:var(--c-text-muted); opacity:.5; }
.mr.gone i.x { background:transparent; }

/* Текст статуса по тону */
.tn-wait { color:var(--c-info) !important; font-weight:600; }
.tn-stop { color:var(--c-danger-text) !important; font-weight:600; }
.tn-loop { color:var(--c-warning-text) !important; font-weight:600; }
.tn-run { color:var(--c-text-heading) !important; }
.hot { color:var(--c-warning-text); font-weight:700; }

/* ===== Плашка фичи (общая для всех вариантов) ===== */
.fs { flex-shrink:0; display:flex; align-items:center; gap:9px; min-height:36px; padding:5px 10px 5px 12px; margin:0 14px; border-radius:10px;
  background:var(--c-bg-card); border:1px solid var(--c-border-light); }
.fs.t-wait { background:var(--c-info-bg); border-color:transparent; }
.fs.t-stop { background:var(--c-danger-bg); border-color:transparent; }
.fs.gone { background:var(--c-bg-inset); border-color:transparent; }
.fs .body { display:flex; align-items:center; gap:9px; min-width:0; flex:1; border:none; background:transparent; padding:0; cursor:pointer; text-align:left; min-height:26px; }
.fs .nm { font-size:12.5px; font-weight:700; color:var(--c-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:40px; }
.fs .sg { font-size:12px; color:var(--c-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.fs .cnt { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--c-text-muted); white-space:nowrap; flex-shrink:0; }
.fs .me { font-size:11px; color:var(--c-text-secondary); white-space:nowrap; flex-shrink:0; }
.fs .go { flex-shrink:0; display:inline-flex; align-items:center; gap:4px; border:none; background:transparent; color:var(--c-accent); font-weight:600; font-size:12px;
  padding:4px 8px; border-radius:8px; cursor:pointer; white-space:nowrap; }
.fs .go:hover { background:var(--c-accent-light); }
.fs .back { flex-shrink:0; display:inline-flex; align-items:center; gap:4px; border:none; background:transparent; color:var(--c-text-secondary); font-size:12px; padding:4px 6px; border-radius:8px; cursor:pointer; white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis; }
.fs .back:hover { background:var(--c-bg-selected); color:var(--c-text-primary); }
.app.m .fs { margin:0 8px; min-height:44px; padding:4px 4px 4px 10px; }
.app.m .fs .go { width:40px; height:40px; justify-content:center; padding:0; }
.fsx { margin:6px 14px 0; border:1px solid var(--c-border-light); border-radius:12px; background:var(--c-bg-white); box-shadow:var(--shadow-card); padding:10px 12px 12px; max-height:430px; overflow:auto; }

/* ===== Конвейер (PipelineFlow, сокращённо) ===== */
.pf { list-style:none; margin:6px 0 0; padding:0; position:relative; }
.pf li { display:grid; grid-template-columns:18px 1fr auto; column-gap:9px; align-items:center; padding:5px 0; position:relative; }
.pf li:not(:last-child)::before { content:""; position:absolute; left:8px; top:21px; bottom:-7px; width:2px; background:var(--c-progress-track); }
.pf li.p::before, .pf li.x::before { background:none; border-left:2px dashed var(--c-dashed); width:0; }
.pf .n { font-size:13px; color:var(--c-text-primary); }
.pf li.p .n, .pf li.x .n { color:var(--c-text-muted); }
.pf li.a .n { font-weight:700; color:var(--c-text-heading); }
.pf .m { font-size:11px; color:var(--c-text-muted); white-space:nowrap; display:flex; align-items:center; gap:6px; }
.pf .sub { grid-column:2 / 4; font-size:11.5px; color:var(--c-text-secondary); }
.tag { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; border-radius:6px; padding:1px 7px; white-space:nowrap; }
.tag.run { background:var(--c-bg-selected); color:var(--c-text-heading); }
.tag.wait { background:var(--c-info-bg); color:var(--c-info); }
.tag.stop { background:var(--c-danger-bg); color:var(--c-danger-text); box-shadow:inset 0 0 0 1px var(--c-danger); }
.tag.loop { background:var(--c-warning-bg); color:var(--c-warning-text); }
.tag.ok { background:var(--c-success-bg); color:var(--c-success-text); }
.tag.src { background:var(--c-bg-selected); color:var(--c-text-secondary); font-weight:700; font-size:10.5px; }
.coil { display:inline-flex; align-items:center; gap:4px; font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--c-text-muted); }
.pulse { animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
@media (prefers-reduced-motion: reduce) { .pulse, .cc.tint-run, .cc.unread { animation:none; } }

/* Тревога, «Сейчас», итог */
.alert { border-radius:10px; padding:9px 11px; margin-top:8px; font-size:12.5px; }
.alert.wait { background:var(--c-info-bg); color:var(--c-text-primary); }
.alert.stop { background:var(--c-danger-bg); color:var(--c-text-primary); }
.alert .r { display:flex; gap:8px; align-items:flex-start; }
.alert .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; margin-left:22px; }
.now { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12.5px; color:var(--c-text-secondary); }
.now b { color:var(--c-text-heading); }
.fin { display:flex; align-items:center; gap:10px; margin-top:8px; padding:9px 11px; border-radius:10px; background:var(--c-success-bg); }
.fin.gone { background:var(--c-bg-selected); }
.fin .a { font-weight:700; color:var(--c-success-text); font-size:13px; }
.fin.gone .a { color:var(--c-text-heading); }
.fin .b { font-size:11px; color:var(--c-text-secondary); }
.btn { display:inline-flex; align-items:center; gap:5px; border-radius:10px; padding:5px 11px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--c-border); background:var(--c-bg-white); color:var(--c-text-primary); }
.btn:hover { background:var(--c-bg-selected); }
.btn.pri { background:var(--c-accent); border-color:var(--c-accent); color:var(--c-on-accent); }
.btn.pri:hover { filter:brightness(.96); }
.btn.gh { border-color:transparent; background:transparent; color:var(--c-text-secondary); }
.app.m .btn { min-height:40px; }

/* ===== Вариант Б: карточки фич ===== */
.fc { border:1px solid var(--c-border-light); background:var(--c-bg-card); border-radius:12px; padding:10px 12px; margin:0 0 8px; cursor:pointer; }
.fc:hover { border-color:var(--c-border); box-shadow:var(--shadow-card); }
.fc.att-wait { border-left:3px solid var(--c-info); }

];

/* ---------- Чаты проекта. r — роль чата в фиче (источник: эпик.sourceSessionId → key,

  { id:'c5',  t:'Ревью Ш1', p:'gleb', f:'fmd', r:'review', ref:'ревью', st:'idle', ago:'2 ч', day:0 },
  { id:'c6',  t:'Проверка 360 px', p:'vera', f:'fmd', r:'qa', ref:'проверка', st:'idle', ago:'1 ч', day:0, unread:true },
  { id:'c7',  t:'Финальное ревью', p:'alex', f:'fmd', r:'final', ref:'финал', st:'idle', ago:'42 мин', day:0 },
  { id:'c8',  t:'Прокси: сжатие в облако', p:'sofya', f:'proxy', r:'key', st:'idle', ago:'25 мин', day:0 },

const ROLE_ORDER = { key:0, cut:1, plan:2, step:3, review:4, qa:5, final:6, merge:7 };
const ROLE_TXT = { key:'ключевой', cut:'разрез', plan:'план' };

/* ---------- Данные с учётом переключателя «Данные» ---------- */
function feats(){
  if (S.data==='none') return [];
  if (S.data==='closed') return FEATS.filter(f => f.closed);
  return FEATS;
}
function chats(){
  const fs = new Set(feats().map(f => f.id));
  return CHATS.filter(c => !c.f || fs.has(c.f));
}
const F = id => feats().find(f => f.id===id) || null;
const C = id => chats().find(c => c.id===id) || null;

/* Состояние фичи для фильтров и глифа */
function fst(f){
  if (f.closed) return f.merged ? 'merged' : 'closed';
  if (f.att?.k==='stop') return 'stop';
  if (f.att?.k==='merge') return 'merge';
  if (f.att?.k==='wait') return 'wait';
  return f.tone==='loop' ? 'loop' : 'run';
}
/* Порядок фич — правило v2 (FeatureProjector): тревога по since ↓ давности, идущие по старту, прочие и закрытые по активности */
function ordered(list){
  const g = f => f.closed ? 3 : f.att ? 0 : f.now ? 1 : 2;
  return [...list].sort((a,b) => g(a)-g(b) || (g(a)===0 ? b.att.since-a.att.since : g(a)===1 ? a.now.min-b.now.min : a.lastAct-b.lastAct));
}
function mins(m){ if (m<60) return `${m} мин`; const h=Math.floor(m/60), r=m%60; return r ? `${h} ч ${r} мин` : `${h} ч`; }
function plural(n,a,b,c){ const m10=n%10, m100=n%100; return m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const av = (k, sm) => `<span class="av${sm?' sm':''}" title="${esc(P[k])}">${esc((P[k]||'?').slice(0,1))}</span>`;

/* Текст статуса фичи — тот же словарь, что у пилюли v2 */
function stText(f){
  const s = fst(f), ai = f.stages.indexOf('a');
  switch(s){
    case 'wait': return { t:`ждёт вас · ${f.att.why} · ${mins(f.att.since)}`, c:'tn-wait' };
    case 'merge': return { t:`ждёт вас · мерж · ${mins(f.att.since)}`, c:'tn-wait' };
    case 'stop': return { t:`стоит · ${P[f.now.p]} · ${mins(f.att.since)}`, c:'tn-stop' };
    case 'loop': return { t:`${STG[ai]} · доработка · ${P[f.now.p]}`, c:'tn-loop' };
    case 'run': return { t:`${STG[ai]} · ${P[f.now.p]} · идёт ${mins(f.now.min)}`, c:'tn-run' };
    case 'merged': return { t:`смержена ${f.merged} · ${f.sum.dur}`, c:'' };
    default: return { t:'закрыта без мержа', c:'' };
  }
}
const cnt = f => `${f.tot ? `${f.acc}/${f.tot}` : '—'}${f.ret ? ` <span class="${f.ret>=3&&!f.closed?'hot':''}">↺${f.ret}</span>` : ''}`;

function glyph(k, s=12){

/* Мини-рельса: 7 сегментов, активный длиннее и в цвет тона */
function mrail(f){
  const segs = [...f.stages].map((s,i) => `<i class="${s==='d'?'d':s==='x'?'x':s==='a'?'a '+(f.tone==='stop'?'stop':f.tone):''}" title="${STG[i]} — ${s==='d'?'пройден':s==='x'?'нет в трекере':s==='a'?'сейчас':'впереди'}"></i>`).join('');
  return `<span class="mr${f.closed?' gone':''}" aria-label="Этап: ${f.closed?'закрыта':STG[f.stages.indexOf('a')]}">${segs}</span>`;
}
/* Подписанная рельса карточки (вариант Б) */
function lrail(f){
  const ai = f.stages.indexOf('a');
  return `<div class="lr">${[...f.stages].map((s,i) => `<div class="sgm ${s==='d'?'d':s==='x'?'x':s==='a'?'a '+(f.tone==='stop'?'stop':f.tone):''}" title="${STG[i]}"></div>`).join('')}
    ${[...f.stages].map((s,i) => `<div class="lb${i===ai?' a':''}">${i===ai || !S.m ? STG_S[i] : ''}</div>`).join('')}</div>`;
}

/* Конвейер фичи — сокращённый PipelineFlow v2: 7 этапов, тон активного, ↺ по источникам */
function pipeline(f){
  const rows = STG.map((n,i) => {
    const s = f.stages[i];
    const tone = f.tone==='stop' ? 'stop' : f.tone;
    const g = s==='d' ? glyph('past',16) : s==='x' ? glyph('absent',16) : s==='p' ? glyph('pend',16) : glyph(tone==='run'?'arun':tone,16);
    let m = '';
    if (s==='a') m = `<span class="tag ${tone}">${tone==='wait'?(f.att?.k==='merge'?'ждёт вас · мерж':'ждёт вас'):tone==='stop'?'стоит':tone==='loop'?'доработка':'идёт'}</span>`;
    else if (s==='x') m = 'нет в трекере';
    else if (s==='d' && i===2 && f.ret) m = `${1+f.ret} ${plural(1+f.ret,'проход','прохода','проходов')}`;
    let sub = '';
    if (i===2 && f.lanes?.length) sub = f.lanes.map(l => `${l[0]} · ${P[l[1]]} · ${l[2]} из ${l[3]}`).join(' &nbsp;·&nbsp; ');
    if (i===2 && f.retSrc) { const b = Object.entries(f.retSrc).map(([k,v]) => `<span class="tag src">↺${v} ${k==='review'?'с ревью':k==='qa'?'с проверки':'с финала'}</span>`).join(' '); if (b) sub += (sub?'<br>':'') + b; }
    return `<li class="${s}">${g}<span class="n">${n}</span><span class="m">${m}</span>${sub?`<div class="sub">${sub}</div>`:''}</li>`;
  }).join('');
  return `<ol class="pf">${rows}</ol>`;
}
function featureBody(f, opts={}){
  let h = '';
  const s = fst(f);
  if (s==='merge') h += `<div class="alert wait"><div class="r">${glyph('wait',14)}<span><b>Ждёт вас ${mins(f.att.since)}.</b> Финал принят, мержа ещё нет. Отдать фичу Марку на мерж?</span></div><div class="acts"><button class="btn">Попросить Марка</button><button class="btn gh">Итог финала</button></div></div>`;
  if (s==='wait') h += `<div class="alert wait"><div class="r">${glyph('wait',14)}<span><b>Ждёт вас ${mins(f.att.since)}.</b> Александр предложил три варианта разреза — нужен выбор.</span></div><div class="acts"><button class="btn" data-a="go:${f.key}">Ответить в ключевом чате</button></div></div>`;
  if (s==='stop') h += `<div class="alert stop"><div class="r">${glyph('stop',14)}<span><b>Денис стоит ${mins(f.att.since)}.</b> Ход оборвался на шаге Ш2, задача в работе.</span></div><div class="acts"><button class="btn">Перезапустить исполнителя</button><button class="btn gh" data-a="chat:c9">Чат Дениса</button></div></div>`;
  if (f.now && s!=='stop') h += `<div class="now">${glyph(s==='loop'?'loop':'arun',14)}<span><b>Сейчас:</b> ${P[f.now.p]} · ${esc(f.now.step)} · идёт ${mins(f.now.min)}</span></div>`;
  if (f.closed) h += `<div class="fin${f.merged?'':' gone'}">${glyph(f.merged?'done':'closed',18)}<div><div class="a">${f.merged?`Фича смержена ${f.merged}`:'Спайк закрыт, в master не идёт'}</div><div class="b mono">${f.sum.dur} · ${f.sum.tasks} задач · ${f.sum.steps} ${plural(f.sum.steps,'шаг','шага','шагов')} · ↺${f.ret}</div></div></div>`;
  h += pipeline(f);
  return h;
}

/* ---------- Плашка фичи (FeatureStrip) — общая для всех вариантов ---------- */
function strip(c){
  const f = c && c.f ? F(c.f) : null;
  if (!f) return '';
  const s = fst(f), t = stText(f), isKey = c.id===f.key;
  const cls = s==='wait'||s==='merge' ? 't-wait' : s==='stop' ? 't-stop' : f.closed ? 'gone' : '';
  const g = glyph(s==='run'?'run':s, 13);
  const roleTxt = isKey ? 'ключевой чат' : (c.ref || ROLE_TXT[c.r] || c.r);
  const back = isKey && S.prev && C(S.prev)?.f===f.id && S.prev!==c.id ? `<button class="back" data-a="chat:${S.prev}" title="Вернуться в чат, из которого пришли">${ICON.backSm}${S.m?'':esc(C(S.prev).ref||C(S.prev).t)}</button>` : '';
  let right;
  if (S.m) right = isKey ? `<button class="go" data-a="fx" aria-label="Конвейер фичи">${ICON.down}</button>` : `<button class="go" data-a="go:${f.key}" aria-label="В ключевой чат фичи">${ICON.arrow}</button>`;
  else right = isKey ? `<button class="go" data-a="fx" aria-expanded="${S.fxOpen}">Конвейер ${ICON.down}</button>` : `<button class="go" data-a="go:${f.key}">Ключевой чат ${ICON.arrow}</button>`;
  return `<div class="fs ${cls} new" role="region" aria-label="Фича этого чата">
    ${back}
    <button class="body" data-a="${S.m?'sheet:strip':(isKey?'fx':'go:'+f.key)}" title="${isKey?'Показать конвейер':'Перейти в ключевой чат фичи'}">
      ${g}<span class="nm">${esc(f.name)}</span>${mrail(f)}${S.m?'':`<span class="sg ${t.c}">${esc(t.t)}</span>`}<span class="cnt">${cnt(f)}</span>
      ${S.m?'':isKey?`<span class="role key">ключевой</span>`:`<span class="me">· этот чат: <span class="role">${esc(roleTxt)}</span></span>`}
    </button>${right}</div>
    ${isKey && S.fxOpen && !S.m ? `<div class="fsx">${featureBody(f)}${legend()}</div>` : ''}`;
}
function legend(){
  return `<div class="legend"><span><span class="mr"><i class="d"></i></span>пройден</span><span><span class="mr"><i class="a run"></i></span>идёт</span><span><span class="mr"><i class="a wait"></i></span>ждёт вас</span><span><span class="mr"><i class="a stop"></i></span>стоит</span><span><span class="mr"><i class="a loop"></i></span>доработка</span><span><span class="mr"><i></i></span>впереди</span><span><span class="mr"><i class="x"></i></span>нет в трекере</span></div>`;
}

/* ---------- Строка чата ---------- */
function chatRow(c, opts={}){
  const f = c.f ? F(c.f) : null;
  const tint = c.st==='run' ? ' tint-run' : c.st==='wait' ? ' tint-wait' : c.st==='stop' ? ' tint-stop' : c.unread ? ' unread' : '';
  let sub;
  if (opts.inGroup) sub = `<span class="role${c.r==='key'?' key':''}">${esc(c.r==='key'?'ключевой':(c.ref||ROLE_TXT[c.r]))}</span><span>${esc(P[c.p])}</span>`;
  else if (f && opts.featTag) { const s=fst(f); sub = `<span class="ft new">${glyph(s==='run'?'run':s,10)}<span>${esc(f.name)}</span></span>`; }
  else sub = `<span>${esc(P[c.p])}</span>`;
  const st = c.st==='stop' ? `<span class="tn-stop">· стоит</span>` : c.st==='wait' ? `<span class="tn-wait">· ждёт вас</span>` : '';
  return `<button class="cc${S.chat===c.id&&!S.m?' on':''}${tint}" data-a="chat:${c.id}">${av(c.p)}<span class="w"><div class="t">${esc(c.t)}</div><div class="s">${sub}${st}</div></span><span class="tm">${esc(c.ago)}</span></button>`;
}

/* ---------- Вариант А: панель «Чаты» с группировкой «Фичи» ---------- */
const GROUPS = [['days','Дни',ICON.cal],['tags','Теги',ICON.tag],['subjects','Темы',ICON.layers],['features','Фичи',ICON.route(14)],['none','Без',ICON.list]];
function filterChips(fl, cur, act){
  const open = fl.filter(f => !f.closed);
  const defs = [['open','Открытые',open.length],['att','Ждут вас',open.filter(f => ['wait','merge'].includes(fst(f))).length],
    ['stop','Стоят',open.filter(f => fst(f)==='stop').length],['merge','К мержу',open.filter(f => fst(f)==='merge').length],
    ['closed','Закрытые',fl.length-open.length]];
  return `<div class="chips new" role="group" aria-label="Фильтр фич">${defs.map(([k,n,c]) => `<button class="fch${cur===k?' on':''}${c?'':' zero'}" aria-pressed="${cur===k}" data-a="${act}:${k}">${n}<span class="n">${c}</span></button>`).join('')}</div>`;
}
function passes(f, k){
  const s = fst(f);
  if (k==='open') return !f.closed;
  if (k==='att') return s==='wait'||s==='merge';
  if (k==='stop') return s==='stop';
  if (k==='merge') return s==='merge';
  return f.closed;
}
function sideA(){
  const g = GROUPS.find(x => x[0]===S.group);
  let h = `<div class="ph"><span class="ttl">Чаты</span>
    <button class="gbtn${S.group==='features'?' new':''}" data-a="menu:group" aria-haspopup="menu" title="Группировка: ${g[1]} (сменить)">${g[2]}<span>${g[1]}</span>${ICON.down}</button>
    <button class="ib" title="Фильтры и поиск">${ICON.filter}</button><button class="ib" title="Архивные">${ICON.archive}</button><button class="ib" title="Новый чат">${ICON.plus}</button></div>`;
  if (S.menu==='group') h += `<div class="menu" style="top:46px;${S.m?'left:8px;right:8px':'left:150px'}" role="menu">${GROUPS.map(([k,n,ic]) => `<button class="mi${S.group===k?' on':''}${k==='features'?' new':''}" role="menuitemradio" aria-checked="${S.group===k}" data-a="group:${k}">${ic}<span>${k==='none'?'Без группировки':n}</span>${S.group===k?'<span class="ck">✓</span>':''}</button>`).join('')}</div>`;
  const fl = ordered(feats());
  if (S.group==='features'){
    if (fl.length) h += filterChips(fl, S.filt, 'filt');
    h += `<div class="scroll">`;
    if (!fl.length) {
      h += `<div class="empty sm">${'<span class="ic">'+ICON.route(20)+'</span>'}<div class="h">Фич пока нет</div><div class="d">Фича появится здесь, когда оркестратор заведёт её эпиком в трекере. Тогда её чаты соберутся в одну группу.</div></div>`;
    }
    const open = fl.filter(f => !f.closed);
    if (fl.length && !open.length && S.filt!=='closed') h += `<div class="calm">${glyph('done',14)}<span>Открытых фич нет. Последняя смержена ${fl[0].merged}.</span></div>`;
    if (S.filt!=='closed') {
      const shown = open.filter(f => passes(f, S.filt));
      if (open.length && !shown.length) h += `<div class="empty sm"><div class="h">Под фильтр ничего не попало</div><div class="d">Сейчас ни одна фича не ${S.filt==='stop'?'стоит':S.filt==='merge'?'ждёт мержа':'ждёт вас'}. <button class="btn gh" data-a="filt:open">Показать открытые</button></div></div>`;
      h += shown.map(f => featGroup(f)).join('');
    }
    const closed = fl.filter(f => f.closed);
    if (closed.length){
      const op = S.closedOpen || S.filt==='closed';
      h += `<button class="sec tg new" data-a="closedOpen" aria-expanded="${op}">${op?ICON.down:ICON.chev}<span>Закрытые</span><span class="n">${closed.length}</span><span class="hint">${op?'':'на втором плане'}</span></button>`;
      if (op) h += `<div class="closed">${closed.map(f => featGroup(f)).join('')}</div>`;
    }
    const loose = chats().filter(c => !c.f);
    if (S.filt==='open' || !fl.length) h += `<div class="sec">Без фичи <span class="n">${loose.length}</span></div>${loose.map(c => chatRow(c)).join('')}`;
    h += `</div>`;
  } else {
    // Дни (как сейчас) + метка фичи на строке чата — фича видна и в хронологии
    const days = ['Сегодня','Вчера (пт)','16 октября (чт)'];
    h += `<div class="scroll">${days.map((d,i) => { const cs = chats().filter(c => c.day===i); return cs.length ? `<div class="sec">${d}</div>${cs.map(c => chatRow(c, { featTag:true })).join('')}` : ''; }).join('')}</div>`;
  }
  return h;
}
function featGroup(f){
  const s = fst(f), t = stText(f), op = !!S.open[f.id];
  const cs = chats().filter(c => c.f===f.id).sort((a,b) => ROLE_ORDER[a.r]-ROLE_ORDER[b.r]);
  const att = s==='wait'||s==='merge' ? ' att-wait' : s==='stop' ? ' att-stop' : '';
  return `<div class="fg${op?' open':''}"><button class="fgh${att} new" data-a="fg:${f.id}" aria-expanded="${op}">
    <span class="chev">${ICON.chev}</span>${glyph(s==='run'?'run':s,13)}<span class="nm">${esc(f.name)}</span><span class="cnt">${cnt(f)}</span>
    <span class="l2">${mrail(f)}<span class="st ${t.c}">${esc(t.t)}</span></span></button>
    ${op ? `<div class="kids">${cs.map(c => chatRow(c,{ inGroup:true })).join('')}</div>` : ''}</div>`;
}

/* ---------- Вариант Б: панель «Фичи» ---------- */
function sideB(){
  if (S.fsel && F(S.fsel)) return detailB(F(S.fsel));
  const fl = ordered(feats());
  let h = `<div class="ph"><span class="ttl">Фичи</span><button class="ib" title="Задачи фич в трекере">${ICON.tasks}</button></div>`;

/* Переход в ключевой чат: запоминаем, откуда пришли — плашка ключевого чата покажет «← назад» */
function goKey(id){
  const from = S.chat;
  S.prev = from !== id ? from : S.prev; S.chat = id; S.fxOpen = false; S.menu = null; S.sheet = null; S.mscreen = 'chat';
  const c = C(id), f = c && F(c.f);
  S.toast = f ? `Ключевой чат фичи «${esc(f.name)}»` : null;
  setTimeout(() => { S.toast = null; render(); }, 1800);
}
document.addEventListener('click', e => {
  const mk = e.target.closest('[data-mk]');
  if (mk){ const [k,v] = mk.dataset.mk.split(':'); S[k] = v==='true' ? true : v==='false' ? false : v; S.menu = null; S.sheet = null; S.fsel = null;
    if (k==='m') S.mscreen = 'chat';
    if (k==='v'){ S.panel = v==='b' ? 'feats' : 'chats'; }
    render(); return; }
  const el = e.target.closest('[data-a]');
  if (!el){ if (S.menu){ S.menu = null; render(); } return; }
  e.stopPropagation();
  const [a, ...rest] = el.dataset.a.split(':'); const v = rest.join(':');
  switch(a){
    case 'chat': S.prev = null; S.chat = v; S.fxOpen = false; S.menu = null; S.sheet = null; S.mscreen = 'chat'; break;
    case 'go': goKey(v); break;
    case 'menu': S.menu = S.menu===v ? null : v; break;
    case 'group': S.group = v; S.menu = null; break;
    case 'filt': S.filt = v; break;
    case 'bfilt': S.bfilt = v; break;
    case 'closedOpen': S.closedOpen = !S.closedOpen; break;
    case 'bClosedOpen': S.bClosedOpen = !S.bClosedOpen; break;
    case 'cClosed': S.closedOpen = !S.closedOpen; break;
    case 'fg': S.open[v] = !S.open[v]; break;
    case 'fx': S.fxOpen = !S.fxOpen; if (S.m) S.sheet = 'strip'; break;
    case 'fsel': S.fsel = v || null; break;
    case 'panel': S.panel = v; S.fsel = null; if (S.m) S.mscreen = 'list'; break;
    case 'sheet': S.sheet = v || null; break;
    case 'mlist': S.mscreen = 'list'; S.menu = null; break;
  }
  render();
});

/* Диплинк: #a, #b, #c и параметры для скриншотов (#b&m&dark) */
(function(){ const h = location.hash.slice(1).split('&'); if (['a','b','c'].includes(h[0])) { S.v = h[0]; S.panel = S.v==='b' ? 'feats' : 'chats'; }
  if (h.includes('m')) S.m = true; if (h.includes('dark')) S.theme = 'dark'; if (h.includes('none')) S.data = 'none'; if (h.includes('closed')) S.data = 'closed';
  const ch = h.find(x => x.startsWith('chat=')); if (ch) S.chat = ch.slice(5);
  const op = h.find(x => x.startsWith('open=')); if (op) op.slice(5).split(',').forEach(id => S.open[id] = true);
  if (h.includes('list')) S.mscreen = 'list'; if (h.includes('fx')) S.fxOpen = true; if (h.includes('sheet')) S.sheet = 'strip';
  const fs = h.find(x => x.startsWith('fsel=')); if (fs) S.fsel = fs.slice(5);
  const mn = h.find(x => x.startsWith('menu=')); if (mn) S.menu = mn.slice(5);
  const pr = h.find(x => x.startsWith('prev=')); if (pr) S.prev = pr.slice(5);
  if (h.includes('closedopen')) { S.closedOpen = true; S.bClosedOpen = true; }
  if (h.includes('days')) S.group = 'days';
})();
render();
</script>
</body>
