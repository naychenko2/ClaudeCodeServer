  ['health','Здоровье'],['loading','Загрузка'],['empty','Не заведена'],['local','Локальный проект'],['entry','«Разобрать в базу»'],
];
const PSTATES = [['proposed','на ревью'],['checking','проверяется'],['stale','устарел'],['applied','применён'],['apply_failed','не применён']];
const S = { screen:'page', dark:false, m:false, ps:'proposed', dec:{ 1:'acc', 2:'acc' }, rs:{}, tip:null, nonew:false, srcOpen:false, driftDiff:true, scope:'base' };
(function readHash(){
  const h = location.hash.slice(1).split('&');
  for (const p of h) {
    const [k, v] = p.split('=');
    if (k === 'dark') S.dark = true; else if (k === 'm') S.m = true; else if (k === 'calm') S.nonew = true;
    else if (k === 'ps') S.ps = v; else if (SCREENS.some(s => s[0] === k)) S.screen = k;
    else if (k === 'rej') { S.dec = { 1:'acc', 2:'acc', 3:'rej' }; }
  }
})();

// ===== Мелкие примитивы =====
const badge = (tone, text, dot) => `<span class="bdg t-${tone}">${dot ? '<span class="d"></span>' : ''}${text}</span>`;
const stBadge = st => st === 'active'
  ? `<span class="dot" style="background:var(--c-success)" title="${ST.active.ru}: ${ST.active.tip}"></span>`
  : `<span title="${ST[st].tip}">${badge(ST[st].tone, ST[st].ru)}</span>`;
const btn = (kind, size, text, act = '', extra = '') => `<button class="btn ${kind} ${size}" ${act ? `data-act="${act}"` : ''} ${extra}>${text}</button>`;
const ckBadge = (ck, n) => ck === 'ok' ? `<span class="ck ok">${I(ic.check,12)}${n}</span>`
  : ck === 'bad' ? `<span class="ck bad">${I(ic.x,12)}${n}</span>` : `<span class="ck" style="color:var(--c-text-muted)"><span class="spin"></span>${n}</span>`;
const tab = () => ['inbox','pkg','checks'].includes(S.screen) ? 'inbox' : S.screen === 'health' ? 'health' : 'catalog';
const isDetail = () => ['page','drift','pkg','checks'].includes(S.screen);

// ===== Боковая панель вики =====
function sideHead() {
  return `<div class="ph"><span class="ttl">Заметки</span>
      <button class="bdg t-neutral new" title="База: у проекта и у личного хранилища — своя вики" style="cursor:pointer">AI Home ${I(ic.chev,12)}</button>
    </div>
    <div class="ctl">
      ${S.m ? '' : `<div class="pills fill new"><button>${I(ic.note,13)}Заметки</button><button class="on">${I(ic.book,13)}Вики</button></div>`}
      ${['empty','local'].includes(S.screen) ? '' : `<div class="pills fill new">
        <button class="${tab()==='catalog'?'on':''}" data-go="catalog">Каталог</button>
        <button class="${tab()==='inbox'?'on':''}" data-go="inbox">Входящие <span class="cnt">5</span></button>
        <button class="${tab()==='health'?'on':''}" data-go="health">Здоровье</button></div>`}
    </div>`;
}
function catalogList() {
  if (S.screen === 'loading') {
    return `<div class="scroll">${[0,1,2].map(() => `<div class="sech"><span class="sk" style="width:70px;height:9px"></span></div>` +
      [0,1,2].map(() => `<div class="row"><span class="sk" style="width:26px;height:26px;border-radius:8px"></span><div class="w"><div class="sk" style="width:60%;height:11px;margin:3px 0 6px"></div><div class="sk" style="width:85%;height:9px"></div></div></div>`).join('')).join('')}</div>`;
  }
  const cur = S.screen === 'drift' ? 'stand' : S.m ? '' : 'gleb';
  let h = `<div style="padding:8px 10px 0"><div class="srch">${I(ic.search,14)}<span>Поиск по вики…</span></div></div><div class="scroll">`;
  for (const T of TYPES) {
    const ps = PAGES.filter(p => p.type === T.k);
    const total = T.k === 'source' ? 14 : ps.length;
    h += `<div class="sech">${T.ru} <span class="n">${total}</span>${T.k==='source' ? '<span class="r">показаны 2 из 14</span>' : ''}</div>`;
    for (const p of ps) {
      h += `<button class="row ${p.id===cur ? 'on' : ''}" data-go="${p.id==='stand' ? 'drift' : 'page'}">
        <span class="ic">${I(ic[T.icon],14)}</span>
        <span class="w"><span class="t"><span class="x">${p.t}</span>${stBadge(p.st)}</span>
        <span class="s" style="display:block">${p.s}</span>
        ${p.type !== 'source' ? `<span class="m">${I(ic.quote,11)} ${p.n} ист.${p.kind ? ' · ' + p.kind : ''}</span>` : ''}</span></button>`;
    }
  }
  return h + `</div>${gitFoot()}`;
}
const gitFoot = () => `<div class="foot new">${I(ic.git,14)}<span>Хранитель не коммитит — вики проекта страхует git. Коммит — за вами.</span></div>`;

function inboxList() {
  const cur = ['pkg'].includes(S.screen) ? 'p1' : S.screen === 'checks' ? 'p2' : (S.m ? '' : 'p1');
  let h = `<div class="scroll">`;
  for (const r of ['high','mid','low']) {
    const ps = PKGS.filter(p => p.risk === r);
    h += `<div class="sech"><span class="dot" style="background:var(--c-${RISK[r].tone==='neutral'?'text-muted':RISK[r].tone})"></span>${RISK[r].ru} <span class="n">${ps.length}</span><span class="r">${RISK[r].hint}</span></div>`;
    for (const p of ps) {
      h += `<button class="row ${p.id===cur ? 'on' : ''}" data-go="${p.id==='p2' ? 'checks' : 'pkg'}" ${p.ck==='run' ? 'aria-disabled="true"' : ''}>
        <span class="ic">${I(ic[OICON[p.o]],14)}</span>
        <span class="w"><span class="t"><span class="x">${p.t}</span></span>
        <span class="s" style="display:block">${p.ops ? `${p.ops} операц${p.ops<5?'ии':'ий'} · ${p.mix}` : 'Хранитель читает источник…'}</span>
        <span class="m">${ckBadge(p.ck, p.ckn)}</span></span><span class="tm">${p.age}</span></button>`;
    }
  }
  h += `<div class="sech">Разобранные <span class="n">12</span><span class="r">90 дней</span></div>`;
  for (const d of DONE) h += `<div class="row" style="min-height:36px;align-items:center"><span class="w"><span class="s" style="display:block">${d.t}</span></span>${badge(d.tone, d.ru)}<span class="tm">${d.d}</span></div>`;
  return h + `</div><div class="foot">${I(ic.inbox,14)}<span>Открыто 5 из 20. При 20 новые разборы ждут, пока вы не разберёте очередь.</span></div>`;
}
function healthSide() {
  return `<div class="scroll">
    <div class="sech">Проблемы в Вики/ <span class="n">2</span></div>
    <button class="row" data-go="drift"><span class="ic" style="color:var(--c-danger)">${I(ic.alert,14)}</span><span class="w"><span class="t"><span class="x">Стенд разработки</span>${badge('danger','дрейф')}</span><span class="s" style="display:block">изменён мимо Хранителя 20.10 14:32</span></span></button>
    <button class="row"><span class="ic">${I(ic.layers,14)}</span><span class="w"><span class="t"><span class="x">Локальные модели</span>${badge('neutral','устарела')}</span><span class="s" style="display:block">94 дня без изменений</span></span></button>
    <div class="sech">Страница просится <span class="n">3</span><span class="r">ссылок в пустоту ≥ 3</span></div>
    ${[['Хранитель базы',7],['Vibe-кодинг',4],['Стенд vLLM',3]].map(([t,n]) => `<div class="row" style="align-items:center;min-height:38px"><span class="ic" style="border:1px dashed var(--c-dashed);background:none">${I(ic.file,13)}</span><span class="w"><span class="s" style="display:block;color:var(--c-text-primary)">${t}</span></span><span class="tm mono">${n}×</span></div>`).join('')}
    <div class="hint" style="padding:6px 8px">Заметки вне Вики/ lint только считает и никогда не предлагает править.</div>
  </div>`;
}
function sideEmpty() {
  const local = S.screen === 'local';
  return `<div class="scroll"><div class="hint" style="padding:16px 8px">${local ? 'Проект живёт на устройстве — вики для него нет.' : 'В этой базе вики ещё нет.'}</div></div>`;
}
function side() {
  const body = ['empty','local'].includes(S.screen) ? sideEmpty() : tab() === 'inbox' ? inboxList() : tab() === 'health' ? healthSide() : catalogList();
  return sideHead() + body;
}

// ===== Страница вики =====
function fn(no) {
  const s = curSrc()[no - 1];
  const card = `<span class="qt">«${s.q}»</span>
    <span class="tsrc">${I(ic[OICON[s.o]],13)}<span class="nm">${s.t}</span></span>
    <span class="tsrc" style="margin-top:3px"><span>${ORU[s.o]} · ${s.ref} · ${s.d}</span></span>
    <span style="display:flex;gap:6px;margin-top:8px">${s.gone ? badge('neutral','оригинал удалён, выдержка сохранена') : '<span class="lnk" style="padding:0">Открыть источник →</span>'}</span>`;
  return `<span class="fn ${S.tip===no && !S.m ? 'open' : ''}" tabindex="0" data-act="tip" data-n="${no}" aria-label="Сноска ${no}: источник и цитата">${no}<span class="tipc" role="tooltip">${card}</span></span>`;
}
function glebBody() {
  return `    <h3 class="sh">Сводка</h3>
    <ul class="claims">
      <li>Ведёт код-ревью AI Home: находки по severity, соглашения проекта, безопасность и изоляция данных.${fn(1)}</li>

      <li>Ревью заметного UI идёт после прогона субагента designer, а не вместо него.${fn(3)}</li>
    </ul>

    <h3 class="sh">Хронология</h3>
    <ul class="chron">
      <li><span class="dt">01.09.2026</span><span>Взял ревью линии «Персоны-Fold».${fn(1)}</span></li>
      <li><span class="dt">20.10.2026</span><span>Принял ревью звука.${fn(2)}</span></li>
    </ul>

    <h3 class="sh">Противоречия <span class="n">1</span></h3>
    <div class="conf">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${badge('warning','открыто с 20.10')}<span class="hint">Кто ревьюит звук</span></div>
      <div class="sides"><div class="q">«закрываю ревью фронта и звука до пятницы»${fn(2)}</div><div class="vs">↔</div><div class="q">«звук ревьюит Вера, Глеб только фронт»${fn(4)}</div></div>
      <div class="hint" style="margin-top:8px">Разрешится пакетом: новый источник или замещение одной из сторон.</div>
    </div>

    <h3 class="sh">История <span class="n">1</span></h3>
    <ul class="hist"><li><span class="per">01.09.2026 → 20.10.2026</span>Глеб ревьюит только бэкенд.${fn(1)} · заменено${fn(2)}</li></ul>`;
}
function standBody() {
  return `<h3 class="sh">Сводка</h3>
    <ul class="claims">
      <li>Хостовый дев-стенд поднимается только через dotnet run.${fn(1)}</li>
      <li>Порождённые процессы наследуют окружение Production и уводят стенд на занятый порт.${fn(2)}</li>
      <li><span style="background:var(--c-warning-bg);border-radius:4px;padding:0 3px">Дев-стенд поднимается через dotnet run, порт 5555.</span> <span class="bdg t-warning" title="Строка появилась мимо Хранителя — у неё нет сноски">без источника</span></li>
    </ul>
    <h3 class="sh">Хронология</h3>
    <ul class="chron"><li><span class="dt">28.09.2026</span><span>Стенд ушёл на :80 из-за унаследованного Production.${fn(2)}</span></li></ul>
    <h3 class="sh">Противоречия</h3>
    <div class="hint">Открытых противоречий нет.</div>
    <h3 class="sh">История</h3>
    <div class="hint">Замещённых утверждений пока нет.</div>`;
}
function page() {
  const drift = S.screen === 'drift';
  const st = drift ? 'drift' : 'disputed';
  return `<div class="doc"><div class="docin">
    ${drift ? `<div class="ntc warning new" style="margin-bottom:12px">${I(ic.alert,16)}<div style="flex:1">
      <div class="nt">Расходится с журналом Хранителя</div>
      Файл изменён мимо Хранителя 20.10 в 14:32 — в Obsidian, git или редакторе. Пока вы не решите, пакеты по этой странице не применяются.
      <div class="na">${btn('sec','sm','Принять как есть','', 'title="Хранитель запомнит текущий файл как верный и запишет в журнал «ручная правка вне Хранителя»"')}
        ${btn('gh','sm',I(ic.undo,14)+'Вернуть','','title="Вернуть версию из журнала Хранителя от 20.10 12:10"')}
        <button class="lnk" data-act="driftdiff">${S.driftDiff ? 'Скрыть разницу' : 'Что изменилось'}</button></div>
      ${S.driftDiff ? `<div class="diff" style="background:var(--c-bg-white)"><div class="dr hunk"><span class="g"></span>журнал 20.10 12:10 → диск 20.10 14:32</div>
        <div class="dr ctx"><span class="g"></span>- Порождённые процессы наследуют окружение Production…[^2]</div>
        <div class="dr add"><span class="g">+</span>- Дев-стенд поднимается через dotnet run, порт 5555.</div></div>
        <div class="hint" style="margin-top:6px">У добавленной строки нет сноски — после «Принять как есть» lint отметит её в «Здоровье».</div>` : ''}
    </div></div>` : ''}
    <div class="kicker">${I(ic.user,13)} сущность · ${drift ? 'система' : 'человек'} ${stBadge(st)}</div>
    <h2 class="pt">${drift ? 'Стенд разработки' : 'Глеб (ревьюер)'}</h2>
    <p class="summary">${drift ? 'Дев-стенд :5000 и его грабли' : 'Ревьюер AI Home: находки по severity, фронт и звук'}</p>
    <div class="meta"><span>${I(ic.quote,12)} ${curSrc().length} источника</span><span>обновлено ${drift ? '02.10.2026' : '20.10.2026'}</span><span>aliases: ${drift ? 'стенд, :5000' : 'Глеб, @gleb'}</span></div>
    <div class="ro new">${I(ic.lock,14)}<span><b>Только чтение</b> — правки идут через Хранителя: разберите новый источник или отклоните пакет с причиной.</span></div>
    ${drift ? standBody() : glebBody()}
    <h3 class="sh">Источники <span class="n">${curSrc().length}</span></h3>
    <div class="srcs">${curSrc().map(s => `<div class="srcc"><span class="no">${s.no}</span>${I(ic[OICON[s.o]],15)}<div style="min-width:0;flex:1"><div class="tt">${s.t}</div>
      <div class="sm"><span>${ORU[s.o]} · ${s.ref}</span><span>разобран ${s.d}</span><span>${s.c} цит.</span>${s.gone ? badge('neutral','оригинал удалён') : ''}</div></div>
      ${s.gone ? '' : '<button class="ib" title="Открыть оригинал">'+I(ic.right,15)+'</button>'}</div>`).join('')}</div>
    <div class="hint" style="margin-top:8px">Блок собирается из сносок — отдельно в файле он не хранится.</div>
  </div></div>`;
}

// ===== Пакет =====
function opCard(o) {
  const d = S.dec[o.seq];
  const depRej = o.dep && S.dec[o.dep] === 'rej';
  const decided = d === 'acc' ? `${badge('success', I(ic.check,11)+' принята')}<button class="lnk" data-act="undo" data-s="${o.seq}">отменить</button>`
    : d === 'rej' ? `${badge('danger', I(ic.x,11)+' отклонена')}<button class="lnk" data-act="undo" data-s="${o.seq}">отменить</button>`
    : `${btn('gh','xs','Отклонить','rej',`data-s="${o.seq}"`)}${btn('sec','xs',I(ic.check,12)+'Принять','acc',`data-s="${o.seq}"`)}`;
  const ro = S.screen === 'checks' || ['applied','stale','apply_failed'].includes(S.ps);
  const ok = !(S.screen === 'checks' && [2,4].includes(o.seq));
  const mark = S.screen === 'checks' ? '' : d==='acc'?'acc':d==='rej'?'rej':'';
  return `<div class="op ${mark} ${depRej?'blk':''}" data-seq="${o.seq}">
    <div class="oh"><span class="seq">№${o.seq}</span>${badge(RISK[OPRISK[o.op]].tone==='neutral'?'neutral':RISK[OPRISK[o.op]].tone, OPRU[o.op])}<span class="where">${o.sec}</span>
      ${S.screen==='checks' ? `<span class="dec">${ok ? `<span class="ck ok">${I(ic.check,12)}проверки</span>` : `<span class="ck bad">${I(ic.x,12)}не прошла</span>`}</span>`
        : ro ? '' : `<span class="dec">${depRej ? badge('neutral','зависит от №'+o.dep) : decided}</span>`}</div>
    <div class="claim">${o.claim}</div>
    <div class="claim" style="font-size:12px;color:var(--c-text-secondary)">${I(ic.quote,12)} <span class="qchip">«${o.q}»</span> <span class="ck ok">${I(ic.check,11)}дословно</span></div>
    ${depRej ? `<div class="hint" style="margin-top:6px">Ссылка ведёт на страницу из №${o.dep}, а она отклонена — эта операция не применится.</div>` : ''}
    <div class="diff">${o.diff.map(([k,t]) => `<div class="dr ${k}"><span class="g">${k==='add'?'+':k==='del'?'−':''}</span>${t.replace(/</g,'&lt;')}</div>`).join('')}</div>
    ${d === 'rej' && !ro ? `<div class="why"><textarea class="ta" placeholder="Почему отклоняете? Например: «Вера — QA, но страница ей пока не нужна»">${S.rs[o.seq] || ''}</textarea>
      <div class="hint">Причина уйдёт Хранителю как правило-кандидат в _schema.md. Необязательно.</div></div>` : ''}
  </div>`;
}

}
function pkgState() {
  if (S.screen === 'checks') return `<div class="ntc danger new" style="margin:10px 18px 0">${I(ic.x,16)}<div style="flex:1">

function spark(pts, color) {
  const max = Math.max(...pts), min = Math.min(...pts);
  const p = pts.map((v,i) => `${i*(100/(pts.length-1))},${28 - ((v-min)/((max-min)||1))*24}`).join(' ');
  return `<svg width="100%" height="30" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p}" fill="none" style="stroke:var(${color});stroke-width:1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { S.screen = g.dataset.go; S.tip = null; if (S.screen === 'pkg' && !e.target.closest('.mk')) S.ps = S.ps; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const k = a.dataset.act, v = a.dataset.v, s = +a.dataset.s;
  if (k === 'theme') S.dark = v === '1';
  else if (k === 'w') S.m = v === '1';
  else if (k === 'calm') S.nonew = a.checked;
  else if (k === 'ps') S.ps = v;
  else if (k === 'scope') S.scope = v;
  else if (k === 'acc') S.dec[s] = 'acc';
  else if (k === 'rej') S.dec[s] = 'rej';
  else if (k === 'undo') delete S.dec[s];
  else if (k === 'accall') { for (const o of OPS) if (!S.dec[o.seq]) S.dec[o.seq] = 'acc'; }
  else if (k === 'tip') { S.tip = S.tip === +a.dataset.n ? null : +a.dataset.n; }
  else if (k === 'tipclose') S.tip = null;
  else if (k === 'driftdiff') S.driftDiff = !S.driftDiff;
  else if (k === 'src') S.srcOpen = !S.srcOpen;
  else if (k === 'go-drift') S.screen = 'drift';
  else return;
  render();
});
document.addEventListener('input', e => {
  const op = e.target.closest('.op'); if (op && e.target.matches('textarea')) S.rs[op.dataset.seq] = e.target.value;
});
// Наведение на операцию подсвечивает её цитату в карточке источника
document.addEventListener('mouseover', e => {
  const op = e.target.closest('.op');
  document.querySelectorAll('mark.hl').forEach(m => m.classList.toggle('hot', !!op && m.dataset.op.split(',').includes(op.dataset.seq)));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.tip) { S.tip = null; render(); } });
render();
</script>
</body>
</html>
