<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Детский режим — рельса «Материалы» · макет v1</title>
<!--
  Макет детской рельсы «Материалы» на экране предмета и в уроке. Эпик 45af8178-8435-4746-8f13-bd3cc781585e,
  задача 5eb76cc9 (role=design, дополнение к окну настроек). Решение Андрея 19.11, ADR-041 редакция 4,
  раздел «Детская рельса „Материалы“» (решения 41–47, инвариант И6′). stepRef шагов реализации назначит план.
  Записка — kids-materials-rail-proposal.md. Сторона админа (флаги «Видно Маше», «Репетитор читает») —
  kids-settings-window.html.

  Детский визуальный язык — как kids-tutors.html: шапка «Уроки» с плашкой времени, острова, заголовки
  PT Serif, текст 16, крупные цели касания. Устройство файла:
    1) ТЕМА — значения --c-* дословно из frontend/src/lib/theme.css. Сырой hex живёт только здесь.
    2) КОМПОНЕНТЫ — классы с именами живых компонентов (.btn = Button, .badge = Badge, .notice = Notice,
       .island = Island, .seg = Segmented, .ib = IconButton), только var(--c-*) и шкалы FS/SP/R.
    3) ПРОТОТИП — состояние в JS. Пульт сверху — рычаги макета, не продукт.
  Якорь адреса повторяет пульт: #scr=lesson&st=view-pdf&w=mob&t=dark
-->
<style>
/* ===== 1. Тема: frontend/src/lib/theme.css ===== */
:root, [data-theme="light"] {
  --c-bg-main:#F4F0E8; --c-bg-panel:#EDE7DC; --c-bg-card:#FBF8F2; --c-bg-white:#FFFFFF;
  --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E;
  --c-on-accent:#FBF8F2; --c-on-dark:#FFFFFF;
  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5; --c-accent-soft:#E8A990;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-divider:#DDD4C4; --c-dashed:#D0C6B4;
  --c-track:#D8CFBE; --c-smoke:#B4A899;
  --c-overlay:rgba(23,19,15,.42); --c-msg-bg:rgba(251,248,242,.42);
  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;
  --c-warning:#C9923E; --c-warning-bg:#FBEFE0; --c-warning-text:#8A6A28;
  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F; --c-danger-border:#F5C6BF;
  --c-info:#3E7CA6; --c-info-bg:#E7EFF5;
  --c-rose:#B0527C; --c-rose-text:#8E3D62;
  --c-plan:#6C5CB0; --c-plan-light:#EEEBF8; --c-plan-text:#4E4196;
  --shadow-focus:0 0 0 3px rgba(217,119,87,.14);
  --shadow-card:0 2px 8px rgba(60,50,35,.05);
  --shadow-island:0 1px 2px rgba(60,50,35,.06),0 6px 20px rgba(60,50,35,.10);
  --shadow-modal:0 24px 60px rgba(23,19,15,.40);
  --shadow-peek:0 2px 6px rgba(60,50,35,.14),0 20px 48px rgba(23,19,15,.32);
  --shadow-button:0 4px 14px rgba(217,119,87,.30);
  --shadow-thumb:0 1px 3px rgba(42,37,31,.12);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(217,119,87,.13),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.10),transparent 60%);
  /* GROUP_COLORS из design.ts — палитра аватаров-инициалов, от темы не зависит */
  --group-blue:#3E7CA6; --group-violet:#8E4A82; --group-green:#3F7A4F; --group-orange:#C2693B; --group-indigo:#4B6BB0; --group-khaki:#7A7250;
}
[data-theme="dark"] {
  --c-bg-main:#201C18; --c-bg-panel:#272320; --c-bg-card:#2E2A25; --c-bg-white:#2E2A25;
  --c-bg-selected:#38332D; --c-bg-inset:#1B1815;
  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072;
  --c-on-accent:#201C18;
  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C; --c-accent-soft:#9A5E48;
  --c-border:#3D3830; --c-border-light:#34302A; --c-divider:#454037; --c-dashed:#4A443B;
  --c-track:#453F37; --c-smoke:#7E7566;
  --c-overlay:rgba(0,0,0,.62); --c-msg-bg:rgba(46,42,37,.38);
  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;
  --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E;
  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72; --c-danger-border:#5A302A;
  --c-info:#5FA0CC; --c-info-bg:#1E2A33;
  --c-rose:#D683A6; --c-rose-text:#E7A3C0;
  --c-plan:#9385D8; --c-plan-light:#2A2540; --c-plan-text:#B0A4E6;
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-island:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.45);
  --shadow-modal:0 28px 70px rgba(0,0,0,.65);
  --shadow-peek:0 2px 8px rgba(0,0,0,.50),0 24px 56px rgba(0,0,0,.68);
  --shadow-button:0 4px 16px rgba(227,138,106,.34);
  --shadow-thumb:0 1px 3px rgba(0,0,0,.45);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(227,138,106,.11),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.08),transparent 60%);
}

/* ===== 2. Компоненты ===== */
*{box-sizing:border-box}
body{margin:0;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--c-bg-inset);color:var(--c-text-primary)}
button,input,textarea{font-family:inherit}
svg.i{display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.serif{font-family:'PT Serif',Georgia,serif}
.muted{font-size:12px;color:var(--c-text-muted);line-height:1.45}

/* Пульт (не продукт) */
.pult{position:sticky;top:0;z-index:2000;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--c-bg-panel);border-bottom:1px solid var(--c-border);font-size:12px;color:var(--c-text-secondary)}
.pult b{font-weight:600;color:var(--c-text-heading);margin-right:4px}
.pult .grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pill{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--c-bg-selected);flex-wrap:wrap}
.pill button{border:none;cursor:pointer;background:transparent;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--c-text-secondary)}
.pill button[aria-pressed="true"]{background:var(--c-bg-white);box-shadow:var(--shadow-thumb);color:var(--c-text-heading)}
.stage{padding:24px 16px 32px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow-x:auto}
.cap{font-size:12px;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* Рамка устройства */
.frame{position:relative;isolation:isolate;flex-shrink:0;height:820px;border-radius:14px;overflow:hidden;background:var(--c-bg-main);color:var(--c-text-primary);display:flex;flex-direction:column;box-shadow:var(--shadow-peek)}
.frame::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--canvas-glow)}
.frame.m{height:740px}

/* Button / IconButton / Badge / Notice / Segmented */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;color:inherit}
.btn:focus-visible,.ib:focus-visible,.mrow:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.btn.sm{min-height:32px;padding:7px 13px;font-size:13px;border-radius:10px}
.btn.md{min-height:44px;padding:11px 18px;font-size:15px;border-radius:12px}
.btn.primary{background:var(--c-accent);color:var(--c-on-accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--c-bg-panel);color:var(--c-text-secondary)}
.btn.ghost{background:transparent;border:1px solid var(--c-border);color:var(--c-text-secondary)}
.btn.ghostAccent{background:var(--c-accent-light);border:1px solid var(--c-accent-muted);color:var(--c-accent)}
.btn.danger{background:var(--c-danger);color:var(--c-on-dark)}
.btn.full{width:100%}
.ib{width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--c-text-muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.ib:hover{background:var(--c-bg-selected);color:var(--c-text-primary)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge.neutral{background:var(--c-bg-inset);color:var(--c-text-muted)}
.badge.mine{background:var(--c-accent-light);color:var(--c-accent)}
.badge.from{background:var(--c-info-bg);color:var(--c-info)}
.badge.success{background:var(--c-success-bg);color:var(--c-success-text)}
.notice{display:flex;align-items:flex-start;gap:8px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;border:1px solid}
.notice .tx{flex:1;min-width:0}
.notice.info{background:var(--c-info-bg);border-color:var(--c-info);color:var(--c-text-primary)}
.notice.info .ic{color:var(--c-info)}
.notice.danger{background:var(--c-danger-bg);border-color:var(--c-danger-border);color:var(--c-danger-text)}
.notice.success{background:var(--c-success-bg);border-color:var(--c-success);color:var(--c-success-text)}
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--c-bg-inset)}
.seg button{flex:1;min-height:36px;border:none;background:transparent;border-radius:9px;padding:0 10px;font-size:13px;font-weight:600;color:var(--c-text-secondary);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--c-bg-white);color:var(--c-text-heading);box-shadow:var(--shadow-thumb)}
.m .seg button{min-height:40px}

/* Аватар / глиф предмета */
.pav{border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:var(--c-on-dark);font-weight:700;line-height:1;user-select:none}
.glyph{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;font-family:'PT Serif',Georgia,serif;font-size:16px;font-weight:700;line-height:1;background:var(--c-info-bg);color:var(--c-info)}
.glyph.sm{width:22px;height:22px;border-radius:6px;font-size:11px}

/* Оболочка ребёнка (kids-tutors.html) */
.hub{flex-shrink:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px}
.hub.mob{height:56px;padding:0 8px 0 4px;border-bottom:1px solid var(--c-border)}
.logo{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 7px;border-radius:8px;background:var(--c-bg-panel)}
.logo .mark{width:26px;height:26px;border-radius:8px;background:var(--c-accent);color:var(--c-on-accent);display:grid;place-items:center}
.logo .name{font-family:'PT Serif',Georgia,serif;font-size:18px;font-weight:500;color:var(--c-text-heading)}
.hub .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.timepill{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--c-bg-inset);color:var(--c-text-secondary);font-size:13px;white-space:nowrap}
.timepill b{color:var(--c-text-heading);font-weight:600}
.mobt{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.mobt .n{font-size:15px;font-weight:600;color:var(--c-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobt .s{font-size:12px;color:var(--c-text-muted)}
.island{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--c-bg-panel);border:1px solid var(--c-border-light);border-radius:14px;box-shadow:var(--shadow-island)}
.ihead{flex-shrink:0;min-height:48px;display:flex;align-items:center;gap:8px;padding:4px 6px 4px 14px;border-bottom:1px solid var(--c-border);background:var(--c-bg-main);font-size:15px;font-weight:600;color:var(--c-text-heading)}
.ihead .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--c-bg-inset);color:var(--c-text-secondary)}
.body{flex:1;min-height:0;display:flex;gap:8px;padding:8px 16px 16px;position:relative}
.m .body{padding:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.railbtn{position:relative}
.railbtn .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--c-accent);color:var(--c-on-accent);font-size:10px;font-weight:700;display:grid;place-items:center}

/* Урок */
.chathead{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:12px 18px 10px;border-bottom:1px solid var(--c-border-light)}
.chathead h1{margin:0;font-family:'PT Serif',Georgia,serif;font-size:26px;font-weight:500;color:var(--c-text-heading)}
.m .chathead{display:none}
.feed{flex:1;min-height:0;overflow:auto;padding:20px 16px 24px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column}
.msg{margin-bottom:15px}
.msg.u{align-self:flex-end;max-width:80%}
.msg.u .bub{background:var(--c-bg-white);border:1px solid var(--c-border-light);box-shadow:var(--shadow-card);border-radius:18px 18px 4px 18px;padding:12px 17px}
.msg.a .bub{background:var(--c-msg-bg);border-radius:12px;padding:9px 12px;color:var(--c-text-heading);display:flow-root}
.bub{font-size:16px;line-height:1.55}
.bub .pav{float:left;margin:1px 9px 2px -3px}
.att{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:12px;background:var(--c-bg-card);border:1px solid var(--c-border-light);font-size:14px}
.att .th{width:36px;height:36px;border-radius:8px}
.composer{flex-shrink:0;padding:0 16px 16px}
.m .composer{padding:0 8px 8px}
.cbox{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 16px;border-radius:18px;border:1px solid var(--c-border);background:var(--c-bg-white);box-shadow:var(--shadow-card)}
.cbox .ph{flex:1;font-size:16px;color:var(--c-text-muted);padding:8px 0}

/* Экран предмета */
.subj{flex:1;min-height:0;overflow:auto;padding:24px}
.m .subj{padding:16px}
.subj .hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.subj h1{margin:0;font-family:'PT Serif',Georgia,serif;font-size:30px;font-weight:500;color:var(--c-text-heading)}
.m .subj h1{font-size:24px}
.lessons{margin-top:20px;display:flex;flex-direction:column;gap:8px;max-width:560px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-radius:12px;background:var(--c-bg-card);border:1px solid var(--c-border-light);font-size:15px;color:var(--c-text-heading)}
.lrow .p{font-size:12px;color:var(--c-text-muted)}

/* Рельса «Материалы» */
.rail{width:360px;flex-shrink:0}
.rail .rbody{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.rail .rfoot{flex-shrink:0;padding:12px;border-top:1px solid var(--c-border);background:var(--c-bg-main);display:flex;flex-direction:column;gap:8px}
.drawer{position:absolute;top:0;right:0;bottom:0;padding:8px;z-index:5;display:flex}
.drawer .rail{box-shadow:var(--shadow-peek)}
.scrim{position:absolute;inset:0;background:var(--c-overlay);z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;top:40px;z-index:5;display:flex}
.sheet .rail{width:100%;border-radius:22px 22px 0 0;border-bottom:none}
.grab{width:36px;height:4px;border-radius:999px;background:var(--c-track);margin:8px auto 0;flex-shrink:0}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mgroup{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);margin:4px 2px -4px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border-radius:12px;border:1px solid var(--c-border-light);background:var(--c-bg-card);text-align:left;cursor:pointer;color:inherit}
.mrow:hover{border-color:var(--c-border)}
.mrow[aria-current="true"]{border-color:var(--c-accent);box-shadow:var(--shadow-focus)}
.th{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--c-bg-inset);color:var(--c-text-secondary);font-size:10px;font-weight:700;letter-spacing:.02em}
.th.img{background:var(--c-info-bg);color:var(--c-info)}
.th.note{background:var(--c-warning-bg);color:var(--c-warning-text)}
.th.office{background:var(--c-plan-light);color:var(--c-plan-text);font-family:'PT Serif',Georgia,serif;font-size:18px}
.mrow .mn{font-size:15px;font-weight:600;color:var(--c-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mm{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--c-text-muted);flex-wrap:wrap}
.up .meter{height:6px;border-radius:999px;background:var(--c-track);overflow:hidden;margin-top:6px}
.up .meter i{display:block;height:100%;border-radius:999px;background:var(--c-accent)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 12px;border:1.5px dashed var(--c-dashed);border-radius:16px}
.empty .eg{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--c-accent-light);color:var(--c-accent)}
.empty .et{font-family:'PT Serif',Georgia,serif;font-size:20px;color:var(--c-text-heading)}
.empty .ed{font-size:15px;line-height:1.5;color:var(--c-text-secondary)}
/* Просмотр */
.vhead{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.vhead .vn{font-size:15px;font-weight:600;color:var(--c-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--c-text-muted)}
.pic{border-radius:12px;background:var(--c-bg-inset);border:1px solid var(--c-border-light);display:grid;place-items:center;color:var(--c-text-muted);aspect-ratio:3/4}
.page{background:var(--c-bg-white);border:1px solid var(--c-border-light);box-shadow:var(--shadow-card);border-radius:6px;padding:20px 18px;font-size:14px;line-height:1.6;color:var(--c-text-primary);font-family:'PT Serif',Georgia,serif;min-height:360px}
.page h4{margin:0 0 10px;font-size:17px;color:var(--c-text-heading)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--c-text-secondary)}
.txt{font-size:16px;line-height:1.6;color:var(--c-text-primary);white-space:pre-wrap;padding:14px;border-radius:12px;background:var(--c-bg-white);border:1px solid var(--c-border-light)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--c-bg-white);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--c-border-light);text-align:left}
.tbl th{font-size:12px;color:var(--c-text-secondary);background:var(--c-bg-panel)}
.slide{padding:12px 14px;border-radius:12px;background:var(--c-bg-white);border:1px solid var(--c-border-light);font-size:15px;line-height:1.5}
.slide .sn{font-size:11px;font-weight:700;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.ro{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--c-text-secondary);padding:8px 10px;border-radius:10px;background:var(--c-bg-inset)}
/* Редактор заметки */
.ttl{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-bg-white);font-size:18px;font-family:'PT Serif',Georgia,serif;color:var(--c-text-heading)}
.ed{width:100%;flex:1;min-height:300px;padding:14px;border-radius:12px;border:1px solid var(--c-accent);box-shadow:var(--shadow-focus);background:var(--c-bg-white);font-size:16px;line-height:1.6;color:var(--c-text-primary);resize:none}
.saved{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--c-success-text)}
/* Диалог */
.dlgwrap{position:absolute;inset:0;background:var(--c-overlay);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.m .dlgwrap{padding:24px 0 0;align-items:flex-end}
.dlg{width:400px;background:var(--c-bg-card);border-radius:20px;box-shadow:var(--shadow-modal);padding:24px;display:flex;flex-direction:column;gap:12px}
.m .dlg{width:100%;border-radius:22px 22px 0 0;padding:16px 16px 20px}
.dlg h3{margin:0;font-family:'PT Serif',Georgia,serif;font-size:22px;font-weight:500;color:var(--c-text-heading)}
.dlg p{margin:0;font-size:15px;line-height:1.5;color:var(--c-text-secondary)}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.m .dlg .df{flex-direction:column-reverse}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--c-text-heading);color:var(--c-bg-main);font-size:14px;font-weight:600;box-shadow:var(--shadow-island);white-space:nowrap}

/* Записка под рамкой */
.notes{max-width:1280px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:13px;line-height:1.5}
.notes .nb{padding:16px;border-radius:14px;background:var(--c-bg-card);border:1px solid var(--c-border-light)}
.notes h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--c-text-secondary)}
.notes ul{margin:0;padding-left:18px}
@media (max-width:900px){.notes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pult" id="pult"></div>
<div class="stage" id="stage"></div>
<script>
/* ===== Иконки (lucide, stroke 2) ===== */
const P = {
  book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>', x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  note:'<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  play:'<path d="m6 3 14 9-14 9z"/>',
};
const ic = (n, s = 16) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24">${P[n]}</svg>`;

/* ===== Данные: предмет, репетитор, материалы (свои и от админа) ===== */
const KID = 'Маша', ADMIN = 'Андрей';
const SUBJ = { label:'Математика', glyph:'2+2' };
const TUT = { name:'Сова Ульяна', bg:'--group-blue', ini:'СУ' };
// t: image | pdf | text | note | docx | xlsx | pptx; mine — UploadedBy == ребёнок
const MAT = [
  { id:'n1', n:'Что я не поняла', t:'note', mine:true, date:'сегодня, 16:40', size:'' },
  { id:'k1', n:'Домашка 19 ноября', ext:'.jpg', t:'image', mine:true, date:'сегодня, 16:32', size:'2,1 МБ' },
  { id:'k2', n:'Доклад про скорость', ext:'.pptx', t:'pptx', mine:true, date:'вчера', size:'3,4 МБ' },
  { id:'k3', n:'Сочинение, черновик', ext:'.docx', t:'docx', mine:true, date:'17 нояб.', size:'24 КБ' },
  { id:'m2', n:'Таблица умножения', ext:'.pdf', t:'pdf', mine:false, date:'14 нояб.', size:'84 КБ' },
  { id:'m3', n:'Меры длины', ext:'.xlsx', t:'xlsx', mine:false, date:'14 нояб.', size:'12 КБ' },
  { id:'m4', n:'Правила задач на движение', ext:'.txt', t:'text', mine:false, date:'12 нояб.', size:'2 КБ' },
];
const TYPE = { image:['Фото','img','image'], pdf:['PDF','','file'], text:['Текст','','file'], note:['Заметка','note','note'],
  docx:['Word','office','W'], xlsx:['Excel','office','X'], pptx:['PowerPoint','office','P'] };

/* ===== Состояние макета ===== */
const S = { scr:'lesson', st:'list', w:'desk', t:'light', f:'all' };
location.hash.slice(1).split('&').forEach((kv) => { const [k, v] = kv.split('='); if (k && v && k in S) S[k] = decodeURIComponent(v); });
const ST = [['empty','Пусто'],['list','Список'],['upload','Загрузка'],['error','Ошибка загрузки'],['view-image','Фото'],['view-pdf','PDF'],['view-text','Текст'],
  ['view-docx','Word'],['view-xlsx','Excel'],['view-pptx','PowerPoint'],['note','Редактор заметки'],['del','Удаление'],['sent','Отправлено в урок']];
const PULT = [
  ['scr','Экран',[['subject','Экран предмета'],['lesson','Урок']]],
  ['st','Рельса',ST],
  ['f','Фильтр',[['all','Все'],['admin','От взрослых'],['mine','Мои']]],
  ['w','Ширина',[['desk','1280'],['tab','768'],['mob','360']]],
  ['t','Тема',[['light','Светлая'],['dark','Тёмная']]],
];
function renderPult() {
  document.getElementById('pult').innerHTML = PULT.map(([k, title, opts]) => `<div class="grp"><b>${title}</b><div class="pill">${opts.map(([v, l]) =>
    `<button aria-pressed="${S[k] === v}" onclick="set('${k}','${v}')">${l}</button>`).join('')}</div></div>`).join('');
}
function set(k, v) { S[k] = v; location.hash = Object.entries(S).map(([a, b]) => `${a}=${b}`).join('&'); render(); }

const M = () => S.w === 'mob';
const tut = (s = 28) => `<span class="pav" style="width:${s}px;height:${s}px;background:var(${TUT.bg});font-size:${Math.round(s * .36)}px">${TUT.ini}</span>`;
const glyph = (sm) => `<span class="glyph${sm ? ' sm' : ''}">${SUBJ.glyph}</span>`;
const thumb = (m) => { const [, cls, g] = TYPE[m.t]; return `<span class="th ${cls}">${g.length === 1 ? g : ic(g, 20)}</span>`; };
const who = (m) => (m.mine ? '<span class="badge mine">моё</span>' : `<span class="badge from"><span class="pav" style="width:14px;height:14px;background:var(--group-orange);font-size:8px">${ADMIN[0]}</span>${ADMIN}</span>`);

/* ===== Рельса: список ===== */
function addRow() {
  return M()
    ? `<div class="addrow"><button class="btn md ghostAccent">${ic('camera', 18)}Фото</button><button class="btn md ghost">${ic('upload', 18)}Файл</button></div><button class="btn md ghost full">${ic('note', 18)}Новая заметка</button>`
    : `<div class="addrow"><button class="btn md ghostAccent">${ic('upload', 18)}Загрузить</button><button class="btn md ghost">${ic('note', 18)}Заметка</button></div>
       <span class="muted" style="text-align:center">Или перетащи файл сюда · фото, PDF, Word, Excel, PowerPoint, текст</span>`;
}
function listBody() {
  if (S.st === 'empty') return `<div class="empty"><span class="eg">${ic('folder', 30)}</span><div class="et">Здесь будут материалы</div>
      <div class="ed">${ADMIN} пока ничего не положил в «${SUBJ.label}». Добавь своё: сфотографируй домашку или запиши, что непонятно.</div></div>${addRow()}`;
  const items = MAT.filter((m) => S.f === 'all' || (S.f === 'mine') === m.mine);
  const row = (m) => `<button class="mrow" ${S.st === 'del' && m.id === 'n1' ? 'aria-current="true"' : ''}>${thumb(m)}<div style="flex:1;min-width:0"><div class="mn">${m.n}</div>
      <div class="mm">${who(m)}<span>${TYPE[m.t][0]}${m.size ? ' · ' + m.size : ''} · ${m.date}</span></div></div>${ic('right', 18)}</button>`;
  const up = S.st === 'upload' ? `<div class="mrow up" style="cursor:default">${thumb({ t:'image' })}<div style="flex:1;min-width:0"><div class="mn">Домашка, страница 2</div><div class="mm">Загружается · 1,4 из 2,3 МБ</div><div class="meter"><i style="width:60%"></i></div></div><button class="ib" aria-label="Отменить загрузку">${ic('x', 18)}</button></div>` : '';
  const err = S.st === 'error' ? `<div class="notice danger">${ic('alert', 18)}<div class="tx"><b>«Игра.exe» тут не откроется.</b> Можно фото, PDF, Word, Excel, PowerPoint или текст.</div><button class="ib" aria-label="Закрыть">${ic('x', 16)}</button></div>` : '';
  const mine = items.filter((m) => m.mine), from = items.filter((m) => !m.mine);
  return `${addRow()}${err}
    <div class="seg" role="group" aria-label="Чьи материалы">${[['all','Все'],['admin','От взрослых'],['mine','Мои']].map(([k, l]) => `<button aria-pressed="${S.f === k}">${l}</button>`).join('')}</div>
    ${up}
    ${mine.length ? `<div class="mgroup">Мои · ${mine.length}</div><div class="mlist">${mine.map(row).join('')}</div>` : ''}
    ${from.length ? `<div class="mgroup">От взрослых · ${from.length}</div><div class="mlist">${from.map(row).join('')}</div>` : ''}
    <span class="muted">${TUT.name} видит твоё, только когда ты сама отправишь это в урок.</span>`;
}

/* ===== Рельса: просмотр ===== */
const VIEW = { 'view-image':'k1', 'view-pdf':'m2', 'view-text':'m4', 'view-docx':'k3', 'view-xlsx':'m3', 'view-pptx':'k2' };
function viewBody(m) {
  const office = ['docx', 'xlsx', 'pptx'].includes(m.t);
  const meta = `<div class="vmeta">${who(m)}<span>${TYPE[m.t][0]}${m.size ? ' · ' + m.size : ''} · ${m.date}</span></div>`;
  const officeNote = office ? `<div class="notice info"><span class="ic">${ic('info', 18)}</span><div class="tx">Это файл ${TYPE[m.t][0]} — тут показываем только текст. Картинки и оформление — в оригинале.</div></div>` : '';
  let content = '';
  if (m.t === 'image') content = `<div class="pic">${ic('image', 48)}</div><span class="muted" style="text-align:center">Двумя пальцами — увеличить</span>`;
  if (m.t === 'pdf') content = `<div class="page"><h4>Таблица умножения</h4>2 × 1 = 2 &nbsp; 3 × 1 = 3 &nbsp; 4 × 1 = 4<br>2 × 2 = 4 &nbsp; 3 × 2 = 6 &nbsp; 4 × 2 = 8<br>2 × 3 = 6 &nbsp; 3 × 3 = 9 &nbsp; 4 × 3 = 12<br>2 × 4 = 8 &nbsp; 3 × 4 = 12 &nbsp; 4 × 4 = 16<br>…</div>
      <div class="pager"><button class="ib" aria-label="Предыдущая страница" disabled style="opacity:.35">${ic('left', 18)}</button>Страница 1 из 2<button class="ib" aria-label="Следующая страница">${ic('right', 18)}</button></div>`;
  if (m.t === 'text') content = `<div class="txt">Задачи на движение — три правила.

1. Скорость — сколько километров за один час.
2. Чтобы найти расстояние, скорость умножаем на время.
3. Если идут навстречу, скорости складываем.</div>`;
  if (m.t === 'docx') content = `<div class="txt">Как я провела каникулы

Летом мы с папой ездили на море. Мы шли пешком до маяка три часа, и папа сказал, что наша скорость была четыре километра в час…</div>`;
  if (m.t === 'xlsx') content = `<div class="muted">Лист «Меры» · первые 50 строк</div><table class="tbl"><tr><th>Мера</th><th>Сколько</th></tr><tr><td>1 км</td><td>1000 м</td></tr><tr><td>1 м</td><td>100 см</td></tr><tr><td>1 см</td><td>10 мм</td></tr><tr><td>1 дм</td><td>10 см</td></tr></table>`;
  if (m.t === 'pptx') content = ['Скорость — это быстрота движения', 'Как измерить скорость: километры в час', 'Кто быстрее: улитка, велосипед, самолёт'].map((x, i) => `<div class="slide"><div class="sn">Слайд ${i + 1}</div>${x}</div>`).join('');
  return `${meta}${officeNote}${content}${m.mine ? '' : `<div class="ro">${ic('lock', 16)}Это прислал ${ADMIN} — можно читать и отправить в урок, но не менять</div>`}`;
}
function viewFoot(m) {
  const office = ['docx', 'xlsx', 'pptx'].includes(m.t);
  const send = S.scr === 'lesson' ? `<button class="btn md primary full">${ic('send', 18)}Отправить в урок</button>` : `<button class="btn md primary full">${ic('send', 18)}Разобрать на уроке</button>`;
  return `${send}<div style="display:flex;gap:8px">${office || m.t === 'pdf' ? `<button class="btn md ghost" style="flex:1">${ic('download', 18)}Скачать оригинал</button>` : '<span style="flex:1"></span>'}
    ${m.mine ? `<button class="ib" aria-label="Ещё: переименовать, удалить">${ic('more', 20)}</button>` : ''}</div>`;
}

/* ===== Рельса: редактор заметки ===== */
function noteBody() {
  return `<input class="ttl" value="Что я не поняла" aria-label="Название заметки">
    <textarea class="ed" aria-label="Текст заметки">Почему, когда идут навстречу, скорости складывают?

Пример: Петя 4 км/ч, Вася 5 км/ч. Вместе 9?</textarea>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="saved">${ic('check', 16)}Сохранено</span><span class="muted">Только твоё — пока не отправишь</span></div>`;
}
function noteFoot() {
  return `<button class="btn md primary full">${ic('send', 18)}Отправить в урок</button>
    <div style="display:flex;gap:8px"><button class="btn md ghost" style="flex:1">Готово</button><button class="ib" aria-label="Удалить заметку">${ic('trash', 20)}</button></div>`;
}

/* ===== Сборка рельсы ===== */
function rail() {
  const vid = VIEW[S.st];
  const m = vid && MAT.find((x) => x.id === vid);
  const close = S.w === 'desk' ? '' : `<button class="ib" aria-label="Закрыть материалы">${ic('x', 20)}</button>`;
  let head, body, foot = '';
  if (m) {
    head = `<div class="vhead"><button class="ib" aria-label="К материалам">${ic('left', 20)}</button><span class="vn">${m.n}${m.ext || ''}</span></div>${close}`;
    body = viewBody(m); foot = viewFoot(m);
  } else if (S.st === 'note') {
    head = `<div class="vhead"><button class="ib" aria-label="К материалам">${ic('left', 20)}</button><span class="vn">Заметка</span></div>${close}`;
    body = noteBody(); foot = noteFoot();
  } else {
    head = `${ic('folder', 18)}Материалы <span class="cnt">${S.st === 'empty' ? 0 : MAT.length}</span><span style="flex:1"></span>${close}`;
    body = listBody();
  }
  return `<div class="island rail" role="complementary" aria-label="Материалы">${M() ? '<div class="grab"></div>' : ''}<div class="ihead">${head}</div>
    <div class="rbody">${body}</div>${foot ? `<div class="rfoot">${foot}</div>` : ''}</div>`;
}
function delDialog() {
  if (S.st !== 'del') return '';
  return `<div class="dlgwrap"><div class="dlg" role="alertdialog" aria-labelledby="dlt">${M() ? '<div class="grab" style="margin:0 auto 4px"></div>' : ''}<h3 id="dlt">Удалить «Что я не поняла»?</h3>
    <p>Заметка пропадёт насовсем, вернуть её не получится. В уроке, куда ты её уже отправляла, она останется.</p>
    <div class="df"><button class="btn md ghost">Оставить</button><button class="btn md danger">${ic('trash', 18)}Удалить</button></div></div></div>`;
}

/* ===== Экраны ===== */
function hub(mobTitle) {
  const cnt = S.st === 'empty' ? '' : `<span class="dot">${MAT.length}</span>`;
  const railBtn = S.w === 'desk' ? '' : `<button class="ib railbtn" aria-label="Материалы" aria-expanded="true" style="background:var(--c-accent-light);color:var(--c-accent)">${ic('folder', 20)}${cnt}</button>`;
  if (M()) return `<div class="hub mob"><button class="ib" aria-label="К предметам">${ic('left', 20)}</button>${mobTitle}<div class="right"><span class="timepill"><b>35</b> мин</span>${railBtn}</div></div>`;
  return `<div class="hub"><span class="logo"><span class="mark">${ic('book', 14)}</span><span class="name">Уроки</span></span>
    <div class="right"><span class="timepill">Ещё <b>35 мин</b></span>${railBtn}<span class="pav" style="width:28px;height:28px;background:var(--group-indigo);font-size:11px">М</span></div></div>`;
}
function lessonMain() {
  const sent = S.st === 'sent';
  const msgs = [['a', `Привет, ${KID}! Я ${TUT.name}. Что сегодня разберём?`]];
  if (sent) msgs.push(['u', `<div class="att">${thumb({ t:'image' })}<div style="min-width:0"><div style="font-weight:600;color:var(--c-text-heading)">Домашка 19 ноября.jpg</div><div class="muted">из Материалов</div></div></div>Давай разберём`],
    ['a', 'Давай! Вижу задачу 3: два пешехода идут навстречу. Как думаешь, они сближаются быстрее или медленнее, чем каждый по отдельности?']);
  return `<div class="main"><div class="chathead">${tut(48)}<div><h1>${TUT.name}</h1><div style="display:flex;gap:6px;margin-top:4px"><span class="badge neutral" style="gap:6px">${glyph(true)}${SUBJ.label}</span></div></div></div>
    <div class="feed"><div class="col">${msgs.map(([r, x]) => `<div class="msg ${r}"><div class="bub">${r === 'a' ? tut(28) : ''}${x}</div></div>`).join('')}</div></div>
    <div class="composer"><div class="cbox"><span class="ph">Напиши ответ…</span><button class="ib" aria-label="Голосом">${ic('mic', 18)}</button><button class="btn md primary" aria-label="Отправить" style="width:44px;padding:0">${ic('send', 16)}</button></div></div></div>`;
}
function subjectMain() {
  return `<div class="main"><div class="subj"><div class="hero">${glyph()}<div style="flex:1;min-width:200px"><h1>${SUBJ.label}</h1><div style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:14px;color:var(--c-text-secondary)">${tut(24)}${TUT.name}</div></div>
      <button class="btn md primary${M() ? ' full' : ''}">Новый урок</button></div>
    <div class="lessons"><div class="mgroup">Мои уроки</div>
      ${[['Задача про пешеходов', 'вчера'], ['Таблица умножения на 4', '17 нояб.']].map(([t, d]) => `<div class="lrow"><div style="flex:1"><div>${t}</div><div class="p">${d}</div></div>${ic('right', 18)}</div>`).join('')}</div></div></div>`;
}
function screen() {
  const mobTitle = S.scr === 'lesson'
    ? `<div class="mobt">${tut(28)}<div style="min-width:0"><div class="n">${TUT.name}</div><div class="s">${SUBJ.label}</div></div></div>`
    : `<div class="mobt">${glyph(true)}<div class="n">${SUBJ.label}</div></div>`;
  const main = S.scr === 'lesson' ? lessonMain() : subjectMain();
  const toast = S.st === 'sent' ? `<div class="toast">${ic('check', 16)}Отправлено — ${TUT.name} уже смотрит</div>` : '';
  // 1280 — рельса островом справа; 768 — выдвижная панель поверх; 360 — шторка снизу
  const r = S.w === 'desk' ? rail() : S.w === 'tab' ? `<div class="scrim"></div><div class="drawer">${rail()}</div>` : `<div class="scrim"></div><div class="sheet">${rail()}</div>`;
  return `${hub(mobTitle)}<div class="body">${main}${r}</div>${toast}${delDialog()}`;
}

/* ===== Записка под рамкой ===== */
function notesBlock() {
  return `<div class="notes">
    <div class="nb"><h4>Где живёт рельса</h4><ul><li>1280 — остров справа, 360 px, рядом с уроком и экраном предмета</li><li>768 — кнопка «Материалы» в шапке, панель выезжает справа поверх</li><li>360 — та же кнопка со счётчиком, шторка снизу на весь экран</li></ul></div>
    <div class="nb"><h4>Чьё что</h4><ul><li>У каждого файла бейдж: «моё» или имя взрослого, фильтр «Все / От взрослых / Мои»</li><li>Материал взрослого — только читать: нет «⋯», замок и строка «можно читать и отправить в урок»</li><li>Своё Маша переименовывает и удаляет через «⋯»</li></ul></div>
    <div class="nb"><h4>Что видит репетитор</h4><ul><li>Свои файлы Маши — только после «Отправить в урок»</li><li>Отправка — обычное вложение со словами «Давай разберём»</li><li>Совместной правки с репетитором нет — следующая волна</li></ul></div></div>`;
}

function render() {
  document.documentElement.setAttribute('data-theme', S.t);
  renderPult();
  const W = { desk:1280, tab:768, mob:360 }[S.w];
  document.getElementById('stage').innerHTML = `<div class="cap">${S.scr === 'lesson' ? 'Урок' : 'Экран предмета'} · рельса «Материалы» · ${W}</div>
    <div class="frame${M() ? ' m' : ''}" data-theme="${S.t}" style="width:${W}px" data-frame="rail">${screen()}</div>${notesBlock()}`;
}
render();
</script>
</body>
</html>
