# Пределы памяти на ccs-agents.slice — жёсткий потолок ядра, без дросселя.
#
# MemoryMax — единственный лимит. При его достижении ядро убивает самый большой
# процесс ВНУТРИ scope (обычно testhost или узел MSBuild): сборка в ходе агента
# падает с понятной ошибкой, сам ход и остальные scope живут.
#
# MemoryHigh здесь НЕ ставим — намеренно. Разбор 2026-09-22: дроссель MemoryHigh
# гонит процессы scope в reclaim и swap, стойло в reclaim считается PSI-давлением
# и суммируется вверх по иерархии до user@1000.service, где systemd-oomd (дефолт
# Ubuntu — kill при 50 %) выбирает жертвой самый «давящий» потомок, то есть наш
# scope. Счётчик memory.events high на slice за три дня — 1 901 740; после
# установки MemoryHigh 21.09 oomd убил ещё четыре scope за вечер. Дроссель был
# не подушкой, а источником сигнала для убийцы.
#
# MemorySwapMax=0 — память агентов в подкачку не уходит: swap-out testhost на 4 GB
# (пики scope 21.09) даёт ту же PSI-историю медленнее. Лучше быстрый OOM одного
# процесса, чем минуты рефолтов.
#
# Значение MemoryMax МАШИННО-СПЕЦИФИЧНО — правило расчёта в deploy/systemd/README.md.
# Для этой машины (60 GB; соседи qemu ~16 GB, vLLM ~11 GB, транскрипция и
# эмбеддинги ~3 GB, рабочий стол ~5 GB, бэкенд ~2 GB) остаток ~24 GB, потолок
# берём с запасом на рост соседей.
[Slice]
MemoryMax=18G
MemorySwapMax=0
