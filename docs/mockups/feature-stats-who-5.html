<!--
  Макеты на выбор Андрею: блок «Кто на чём работает» (сейчас — «Кто и на чём работал», Breakdown в
  FeatureStatsBlocks.tsx). Записка и спецификация — feature-stats-who-5.md. Код продукта не правится.
  Привязка: featureId 8d33d18b-c6f6-4311-8ddb-e5a627f38fb2, задача aae59264 (role=design, stepRef нет).
  Данные выдуманы, но только из полей, которые бэк уже отдаёт: run.stages[].executors (personaId, taskRole,
  stepRef, lane, status, chatId, modelLabel, reviewOf), run.now, run.attention, run.stepChains, задачи фичи
  (claudeStartedAt, completedAt, createdAt, awaitingHumanSince/Reason, executorStoppedAt/Reason),
  stats.breakdown.personas (minutes, tokens, costUsd), stats.timeline.segments (kind + taskId).
  Пометка .be «нужны данные» — поля нет в ответе API.
  A — «Доска»: колонки по состоянию (работают · ждут вас · ждут ревью · в очереди · свободны).
  B — «Команда»: строка на человека: сейчас · дальше · сделано · время и расход.
  C — «Загрузка»: люди на оси времени — когда кто был занят, где простой, что в очереди после «сейчас».
-->

    <button data-v="A" class="on">A · Доска</button><button data-v="B">B · Команда</button><button data-v="C">C · Загрузка</button></div></div>

<script>
// Минуты — от старта фичи (09:20). Всё ниже — поля run/stats, см. шапку файла.
const START = 9 * 60 + 20;
const fmt = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + ' мин'; if (!r) return h + ' ч'; return h + ' ч ' + String(r).padStart(2, '0') + ' мин'; };
const clock = m => { const t = START + Math.round(m); return String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const BE = t => ` <span class="be">нужны данные${t ? ': ' + t : ''}</span>`;
const P = {
  sofya: { n: 'Софья', r: 'координатор', c: 'var(--p-orange)' }, egor: { n: 'Егор', r: 'планировщик', c: 'var(--p-brown)' },
  timur: { n: 'Тимур', r: 'бэкенд', c: 'var(--p-blue)' }, denis: { n: 'Денис', r: 'бэкенд · локальная', c: 'var(--p-blue)' },
  polina: { n: 'Полина', r: 'фронтенд', c: 'var(--p-purple)' }, kira: { n: 'Кира', r: 'фронтенд · локальная', c: 'var(--p-purple)' },
  gleb: { n: 'Глеб', r: 'ревью', c: 'var(--p-green)' }, vera: { n: 'Вера', r: 'проверка', c: 'var(--p-green)' }, alex: { n: 'Александр', r: 'финал', c: 'var(--p-brown)' },
};
const av = (k, lg) => `<span class="av${lg ? ' lg' : ''}" style="background:${P[k].c}">${P[k].n[0]}</span>`;
const CAT = {
  run: { t: 'Работают', chip: 't-run', w: 'идёт' }, wait: { t: 'Ждут вас', chip: 't-wait', w: 'ждёт вас' },
  stop: { t: 'Встали', chip: 't-stop', w: 'встал' }, review: { t: 'Ждут ревью', chip: 't-rev', w: 'ждёт ревью' },
  queue: { t: 'В очереди', chip: 't-q', w: 'в очереди' }, free: { t: 'Свободны', chip: 't-free', w: 'свободен' }, done: { t: 'Сделали', chip: 't-ok', w: 'готово' },
};
// Задачи фичи: кто (personaId), что (stepRef + title из stepChains/задачи), роль, линия, модель (executor.modelLabel),
// интервалы работы (claudeStartedAt → completedAt), ожидания (segments kind=waiting с taskId), статус исполнителя.
const T_RUN = [
  { who: 'sofya', ref: 'Разрез', title: 'Разрез фичи', role: 'разрез', model: 'Haiku 5.5', a: 0, b: 18, st: 'done' },

// Категория исполнителя «сейчас» — по его самой актуальной задаче.
// run/wait/stop — executor.status; review — шаг done, задача ревью по reviewOf не стартовала (или её нет);
// queue — executor.status=pending; free — все задачи done; done — у закрытой фичи.
function people(D) {
  const by = {};
  for (const t of D.tasks) (by[t.who] = by[t.who] || []).push(t);
  const out = [];
  for (const [who, ts] of Object.entries(by)) {
    let cat, cur;
    if (D.key === 'merged') { cat = 'done'; }
    else if ((cur = ts.find(t => t.st === 'wait'))) cat = 'wait';
    else if ((cur = ts.find(t => t.st === 'run'))) cat = 'run';
    else if ((cur = ts.find(t => t.st === 'queue'))) cat = 'queue';
    else cat = 'free';
    const last = ts.filter(t => t.b != null).reduce((m, t) => Math.max(m, t.b), -1);
    out.push({ who, ts, cat, cur, last, next: ts.filter(t => t.st === 'queue' && t !== cur) });
  }
  return out;
}
// «Ждут ревью» — это шаги, а не люди: шаг сдан, ревью ещё не взято.
const reviewWaits = D => D.tasks.filter(t => t.needReview && D.key !== 'merged');
function sinceTxt(D, p) {
  const c = p.cur;
  if (p.cat === 'wait') return fmt(D.now - c.since);
  if (p.cat === 'run') return fmt(D.now - c.a);
  if (p.cat === 'queue') return fmt(D.now - (c.created || 0));
  if (p.cat === 'free') return fmt(D.now - p.last);
  return '';
}
function head(D) {

  }).join('');
  return title(D, ps) + summary(D, ps) + `<div class="a-cols">${html}</div>`;

// ===== C · Загрузка =====
function renderC(D, m) {
  const ps = people(D);
  if (D.key === 'empty') return title(D, ps) + emptyBlock(D, m);
  const merged = D.key === 'merged';
  const T = merged ? D.now : D.now + 90; // справа от «сейчас» — очередь (горизонт 1,5 ч, без прогноза длительности)
  const x = v => v / T * 100;
  const order = ['sofya', 'egor', 'timur', 'denis', 'polina', 'kira', 'gleb', 'vera', 'alex'];
  ps.sort((a, b) => order.indexOf(a.who) - order.indexOf(b.who));
  const ticks = []; for (let h = Math.ceil(START / 60) * 60; h <= START + T - 30; h += 60) if (merged || Math.abs(h - START - D.now) > 25) ticks.push(h - START);
  const rows = ps.map(p => {
    let bars = '';
    const busy = [];
    for (const t of p.ts) {
      if (t.st === 'queue' && !merged) {
        bars += `<span class="c-b q" style="left:${x(D.now + 2)}%;width:${x(80)}%" title="в очереди с ${clock(t.created)}">${t.ref} · ждёт ${t.after}</span>`; continue;
      }
      if (t.a == null) continue;
      const b = t.b == null ? D.now : t.b; busy.push([t.a, b]);
      const cls = t.rev ? 'rev' : 'work';
      bars += `<span class="c-b ${cls}" style="left:${x(t.a)}%;width:${x(b - t.a)}%" title="${t.ref} · ${t.title} · ${clock(t.a)}–${t.b == null ? 'идёт' : clock(t.b)}">${x(b - t.a) > 5 ? t.ref : ''}</span>`;
      for (const [w, d] of (t.waits || [])) bars += `<span class="c-b wait" style="left:${x(w)}%;width:${x(d)}%" title="ждали вас ${d} мин"></span>`;
      for (const [w, d] of (t.err || [])) bars += `<span class="c-b err" style="left:${x(w)}%;width:${x(d)}%" title="ошибка ${d} мин"></span>`;
      if (t.st === 'wait') bars += `<span class="c-b wait live" style="left:${x(t.since)}%;width:${x(D.now - t.since)}%" title="ждёт вас">✋</span>`;
    }
    // Простой между задачами человека внутри фичи (подпись, если промежуток заметный).
    busy.sort((a, b) => a[0] - b[0]);
    for (let i = 1; i < busy.length; i++) { const g0 = busy[i - 1][1], g1 = busy[i][0]; if (g1 - g0 >= 40) bars += `<span class="c-gap" style="left:${x(g0)}%;width:${x(g1 - g0)}%">простой ${fmt(g1 - g0)}</span>`; }
    if (!merged && p.cat === 'free' && D.now - p.last >= 40) bars += `<span class="c-gap" style="left:${x(p.last)}%;width:${x(D.now - p.last)}%">свободен ${fmt(D.now - p.last)}</span>`;
    const span = busy.length ? [Math.min(...busy.map(b => b[0])), Math.max(...busy.map(b => b[1]))] : null;
    const base = span ? `<span class="base" style="left:${x(span[0])}%;width:${x(span[1] - span[0])}%"></span>` : '';
    const nowl = merged ? '' : `<span class="c-now" style="left:${x(D.now)}%"></span>`;
    const [mins, cost] = (D.money || MONEY)[p.who];
    const st = merged ? '' : `<span class="chip ${CAT[p.cat].chip}" style="height:18px;font-size:10px">${CAT[p.cat].w}</span>`;
    return `<div class="c-row"><div class="nm">${av(p.who)}<div style="min-width:0">${P[p.who].n} ${st}<small>${P[p.who].r}</small></div></div>
      <div class="c-tk">${base}${bars}${nowl}</div><div class="vl">${mins ? fmt(mins) : '—'}<small>${cost || ''}</small></div></div>`;
  }).join('');
  const active = merged ? D.now : D.now;
  const util = merged
    ? `<div class="c-util"><div class="k"><b>9</b><span>участников</span></div><div class="k"><b>2,4</b><span>в среднем работали одновременно</span></div><div class="k"><b>${fmt(95)}</b><span>ждали вас, всего</span></div><div class="k"><b>${fmt(317)}</b><span>дольше всех ждала в очереди: Кира</span></div></div>`
    : `<div class="c-util"><div class="k"><b>${ps.filter(p => p.cat === 'run').length}</b><span>работают</span></div><div class="k"><b>${ps.filter(p => p.cat === 'wait').length}</b><span>ждут вас</span></div><div class="k"><b>${ps.filter(p => p.cat === 'queue').length}</b><span>в очереди</span></div><div class="k"><b>${ps.filter(p => p.cat === 'free').length}</b><span>свободны</span></div></div>`;
  const axis = `<div class="c-axis"><span></span><div class="ax">${ticks.map(t => `<span style="left:${x(t)}%">${clock(t)}</span>`).join('')}${merged ? '' : `<span style="left:${x(D.now)}%;color:var(--c-accent);font-weight:700">сейчас</span>`}</div><span></span></div>`;
  const legend = `<div class="c-legend"><span><i class="sw" style="background:var(--c-accent)"></i>работа</span><span><i class="sw" style="background:var(--c-plan)"></i>ревью</span><span><i class="sw" style="background:var(--c-info)"></i>ждали вас</span><span><i class="sw" style="background:var(--c-danger)"></i>ошибка</span>${merged ? '' : '<span><i class="sw" style="border:1px dashed var(--c-warning)"></i>в очереди (длина не прогноз)</span>'}<span>— линия: между первой и последней задачей</span></div>`;
  return title(D, ps) + util + `<div class="card">${axis}${rows}${legend}</div>`;
}

function mergedTeam(D, ps, m) {
  const cards = ps.sort((a, b) => (D.money || MONEY)[b.who][0] - (D.money || MONEY)[a.who][0]).map(p => {
    const done = p.ts.filter(t => t.b != null);
    return `<div class="a-card"><div class="who">${av(p.who)}${P[p.who].n}<span class="tm">${fmt((D.money || MONEY)[p.who][0])}</span></div>
      <div class="meta" style="margin-top:4px">${P[p.who].r} · ${(D.money || MONEY)[p.who][1] || 'расхода нет'}</div>
      <div class="b-list b-done" style="margin-top:6px">${done.map(t => `<i class="${t.ret ? 't-stop' : 't-ok'}">${t.ret ? '↩' : '✓'} ${t.ref}</i>`).join('')}</div></div>`;
  }).join('');
  return `<div style="display:grid;grid-template-columns:${m ? '1fr' : 'repeat(3,1fr)'};gap:8px">${cards}</div>`;
}
function emptyBlock(D, m) {
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div style="font:700 16px 'PT Serif',Georgia,serif;color:var(--c-text-heading)">Пока никто не работает</div>
    <div class="sec2" style="font-size:12px">Команда соберётся после плана: шаги получат исполнителей. Сейчас в очереди одна задача.</div>
    <div class="a-card" style="margin:0"><div class="who">${av('sofya')}${P.sofya.n}<span class="tm">в очереди ${fmt(D.now)}</span></div>
      <div class="what">${what(D.tasks[0])}</div><div class="meta">ждёт: запуск исполнителя</div>
      <div class="ft"><button class="btn gh">Запустить исполнителя</button></div></div></div>`;
}

const st = { v: 'A', s: 'running', t: 'both', w: 'both', m: 'on' };
const NOTES = {
  A: 'A · «Доска»: пять колонок по состоянию — работают · ждут вас · ждут ревью · в очереди · свободны. Ответ на «кто сейчас чем занят и кого я держу». На 360 — секции друг под другом, пустые свёрнуты в строку.',
  B: 'B · «Команда»: строка на человека — сейчас · дальше в очереди · сделано (✓/↩) · время и расход. Ждущий вас всегда первый и подсвечен. На 360 — карточка на человека.',
  C: 'C · «Загрузка»: люди на оси времени — работа, ревью, ожидание вас, ошибки, простой между задачами; справа от «сейчас» — очередь пунктиром. Видно, кто простаивал и кто был узким местом.',
};
function render() {
  document.body.classList.toggle('nomarks', st.m === 'off');
  document.getElementById('note').textContent = NOTES[st.v];
  const D = S[st.s];
  const themes = st.t === 'both' ? ['light', 'dark'] : [st.t];
  const widths = st.w === 'both' ? ['1280', '360'] : [st.w];
  const fn = { A: renderA, B: renderB, C: renderC }[st.v];
  const out = [];
  for (const w of widths) for (const t of themes)
    out.push(`<div class="w${w}"><div class="cap">${st.v} · ${w} · ${t === 'light' ? 'светлая' : 'тёмная'}</div>
      <div class="frame" data-theme="${t}"><div class="page">${head(D)}${fn(D, w === '360')}</div></div></div>`);
  document.getElementById('out').innerHTML = out.join('');
}
document.querySelectorAll('.pills').forEach(p => p.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  p.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  st[p.dataset.k] = b.dataset.v; render();
}));
const h = location.hash.slice(1).split('-');
if (h[0]) { st.v = h[0]; st.s = h[1] || st.s; st.t = h[2] || st.t; st.w = h[3] || st.w;
  document.querySelectorAll('.pills').forEach(p => p.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === st[p.dataset.k]))); }
render();
</script>
