    if (g.k === 'merge' && s === 'wait') sub = 'ждёт вашего согласия · 40 мин · очередь уступлена';
    if (g.k === 'merge' && s === 'active') sub = 'Марк сливает в master';
    const rt = s === 'done' ? `<span class="tmx">${g.t}</span>` : s === 'todo' ? '' : s === 'skip' ? 'пропущен' :
      ({active:'идёт', wait:'<b style="color:var(--c-info)">ждёт вас</b>', stop:'<b style="color:var(--c-danger-text)">стоит</b>', pause:'пауза'}[s]);
    return `<div class="stg ${s} ${cur ? 'cur' : ''}"><span class="mk2"><span class="dotx"></span></span>
      <span class="nm">${g.n} ${roleChip(g.role)}</span>
      <span class="rgt"><span class="ex avs">${g.who.map(w => av(w, 16)).join('')}</span>${rt}</span>
      ${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
  }).join('')}</div>`;
}

// Витки шага: у принятой фичи последний виток Ш3 — «принят», а не «идёт».
function toursOf(s, st) { return st === 'd' && s.c === 'Ш3' ? s.tours.slice(0, 2).concat([{w:'виток 3', r:'принят Глебом', sev:['ok','принят'], t:'22 мин'}]) : s.tours; }
function stepsList() {
  if (S.fs === 'empty' || S.fs === 'queue') return `<div class="empty" style="padding:14px 10px 6px"><h3 style="font-size:14px">Шагов пока нет</h3><p>${S.fs === 'queue' ? 'План готов: 4 шага появятся, когда фича выйдет из очереди.' : 'Появятся после разреза и плана.'}</p></div>`;
  return STEPS.map(s => {
    const o = !!S.openSteps[s.c];
    const st = (S.fs === 'merged' || S.fs === 'merge' || S.fs === 'closed' || S.fs === 'merging') ? 'd' : s.st;
    const tours = toursOf(s, st);
    return `<button class="rowb" data-act="step" data-id="${s.c}" aria-expanded="${o}">
      <span class="chv ${o ? 'o' : ''}">${ic('chevR', 12)}</span><span class="code">${s.c}</span><span class="tx">${s.n}</span>
      <span class="rx">${roleChip(s.role)}${av(s.who, 18)}${tours.length > 1 ? `<span title="витков">↺${tours.length}</span>` : ''}<span class="tst ${st}">${TST[st]}</span></span></button>
      ${o ? `<div class="tours">${tours.length ? tours.map(t => `<div class="tour"><span class="k">${t.w}</span><span>${t.r}</span><span class="sev ${t.sev[0]}">${t.sev[1]}</span></div>`).join('') : '<div class="tour"><span class="k">—</span><span>не начат</span><span></span></div>'}</div>` : ''}`;
  }).join('');
}

function chatsList(card = false) {
  if (S.fs === 'empty') return `<button class="rowb key" data-act="chat" data-id="cur">${av('sofya', 28, true)}<span class="tx">Шаблоны чатов — куратор</span><span class="rx">${roleChip('ключевой','key')}</span></button>`;
  const live = CHATS.filter(c => !c.arch), arch = CHATS.filter(c => c.arch);
  const row = c => card
    ? `<button class="chatcard" data-act="chat" data-id="${c.id}">${av(c.who, 28, true)}<span class="tx"><b>${c.n}</b><span>${PER[c.who].n} · ${c.t}</span></span>${roleChip(c.role, c.key ? 'key' : '')}</button>`
    : `<button class="rowb ${c.key ? 'key' : ''} ${c.arch ? 'arch' : ''}" data-act="chat" data-id="${c.id}">${av(c.who, 28, true)}<span class="tx">${c.n}</span><span class="rx">${roleChip(c.role, c.key ? 'key' : '')}${c.t}</span></button>`;
  return live.map(row).join('') +
    `<button class="rowb" data-act="arch" aria-expanded="${S.archOpen}"><span class="chv ${S.archOpen ? 'o' : ''}" style="width:28px;justify-content:center">${ic('chevR', 12)}</span><span class="tx" style="color:var(--c-text-secondary)">Архивные · ${arch.length}</span><span class="rx">${be('p')}</span></button>` +
    (S.archOpen ? arch.map(row).join('') : '');
}

function tasksList() {
  if (S.fs === 'empty') return `<div class="empty" style="padding:14px 10px 6px"><h3 style="font-size:14px">Задач нет</h3><p>Фича создана, но конвейер не запускался.</p></div>`;
  const all = S.fs === 'queue' ? TASKS.slice(0, 2) : TASKS.map(t => ['merge','merged','closed','merging'].includes(S.fs) ? { ...t, st:'d' } : t);
  const cnt = k => all.filter(t => t.st === k).length;
  const f = S.taskF;
  const chips = [['all','все ' + all.length]].concat(['d','r','w','t'].filter(k => cnt(k)).map(k => [k, TST[k] + ' ' + cnt(k)]));
  const shown = all.filter(t => f === 'all' || t.st === f);
  return `<div class="cnts">${chips.map(([k, t]) => `<button class="cnt ${f === k ? 'on' : ''}" data-act="taskF" data-id="${k}">${t}</button>`).join('')}</div>` +
    shown.map(t => `<button class="rowb" data-act="openTasks">${av(t.who, 18)}<span class="tx">${t.n}</span><span class="rx">${roleChip(PER[t.who].role)}<span class="tst ${t.st}">${TST[t.st]}</span></span></button>`).join('');
}

function eventsList() {
  if (S.fs === 'empty') return `<div style="font-size:12px;color:var(--c-text-secondary);padding:6px 0">Событий пока нет.</div>`;
  let ev = EVENTS.slice();
  if (S.fs === 'pause') ev.unshift({t:'16:20', who:'me', tx:'<b class="who">остановил фичу</b> · дождаться конца хода ' + be('s','журнал'), hm:1});
  if (S.fs === 'merge') ev.unshift({t:'17:10', who:'sofya', tx:'«Экспорт заметок» запущена из очереди — эта уступила ' + be('s','журнал')}, {t:'16:55', who:'alex', tx:'принял финал; мерж ждёт вашего согласия'});
  if (S.fs === 'merged') ev.unshift({t:'17:35', who:'mark', tx:'смержил в master'}, {t:'17:31', who:'me', tx:'<b class="who">согласовал мерж</b>', hm:1});
  if (S.fs === 'stop') ev.unshift({t:'16:30', who:'kira', tx:'исполнитель упал: 529 ×3 ' + be('p')});
  const shown = S.evAll ? ev : ev.slice(0, 6);
  return shown.map(e => `<div class="ev ${e.hm ? 'hm' : ''}"><span class="t">${e.t.includes(' ') ? e.t.split(' ').join('<br>') : e.t}</span>${av(e.who, 16)}<span><b class="who">${PER[e.who].n}</b> ${e.tx}</span></div>`).join('') +
    (ev.length > 6 ? `<button class="btn xs gh" data-act="evAll" style="margin-top:6px">${S.evAll ? 'Свернуть' : 'Показать все · ' + ev.length}</button>` : '');
}

function queueBox(compact = false) {
  const st = { voice:'идёт · проверка', tmpl:'', export:'ждёт' };
  if (S.fs === 'merge') { st.tmpl = '<span class="yield">уступила · ждёт мержа</span>'; st.export = 'идёт · из очереди'; }
  else if (S.fs === 'queue') st.tmpl = 'ждёт своей очереди';
  else if (S.fs === 'pause') st.tmpl = 'на паузе';
  else st.tmpl = 'идёт';
  return `<div class="q new" data-t="queue">${S.queue.map((k, i) => `<div class="qi ${k === 'tmpl' ? 'me' : ''}" draggable="true" data-q="${k}">
    <span class="grip" title="Перетащить">${ic('grip', 14)}</span><span class="n">${i + 1}</span><span class="tx">${QN[k]}${compact ? `<small>${st[k]}</small>` : ''}</span>${compact ? '' : `<span class="sub">${st[k]}</span>`}
    <button class="qbtn" data-act="qUp" data-id="${k}" ${i === 0 ? 'disabled' : ''} aria-label="Выше «${QN[k]}»">${ic('up', 13)}</button>
    <button class="qbtn" data-act="qDown" data-id="${k}" ${i === S.queue.length - 1 ? 'disabled' : ''} aria-label="Ниже «${QN[k]}»">${ic('down', 13)}</button></div>`).join('')}</div>
    <div style="font-size:11px;color:var(--c-text-muted);margin-top:6px">Одна фича работает за раз; ждущая мержа уступает очередь. ${be('s')} ${be('a')}</div>`;
}

function metricsBlock(full = true) {
  if (S.fs === 'empty') return `<div class="empty" style="padding:14px 10px 6px"><h3 style="font-size:14px">Считать пока нечего</h3><p>Метрики появятся с первым ходом исполнителя.</p></div>`;
  const m = met();
  const cuts = { role:[['фронт',0.9],['бэк',0.6],['ревью',0.3],['оркестратор',0.2],['проверка',0.1]],
    model:[['Qwen (лок.)',0.9],['Opus 5.5',0.9],['Sonnet 5.5',0.3]], who:[['Кира',0.9],['Денис',0.6],['Глеб',0.3],['Софья',0.2],['Егор',0.1]] }[S.cut];
  const max = 0.9;
  const cell = (l, v, h, cls = '') => `<div class="mc"><div class="l">${l}</div><div class="v ${cls}">${v}</div>${h ? `<div class="h">${h}</div>` : ''}</div>`;
  return `<div class="mgrid" style="margin-bottom:12px">
      ${cell('Всего', m.el, 'от создания эпика')}${cell('Чистая работа', m.work, 'без пересечений')}
      ${cell('Ждёт вас', m.wait, 'самое долгое 40 мин', 'w')}${cell('Простой', m.idle, 'никто не работает')}
      ${cell('Токенов', m.tok, '≈ 1 100 тыс. на шаг')}${cell('Ошибки', m.err, '529 ×1, сеть ×1', 'e')}${cell('Возвраты', m.ret, '1 с первого раза из 3')}
    </div>
    ${S.fs !== 'merged' && S.fs !== 'closed' ? `<div class="hot new" style="margin-bottom:12px"><span class="ic">${ic('flame', 15)}</span><div><b>Сейчас дороже всего:</b> Кира · Qwen (локально) · Ш3 виток 3 — 640 тыс. токенов за последний час, 31 % фичи. Третий виток подряд на одном шаге. ${be('s')}</div></div>` : ''}
    <div class="stl">Время по этапам ${be('s','журнал')}</div>
    <div class="band" role="img" aria-label="Время по этапам: работа, ожидание, простой">
      <span class="b-work" style="flex:35" title="Разрез 35 мин">35м</span><span class="b-idle" style="flex:40" title="Простой 40 мин"></span>
      <span class="b-work" style="flex:20" title="План 20 мин"></span><span class="b-wait" style="flex:40" title="Ждёт вас 40 мин">40м</span>
      <span class="b-work" style="flex:125" title="Производство 2 ч 05 мин">2ч05</span><span class="b-idle" style="flex:90" title="Простой 1 ч 30 мин"></span><span class="b-work" style="flex:25" title="Ревью 25 мин"></span></div>
    <div class="blg"><span><i class="b-work"></i>работа</span><span><i class="b-wait"></i>ждёт вас</span><span><i class="b-idle"></i>простой</span></div>
    ${full ? `<div class="stl" style="margin-top:16px">Токены <span class="rt"><span class="seg">${[['role','роли'],['model','модели'],['who','персоны']].map(([k, t]) => `<button class="${S.cut === k ? 'on' : ''}" data-act="cut" data-id="${k}">${t}</button>`).join('')}</span></span></div>
    <div class="bars">${cuts.map(([l, v]) => `<div class="bar"><span>${l}</span><span class="tr"><span class="fl" style="width:${v / max * 100}%"></span></span><span class="vv">${String(v).replace('.', ',')}М</span></div>`).join('')}</div>
    <div class="stl" style="margin-top:16px">Возвраты</div>
    ${[['Ш2','Глеб','major 1'],['Ш3','Глеб','major 2 · minor 3'],['Ш3','Глеб','major 1']].map(r => `<div class="tour" style="grid-template-columns:30px minmax(0,1fr) auto"><span class="code">${r[0]}</span><span>${r[1]}</span><span class="sev maj">${r[2]}</span></div>`).join('')}` : ''}`;
}

function summaryCard() {
  return `<div class="sum new" data-t="summary"><h3>Итоги фичи</h3>
    <div style="font-size:13px;color:var(--c-text-primary);margin-bottom:10px">«Шаблоны чатов» смержена за <b>2 дн 4 ч</b>: работа 9 ч 40 мин, ожидание вас 1 ч 30 мин, 4,8М токенов, 5 возвратов, 3 ошибки.
    <b>На 30 % дороже</b> типичной фичи проекта ${be('s','медиана: хранилище')}.</div>
    <div class="mgrid">${[['Работа','9 ч 40 мин'],['Ждала вас','1 ч 30 мин'],['Токенов','4,8М'],['С первого раза','1 из 4 шагов']].map(([l, v]) => `<div class="mc"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${btn(['copySum','Скопировать итог в markdown','gh','copy'], 'xs')}</div></div>`;
}

function stateBody() {
  if (S.fs === 'loading') return `<div style="display:flex;flex-direction:column;gap:10px" data-t="loading">${[70,92,84,60,88,76].map(w => `<div class="sk" style="width:${w}%"></div>`).join('')}<div class="sk" style="height:120px;margin-top:6px"></div></div>`;
  if (S.fs === 'error') return `<div class="notice dn" data-t="error">${ic('alert', 16)}<div><b>Не удалось загрузить фичу.</b>Сервер не ответил; список и чаты работают как обычно.<div style="margin-top:8px"><button class="btn xs gh" data-act="retry">${ic('rotate', 12)}Повторить</button></div></div></div>`;
  if (S.fs === 'off') return `<div class="notice in" data-t="off">${ic('plug', 16)}<div><b>Подсистема задач выключена</b>Страница фичи недоступна, чаты работают как обычно.</div></div>`;
  if (S.fs === 'gone') return `<div class="empty" data-t="gone"><span class="ci">${ic('inbox', 20)}</span><h3>Фичи больше нет</h3><p>Эпик удалён в «Задачах». Чаты остались на месте и снова живут без фичи.</p><button class="btn sm gh" data-act="close">К списку чатов</button></div>`;
  if (S.fs === 'empty') return `<div class="empty" data-t="empty"><span class="ci">${fg('empty', 20)}</span><h3>Фича ещё не начата</h3><p>В ней нет задач. Запуск отдаст разрез Александру; если сейчас идёт другая фича — предложим очередь.</p><button class="btn sm pri" data-act="startNew">${ic('play', 13)}Запустить</button></div>`;
  return null;
}

/* ============ Вариант А «Паспорт» ============ */
function variantA() {
  const sb = stateBody();
  if (sb && S.fs !== 'empty') return sb;
  const secs = [['s-pipe','Конвейер'],['s-steps','Шаги'],['s-chats','Чаты'],['s-tasks','Задачи'],['s-ev','События'],['s-met','Метрики']];
  if (['queue','merge','run','pause'].includes(S.fs)) secs.splice(1, 0, ['s-q','Очередь']);
  return `<div class="doc">
    ${metaLine()}
    <div style="margin-top:10px">${kpiStrip('toMetrics')}</div>
    ${S.fs === 'merged' ? `<div style="margin-top:14px">${summaryCard()}</div>` : ''}
    <div style="margin-top:14px">${alertBlock(S.fs)}</div>
    ${S.fs === 'empty' ? sb : ''}
    <div class="snav" style="margin-top:16px" data-t="snav">${secs.map(([id, t]) => `<button data-act="toSec" data-id="${id}" class="${S.secOn === id ? 'on' : ''}">${t}</button>`).join('')}</div>
    <section class="sec" id="s-pipe"><div class="stl">Конвейер <span class="rt">${be('p','роль: проекция')}</span></div>${pipeline()}</section>
    ${secs.find(s => s[0] === 's-q') ? `<section class="sec" id="s-q"><div class="stl">Очередь фич проекта</div>${queueBox()}</section>` : ''}
    <section class="sec" id="s-steps"><div class="stl">Шаги и витки <span class="rt">${S.fs === 'empty' || S.fs === 'queue' ? '' : '2/4 ↺6'}</span></div>${stepsList()}</section>
    <section class="sec" id="s-chats"><div class="stl">Чаты фичи · ${S.fs === 'empty' ? 1 : CHATS.length} <span class="rt">${be('p','модель на фото: проекция')}</span></div>${chatsList()}</section>
    <section class="sec" id="s-tasks"><div class="stl">Задачи</div>${tasksList()}</section>
    <section class="sec" id="s-ev"><div class="stl">События</div>${eventsList()}</section>
    <section class="sec" id="s-met"><div class="stl">Метрики</div>${metricsBlock()}</section>
  </div>`;
}

/* ============ Вариант Б «Пульт» ============ */
function controlCard() {
  const A = actionsFor(S.fs);
  const t = tagOf(S.fs);
  const m = met();
  const extra = [];
  if (['run','wait','stop'].includes(S.fs)) extra.push(['queueMe','Пропустить вперёд другую','gh','list']);
  return `<div class="card" data-t="control"><h4>Управление</h4>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px"><span class="tag ${t[0]}">${['wait','merge'].includes(S.fs) ? '<span class="dot"></span>' : ''}${t[1]}</span></div>
    <div class="acts">${A.filter(Boolean).map(a => btn(a, 'sm')).join('') || '<span style="font-size:12px;color:var(--c-text-muted)">Действий нет — всё идёт само.</span>'}</div></div>
  ${S.fs === 'empty' ? '' : `<div class="card" data-t="kpi-card"><h4>Метрики ${be('s','токены: хранилище')}</h4>
    <div class="k2"><div><div class="l">идёт</div><div class="v">${m.el}</div></div><div><div class="l">токенов</div><div class="v">${m.tok}</div></div>
    <div><div class="l">ждёт вас</div><div class="v w">${m.wait}</div></div><div><div class="l">ошибок</div><div class="v e">${m.err}</div></div></div>
    ${!['merged','closed','queue'].includes(S.fs) ? `<div class="hot new" style="margin-top:10px"><span class="ic">${ic('flame', 14)}</span><div><b>Дороже всего:</b> Кира · Qwen · Ш3 — 640 тыс./ч</div></div>` : ''}
    <button class="btn xs lnk" data-act="tabB" data-id="metrics" style="margin-top:8px">Все метрики →</button></div>`}
  ${S.fs === 'empty' || S.fs === 'merged' || S.fs === 'closed' ? '' : `<div class="card"><h4>Очередь</h4>${queueBox(true)}</div>`}
  <div class="card" data-t="team"><h4>Команда ${be('p','роль: проекция')}</h4>${['sofya','alex','egor','denis','kira','gleb','vera'].map(k => `<div class="qi" style="padding:3px 0;min-height:30px">${av(k, 18)}<span class="tx">${PER[k].n}</span>${roleChip(PER[k].role)}</div>`).join('')}</div>`;
}
function variantB() {
  const sb = stateBody();
  if (sb && S.fs !== 'empty') return sb;
  const tabs = [['overview','Обзор'],['chats','Чаты',CHATS.length],['tasks','Задачи',TASKS.length],['events','События'],['metrics','Метрики']];
  let main = '';
  if (S.tabB === 'overview') main = `${S.fs === 'empty' ? sb : ''}${S.fs === 'merged' ? summaryCard() + '<div style="height:14px"></div>' : ''}${alertBlock(S.fs)}
    <div class="stl" style="margin-top:16px">Конвейер</div>${isM() ? pipeline() : hStepper()}
    <div class="stl" style="margin-top:18px">Шаги и витки</div>${stepsList()}
    <div class="stl" style="margin-top:18px">Последние события</div>${eventsList()}`;
  if (S.tabB === 'chats') main = chatsList(true);
  if (S.tabB === 'tasks') main = tasksList();
  if (S.tabB === 'events') main = eventsList();
  if (S.tabB === 'metrics') main = metricsBlock();
  const tabsH = `<div class="tabs" data-t="tabs" role="tablist">${tabs.map(([k, t, c]) => `<button role="tab" aria-selected="${S.tabB === k}" class="${S.tabB === k ? 'on' : ''}" data-act="tabB" data-id="${k}">${t}${c ? `<span class="c">${c}</span>` : ''}</button>`).join('')}</div>`;
  if (isM()) return `${metaLine()}<div style="margin-top:12px">${controlCard().split('<div class="card"><h4>Очередь')[0]}</div>${tabsH}${main}
    ${S.tabB === 'overview' && !['empty','merged','closed'].includes(S.fs) ? `<div class="stl" style="margin-top:18px">Очередь</div>${queueBox(true)}` : ''}`;
  return `${metaLine()}<div class="cols" style="margin-top:12px"><div>${tabsH}${main}</div><div>${controlCard()}</div></div>`;
}
function hStepper() {
  const st = stageStatus(S.fs);
  return `<div class="hstep" data-t="pipeline">${STAGES.map((g, i) => `<div class="${st[i]}"><div class="bar2"></div><div class="t1">${g.n}</div><div class="t2"><span class="avs">${g.who.map(w => av(w, 16)).join('')}</span>${roleChip(g.role.split(' ')[0])}</div></div>`).join('')}</div>`;
}

/* ============ Вариант В «Хронология» ============ */
function variantC() {
  const sb = stateBody();
  if (sb && S.fs !== 'empty') return sb;
  const st = stageStatus(S.fs);
  const W = { cut:35, plan:20, prod:125, review:25, qa:30, final:20, merge:15 };

    <div class="blg"><span>ширина — время этапа ${be('s','журнал')}</span><span>сегодня 16:20</span></div>`;
  const evOf = k => EVENTS.filter(e => e.st === k);
  const node = (g, i) => {

    const body = [];

    else {
      if (g.k === 'prod') {
        body.push(STEPS.map(sp => `<button class="rowb" data-act="step" data-id="${sp.c}"><span class="chv ${S.openSteps[sp.c] ? 'o' : ''}">${ic('chevR', 12)}</span><span class="code">${sp.c}</span><span class="tx">${sp.n}</span><span class="rx">${av(sp.who, 18)}${sp.tours.length > 1 ? '↺' + sp.tours.length : ''}<span class="tst ${['merge','merged','closed','merging'].includes(S.fs) ? 'd' : sp.st}">${TST[['merge','merged','closed','merging'].includes(S.fs) ? 'd' : sp.st]}</span></span></button>${S.openSteps[sp.c] ? `<div class="tours">${toursOf(sp, ['merge','merged','closed','merging'].includes(S.fs) ? 'd' : sp.st).map(t => `<div class="tour"><span class="k">${t.w}</span><span>${t.r}</span><span class="sev ${t.sev[0]}">${t.sev[1]}</span></div>`).join('') || '<div class="tour"><span class="k">—</span><span>не начат</span></div>'}</div>` : ''}`).join(''));

    return `<div class="tln ${s}" id="n-${g.k}"><span class="dotx"></span>
      <div class="tlh"><span class="nm">${g.n}</span>${roleChip(g.role)}<span class="avs">${g.who.map(w => av(w, 16)).join('')}</span><span class="rt">${s === 'done' ? g.t : ''}${s === 'done' && S.fs !== 'empty' ? ` · ${({cut:'0,2М',plan:'0,1М',prod:'1,4М',review:'0,3М',qa:'0,1М',final:'0,1М',merge:'0,05М'})[g.k]} ${be('s','токены')}` : ''}</span></div>
      <div class="tlc">${body.join('')}</div></div>`;
  };
  const startNode = S.fs === 'queue' ? `<div class="tln queue" id="n-queue"><span class="dotx" style="box-shadow:inset 0 0 0 2px var(--c-text-secondary)"></span><div class="tlh"><span class="nm">Очередь · №${qpos()}</span>${be('s')}</div><div class="tlc">${alertBlock('queue')}<div style="margin-top:8px">${queueBox()}</div></div></div>` : '';

    <div class="tl" data-t="timeline">${startNode}${STAGES.map(node).join('')}

    <div class="stl" style="margin-top:18px">Все чаты фичи · ${CHATS.length}</div>${chatsList()}`;
}

  } else {
    const scr = S.win === 'feature' ? featurePage() : S.win === 'chat' ? chatPane() : S.win === 'file' ? filePane() : S.win === 'tasks' ? tasksPane() : S.win === 'notes' ? notesPane() : sidePanel();
    html = `<div class="app m" id="frame">${scr}${modalHtml()}${S.toast ? `<div class="toast" data-t="toast">${S.toast}</div>` : ''}</div>`;
  }
  const keepScroll = document.getElementById('pbody')?.scrollTop || 0;
  document.getElementById('app').innerHTML = html;
  const pb = document.getElementById('pbody');
  if (pb) { pb.scrollTop = keepScroll; pb.onscroll = spy; }
  wireDrag();
}

/* Разведка разделов (вариант А): подсветка чипа навигации */
function spy() {
  const pb = document.getElementById('pbody');
  if (S.v !== 'A' || !pb) return;
  let on = 's-pipe';
  pb.querySelectorAll('section.sec').forEach(s => { if (s.offsetTop - pb.scrollTop < 90) on = s.id; });
  if (on !== S.secOn) { S.secOn = on; pb.querySelectorAll('.snav button').forEach(b => b.classList.toggle('on', b.dataset.id === on)); }
}
function scrollToEl(id) {
  const pb = document.getElementById('pbody'); const el = document.getElementById(id);
  if (pb && el) pb.scrollTo({ top: el.offsetTop - 50, behavior: 'smooth' });
}
let toastT;
function toast(t) { S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 2600); }

/* Перетаскивание очереди */
function wireDrag() {
  let from = null;
  document.querySelectorAll('.qi[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => { from = el.dataset.q; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => el.classList.remove('drag'));
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => { e.preventDefault(); const to = el.dataset.q; if (from && from !== to) { const q = S.queue.filter(x => x !== from); q.splice(q.indexOf(to), 0, from); S.queue = q; toast('Очередь переставлена'); render(); } });
  });
}
function moveQ(k, d) { const i = S.queue.indexOf(k), j = i + d; if (j < 0 || j >= S.queue.length) return; const q = S.queue.slice(); [q[i], q[j]] = [q[j], q[i]]; S.queue = q; toast(`«${QN[k]}» теперь №${j + 1}`); }

/* ============ Действия ============ */
document.addEventListener('click', e => {
  const set = e.target.closest('[data-set]');
  if (set) { const k = set.dataset.set; let v = set.dataset.v; if (k === 'marks') v = v === 'true';
    S[k] = v; if (k === 'fs' || k === 'v' || k === 'dev') { S.win = 'feature'; S.menu = false; S.modal = null; S.rail = 'chats'; if (k === 'fs') S.pauseWhy = 'stop'; }
    if (k === 'v') S.tabB = 'overview'; render(); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { if (S.menu) { S.menu = false; render(); } return; }
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'ovl' && e.target !== a) return;
  if (act !== 'menu') S.menu = false;
  switch (act) {
    case 'menu': S.menu = !S.menu; break;
    case 'close': S.win = isM() ? 'list' : 'none'; break;
    case 'toList': S.win = 'list'; break;
    case 'openFeature': S.win = 'feature'; S.rail = 'chats'; break;
    case 'resetWin': S.win = 'feature'; S.rail = 'chats'; break;
    case 'chat': S.win = 'chat'; S.chatId = id; S.rail = 'chats'; break;
    case 'rail': if (id === 'chats') S.rail = 'chats';
      else if (id === 'files') { S.rail = 'files'; if (isM()) S.win = 'file'; }
      else { S.win = id; } break;
    case 'openFile': S.win = 'file'; break;
    case 'closeFile': S.win = 'none'; break;
    case 'openTasks': S.win = 'tasks'; break;
    case 'step': S.openSteps[id] = !S.openSteps[id]; break;
    case 'arch': S.archOpen = !S.archOpen; break;
    case 'evAll': S.evAll = !S.evAll; break;
    case 'taskF': S.taskF = id; break;
    case 'cut': S.cut = id; break;
    case 'tabB': S.tabB = id; break;
    case 'toSec': S.secOn = id; render(); scrollToEl(id); return;
    case 'toMetrics': if (S.v === 'B') { S.tabB = 'metrics'; break; } render(); scrollToEl(S.v === 'A' ? 's-met' : 'n-met'); return;
    case 'toStage': render(); scrollToEl('n-' + id); return;
    case 'copyBranch': toast('Ветка скопирована: ' + FEAT.branch); break;
    case 'copySum': toast('Итог фичи скопирован в markdown'); break;
    case 'answer': S.win = 'chat'; S.chatId = 'k3'; break;
    case 'restart': S.fs = 'run'; toast('Ш3 перезапущен'); break;
    case 'diff': S.win = 'file'; S.rail = 'files'; break;
    case 'stop': case 'merge': case 'startNew': case 'startNow': case 'closeNoMerge': S.modal = act; break;
    case 'stopMode': S.stopMode = id; break;
    case 'modalX': S.modal = null; break;
    case 'ovl': S.modal = null; break;
    case 'stopOk': S.modal = null; S.fs = 'pause'; S.pauseWhy = 'stop'; toast(S.stopMode === 'wait' ? 'Фича остановится после текущего хода' : 'Фича остановлена'); break;
    case 'start': S.fs = 'run'; toast('Фича запущена: продолжает с Ш3'); break;
    case 'mergeOk': S.modal = null; S.fs = 'merging'; setTimeout(() => { if (S.fs === 'merging') { S.fs = 'merged'; render(); } }, 2200); break;
    case 'startParallel': S.modal = null; S.fs = 'run'; toast('Фича запущена'); break;
    case 'toQueue': S.modal = null; S.fs = 'queue'; S.queue = ['voice','tmpl','export']; toast('Поставлена в очередь, №2'); break;
    case 'queueMe': S.fs = 'queue'; S.queue = ['voice','tmpl','export']; toast('Фича уступила: «Голосовой режим 2» впереди'); break;
    case 'unqueue': S.fs = 'pause'; S.pauseWhy = 'unqueue'; S.queue = ['voice','export','tmpl']; toast('Убрана из очереди'); break;
    case 'closeOk': S.modal = null; S.fs = 'closed'; break;
    case 'reopen': S.fs = 'pause'; S.pauseWhy = 'unqueue'; break;
    case 'retry': S.fs = 'loading'; render(); setTimeout(() => { S.fs = 'run'; render(); }, 900); return;
    case 'qUp': moveQ(id, -1); break;
    case 'qDown': moveQ(id, 1); break;
  }
  render();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.modal) S.modal = null; else if (S.menu) S.menu = false; else if (S.win === 'feature') S.win = isM() ? 'list' : 'none'; else return;
  render();
});
render();
</script>
</body>
</html>
