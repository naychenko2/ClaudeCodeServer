function chatRow(c){

function group(f){
  const kids = chatsOf(f.id);
  const head = S.v==='a'?headerA(f): S.v==='b'?headerB(f): headerC(f);
  if (S.v==='b') return head;
  const open=!!S.open[f.id];
  const shown = open ? kids : kids.filter(c=>c.r==='key'||c.st==='run'||c.st==='stop'||c.st==='wait');
  const rest = kids.length - shown.length;
  const body = f.closed && !open ? '' : `<div class="kids">${shown.map(chatRow).join('')}${rest>0?`<button class="more" data-act="tog" data-f="${f.id}">ещё ${rest} ${rest<5?'чата':'чатов'}</button>`:''}</div>`;
  return `<div class="${S.v==='a'?'ga':'gc'}${open?' open':''}${f.closed?(S.v==='a'?' closedA':' gone'):''}">${head}${S.v==='c'&&!open&&!f.closed?'':body}</div>`;
}

  const ev=EVENTS[f.id]||[];
  if (!ev.length) return `<div class="empty sm"><div class="d">Событий пока нет</div></div>`;
  return ev.map(([t,p,x,k])=>`<div class="ev"><span class="tm">${t}</span>${av(p,'xs')}<span><b>${P[p]}</b> ${x}</span></div>`).join('');
}
const blk = (cap, body, right='') => `<div class="blk"><div class="cap">${cap}${right?`<span class="r">${right}</span>`:''}</div>${body}</div>`;
function pageBodyState(){
  if (S.ps==='loading') return `<div style="display:flex;flex-direction:column;gap:10px">${[70,92,84,60,88,76].map(w=>`<div class="sk" style="height:14px;width:${w}%"></div>`).join('')}<div class="sk" style="height:120px;margin-top:6px"></div></div>`;
  if (S.ps==='error') return `<div class="ntc">${G('stop')}<div><b>Не удалось загрузить фичу.</b> Сервер не ответил; список и чаты работают как обычно.<div style="margin-top:8px;display:flex;gap:6px"><button class="btn xs gh" data-act="retry" style="background:var(--c-bg-white)">${I.retry} Повторить</button></div></div></div>`;
  if (S.ps==='gone') return `<div class="empty"><div class="ic">${I.route}</div><div class="h">Фичи больше нет</div><div class="d">Эпик удалён в «Задачах». Чаты остались на месте и снова живут без фичи.</div><button class="btn sm gh" data-act="back">К списку чатов</button></div>`;
  return null;
}
function evCap(){ return `События <span class="be">журнал: нужно от бэка</span>`; }
function page(f, mode){
  const st = pageBodyState();
  if (mode==='center'){
    const body = st || `${attBlock(f)}<div class="cols"><div>${blk('Конвейер',conveyor(f), prog(f))}${blk('Шаги',stepsList(f), (STEPS[f.id]||[]).length+'')}</div>
      <div>${blk('Чаты фичи · '+chatsOf(f.id).length,chatsList(f))}${blk('Задачи',tasksBlock(f))}${blk(evCap(),eventsBlock(f))}</div></div>`;
    return `<div class="pg">${pageHead(f,'center')}<div class="pgb">${body}</div></div>`;
  }
  if (mode==='drawer' || mode==='sheet'){
    const tabs = [['over','Обзор'],['chats','Чаты',chatsOf(f.id).length],['tasks','Задачи',f.tasks],['ev','События']];
    let body = st;
    if (!st){
      if (S.tab==='over') body = `${attBlock(f)}${blk('Конвейер',conveyor(f),prog(f))}${blk('Шаги',stepsList(f))}`;
      else if (S.tab==='chats') body = blk('Ключевой чат первым',chatsList(f));
      else if (S.tab==='tasks') body = blk('Задачи',tasksBlock(f));
      else body = blk(evCap(),eventsBlock(f));
    }
    return `<div class="pg">${pageHead(f,mode)}<div class="tabs" role="tablist">${tabs.map(([k,l,n])=>`<button role="tab" class="${S.tab===k?'on':''}" data-act="tab" data-k="${k}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('')}</div><div class="pgb">${body}</div></div>`;
  }
  // panel (В) и мобильный экран В — сворачиваемые секции
  const sec = (k, cap, n, body) => `<div class="sect${S.sect[k]?' open':''}"><button class="sh" data-act="sect" data-k="${k}" aria-expanded="${!!S.sect[k]}">${I.chev}${cap}${n!=null?` <span class="n">${n}</span>`:''}</button>${S.sect[k]?`<div class="sb">${body}</div>`:''}</div>`;
  const body = st ? `<div style="padding:14px 16px">${st}</div>` : `<div style="padding:12px 16px 0">${attBlock(f)}</div>
    ${sec('conv','Конвейер',prog(f),conveyor(f))}${sec('chats','Чаты фичи',chatsOf(f.id).length,chatsList(f))}${sec('steps','Шаги',(STEPS[f.id]||[]).length,stepsList(f))}
    ${sec('tasks','Задачи',f.tasks,tasksBlock(f))}${sec('ev','События',null,`<div style="margin-bottom:6px"><span class="be">журнал: нужно от бэка</span></div>`+eventsBlock(f))}`;
  return `<div class="pg">${pageHead(f,'panel')}<div class="pgb" style="padding:0">${body}</div></div>`;
}

/* ---------- Чат ---------- */
function chatView(){
  const c = CHATS.find(x=>x.id===S.chat) || CHATS[0];
  const f = c.f.length ? F(c.f[0]) : null;
  const k = f ? kind(f) : null;
  const plank = f ? `<div class="fs ${k==='stop'?'t-stop':(k==='wait'||k==='merge')?'t-wait':''}">${G(k)}<span class="nm">${esc(f.name)}</span>${S.m?'':rail(f)}<span class="sg ${toneCls(k)}">${statusText(f)}</span>
     ${S.m?'':`<span class="role">${c.r==='key'?'ключевой':'этот чат: '+c.ref}</span>`}<button class="go new" data-act="page" data-f="${f.id}" data-from="${c.id}">Фича ${I.go}</button></div>` : '';
  return `${S.m?`<div class="mhd"><button class="ib" data-act="mback" aria-label="К списку">${I.back}</button><span class="ttl">${esc(c.t)}</span></div>`:`<div class="chd"><span class="t">${esc(c.t)}</span></div>`}
    ${plank}<div class="feed"><div class="msg-u">Продолжай Ш3: поправь пустое состояние панели по замечаниям Глеба.</div>
    <div class="msg-a">Поправила пустое состояние: текст и кнопка «Сбросить фильтр». Тёмная тема и 360 px проверены, отдаю на ревью.</div></div>
    <div class="comp">Напишите сообщение…</div>`;
}

/* ---------- Сборка экрана ---------- */
function railCol(){ return `<div class="rail"><button class="rb on" title="Чаты">${I.chats}</button><button class="rb" title="Файлы">${I.files}</button><span class="sep"></span><button class="rb" title="Задачи">${I.task}</button></div>`; }
function render(){
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('nonew', !document.getElementById('shownew').checked);
  const app = document.getElementById('app'); app.className = 'app' + (S.m?' m':'');
  const f = S.page ? F(S.page) : null;
  let h='';
  if (!S.m){
    if (S.v==='a'){
      h = railCol() + `<div class="isl side">${listPanel()}</div><div class="isl center">${f?page(f,'center'):chatView()}</div>`;
    } else if (S.v==='b'){
      h = railCol() + `<div class="isl side">${listPanel()}</div><div class="isl center">${chatView()}${f?`<div class="scrimc" data-act="close"></div><div class="drw" role="dialog" aria-label="Фича">${page(f,'drawer')}</div>`:''}</div>`;
    } else {
      h = railCol() + `<div class="isl side narrow">${listPanel()}</div><div class="isl center">${chatView()}</div>${f?`<div class="isl right new">${page(f,'panel')}</div>`:''}`;
    }
  } else {
    if (S.v==='a'){
      h = `<div class="isl">${S.mscreen==='page'&&f?page(f,'mobile'):S.mscreen==='chat'?chatView():listPanel()}</div>`;
    } else if (S.v==='b'){
      h = `<div class="isl">${S.mscreen==='chat'?chatView():listPanel()}</div>${f?`<div class="scrim" data-act="close"></div><div class="sheet tall"><div class="grab"></div>${page(f,'sheet')}</div>`:''}`;
    } else {
      const tabs = f ? `<div class="mtabs new" style="margin-top:8px"><button class="${S.mscreen!=='page'?'on':''}" data-act="mtab" data-k="list"><span>Чаты</span></button><button class="${S.mscreen==='page'?'on':''}" data-act="mtab" data-k="page">${G(kind(f))}<span>${esc(f.name)}</span></button></div>` : '';
      h = `<div class="isl">${tabs}${S.mscreen==='page'&&f?page(f,'panel'):S.mscreen==='chat'?chatView():listPanel()}</div>`;
    }
    if (S.v==='a' && S.sheet==='filter'){
      h += `<div class="scrim" data-act="sheetclose"></div><div class="sheet fsh"><div class="grab"></div><div class="hd"><span class="t">Фильтры</span><button class="ib" data-act="sheetclose" aria-label="Закрыть">${I.x}</button></div>
        <div class="in">${filterBodyA(true)}</div><div class="foot">${S.fa.size||S.faClosed?'<button class="lnk" data-act="reset" style="min-height:40px">Сбросить всё</button>':''}<span class="sp"></span>
        <button class="btn md pri" data-act="sheetclose">Показать ${plural(visible().open.length+visible().closed.length)}</button></div></div>`;
    }
  }
  if (S.menu) h += `<div class="menu" style="${S.m?'left:8px;right:8px;top:60px':'right:24px;top:56px'}"><button class="mi" data-act="toast" data-t="Ветка скопирована">Скопировать ветку</button>
     <button class="mi" data-act="toast" data-t="Откроются «Задачи»">Открыть эпик в «Задачах»</button><div class="msep"></div>
     <button class="mi dng" data-act="toast" data-t="Закрыть без мержа: нужна ручка на бэке">Закрыть без мержа <span class="be d">бэк</span></button></div>`;
  if (S.toast) h += `<div class="toast">${S.toast}</div>`;
  app.innerHTML = h;
  renderBar(); renderNote(); saveHash();
}

/* ---------- События ---------- */
document.getElementById('app').addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t){ if (S.pop||S.menu){ S.pop=false; S.menu=null; render(); } return; }
  const a=t.dataset.act, id=t.dataset.f;
  if (a!=='menu') S.menu=null;
  switch(a){
    case 'tog': S.open[id]=!S.open[id]; break;
    case 'page': S.from = t.dataset.from || (S.page? S.from : S.chat); S.page=id; S.tab='over'; S.ps = S.ps==='gone'?'ok':S.ps; if (S.m) S.mscreen = S.v==='b' ? S.mscreen : 'page'; break;
    case 'close': S.page=null; if (S.m && S.v==='c') S.mscreen='list'; break;
    case 'back': if (S.from && !S.m){ S.chat=S.from; } S.page=null; if (S.m) S.mscreen = S.from? 'chat':'list'; S.from=null; break;
    case 'mback': S.mscreen='list'; break;
    case 'chat': S.chat=t.dataset.c; if (!(S.v==='c' && !S.m)) S.page=null; if (S.m) S.mscreen='chat'; break;
    case 'key': { const f=F(id); S.chat=f.key; S.page = S.v==='c' && !S.m ? S.page : null; if (S.m) S.mscreen='chat'; S.toast = f.att&&f.att.k==='merge' ? 'Ключевой чат: финальное ревью принято, мерж — у оркестратора' : null; break; }
    case 'pop': if (S.m){ S.sheet='filter'; } else S.pop=!S.pop; break;
    case 'sheetclose': S.sheet=null; break;
    case 'fa': S.fa.has(t.dataset.k)?S.fa.delete(t.dataset.k):S.fa.add(t.dataset.k); break;
    case 'faClosed': S.faClosed=!S.faClosed; break;
    case 'fb': S.fb=t.dataset.k; break;
    case 'fc': S.fc.has(t.dataset.k)?S.fc.delete(t.dataset.k):S.fc.add(t.dataset.k); break;
    case 'fcClosed': S.fcClosed=!S.fcClosed; break;
    case 'reset': resetFilters(); break;
    case 'closedSec': S.closedOpen=!S.closedOpen; if (S.v==='a' && S.faClosed && !S.closedOpen) {} break;
    case 'tab': S.tab=t.dataset.k; break;
    case 'sect': S.sect[t.dataset.k]=!S.sect[t.dataset.k]; break;
    case 'mtab': S.mscreen = t.dataset.k==='page'?'page':'list'; break;
    case 'menu': S.menu=!S.menu; break;
    case 'retry': S.ps='loading'; render(); setTimeout(()=>{ S.ps='ok'; render(); }, 900); return;
    case 'toast': S.toast=t.dataset.t; break;
  }
  if (a!=='toast' && a!=='key') S.toast = a==='key'?S.toast:null;
  if (S.toast){ clearTimeout(render.tt); render.tt=setTimeout(()=>{ S.toast=null; render(); }, 2400); }
  e.stopPropagation(); render();
});
document.addEventListener('keydown', e => { if (e.key==='Escape'){ if (S.pop||S.menu||S.sheet){ S.pop=false; S.menu=null; S.sheet=null; } else if (S.page && S.v!=='a'){ S.page=null; } render(); } });

/* ---------- Служебная панель и записка ---------- */
function pills(id, items, key, after){
  document.getElementById(id).innerHTML = items.map(([v,l])=>`<button class="${S[key]===v?'on':''}" data-v="${v}">${l}</button>`).join('');
  document.getElementById(id).onclick = e => { const b=e.target.closest('button'); if(!b) return; let v=b.dataset.v; if (v==='true') v=true; if (v==='false') v=false; S[key]=v; after&&after(); render(); };
}
function renderBar(){
  pills('pv',[['a','А · Строка + страница в центре'],['b','Б · Плитка + шторка'],['c','В · Индикатор + панель']],'v',()=>{ S.page=null; S.pop=false; S.sheet=null; S.mscreen='list'; });
  pills('pd',[['normal','Обычно'],['calm','Все закрыты'],['none','Нет фич']],'data',()=>{ resetFilters(); S.page=null; });
  pills('pp',[['ok','Обычно'],['loading','Загрузка'],['error','Ошибка'],['gone','Фичу удалили']],'ps', ()=>{ if(!S.page){ S.page='stats'; S.from='c17'; if(S.m && S.v!=='b') S.mscreen='page'; } });
  pills('pt',[['light','Светлая'],['dark','Тёмная']],'theme');
  pills('pw',[[false,'1280'],[true,'360']],'m',()=>{ S.pop=false; S.sheet=null; S.mscreen = S.page && S.v!=='b' ? 'page' : 'list'; });
}
const NOTES = {
  a:'<b>А · «Строка + страница в центре».</b> Плашка — две строки, 55 px: шеврон отдельной тач-целью раскрывает чаты, тело открывает <b>страницу фичи в центральной области</b> вместо чата (крошка «← К чату …» возвращает туда, откуда пришли). Фильтр — тот же <b>FilterBar</b>, что у «Чатов»: воронка, поповер с секцией «Фичи · что с ними» и тумблером «Закрытые», бейдж «скрыто N», сброс; активный фильтр виден строкой снимаемых чипов под шапкой. Наведите на плашку — справа появится быстрое действие.',
  b:'<b>Б · «Плитка + шторка».</b> Плашка — карточка 156 px: тег состояния, ветка, <b>подписанная рельса</b>, строка «кто и что сейчас», внизу чаты/задачи и быстрое действие. Страница — <b>шторка справа поверх чата</b> (540 px, вкладки Обзор · Чаты · Задачи · События), чат за ней не теряется, Esc закрывает. Фильтр — <b>InlineSegmented</b> по корзинам «Открытые · Требуют вас · Идут · Закрытые» с числами, одно нажатие. На 360 — нижняя шторка 92 %.',
  c:'<b>В · «Индикатор + панель».</b> Плашка — одна строка 40 px: кольцо прогресса шагов, название, справа кто/стадия или тревога. Список остаётся плотным, детали живут в <b>панели «Фича» справа</b>, она остаётся открытой, пока вы ходите по чатам фичи (как «Файлы»). Фильтр — ряд <b>ui/Chip soft</b> с числами, «Закрытые» за разделителем, «Сбросить» появляется при выборе. На 360 — вкладки «Чаты · ‹фича›».',
};
function renderNote(){ document.getElementById('note').innerHTML = NOTES[S.v] + ' <span style="color:var(--c-text-muted)">Пунктир — нового нет в продукте; жёлтая метка — данных или ручки нет на бэке.</span>'; }
function saveHash(){ const p=[S.v]; if (S.m) p.push('m'); if (S.theme==='dark') p.push('dark'); if (S.page) p.push('page='+S.page); if (S.data!=='normal') p.push(S.data); if (S.ps!=='ok') p.push('ps='+S.ps); history.replaceState(null,'','#'+p.join('&')); }
function loadHash(){
  const p = location.hash.slice(1).split('&').filter(Boolean);
  for (const x of p){
    if (['a','b','c'].includes(x)) S.v=x; else if (x==='m') S.m=true; else if (x==='dark') S.theme='dark';
    else if (x.startsWith('page=')){ S.page=x.slice(5); S.from='c17'; } else if (['calm','none'].includes(x)) S.data=x;
    else if (x.startsWith('ps=')) S.ps=x.slice(3); else if (x==='pop') S.pop=true; else if (x==='fsheet') S.sheet='filter';
    else if (x.startsWith('fa=')) x.slice(3).split(',').forEach(k=>S.fa.add(k)); else if (x.startsWith('fb=')) S.fb=x.slice(3);
    else if (x.startsWith('fc=')) x.slice(3).split(',').forEach(k=>S.fc.add(k)); else if (x.startsWith('open=')) S.open[x.slice(5)]=true;
  }
  if (S.m && S.page && S.v!=='b') S.mscreen='page';
}
document.getElementById('shownew').onchange = render;
loadHash(); render();
</script>
</body>
</html>
