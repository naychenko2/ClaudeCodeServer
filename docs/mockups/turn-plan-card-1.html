:root {

/* Мини-рельс этапов: 7 (или K) сегментов 6×4, R.sm/2; пройден — C.success,

.rail { display:inline-flex; gap:2px; align-items:center; flex-shrink:0; }

.t-stopped { background:var(--c-danger) !important; } .t-loop { background:var(--c-warning) !important; }

/* Аватары активных: 20 px (на 360 — 22), кольцо 2px C.bgWhite, наезд −6. */
.avs { display:inline-flex; align-items:center; flex-shrink:0; }
.avs .a { width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;

.legend { display:flex; flex-wrap:wrap; gap:2px 10px; font-size:11px; color:var(--c-text-secondary); }
.legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:-1px; }

/* Полоса проблемы (вариант В): фон *Bg, левый край 3px цветом тона. */

.band.stop { background:var(--c-danger-bg); box-shadow:inset 3px 0 0 var(--c-danger); }

.band .bt .why { color:var(--c-text-secondary); }

.act:hover { border-color:var(--c-accent); }
#stage.w360 .act { min-height:40px; padding:0 12px; }
.lnk { font-size:12px; font-weight:600; color:var(--c-accent); white-space:nowrap; display:inline-flex; align-items:center; gap:2px; flex-shrink:0; }
#stage.w360 .lnk { min-height:40px; }

/* Глиф состояния 14 px (как FeatureGlyph): цвет по тону. */
.g { display:inline-flex; flex-shrink:0; }
.g.run { color:var(--c-accent); } .g.wait { color:var(--c-info); } .g.stop { color:var(--c-danger); }
.g.loop { color:var(--c-warning); } .g.done { color:var(--c-success); } .g.quiet { color:var(--c-text-muted); }

/* «Было»: нынешняя строка (для сравнения). */
.old .row { padding:10px 13px; flex-wrap:wrap; row-gap:4px; }
.old .now { font-size:12px; color:var(--c-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
#stage.w360 .old .now { order:6; flex:1 1 0; max-width:100%; }
#stage.w360 .old .brk { display:block; flex-basis:100%; height:0; order:5; }

#stage.w360 .old .lnk { order:7; }
.pbar { display:inline-block; width:44px; height:4px; border-radius:2px; background:var(--c-border-light); overflow:hidden; flex-shrink:0; }

/* ===== Вариант А «Сводка в две строки» ===== */

/* ===== Вариант Б «Одна строка» ===== */

/* На 360 рельс уходит: номер этапа «3/7» уже есть, а чип проблемы обязан влезть в первую строку. */
#stage.w360 .vb .rail { display:none; }

/* ===== Вариант В «Сначала проблема» ===== */
.vc .body { padding:9px 13px 10px; display:grid; gap:6px; }
.vc .foot { display:flex; align-items:center; gap:8px; }

<script>
// ===== Данные: ровно поля FeatureRun (GET /api/tasks/features?sessionId=…), которые

const P = { kira:{n:'Кира',i:'К'}, denis:{n:'Денис',i:'Д'}, gleb:{n:'Глеб',i:'Г'}, kuzma:{n:'Кузьма',i:'К'}, timur:{n:'Тимур',i:'Т'}, vera:{n:'Вера',i:'В'} };
const KEYS = ['cut','plan','prod','review','qa','final','merge'];
const NAME = { cut:'Разрез', plan:'План', prod:'Производство', review:'Ревью', qa:'Проверка', final:'Финальное ревью', merge:'Мерж' };
function stages(activeKey, tone, absent){ // done до активной, pending после
  const ai = KEYS.indexOf(activeKey);
  return KEYS.map((k,i) => ({ key:k, state: (absent||[]).includes(k) ? 'absent' : ai<0 ? 'done' : i<ai ? 'done' : i===ai ? 'active' : 'pending', tone: i===ai ? tone : null }));
}
const CASES = {

    run:{ state:'stopped', title:'Обзор фич · волна 4', stages:stages('prod','stopped'),

};
let theme='light', width='desk', cs='run';

// ===== Слова (общие у вариантов) =====
const svg = (p, s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {

  wait:'<path d="M12 3l9 9-9 9-9-9z"/>', stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',

const plural = (n, a, b, c) => { const n10=n%10, n100=n%100; return n10===1&&n100!==11 ? a : n10>=2&&n10<=4&&(n100<12||n100>14) ? b : c; };
const activeIdx = r => r.stages.findIndex(s => s.state==='active');
// «этап N из K»: K — длина рельса (сейчас 7; после W4-DES — 8). «из 12» в данных нет.
const stageNo = r => { const i = activeIdx(r); return i < 0 ? '' : `этап ${i+1} из ${r.stages.length}`; };
const stageName = r => { const i = activeIdx(r); return i < 0 ? '—' : NAME[r.stages[i].key]; };
const left = r => r.sp.total - r.sp.accepted;
// Проблема — ОДНА, по приоритету: стоит → ждёт вас → к мержу → открытые возвраты → тихо.
function problem(r){
  const a = r.attention;
  if (a && a.kind==='stopped') return { tone:'stop', glyph:'stop', chip:`стоит ${dur(a.min)}`, band:`<b>${P[a.who].n}</b> встал${P[a.who].n.endsWith('а')?'а':''} ${dur(a.min)} назад`, why:a.reason, act:'Открыть чат' };
  if (a && a.kind==='wait') return { tone:'wait', glyph:'wait', chip:`ждёт вас · ${dur(a.min)}`, band:`<b>${P[a.who].n}</b> ждёт вас ${dur(a.min)}`, why:a.reason, act:'Ответить' };
  if (a && a.kind==='merge') return { tone:'wait', glyph:'wait', chip:'ждёт согласия на мерж', band:'<b>Готово к мержу</b> — нужно ваше согласие', why:`финал принят ${dur(a.min)} назад`, act:'Открыть' };
  if (r.openReturns > 0) return { tone:'loop', glyph:'loop', chip:`↺ ${r.openReturns} ${plural(r.openReturns,'доработка','доработки','доработок')}`, band:`<b>Ревью вернуло работу:</b> ${r.openReturns} ${plural(r.openReturns,'доработка открыта','доработки открыты','доработок открыто')}`, why:`всего возвратов ${r.loops}`, act:'Что вернули' };
  if (r.staleNeedsField && r.quietMin >= 120) return { tone:'loop', glyph:'quiet', chip:`тихо ${dur(r.quietMin)}`, band:`<b>Тихо ${dur(r.quietMin)}</b> — ни одного события по фиче`, why:'идёт формально, но никто не отчитывался', act:'Открыть чат', need:true };
  return null;
}
const glyphFor = r => { const p = problem(r); if (p) return p.glyph; if (r.state==='merge_pending') return 'wait'; return activeIdx(r) >= 0 && r.stages[activeIdx(r)].tone==='loop' ? 'loop' : 'run'; };
const toneClass = g => ({run:'run',wait:'wait',stop:'stop',loop:'loop',done:'done',quiet:'quiet'})[g];
function rail(r){ return `<span class="rail" aria-hidden="true">${r.stages.map(s => `<i class="${s.state}${s.state==='active' ? ' t-' + (s.tone||'run') : ''}"></i>`).join('')}</span>`; }
// Аватары: только активные (now[] + упавший из тревоги), ≤ N, дальше «+K». title — имена.
function avatars(r, max){
  const ids = [...r.now]; const a = r.attention;
  if (a && a.who && !ids.includes(a.who)) ids.unshift(a.who);
  if (!ids.length) return '';
  const shown = ids.slice(0, max), rest = ids.length - shown.length;
  const cls = id => a && a.who===id ? (a.kind==='stopped' ? ' stop' : ' wait') : '';
  return `<span class="avs" title="Сейчас: ${ids.map(i=>P[i].n).join(', ')}">${shown.map(i => `<span class="a${cls(i)}">${P[i].i}</span>`).join('')}${rest>0 ? `<span class="a more">+${rest}</span>` : ''}</span>`;
}
const chipHtml = p => p ? `<span class="chip ${p.tone}">${p.chip}${p.need ? ' <span class="need">· нет поля</span>' : ''}</span>` : '';
const chev = `<span class="chev">${svg(I.chev, 16)}</span>`;
function leftText(r, short){
  if (r.sp.planState==='done') return 'все шаги приняты';
  const l = left(r);
  const parts = [`осталось ${l} из ${r.sp.total}`];
  if (!short) { if (r.sp.work) parts.push(`${r.sp.work} в работе`); if (r.sp.review) parts.push(`${r.sp.review} в ревью`); }
  if (r.sp.planState==='partial') parts.push('план частично');
  return parts.join(' · ');
}
const more = r => r.more ? `<span class="chip quiet">+${r.more} ${plural(r.more,'фича','фичи','фич')}</span>` : '';

// ===== Было =====
function vOld(c){
  const t = c.todo, pct = Math.round(t.done / t.total * 100);
  return `<div class="card old"><div class="row">
    <span class="g run">${svg('<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/>', 15)}</span>
    <span class="h">План хода</span>
    <span class="now">· сейчас: ${t.now}</span>
    <span class="pbar"><span style="width:${pct}%"></span></span>
    <span class="mut mono" style="font-size:11px">${t.done} из ${t.total}</span>
    <span class="brk"></span>
    <span class="lnk" style="margin-left:auto">Подробнее ›</span>
  </div></div>`;
}
// ===== А · Сводка в две строки =====
function vA(c){
  const r = c.run, p = problem(r), g = glyphFor(r);
  return `<button class="card hit" title="Открыть исполнение фичи"><div class="va">
    <div class="row">
      <span class="g ${toneClass(g)}">${svg(I[g])}</span>
      <span class="h">${stageName(r)}</span>
      <span class="mut">${stageNo(r)}</span>
      ${rail(r)}
      ${more(r)}
      ${chev}
    </div>
    <div class="row">
      <span class="sub ell">${leftText(r, width==='m')}</span>
      <span style="margin-left:auto"></span>
      ${chipHtml(p)}
      ${avatars(r, 3)}
    </div>
  </div></button>`;
}
// ===== Б · Одна строка =====
function vB(c){
  const r = c.run, p = problem(r), g = glyphFor(r);
  const i = activeIdx(r);
  return `<button class="card hit" title="Открыть исполнение фичи"><div class="vb">
    ${rail(r)}
    <span class="h">${stageName(r)}</span>
    <span class="mut mono" style="font-size:11px">${i<0?'':(i+1)+'/'+r.stages.length}</span>
    ${chipHtml(p)}
    <span class="brk"></span>
    <span class="sub ell">${r.sp.planState==='done' ? 'все шаги приняты' : `осталось ${left(r)} ${plural(left(r),'шаг','шага','шагов')}`}</span>
    ${more(r)}
    <span style="margin-left:auto"></span>
    ${avatars(r, 2)}
    <span class="chev" style="margin-left:0">${svg(I.chev, 16)}</span>
  </div></button>`;
}
// ===== В · Сначала проблема =====
function vC(c){
  const r = c.run, p = problem(r), sp = r.sp;
  const w = n => `${(n / sp.total * 100).toFixed(1)}%`;
  const band = p ? `<div class="band ${p.tone}">
      <span class="g ${toneClass(p.glyph)}">${svg(I[p.glyph])}</span>
      <span class="bt">${p.band}${width==='m' ? '<br>' : ' · '}<span class="why">${p.why}</span>${p.need ? ' <span class="chip quiet">нет поля</span>' : ''}</span>
      <button class="act">${p.act}</button>
    </div>` : '';
  const legend = [
    sp.accepted ? `<span><i class="b-acc"></i>${sp.accepted} принято</span>` : '',
    sp.review ? `<span><i class="b-rev"></i>${sp.review} в ревью</span>` : '',
    sp.work ? `<span><i class="b-work"></i>${sp.work} в работе</span>` : '',
    sp.notCreated ? `<span><i class="b-none"></i>${sp.notCreated} не заведено</span>` : '',
  ].join('');
  return `<div class="card vc">${band}<div class="body">
      <div class="row">
        <span class="h">${stageName(r)}</span>
        <span class="mut">${stageNo(r)}</span>
        ${more(r)}
        <span style="margin-left:auto"></span>
        ${avatars(r, 3)}
      </div>
      <div class="bar" role="img" aria-label="${sp.accepted} из ${sp.total} шагов принято">
        <span class="b-acc" style="width:${w(sp.accepted)}"></span><span class="b-rev" style="width:${w(sp.review)}"></span><span class="b-work" style="width:${w(sp.work)}"></span><span class="b-none" style="flex:1"></span>
      </div>
      <div class="foot"><span class="legend">${sp.planState==='done' ? `<span><i class="b-acc"></i>все ${sp.total} шагов приняты</span>` : legend}</span>
        <button class="lnk" style="margin-left:auto">Подробнее ›</button></div>
    </div></div>`;
}

const VARIANTS = [
  ['Было', 'нынешняя строка: чек-лист агента, а не фича', vOld],
  ['А · Сводка в две строки', 'вся карточка — одна тач-цель; 1-я строка «где», 2-я «сколько · проблема · кто»', vA],
  ['Б · Одна строка', 'минимум высоты; на 360 — две строки по 40 px', vB],
  ['В · Сначала проблема', 'тихая, когда всё хорошо; при тревоге сверху полоса с действием', vC],
];
function render(){
  document.documentElement.setAttribute('data-theme', theme);
  const st = document.getElementById('stage');
  st.className = width==='m' ? 'w360' : '';
  const c = CASES[cs];
  document.getElementById('caseNote').innerHTML = `<b>${c.label}.</b> ${c.note}`;
  st.innerHTML = VARIANTS.map(([t, d, f]) => `<div class="vrow"><div class="vhead"><b>${t}</b><span>${d}</span></div>
    <div class="frame"><p class="msgline">Софья: Запустила Киру на W4-6, Денис ждёт слота…</p>${f(c)}<p class="msgline after">▸ tasks_run_executor · W4-CHT-B</p></div></div>`).join('');
}
function pills(id, opts, get, set){
  const el = document.getElementById(id);
  const draw = () => { el.innerHTML = opts.map(([v,l]) => `<button class="${get()===v?'on':''}" data-v="${v}">${l}</button>`).join(''); };
  el.onclick = e => { const v = e.target.closest('button')?.dataset.v; if (v) { set(v); draw(); render(); } };
  draw();
}
pills('pTheme', [['light','Светлая'],['dark','Тёмная']], () => theme, v => theme = v);
pills('pWidth', [['desk','Десктоп'],['m','360']], () => width, v => width = v);
pills('pCase', Object.entries(CASES).map(([k,v]) => [k, v.label]), () => cs, v => cs = v);
if (window.innerWidth < 720) width = 'm';
pills('pWidth', [['desk','Десктоп'],['m','360']], () => width, v => width = v);
render();
</script>
</body>
</html>
