name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    # История: тесты на Linux-раннере зависали насмерть (прогоны умирали на дефолтном
    # 6-часовом таймауте). Потолок джобы — страховка от сгоревших часов; виновника
    # зависания ищет blame-режим шага Test ниже.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Проекты на net10.0. Раньше тут стояло 9.0.x, и сборка проходила лишь потому,
          # что на образе раннера случайно оказался предустановленный SDK 10.x — при
          # обновлении образа это молча сломалось бы.
          dotnet-version: 10.0.x
      # Предупреждения компилятора — ошибка сборки, но только здесь, а не в
      # Directory.Build.props: локально они не должны мешать отладке (временно
      # неиспользуемая переменная — норма в процессе работы, а не повод глушить
      # предупреждение прагмой). Гейт стоит там, где решается попадание в master.
      # Список кодов, выведенных из-под гейта (NuGet-предупреждения, зависящие от
      # сети и внешних advisory), — в свойстве WarningsNotAsErrors там же, в props.
      - name: Build
        run: dotnet build backend/ClaudeHomeServer.slnx -warnaserror
      # Сторож кросс-сборки агента устройства (agent-distribution AD-1): выкатка собирает
      # win-x64 на Linux, и мост ConPTY обязан ехать в тот же каталог. Условие в csproj
      # по ОС сборки вместо целевого RID молча выкинуло бы мост — здесь это падение.
      - name: Publish DeviceAgent (win-x64)
        run: |
          dotnet publish backend/ClaudeHomeServer.DeviceAgent/ClaudeHomeServer.DeviceAgent.csproj \
            -c Release -r win-x64 --self-contained -warnaserror -o "$RUNNER_TEMP/agent-win-x64"
          for f in ai-home-agent.exe ConPtyBridge.exe ConPtyBridge.dll; do
            test -f "$RUNNER_TEMP/agent-win-x64/$f" || { echo "нет $f в publish агента win-x64" >&2; exit 1; }
          done
        shell: bash
      # Гейт кодировки: все .cs в backend/ должны быть валидным UTF-8. Ловит
      # побочные повреждения, когда файл пересохраняется в системной кодовой странице
      # (CP1251 на Windows, KOI8-R где-то ещё) и локально собирается из-за windows-фолбэка
      # Roslyn, а на ubuntu-latest — нет (CI гоняет Linux). Сторож: см. ревью 3c280eaa
      # (коммит 215aaebe обнулил/перекодировал три файла, прогон остался зелёным).
      # Дешёвая проверка через python3 — есть на ubuntu-latest из коробки.
      - name: Check UTF-8 (no CP1251)
        run: |
          python3 -c "
          import os, sys
          failed = []
          for root, _, files in os.walk('backend'):
              for f in files:
                  if not f.endswith('.cs'):
                      continue
                  p = os.path.join(root, f)
                  try:
                      open(p, 'r', encoding='utf-8').read()
                  except UnicodeDecodeError as e:
                      failed.append((p, str(e)))
          if failed:
              for p, e in failed:
                  print(f'FAIL: {p}: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'OK: {sum(1 for r,_,fs in os.walk(\"backend\") for f in fs if f.endswith(\".cs\"))} файлов .cs — валидный UTF-8')
          "
        shell: bash
      # Blame-режим: молчание тестового процесса дольше 5 минут — VSTest снимает дамп,
      # пишет в лог ИМЕНА тестов, выполнявшихся в этот момент, и валит шаг. По mini-дампу
      # дедлок не разобрать (dumpasync требует метаданных, которых в mini нет) — берём full.
      # Порог 5 минут: обычный тест живёт <1 с, пять минут тишины — гарантированный труп,
      # а итерация диагностики втрое быстрее, чем с 15 минутами.
      # Флаги vstest-консоли (--diagnostic и пр.) сюда нельзя: dotnet test в MSBuild-режиме
      # передаёт их MSBuild как неизвестные свитчи (MSB1001).
      - name: Test
# Категория "Node" — за бортом: нужен Node + frontend/node_modules, не ставим.
      # Категория "Dns" на ubuntu-latest НЕ исключается: внешний DNS-резолв в CI
      # работает штатно (исторический прогон 02.09: 1317 passed), а выкинуть её —
      # потерять рабочие тесты, в т.ч. SSRF-страховку Reader (проверки приватных
      # адресов/схем через редирект — `ReaderService_*`, `SsrfGuardTests.*DnsFailed`).
      # На локальной Windows-машине с Proxifier Dns-категория падает средой, и там
      # прогоняют с дополнительным `--filter "Category!=Dns"` (рекомендация в CLAUDE.md,
      # раздел «Соглашения»); в CI этого фильтра быть НЕ должно.
      # Общий прогон по `.slnx`, а не по одному `.Tests.csproj`: вынесенные тестовые
      # проекты (`.Video.Tests`/`.Yandex.Tests`/`.Reader.Tests`, после Этапа 3) собираются
      # шагом Build выше и должны гоняться в том же гейте master — иначе их падения
      # пройдут мимо CI, ровно до первого прод-бага в перенесённом коде.
      # Blame-режим: молчание тестового процесса дольше 5 минут — VSTest снимает дамп,
      # пишет в лог ИМЕНА тестов, выполнявшихся в этот момент, и валит шаг. По mini-дампу
      # дедлок не разобрать (dumpasync требует метаданных, которых в mini нет) — берём full.
      # Порог 5 минут: обычный тест живёт <1 с, пять минут тишины — гарантированный труп,
      # а итерация диагностики втрое быстрее, чем с 15 минутами.
      # Флаги vstest-консоли (--diagnostic и пр.) сюда нельзя: dotnet test в MSBuild-режиме
      # передаёт их MSBuild как неизвестные свитчи (MSB1001).
        run: >
          dotnet test backend/ClaudeHomeServer.slnx --no-build
          --filter "Category!=Node"
          --blame-hang-timeout 5m --blame-hang-dump-type full
      # Дампы и Sequence.xml blame складывает в TestResults — при падении выгружаем,
      # иначе они умирают вместе с раннером. После Этапа 3 артефакты тестов идут
      # из корня slnx (а не из папки конкретного `.Tests.csproj`) — общий глоб
      # `backend/**/TestResults/**` ловит выгрузки всех проектов.
      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-artifacts
          path: backend/**/TestResults/**

  # ADR-016 2.5. Агент устройства (`backend/ClaudeHomeServer.DeviceAgent`) работает на
  # Linux и Windows, но основная задача `backend` гоняет только ubuntu-latest — платформенные
  # ветки (Job Object, DPAPI, `claude.cmd`, пути с буквами дисков, `FileSystemWatcher`)
  # проверялись бы только руками. Задача собирает и тестирует ТОЛЬКО DeviceAgent + .Tests
  # (не весь `slnx` — дорого и не нужно), отдельным прогоном на windows-latest. Общие
  # триггеры с `backend`, без `continue-on-error` — падение валит CI.
  device-agent-windows:
    name: DeviceAgent (windows)
    runs-on: windows-latest
    # 10 минут по требованию задачи: проект маленький (одна зависимость
    # `Microsoft.Extensions.Logging.Abstractions` плюс xunit), встроенный NuGet-кеш
    # `setup-dotnet` держит холодный старт ниже потолка. Превышение — сигнал поломки
    # кеша или неожиданной тяжёлой зависимости.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Тот же SDK, что у Linux-задачи `backend`: проекты на net10.0.
          dotnet-version: 10.0.x
          # Встроенный NuGet-кеш setup-dotnet: ключ по csproj двух проектов — попадание
          # в кеш не зависит от правок в остальной части репозитория. `cache: true` для
          # setup-dotnet работает на всех ОС, включая Windows.
          cache: true
          cache-dependency-path: |
            backend/ClaudeHomeServer.DeviceAgent/ClaudeHomeServer.DeviceAgent.csproj
            backend/ClaudeHomeServer.DeviceAgent.Tests/ClaudeHomeServer.DeviceAgent.Tests.csproj
      # Явный restore отдельным шагом: без него `dotnet build --no-restore` ниже упадёт
      # на отсутствующем project.assets.json — на чистом раннере obj/ нет. Тот же csproj,
      # что и Build, чтобы NuGet-кеш `setup-dotnet` (cache-dependency-path выше) попал
      # точно в прогрев. Вынос restore из build держит его лог читаемым при разборе падений.
      - name: Restore
        run: dotnet restore backend/ClaudeHomeServer.DeviceAgent.Tests/ClaudeHomeServer.DeviceAgent.Tests.csproj
      # Сборка тестового проекта (DeviceAgent.Tests) подтянет DeviceAgent по ProjectReference
      # транзитивно. Отдельный шаг сборки основного проекта не нужен — он уже в графе.
      # --no-restore обязателен: без него restore сольётся с build в один лог и провал
      # restore в общем потоке не разобрать.
      - name: Build
        run: dotnet build backend/ClaudeHomeServer.DeviceAgent.Tests/ClaudeHomeServer.DeviceAgent.Tests.csproj -warnaserror --no-restore
      # console;verbosity=normal — имена тестов в логе. Счётчик skipped валится глазами,
      # как требует задача: на windows-latest пропускаются `На_Unix_копия_исполняемая`
      # (права Unix) и `Платформа_Linux_определяется_ключом_манифеста` (ветка Linux), а
      # `Платформа_Windows_определяется_ключом_манифеста` — passed.
      - name: Test
        run: dotnet test backend/ClaudeHomeServer.DeviceAgent.Tests/ClaudeHomeServer.DeviceAgent.Tests.csproj --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # В коде ~116 существующих lint-ошибок — шаг информационный,
      # пока бэклог не расчищен; жёсткий гейт — typecheck и сборка
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
      - name: Build (tsc -b + vite)
        run: npm run build
      - name: Test
        run: npm test --if-present
