    run:`<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.6"/><circle cx="7" cy="7" r="2.4" fill="${c}"/>`,
    wait:`<circle cx="7" cy="7" r="6" fill="${c}"/><circle cx="7" cy="7" r="2" fill="var(--c-bg-white)"/>`,
    merge:`<circle cx="7" cy="7" r="6" fill="${c}"/><path d="M5 4v6M5 6.5c0 1.5 1.5 2.5 4 2.5" stroke="var(--c-bg-white)" stroke-width="1.4" fill="none"/>`,
    stop:`<path d="M7 1.2 13 12.2H1Z" fill="${c}"/><path d="M7 5v3.4M7 10v.4" stroke="var(--c-bg-white)" stroke-width="1.4"/>`,
    merged:`<circle cx="7" cy="7" r="6" fill="${c}"/><path d="m4.3 7.2 1.8 1.8 3.6-3.8" stroke="var(--c-bg-white)" stroke-width="1.5" fill="none"/>`,
    closed:`<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M3.3 10.7 10.7 3.3" stroke="${c}" stroke-width="1.6"/>`,
    empty:`<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.6" stroke-dasharray="1.4 2"/>`,
    idle:`<circle cx="7" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="1.6"/><path d="M5.6 5v4M8.4 5v4" stroke="${c}" stroke-width="1.6"/>`,
  }[kind];
  return `<svg width="${s}" height="${s}" viewBox="0 0 14 14" aria-hidden="true">${inner}</svg>`;
}
const PER = { kira:['Кира','К'], denis:['Денис','Д'], mark:['Марк','М'], me:['Вы','А'], alex:['Александр','А'], sofya:['Софья','С'] };
const av = k => `<span class="av h-${k}" aria-hidden="true">${PER[k][1]}</span>`;
const STAGES = ['Разрез','План','Производство','Ревью','Проверка','Финал','Мерж'];
/* run.state → строка карточки. k — номер этапа (1…7), cur — тон точки, who — один чип [персона, роль, куда ведёт]. */
const ST = {
  not_started:{ t:'не начата', g:'empty', tone:'neu', k:0, b:'Не начата', tx:'разрез впереди', who:null, none:'никто не работает' },
  running:{ t:'идёт', g:'run', tone:'now', k:3, b:'Производство', tx:'идёт', tm:'1 ч 10 мин', who:['kira','Ш3','Открыт чат Киры · Ш3'] },
  waiting:{ t:'ждёт вас', g:'wait', tone:'info', k:3, b:'Производство', tx:'ждёт вас', tm:'25 мин', who:['kira','Ш3 · вопрос','Открыт чат Киры: вопрос про чужие шаблоны'] },
  stopped:{ t:'стоит', g:'stop', tone:'danger', k:3, b:'Производство', tx:'стоит', tm:'12 мин', who:['denis','Ш2 · 529','Открыт чат Дениса: ошибка 529'] },
  merge_pending:{ t:'мерж ждёт согласия', g:'merge', tone:'info', k:7, b:'Мерж', tx:'ждёт согласия', tm:'40 мин', who:['me','решение за вами','Открыт попап: «Мерж…» с подтверждением'] },
  merging:{ t:'мерж идёт', g:'run', tone:'now', k:7, b:'Мерж', tx:'идёт', tm:'6 мин', who:['mark','мерж','Открыт чат Марка'] },
  merged:{ t:'смержена', g:'merged', tone:'success', k:8, b:'Смержена', tx:'20.10 · 21:09', who:null, none:'' },
  closed:{ t:'закрыта без мержа', g:'closed', tone:'neu', k:-1, b:'Закрыта без мержа', tx:'20.10 · 15:30', who:null, none:'' },
  idle:{ t:'простаивает', g:'idle', tone:'neu', k:3, b:'Производство', tx:'простаивает', tm:'1 ч', who:null, none:'никто не работает', isNew:true },
  plan:{ t:'план хода без фичи', plan:true },
};
const TODOS = [['Прочитать отчёт Глеба по Ш3','d'],['Запустить виток 3 Киры','d'],['Ответить Андрею в ключевом чате','a'],['Обновить план в эпике','t'],['Проверить ветку фичи','t']];
const S = { v:'A', st:'waiting', turns:1, theme:'light', dev:'d', pop:false, toast:null, snapOpen:{}, marks:true };
const isM = () => S.dev === 'm';
const tdone = () => TODOS.filter(t => t[1] === 'd').length;
const curTodo = () => (TODOS.find(t => t[1] === 'a') || [''])[0];
const toneCls = st => ({ info:'t-info', danger:'t-danger', success:'t-success', neu:'t-neu' })[st.tone] || '';
function stageWord(st) {
  if (st.k === 8) return '7 из 7';
  if (st.k <= 0) return st.k === 0 ? '0 из 7' : '';
  return `этап ${st.k} из 7`;
}
function dots(st) {
  return `<span class="dots" aria-hidden="true">${STAGES.map((_, i) => { const n = i + 1;
    const cls = st.k === 8 || (st.k === -1 && n <= 4) || n < st.k ? 'd' : n === st.k ? 'c ' + (st.tone === 'info' ? 'info' : st.tone === 'danger' ? 'danger' : st.tone === 'neu' ? 'neu' : '') : '';
    return `<i class="${cls}"></i>`; }).join('')}</span>`;
}
const chip = st => st.who
  ? `<button class="chip" data-act="who" data-tip="${st.who[2]}" aria-label="${PER[st.who[0]][0]}, ${st.who[1]}: ${st.who[2]}">${av(st.who[0])}${PER[st.who[0]][0]} <span class="r">· ${st.who[1]}</span></button>`
  : (st.none ? `<span class="chip none">${st.none}</span>` : '');
const more = (lab = 'Подробнее') => `<button class="more" data-act="pop" aria-haspopup="dialog" aria-label="${lab}: попап «Исполнение фичи»">${lab}${ic('chevR', 13)}</button>`;
const stx = st => `<span class="stx">${fg(st.g)}<b>${st.b}</b>${st.tx ? `<span>· ${st.tx}</span>` : ''}${st.tm ? `<span class="tm">· ${st.tm}</span>` : ''}</span>`;

/* ===== Вариант А: одна строка ===== */
function cardA(st) {
  if (st.plan) return `<div class="fc fcp" data-t="card" role="group" aria-label="План хода">${ic('sq', 14)}<span class="stx"><b>План хода</b></span><span class="now">· сейчас: ${curTodo()}</span>
    <span class="sp"></span><span class="pbar" aria-hidden="true"><i style="width:${tdone() / TODOS.length * 100}%"></i></span><span class="ptk">${tdone()} из ${TODOS.length}</span><span class="brk"></span>${more()}</div>`;
  return `<div class="fc ${toneCls(st)} ${st.isNew ? 'new' : ''}" data-t="card" role="group" aria-label="Фича: ${st.b} ${st.tx || ''}">${stx(st)}${stageWord(st) ? `<span class="wh">${stageWord(st)}</span>` : ''}<span class="sp"></span>${chip(st)}${more()}</div>`;
}
/* ===== Вариант Б: две строки (фича сверху, план хода снизу) ===== */
function cardB(st) {
  if (st.plan) return cardA(st);
  return `<div class="fc2 ${toneCls(st)} ${st.isNew ? 'new' : ''}" data-t="card" role="group" aria-label="Фича: ${st.b}">
    <div class="l1">${fg(st.g)}<b class="fn">Шаблоны чатов</b>${dots(st)}<span class="stx">${st.b}${st.tx ? ' · ' + st.tx : ''}${st.tm ? ' · ' + st.tm : ''}</span></div>
    <div class="l2">${chip(st)}<span class="ptk">${ic('sq', 12)} план хода ${tdone()}/${TODOS.length}</span><span class="sp" style="flex:1"></span>${more()}</div></div>`;
}
/* ===== Вариант В: карточки нет, чип в строке итога хода ===== */
function chipC(st) {
  if (st.plan) return `<button class="rchip" data-act="pop" data-t="card" aria-label="План хода ${tdone()} из ${TODOS.length}: открыть">${ic('list', 12)}<span><b>${tdone()}/${TODOS.length}</b> · ${curTodo()}</span></button>`;
  return `<button class="rchip ${toneCls(st)} ${st.isNew ? 'new' : ''}" data-act="pop" data-t="card" aria-label="Фича: ${st.b} ${st.tx || ''}. Открыть попап">${fg(st.g, 12)}<span><b>${st.b}</b>${st.tx ? ' · ' + st.tx : ''}${st.tm ? ' · ' + st.tm : ''}${st.who ? ' · ' + PER[st.who[0]][0] : ''}</span></button>`;
}
/* Снимок прошлого хода: одна строка без тона и без фичи — что было в плане хода к его концу. */
function snap(i, t) {
  const o = !!S.snapOpen[i];
  return `<button class="snap" data-act="snap" data-id="${i}" aria-expanded="${o}" data-t="snap"><span class="chv ${o ? 'o' : ''}">${ic('chevR', 12)}</span>${ic('sq', 13)}План хода <span class="mono">${t.done}/${t.all}</span> · ${t.when}<span style="margin-left:auto" class="mono">снимок</span></button>
    ${o ? `<div class="snapl">${t.items.map(([n, s]) => `<div class="todo ${s}"><i></i>${n}</div>`).join('')}</div>` : ''}`;
}
const PAST = [
  { when:'15:40', done:3, all:3, items:[['Принять Ш2 у Глеба','d'],['Запустить Ш3','d'],['Доложить в ключевой чат','d']] },
  { when:'16:12', done:4, all:4, items:[['Разобрать вопрос Киры','d'],['Переслать вопрос Андрею','d'],['Поставить сторожа на ответ','d'],['Обновить эпик','d']] },
  { when:'16:30', done:2, all:2, items:[['Прочитать возврат Глеба','d'],['Вернуть Ш3 Кире','d']] },
];
const TURN_TX = ['Глеб вернул Ш3: пустое состояние без текста. Запускаю виток 3 Киры и обновляю план.', 'Ш2 принят, Ш3 в работе. Кира спросила про чужие шаблоны — переслала вам.', 'Виток 3 запущен, жду сдачи.', 'Кира ждёт вашего ответа: показывать ли в галерее шаблоны других участников. Пока ответа нет, Ш4 не начинаем.'];
function turn(i, last) {
  const st = ST[S.st];
  const live = last;
  let card = '';
  if (S.v !== 'C') card = live ? (S.v === 'A' ? cardA(st) : cardB(st)) : snap(i, PAST[i % PAST.length]);
  const resChip = S.v === 'C' && live ? chipC(st) : '';
  return `${i ? `<div class="turnsep">ход ${i + 1}</div>` : ''}
    <div class="msg me">${i ? 'Дальше' : 'Как там шаблоны?'}</div>
    <div class="msg">${TURN_TX[(i + (last ? 3 : 0)) % TURN_TX.length]}</div>
    ${card}
    <div class="res" data-t="res">${ic('sq', 12)}<span>ход завершён · ${['2 мин','1 мин','40 с','3 мин'][i % 4]}</span>${resChip}</div>`;
}
function chat() {
  const st = ST[S.st];
  const N = +S.turns;
  const pa = st.plan ? '' : `<div class="pa ${st.tone === 'info' ? 'info' : st.tone === 'danger' ? 'danger' : ''}" data-t="panelA">${dots(st)}<b>Шаблоны чатов</b><span class="st">${st.b}${st.tx ? ' · ' + st.tx : ''}${st.tm ? ' · ' + st.tm : ''}</span>${isM() ? '' : '<span class="lab">панель А · утверждена</span>'}</div>`;
  const vn = { A:'<b>А · строка.</b> Одна строка на месте нынешней карточки: тон и этап, один чип, «Подробнее». Прошлые ходы — строка-снимок.',
    B:'<b>Б · две строки.</b> Сверху фича с точками этапов, снизу чип, план хода и «Подробнее». Прошлые ходы — строка-снимок.',
    C:'<b>В · в строке итога.</b> Карточки в ленте нет: чип в строке «ход завершён» последнего хода. Прошлые ходы — без следа.' }[S.v];
  return `<div class="isl center" data-t="chat">
    <div class="tb">${isM() ? `<span style="display:inline-flex;align-items:center;color:var(--c-text-secondary);min-height:40px">${ic('chevL', 18)}</span>` : ''}<span class="nm">Шаблоны чатов — куратор</span><span class="keyl">ключевой</span></div>
    ${pa}
    <div class="feed" id="feed"><div class="col">
      <div class="vnote" data-t="vnote">${vn}</div>
      ${Array.from({ length:N }, (_, i) => turn(i, i === N - 1)).join('')}
    </div></div>
    <div class="compose"><div>Сообщение…</div></div>
    ${S.pop ? popHtml(st) : ''}
    ${S.toast ? `<div class="toast" role="status" data-t="toast">${S.toast}</div>` : ''}</div>`;
}
function popHtml(st) {
  const r = document.querySelector('[data-t="card"]')?.getBoundingClientRect(), a = document.getElementById('frame')?.getBoundingClientRect();
  const top = r && a ? Math.max(8, Math.min(r.bottom - a.top + 6, a.height - 330)) : 120, left = r && a ? Math.max(8, Math.min(r.right - a.left - 380, a.width - 388)) : 400;
  return `<div class="ovl" data-act="ovl" data-t="pop"><div class="pop" role="dialog" aria-label="${st.plan ? 'План хода' : 'Исполнение фичи'}" style="top:${top}px;left:${left}px">
    <h3>${st.plan ? 'План хода' : 'Исполнение фичи · Шаблоны чатов'}</h3>
    ${st.plan ? '' : `<div class="stub">Тело попапа — по макету turn-plan-feature-popup-1.html: тег статуса, строка состояния, 7 этапов с исполнителями.</div>`}
    <div>${TODOS.map(([n, s]) => `<div class="todo ${s}"><i></i>${n}</div>`).join('')}</div>
    <div class="ft"><button class="btn gh" data-act="close">Закрыть</button>${st.plan ? '' : `<button class="btn pri" data-act="page">Страница фичи${ic('chevR', 13)}</button>`}</div></div></div>`;
}
function render() {
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('nomarks', !S.marks);
  const pill = (k, list) => `<div class="pills">${list.map(([v, t]) => `<button class="${String(S[k]) === String(v) ? 'on' : ''}" data-set="${k}" data-v="${v}">${t}</button>`).join('')}</div>`;
  document.getElementById('mk').innerHTML = `<h1>AI Home · карточка плана в ленте</h1>
    <span class="grp"><span class="lbl">Вариант</span>${pill('v', [['A','А · строка'],['B','Б · две строки'],['C','В · в итоге хода']])}</span>
    <span class="grp"><span class="lbl">run.state</span>${pill('st', Object.entries(ST).map(([k, v]) => [k, v.t]))}</span>
    <span class="grp"><span class="lbl">Ходов подряд</span>${pill('turns', [[1,'1'],[4,'4']])}</span>
    <span class="grp"><span class="lbl">Тема</span>${pill('theme', [['light','светлая'],['dark','тёмная']])}</span>
    <span class="grp"><span class="lbl">Ширина</span>${pill('dev', [['d','1280'],['m','360']])}</span>
    <span class="grp"><span class="lbl">Пометки</span>${pill('marks', [[true,'вкл'],[false,'выкл']])}</span>`;
  document.getElementById('note').innerHTML = '<b>Рекомендую А.</b> Сейчас на месте плана хода в ленте ключевого чата — карточка с переключателем «План хода | Исполнение фичи», выбором фичи, полным конвейером и подвалом «Задачи фичи в трекере». Здесь вместо неё одна строка: тон и этап как у панели А, один чип «кто сейчас», «Подробнее» — попап. Пунктир — нового состояния «простаивает» в продукте ещё нет.';
  const html = isM() ? `<div class="app m" id="frame">${chat()}</div>`
    : `<div class="app" id="frame"><div class="isl side"><div class="ttl">Чаты</div><div class="row on">${av('sofya')}Шаблоны чатов — куратор</div><div class="row">${av('kira')}Ш3 · Галерея шаблонов</div><div class="row">${av('denis')}Ш2 · Применение шаблона</div></div>${chat()}</div>`;
  document.getElementById('app').innerHTML = html;
  const f = document.getElementById('feed'); if (f) f.scrollTop = f.scrollHeight;
}
let toastT;
function toast(t) { S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 2400); }
document.addEventListener('click', e => {
  const s = e.target.closest('[data-set]');
  if (s) { let v = s.dataset.v; if (s.dataset.set === 'marks') v = v === 'true'; S[s.dataset.set] = v; S.pop = false; render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'ovl' && e.target !== a) return;
  if (act === 'pop') { S.pop = true; render(); render(); document.querySelector('.pop .btn')?.focus(); return; }
  if (act === 'close' || act === 'ovl') S.pop = false;
  if (act === 'page') { S.pop = false; toast('Открыта страница фичи · «Хронология»'); }
  if (act === 'who') toast(a.dataset.tip);
  if (act === 'snap') S.snapOpen[a.dataset.id] = !S.snapOpen[a.dataset.id];
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.pop) { S.pop = false; render(); document.querySelector('[data-act="pop"]')?.focus(); } });
render();
</script>
