<script>
const fmt = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60;
  if (!h) return r + ' мин'; if (!r) return h + ' ч'; return h + ' ч ' + String(r).padStart(2, '0') + ' мин'; };
const tok = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + 'М' : Math.round(n / 1000) + ' тыс.';
const usd = n => n == null ? '—' : n === 0 ? 'бесплатно' : '$' + n.toFixed(2).replace('.', ',');
const BE = t => ` <span class="be">нужны данные${t ? ': ' + t : ''}</span>`;

// g: [key, minutes, tokens, cost, chats:[[подпись, роль, архив?]], связи {models:[], roles:[], personas:[]}, live: 'run'|'wait'|null]
const RUN = {

    ['timur', 262, 3.1e6, 6.10, [['Ш1', 'шаг'], ['Ш2', 'шаг'], ['Ш2', 'доработка'], ['Ш5', 'шаг'], ['Ш6', 'шаг']], { models: ['opus'], roles: ['step', 'rework'] }, null],

  ],
  roles: [
    ['step', 470, 5.6e6, 8.20, [], { personas: ['timur', 'polina', 'denis'], models: ['opus', 'sonnet', 'qwen'] }],
    ['rework', 130, 1.6e6, 1.90, [], { personas: ['timur', 'denis'], models: ['opus', 'qwen'] }],
    ['review', 65, 1.4e6, 2.40, [], { personas: ['gleb'], models: ['opus'] }],
    ['plan', 60, 0.9e6, 1.10, [], { personas: ['egor'], models: ['sonnet'] }],
    ['cut', 18, 0.3e6, 0.30, [], { personas: ['sofya'], models: ['haiku'] }],
    // Роль feature — работа координатора на эпике: строка «координация», не прячется (сверка 25.10).
    ['feature', 12, 0.2e6, 0.20, [], { personas: ['sofya'], models: ['haiku'] }],
  ],
};
const MN = { opus: ['Opus 5.5', 'облако'], sonnet: ['Sonnet 5.5', 'облако'], qwen: ['Qwen 3.8', 'локальная · бесплатно'], haiku: ['Haiku 5.5', 'облако'] };
const RN = { step: ['шаг', ''], rework: ['доработка', ''], review: ['ревью', ''], plan: ['план', ''], cut: ['разрез', ''], feature: ['координация', ''], qa: ['проверка', ''], final: ['финал', ''], merge: ['мерж', ''] };
const clone = o => JSON.parse(JSON.stringify(o));
const WAIT = clone(RUN); WAIT.personas[1][6] = 'wait';
const MERGED = clone(RUN);
MERGED.personas.forEach(g => g[6] = null);
MERGED.personas.push(['vera', 40, 0.8e6, 2.30, [['Проверка', 'проверка', true]], { models: ['sonnet'], roles: ['qa'] }, null],
  ['kira', 45, 0.6e6, 0, [['Ш7', 'шаг', true]], { models: ['qwen'], roles: ['step'] }, null],
  ['alex', 45, 0.7e6, 1.40, [['Финал', 'финал', true]], { models: ['opus'], roles: ['final'] }, null]);
MERGED.personas[0][1] = 262; MERGED.personas[1][1] = 205; MERGED.personas[2][1] = 212; MERGED.personas[3][1] = 100; MERGED.personas[3][3] = 3.10;
MERGED.personas.sort((a, b) => b[1] - a[1]);
MERGED.models = [['opus', 407, 5.6e6, 10.90, [], { personas: ['timur', 'gleb', 'alex'], roles: ['step', 'rework', 'review', 'final'] }], ['sonnet', 245, 3.5e6, 7.70, [], { personas: ['polina', 'egor', 'vera'], roles: ['step', 'plan', 'qa'] }],
  ['qwen', 257, 2.5e6, 0, [], { personas: ['denis', 'kira'], roles: ['step', 'rework'] }], ['haiku', 48, 0.5e6, 0.50, [], { personas: ['sofya'], roles: ['cut', 'merge'] }]];
MERGED.roles = [['step', 560, 6.4e6, 9.90, [], { personas: ['timur', 'polina', 'denis', 'kira'], models: ['opus', 'sonnet', 'qwen'] }], ['rework', 150, 1.8e6, 2.10, [], { personas: ['timur', 'denis', 'polina'], models: ['opus', 'qwen', 'sonnet'] }],
  ['review', 100, 1.9e6, 3.10, [], { personas: ['gleb'], models: ['opus'] }], ['plan', 60, 0.9e6, 1.10, [], { personas: ['egor'], models: ['sonnet'] }], ['final', 45, 0.7e6, 1.40, [], { personas: ['alex'], models: ['opus'] }],
  ['qa', 40, 0.8e6, 2.30, [], { personas: ['vera'], models: ['sonnet'] }], ['cut', 18, 0.3e6, 0.30, [], { personas: ['sofya'], models: ['haiku'] }], ['merge', 30, 0.2e6, 0.20, [], { personas: ['sofya'], models: ['haiku'] }]];
MERGED.roles.sort((a, b) => b[1] - a[1]);
const THIN = { personas: [['sofya', 12, 0.1e6, 0.18, [['Разрез', 'разрез']], { models: ['haiku'], roles: ['cut'] }, 'run']], models: [['haiku', 12, 0.1e6, 0.18, [], { personas: ['sofya'], roles: ['cut'] }]], roles: [['cut', 12, 0.1e6, 0.18, [], { personas: ['sofya'], models: ['haiku'] }]] };
const NOCOST = clone(RUN); for (const ax of ['personas', 'models', 'roles']) NOCOST[ax].forEach(g => { g[2] = null; g[3] = null; });
NOCOST.nocost = true;
const DATA = { running: RUN, waiting: WAIT, merged: MERGED, thin: THIN, nocost: NOCOST };
const AXN = { personas: 'персоны', models: 'модели', roles: 'роли' };

function nameOf(ax, k) { return ax === 'personas' ? PN[k] : ax === 'models' ? MN[k] : RN[k]; }
function colorOf(ax, k, i) { return ax === 'personas' ? PC[k] : PAL[i % PAL.length]; }
function markOf(ax, k, i) {
  return ax === 'personas' ? `<span class="av" style="background:${PC[k]}">${PN[k][0][0]}</span>` : `<span class="sw" style="background:${colorOf(ax, k, i)}"></span>`;
}
function liveChip(g) { return g[6] === 'run' ? '<span class="chip t-run"><span class="d live"></span>работает</span>' : g[6] === 'wait' ? '<span class="chip t-wait"><span class="d"></span>ждёт вас</span>' : ''; }
const MET = { time: 1, tokens: 2, cost: 3 };
const MET_GEN = { time: 'времени', tokens: 'токенов', cost: 'денег' };
// Действующая мера: без учёта расхода — время (как effectiveMeasure в коде).
const effMet = D => D.nocost ? 'time' : st.me;
const valOf = (g, met) => met === 'time' ? g[1] : met === 'tokens' ? (g[2] || 0) : (g[3] || 0);
const fmtVal = (g, met) => met === 'time' ? fmt(g[1]) : met === 'tokens' ? tok(g[2]) : usd(g[3]);
function metSeg(D, met, m) {
  const off = D.nocost ? 'off' : '';
  met = st.v === 'C' ? effMet(D) : met;
  return `<span class="seg"><span class="${met === 'time' ? 'on' : ''}">время</span><span class="${met === 'tokens' ? 'on' : ''} ${off}" title="${off ? 'нет учёта расхода' : ''}">токены</span><span class="${met === 'cost' ? 'on' : ''} ${off}">деньги</span></span>`;
}
function axSeg(ax) { return `<span class="seg">${Object.keys(AXN).map(k => `<span class="${k === ax ? 'on' : ''}">${AXN[k]}</span>`).join('')}</span>`; }
function partial(D) { return D.nocost ? `<div class="partial">Токены и деньги недоступны: у этой фичи нет учёта расхода. Доли — по времени.</div>` : ''; }
// Чаты выбранной группы: подпись = шаг · роль (executors[].chatId ↔ stepRef/taskRole), а не обрезанный id.
function chatsOf(D, ax, g) {
  let list = g[4];
  if (ax !== 'personas') { list = []; for (const p of D.personas) if ((g[5].personas || []).includes(p[0])) for (const c of p[4]) if (ax === 'models' || RN[g[0]][0] === c[1].split(' ')[0]) list.push(c.concat([p[0]])); }
  if (!list.length) return '';
  const nm = nameOf(ax, g[0])[0];
  return `<div class="chats"><h5>Чаты · ${nm} <span class="muted" style="font-weight:400">${list.length}</span></h5><div class="list">${list.slice(0, 6).map(c =>
    `<button class="chat ${c[2] ? 'arch' : ''}">${c[3] ? `<span class="av" style="background:${PC[c[3]]};width:18px;height:18px">${PN[c[3]][0][0]}</span>` : ''}<span class="ref">${c[0]}</span><span>${c[1]}</span>${c[2] ? '<span class="muted" style="font-size:10px">в архиве</span>' : ''}<span class="go">чат →</span></button>`).join('')}</div>
    ${list.length > 6 ? `<div class="muted" style="font-size:11px;margin-top:6px">ещё ${list.length - 6}</div>` : ''}</div>`;
}
function head(ax, D, m, extra) {
  return `<div class="bh"><span class="t">Кто и на чём работал</span>${extra || ''}${axSeg(ax)}${metSeg(D, 'time', m)}</div>${partial(D)}`;
}
function emptyBlock() { return `<div class="empty"><b>Пока нечего разрезать</b>Разрезы появятся, когда исполнителей станет больше одного. Сейчас работает только Софья — разрез, 12 мин.</div>`; }

// ===== A · Кольцо =====
function renderA(D, ax, m) {
  const gs = D[ax];
  if (gs.length < 2) return `<div class="card">${head(ax, D, m)}${emptyBlock()}</div>`;
  const tot = gs.reduce((a, g) => a + g[1], 0);
  const R = 70, L = 2 * Math.PI * R; let off = 0;
  const arcs = gs.map((g, i) => { const len = g[1] / tot * L; const gap = 3;
    const s = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${colorOf(ax, g[0], i)}" stroke-width="${i === 0 ? 26 : 20}" stroke-dasharray="${Math.max(0, len - gap)} ${L}" stroke-dashoffset="${-off}"/>`; off += len; return s; }).join('');
  const sel = gs[0];
  const cost = D.nocost ? null : gs.reduce((a, g) => a + (g[3] || 0), 0);
  const ring = `<div class="a-ring"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--c-bg-selected)" stroke-width="20"/>${arcs}</svg>
    <div class="c"><b>${fmt(tot).replace(' ч ', ' ч<br>')}</b><span>${AXN[ax]} суммарно${cost != null ? ' · ' + usd(cost) : ''}</span></div></div>`;
  const rows = gs.map((g, i) => { const [n, sub] = nameOf(ax, g[0]);
    return `<button class="a-row ${g === sel ? 'sel' : ''}">${markOf(ax, g[0], i)}<span class="nm">${n}${sub ? `<small>${sub}</small>` : ''}${ax === 'personas' ? liveChip(g) : ''}</span>
      <span class="v">${fmt(g[1])}</span><span class="x2">${D.nocost ? '' : tok(g[2]) + ' · ' + usd(g[3])}</span><span class="p">${Math.round(g[1] / tot * 100)} %</span></button>`; }).join('');
  return `<div class="card">${head(ax, D, m)}<div class="a-wrap">${ring}<div class="a-list">${rows}</div></div>${chatsOf(D, ax, sel)}</div>`;
}

// ===== B · Три полосы =====
function renderB(D, ax, m) {
  if (D.personas.length < 2) return `<div class="card"><div class="bh"><span class="t">Кто и на чём работал</span>${metSeg(D, 'time', m)}</div>${emptyBlock()}</div>`;
  const sel = D[ax][0];
  const rel = sel[5];
  const bars = ['personas', 'models', 'roles'].map(a => {
    const gs = D[a]; const tot = gs.reduce((s, g) => s + g[1], 0);
    const isSel = a === ax;
    const on = g => isSel ? g === sel : (rel[a] || []).includes(g[0]);
    const segs = gs.map((g, i) => { const c = colorOf(a, g[0], i); const w = g[1] / tot * 100;
      const lbl = w > (m ? 22 : 9) ? `${nameOf(a, g[0])[0]}${w > (m ? 34 : 14) ? ` <span style="opacity:.8;font-weight:500">${Math.round(w)} %</span>` : ''}` : '';
      return `<i class="${on(g) ? (isSel ? 'sel' : '') : 'dim'} ${LIGHT.has(c) ? 'light' : ''}" style="flex:${g[1]};background:${c}" title="${nameOf(a, g[0])[0]} · ${fmt(g[1])}">${lbl}</i>`; }).join('');
    const leg = gs.map((g, i) => `<span class="${on(g) ? '' : 'dim'}">${a === 'personas' ? `<span class="av" style="background:${PC[g[0]]};width:14px;height:14px;font-size:8px">${PN[g[0]][0][0]}</span>` : `<span class="sw" style="background:${colorOf(a, g[0], i)};width:10px;height:10px"></span>`}${nameOf(a, g[0])[0]} <b>${fmt(g[1])}</b>${a === 'personas' && g[6] ? ` <span class="${g[6] === 'run' ? 'live' : ''}" style="color:${g[6] === 'run' ? 'var(--c-accent)' : 'var(--c-info)'}">●</span>` : ''}</span>`).join('');
    return `<div class="b-axis"><div class="b-al">${AXN[a][0].toUpperCase() + AXN[a].slice(1)}<span>${fmt(tot)}${D.nocost ? '' : ' · ' + usd(gs.reduce((s, g) => s + (g[3] || 0), 0))}</span></div><div class="b-bar">${segs}</div><div class="b-leg">${leg}</div></div>`;
  }).join('');
  const [sn] = nameOf(ax, sel[0]);
  const link = `<div class="b-link" style="margin:0 0 14px">Выбрано: <b style="color:var(--c-text-heading)">${sn}</b> — в других полосах подсвечено, где ${ax === 'personas' ? 'он работал' : 'это встречается'}. Связь — без минут${BE('время по парам «персона × модель», «персона × роль»')}</div>`;
  return `<div class="card"><div class="bh"><span class="t">Кто и на чём работал</span>${metSeg(D, 'time', m)}</div>${partial(D)}${link}${bars}${chatsOf(D, ax, sel)}</div>`;
}

// ===== C · Таблица =====
function renderC(D, ax, m) {
  // Единый выбор (сверка 25.10): мера шапки = сортировка таблицы и карточек = доля в карточке;
  // клик по заголовку колонки на 1280 переключает ту же меру в шапке.
  const met = effMet(D), K = MET[met];
  const gs = D[ax].slice().sort((a, b) => (b[K] || 0) - (a[K] || 0));
  if (gs.length < 2) return `<div class="card">${head(ax, D, m)}${emptyBlock()}</div>`;
  const mx = k => Math.max(...gs.map(g => g[k] || 0), 1);
  const tot = k => gs.reduce((a, g) => a + (g[k] || 0), 0);
  const sel = gs[0];
  const rel = (g) => ax === 'personas' ? [...(g[5].models || []).map(x => `<span class="mdl">${MN[x][0]}</span>`), ...(g[5].roles || []).map(x => `<span class="mdl">${RN[x][0]}</span>`)].join('')
    : (g[5].personas || []).map(x => `<span class="av" style="background:${PC[x]};width:18px;height:18px;font-size:9px" title="${PN[x][0]}">${PN[x][0][0]}</span>`).join('');
  const cell = (g, k, i) => { const v = g[k]; const c = colorOf(ax, g[0], i);
    if (v == null) return `<div class="c-cell"><span class="muted" style="font-size:11px">нет учёта</span></div>`;
    return `<div class="c-cell"><span class="bar"><i style="width:${v / mx(k) * 100}%;background:${c}"></i></span><span class="v">${k === 1 ? fmt(v) : k === 2 ? tok(v) : usd(v)} <small>${Math.round(v / (tot(k) || 1) * 100)}%</small></span></div>`; };
  if (m) {
    const rows = gs.map((g, i) => { const [n] = nameOf(ax, g[0]);
      const ms = [[1, 'время'], [2, 'токены'], [3, 'деньги']].map(([k, l]) => g[k] == null ? `<span>${l}</span><span class="muted">нет учёта</span><span></span>` :
        `<span>${l}</span><span class="bar"><i style="width:${g[k] / mx(k) * 100}%;background:${colorOf(ax, g[0], i)}"></i></span><span class="v">${k === 1 ? fmt(g[k]) : k === 2 ? tok(g[k]) : usd(g[k])}</span>`).join('');
      return `<button class="c-mr ${g === sel ? 'sel' : ''}"><div class="top">${markOf(ax, g[0], i)}${n}${ax === 'personas' ? liveChip(g) : ''}<span class="p">${Math.round((g[K] || 0) / (tot(K) || 1) * 100)} %</span></div>
        <div class="c-chips" style="margin-top:6px">${rel(g)}</div><div class="ms">${ms}</div></button>`; }).join('');
    return `<div class="card">${head(ax, D, m)}<div class="muted" style="font-size:11px;margin-bottom:8px">По убыванию ${MET_GEN[met]} · сортировка — в шапке</div><div class="c-m">${rows}</div>${chatsOf(D, ax, sel)}</div>`;
  }
  const relTitle = ax === 'personas' ? 'Модели и роли' : 'Кто';
  const rows = gs.map((g, i) => { const [n, sub] = nameOf(ax, g[0]);
    return `<tr class="${g === sel ? 'sel' : ''}"><td><div class="c-nm">${markOf(ax, g[0], i)}<div>${n}${sub ? `<small>${sub}</small>` : ''}</div>${ax === 'personas' ? liveChip(g) : ''}</div></td>
      <td><div class="c-chips">${rel(g)}</div></td><td>${cell(g, 1, i)}</td><td>${cell(g, 2, i)}</td><td>${cell(g, 3, i)}</td><td style="text-align:right"><span style="color:var(--c-accent);font-size:12px;font-weight:600">${(g[4].length || '') && g[4].length + ' чат.'} ›</span></td></tr>`; }).join('');
  const totRow = `<tr class="c-tot"><td>Всего</td><td></td><td class="mono">${fmt(tot(1))}</td><td class="mono">${D.nocost ? '—' : tok(tot(2))}</td><td class="mono">${D.nocost ? '—' : usd(tot(3))}</td><td></td></tr>`;
  return `<div class="card">${head(ax, D, m, '')}<table class="c-tab"><thead><tr><th>${AXN[ax]}</th><th>${relTitle}</th>${[['time', 'время'], ['tokens', 'токены'], ['cost', 'деньги']].map(([k, l]) => `<th class="${k === met ? 's' : ''}">${l}</th>`).join('')}<th></th></tr></thead><tbody>${rows}${totRow}</tbody></table>${chatsOf(D, ax, sel)}</div>`;
}

const st = { v: 'A', s: 'running', a: 'personas', me: 'time', t: 'both', w: 'both', m: 'on' };
const NOTES = {
  A: 'A · «Кольцо»: доля группы — кольцом с итогом в центре, рядом список: время, токены, деньги, %. Самая крупная группа выбрана и раскрывает чаты с подписями шагов. Живые персоны отмечены «работает» / «ждёт вас».',
  B: 'B · «Три полосы»: все три разреза сразу, каждый — полоса 100 %. Выбор группы в одной полосе подсвечивает связанное в двух других (Тимур → Opus 5.5 → шаг, доработка). Переключатель разреза не нужен.',
  C: 'C · «Таблица»: строка на группу, время, токены и деньги видны одновременно — полосами в ячейках с долей; колонка «модели и роли» связывает разрезы; итоговая строка. На 360 — карточки с тремя мини-полосами.',
};
function render() {
  document.body.classList.toggle('nomarks', st.m === 'off');
  document.getElementById('note').textContent = NOTES[st.v];
  const D = DATA[st.s];
  const themes = st.t === 'both' ? ['light', 'dark'] : [st.t];
  const widths = st.w === 'both' ? ['1280', '360'] : [st.w];
  const fn = { A: renderA, B: renderB, C: renderC }[st.v];
  const out = [];
  for (const w of widths) for (const t of themes)
    out.push(`<div class="w${w}"><div class="cap">${st.v} · ${AXN[st.a]} · ${w} · ${t === 'light' ? 'светлая' : 'тёмная'}</div>
      <div class="frame" data-theme="${t}"><div class="page"><div class="above">… выше — герой, плитки, «Главные потери» и этапы (feature-stats-5, вариант A)</div>${fn(D, st.a, w === '360')}</div></div></div>`);
  document.getElementById('out').innerHTML = out.join('');
}
document.querySelectorAll('.pills').forEach(p => p.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  p.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  st[p.dataset.k] = b.dataset.v; render();
}));
// #B-merged-dark-360-models — вариант, состояние, тема, ширина, разрез.
const h = location.hash.slice(1).split('-');
if (h[0]) { st.v = h[0]; st.s = h[1] || st.s; st.t = h[2] || st.t; st.w = h[3] || st.w; st.a = h[4] || st.a;
  document.querySelectorAll('.pills').forEach(p => p.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === st[p.dataset.k]))); }
render();
</script>
</body>
