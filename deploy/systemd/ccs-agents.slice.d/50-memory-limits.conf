# Пределы памяти на ccs-agents.slice — основная защита от oomd.
#
# MemoryHigh — дросселирование: процессы внутри slice получают замедление
# аллокатора, но не убиваются. Это даёт сборкам внутри ходов
# (testhost/dotnet build, потомки процесса claude CLI) шанс остыть до того,
# как oomd выберет жертву.
#
# MemoryMax — жёсткий потолок: при превышении ядро кикает процессы в slice.
#
# Значения МАШИННО-СПЕЦИФИЧНЫЕ — см. deploy/systemd/README.md (как считать под
# свою машину) и подставьте свои. Эти числа взяты под эту машину
# (60 GB RAM; рядом живут qemu ~16.7 GB и vLLM ~6-7 GB).
[Slice]
MemoryHigh=18G
MemoryMax=24G
