<!--

  черновик 19.11), поэтому здесь раскладка, состав и состояния, без полировки.
  Эпик 45af8178-8435-4746-8f13-bd3cc781585e, задача 5eb76cc9 (role=design). Записка — kids-subject-folder-proposal.md.
  Заменяет детскую рельсу «Материалы» (kids-materials-rail.html, отклонена поправкой Андрея 19.11).
  Детская сторона: взрослая рельса «Файлы» (FileExplorer + FileViewer) по папке проекта-предмета,
  встроенная в детский экран предмета и урока. Сторона куратора: та же папка в окне настроек
  (kids-settings-window.html, блок «Папка предмета») и в общем проекте обычными рельсами «Файлы» и «Знания».
  Только var(--c-*) из theme.css; сырой hex — лишь в блоке темы.
-->

*{box-sizing:border-box}
body{margin:0;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--c-bg-inset);color:var(--c-text-primary)}
svg.i{display:inline-block;vertical-align:-3px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pult{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:8px 16px;background:var(--c-bg-panel);border-bottom:1px solid var(--c-border);font-size:12px;color:var(--c-text-secondary)}
.pill{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--c-bg-selected)}
.pill button{border:none;cursor:pointer;background:transparent;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--c-text-secondary)}
.pill button[aria-pressed="true"]{background:var(--c-bg-white);color:var(--c-text-heading)}
.wrap{max-width:1320px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:28px}
h2{margin:0;font-family:'PT Serif',Georgia,serif;font-size:22px;font-weight:500;color:var(--c-text-heading)}
.sub{font-size:13px;color:var(--c-text-muted);margin-top:4px;line-height:1.5;max-width:900px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12px;font-weight:600;color:var(--c-text-heading);margin-bottom:6px}
.cap span{display:block;font-weight:400;color:var(--c-text-muted);margin-top:2px}

/* Каркасы раскладки */
.lay{border:1px solid var(--c-border);border-radius:12px;background:var(--c-bg-main);overflow:hidden;display:flex;flex-direction:column;font-size:11px;color:var(--c-text-secondary)}
.lay .hd{height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--c-border-light);background:var(--c-bg-panel)}
.lay .bd{flex:1;display:flex;gap:6px;padding:6px;position:relative}
.blk{border:1.5px dashed var(--c-dashed);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;color:var(--c-text-muted)}
.blk.rail{border-style:solid;border-color:var(--c-accent);background:var(--c-accent-light);color:var(--c-accent);font-weight:600}
.scrim{position:absolute;inset:0;background:var(--c-overlay)}

/* Мини-кадр 360 с рельсой */
.cell{width:340px}
.fr{width:340px;height:560px;border-radius:14px;overflow:hidden;background:var(--c-bg-panel);border:1px solid var(--c-border-light);box-shadow:var(--shadow-card);display:flex;flex-direction:column;position:relative}
.fh{min-height:44px;display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--c-border);background:var(--c-bg-main);font-size:14px;font-weight:600;color:var(--c-text-heading)}
.fh .sp{flex:1}
.ib{width:36px;height:36px;border-radius:8px;border:none;background:transparent;color:var(--c-text-muted);display:grid;place-items:center;cursor:pointer}
.fb{flex:1;overflow:hidden;padding:8px;display:flex;flex-direction:column;gap:6px}
.seen{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--c-info-bg);color:var(--c-text-primary);font-size:12px}
.tb{display:flex;gap:6px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-bg-white);font-size:13px;font-weight:600;color:var(--c-text-secondary)}
.b.p{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent)}
.b.dg{background:var(--c-danger);border-color:var(--c-danger);color:var(--c-on-dark)}
.b.f{flex:1}
.tr{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 6px;border-radius:8px;font-size:13px;color:var(--c-text-primary)}
.tr.in{padding-left:26px}
.tr.sel{background:var(--c-bg-selected)}
.tr .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .lk{color:var(--c-text-muted)}
.tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;white-space:nowrap}
.tag.ro{background:var(--c-bg-inset);color:var(--c-text-secondary)}
.tag.hid{background:var(--c-warning-bg);color:var(--c-warning-text)}
.tag.kid{background:var(--c-accent-light);color:var(--c-accent)}
.tag.tut{background:var(--c-info-bg);color:var(--c-info)}
.menu{position:absolute;right:12px;width:220px;background:var(--c-bg-card);border:1px solid var(--c-border);border-radius:12px;box-shadow:var(--shadow-island);padding:4px;z-index:3}
.mi{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--c-text-primary)}
.mi.dg{color:var(--c-danger-text)}
.mi.off{color:var(--c-text-muted)}
.sep{height:1px;background:var(--c-border-light);margin:4px 0}
.view{flex:1;border-radius:10px;border:1px solid var(--c-border-light);background:var(--c-bg-white);display:grid;place-items:center;color:var(--c-text-muted);font-size:12px;text-align:center;padding:8px}
.note{font-size:12px;line-height:1.45;padding:8px;border-radius:8px;border:1px solid}
.note.info{background:var(--c-info-bg);border-color:var(--c-info)}
.note.warn{background:var(--c-warning-bg);border-color:var(--c-warning);color:var(--c-warning-text)}
.dlg{position:absolute;left:0;right:0;bottom:0;background:var(--c-bg-card);border-radius:18px 18px 0 0;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-modal);z-index:4}
.dlg h3{margin:0;font-family:'PT Serif',Georgia,serif;font-size:18px;font-weight:500;color:var(--c-text-heading)}
.dlg p{margin:0;font-size:13px;line-height:1.5;color:var(--c-text-secondary)}
.msg{align-self:flex-end;max-width:85%;background:var(--c-bg-white);border:1px solid var(--c-border-light);border-radius:14px 14px 4px 14px;padding:8px 10px;font-size:14px}
.att{display:flex;gap:6px;align-items:center;padding:6px;border-radius:8px;background:var(--c-bg-card);border:1px solid var(--c-border-light);font-size:12px;margin-bottom:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--c-text-secondary)}
.tbl{border-collapse:collapse;font-size:13px;background:var(--c-bg-card);border-radius:12px;overflow:hidden;min-width:min(100%,900px)}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--c-border-light);text-align:left;vertical-align:top}
.tbl th{background:var(--c-bg-panel);font-size:12px;color:var(--c-text-secondary)}
</style>
</head>
<body>
<div class="pult"><b style="color:var(--c-text-heading)">Тема</b><div class="pill"><button id="tl" aria-pressed="true" onclick="th('light')">Светлая</button><button id="td" aria-pressed="false" onclick="th('dark')">Тёмная</button></div>
  <span>Схема для разреза — состав рельсы может поменяться</span></div>
<div class="wrap" id="root"></div>
<script>
const P = {
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',

  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  left:'<path d="m15 18-6-6 6-6"/>', down:'<path d="m6 9 6 6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  undo:'<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
  pen:'<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

const ic = (n, s = 16) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24">${P[n]}</svg>`;
function th(t) { document.documentElement.setAttribute('data-theme', t); document.getElementById('tl').setAttribute('aria-pressed', t === 'light'); document.getElementById('td').setAttribute('aria-pressed', t === 'dark'); }

/* Дерево папки «Математика» глазами ребёнка: Для репетитора/, .ccs-text/, .ccs-trash/ не показываются */
const kidTree = (opt = {}) => `
  <div class="tr">${ic('down', 14)}${ic('folder')}<span class="n"><b>Материалы</b></span><span class="tag ro">${ic('lock', 11)} только чтение</span></div>
  <div class="tr in">${ic('file')}<span class="n">Таблица умножения.pdf</span><span class="lk">${ic('lock', 14)}</span></div>
  <div class="tr in">${ic('file')}<span class="n">Меры длины.xlsx</span><span class="lk">${ic('lock', 14)}</span></div>
  <div class="tr">${ic('down', 14)}${ic('folder')}<span class="n">Домашка</span></div>
  <div class="tr in ${opt.sel === 'hw' ? 'sel' : ''}">${ic('image')}<span class="n">Домашка 19 ноября.jpg</span>${ic('more', 16)}</div>
  <div class="tr in">${ic('file')}<span class="n">Задача 3 — решение.md</span>${ic('more', 16)}</div>
  <div class="tr ${opt.sel === 'note' ? 'sel' : ''}">${ic('file')}<span class="n">Что я не поняла.md</span>${ic('more', 16)}</div>
  <div class="tr">${ic('file')}<span class="n">Доклад про скорость.pptx</span>${ic('more', 16)}</div>
  <div class="tr" style="margin-top:4px;border-top:1px solid var(--c-border-light);border-radius:0">${ic('trash')}<span class="n">Корзина</span><span class="tag ro">2</span>${ic('right', 14)}</div>`;
const railHead = (t = 'Файлы · Математика', back) => `<div class="fh">${back ? `<button class="ib">${ic('left', 18)}</button>` : ic('folder')}<span class="sp">${t}</span><button class="ib">${ic('x', 18)}</button></div>`;
const seen = `<div class="seen">${ic('eye', 14)}Эту папку видят: ты, Андрей, Ольга</div>`;
const tools = `<div class="tb"><span class="b f">${ic('upload')}Загрузить</span><span class="b">${ic('plus')}Файл</span><span class="b">${ic('search')}</span></div>`;

const cells = [
  ['1 · Список', 'Взрослый FileExplorer: дерево папки предмета. «Материалы» под замком, «Для репетитора» не видна вовсе.',
    `${railHead()}<div class="fb">${seen}${tools}${kidTree()}</div>`],
  ['2 · Пусто', 'Новая папка предмета: «Материалы» может быть пустой, своих файлов нет.',
    `${railHead()}<div class="fb">${seen}${tools}<div class="tr">${ic('folder')}<span class="n"><b>Материалы</b></span><span class="tag ro">${ic('lock', 11)} только чтение</span></div>
      <div class="view" style="flex:0 0 200px">Тут пока пусто.<br>Сфотографируй домашку или создай файл — его сможешь отправить в урок.</div></div>`],
  ['3 · Меню своего файла', 'Своё: всё, что есть у взрослого, кроме закрытых ручек (diff, revert, git).',
    `${railHead()}<div class="fb">${seen}${tools}${kidTree({ sel:'hw' })}</div>
      <div class="menu" style="top:236px">${[['eye','Открыть'],['send','Отправить в урок'],['download','Скачать'],['pen','Переименовать']].map(([i, l]) => `<div class="mi">${ic(i)}${l}</div>`).join('')}<div class="sep"></div><div class="mi dg">${ic('trash')}Удалить в корзину</div></div>`],
  ['4 · Меню файла из «Материалов»', 'Только чтение: «Переименовать» и «Удалить» нет совсем, а не серые.',
    `${railHead()}<div class="fb">${seen}${tools}${kidTree()}</div>
      <div class="menu" style="top:186px">${[['eye','Открыть'],['send','Отправить в урок'],['download','Скачать']].map(([i, l]) => `<div class="mi">${ic(i)}${l}</div>`).join('')}<div class="sep"></div><div class="mi off">${ic('lock')}Это от взрослых — только читать</div></div>`],
  ['5 · Просмотр: картинка / PDF', 'FileViewer внутри рельсы (stream). Кнопка «Отправить в урок» — в шапке просмотра.',
    `${railHead('Домашка 19 ноября.jpg', true)}<div class="fb"><div class="view">${ic('image', 40)}<br>картинка или страница PDF<br>листание страниц у PDF</div><div class="tb"><span class="b p f">${ic('send')}Отправить в урок</span><span class="b">${ic('more')}</span></div></div>`],
  ['6 · Просмотр: офис', 'Текст из .ccs-text, оригинал — скачать.',
