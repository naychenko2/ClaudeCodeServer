<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт куратора — жизненный цикл фичи от идеи до релиза · макет v2</title>
<style>
/* ===== Токены: значения из frontend/src/lib/theme.css, семантика — C.* из design.ts ===== */
:root {
  --c-bg-main:#F4F0E8; --c-bg-panel:#EDE7DC; --c-bg-card:#FBF8F2; --c-bg-white:#FFFFFF;
  --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E;
  --c-on-accent:#FBF8F2; --c-on-dark:#FFFFFF;
  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5; --c-accent-soft:#E8A990;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-divider:#DDD4C4; --c-dashed:#D0C6B4; --c-track:#D8CFBE;
  --c-progress-track:#D8CFBE;
  --c-overlay:rgba(23,19,15,.42);
  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;
  --c-warning:#C9923E; --c-warning-bg:#FBEFE0; --c-warning-text:#8A6A28; --c-on-warning:#201C18;
  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F; --c-danger-border:#F5C6BF;
  --c-info:#3E7CA6; --c-info-bg:#E7EFF5;
  --c-diff-add-bg:#E8F5E9; --c-diff-add-text:#1B5E20; --c-diff-rem-bg:#FFEBEE; --c-diff-rem-text:#B71C1C;
  --shadow-focus:0 0 0 3px rgba(217,119,87,.14);
  --shadow-card:0 2px 8px rgba(60,50,35,.05);
  --shadow-island:0 1px 2px rgba(60,50,35,.06),0 6px 20px rgba(60,50,35,.10);
  --shadow-dropdown:0 8px 28px rgba(60,50,35,.16);
  --shadow-modal:0 24px 60px rgba(23,19,15,.40);
  --shadow-peek:0 2px 6px rgba(60,50,35,.14),0 20px 48px rgba(23,19,15,.32);
  --shadow-sheet:0 -8px 40px rgba(23,19,15,.22);
  --shadow-button:0 4px 14px rgba(217,119,87,.30);
  --shadow-thumb:0 1px 3px rgba(42,37,31,.12);
  --shadow-press:inset 0 1px 3px rgba(60,50,35,.12);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(217,119,87,.13),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.10),transparent 60%);
}
[data-theme="dark"] {
  --c-bg-main:#201C18; --c-bg-panel:#272320; --c-bg-card:#2E2A25; --c-bg-white:#2E2A25;
  --c-bg-selected:#38332D; --c-bg-inset:#1B1815;
  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072;
  --c-on-accent:#201C18; --c-on-dark:#FFFFFF;
  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C; --c-accent-soft:#9A5E48;
  --c-border:#3D3830; --c-border-light:#34302A; --c-divider:#454037; --c-dashed:#4A443B; --c-track:#453F37;
  --c-progress-track:#5C544A;
  --c-overlay:rgba(0,0,0,.62);
  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;
  --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E; --c-on-warning:#201C18;
  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72; --c-danger-border:#5A302A;
  --c-info:#5FA0CC; --c-info-bg:#1E2A33;
  --c-diff-add-bg:#1E2E1E; --c-diff-add-text:#8FCB79; --c-diff-rem-bg:#33201E; --c-diff-rem-text:#EE8A72;
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-island:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.45);
  --shadow-dropdown:0 10px 32px rgba(0,0,0,.55);
  --shadow-modal:0 28px 70px rgba(0,0,0,.65);
  --shadow-peek:0 2px 8px rgba(0,0,0,.50),0 24px 56px rgba(0,0,0,.68);
  --shadow-sheet:0 -10px 46px rgba(0,0,0,.55);
  --shadow-button:0 4px 16px rgba(227,138,106,.34);
  --shadow-thumb:0 1px 3px rgba(0,0,0,.45);
  --shadow-press:inset 0 1px 4px rgba(0,0,0,.38);
  --canvas-glow:radial-gradient(140% 70% at 50% 0%,rgba(227,138,106,.11),transparent 55%),radial-gradient(120% 60% at 50% 110%,rgba(110,140,120,.08),transparent 60%);
}
* { box-sizing:border-box; }
html,body { margin:0; }
body {
  background:var(--c-bg-main); color:var(--c-text-primary);
  font-family:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif; font-size:13px; line-height:1.45;
}
button { font:inherit; }
.serif { font-family:"PT Serif",Georgia,serif; letter-spacing:-.01em; }
.mono { font-family:"JetBrains Mono","Courier New",monospace; }

/* ===== Обвязка макета (не часть продукта) ===== */
.mk {
  position:sticky; top:0; z-index:2000; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
  padding:10px 16px; background:var(--c-bg-panel); border-bottom:1px solid var(--c-border);
}
.mk h1 { margin:0; font-size:15px; font-weight:600; color:var(--c-text-heading); }
.mk .grp { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.mk .lbl { font-size:11px; color:var(--c-text-muted); text-transform:uppercase; letter-spacing:.05em; }
.pills { display:inline-flex; flex-wrap:wrap; gap:2px; padding:2px; background:var(--c-bg-selected); border-radius:9px; }
.pills button {
  border:none; background:transparent; color:var(--c-text-secondary); padding:4px 10px; border-radius:7px;
  font-size:12px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
}
.pills button.on { background:var(--c-bg-white); color:var(--c-text-heading); box-shadow:var(--shadow-thumb); font-weight:600; }

/* ===== Приложение ===== */
.stage { padding:16px; display:flex; justify-content:center; }
.app { width:100%; max-width:1180px; position:relative; }
.app.m {
  width:360px; height:760px; border:1px solid var(--c-border); border-radius:28px; overflow:hidden;
  transform:translateZ(0); /* фиксированные слои (шторки) — внутри «телефона» */
  background:var(--c-bg-main);
}
.app.m .scroll { height:100%; overflow:auto; }
.canvas { background:var(--canvas-glow), var(--c-bg-main); min-height:100%; padding:8px 16px 32px; }
.app.m .canvas { padding:0 0 0; }

.hub { display:flex; align-items:center; gap:12px; height:52px; padding:0 4px; }
.app.m .hub { height:56px; padding:0 14px; background:var(--c-bg-main); border-bottom:1px solid var(--c-border); position:sticky; top:0; z-index:5; }
.hub .ttl { font-size:22px; color:var(--c-text-heading); margin:0; font-weight:700; }
.app.m .hub .ttl { font-size:18px; }
.hub .sp { flex:1; }
.hub .who { font-size:12px; color:var(--c-text-muted); }
.crumb { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--c-text-muted); margin:0 0 8px; }
.app.m .crumb { padding:8px 14px 0; }
.back {
  border:none; background:transparent; color:var(--c-text-secondary); cursor:pointer; padding:6px 8px; margin-left:-8px;
  border-radius:8px; display:inline-flex; align-items:center; gap:4px; font-size:13px; min-height:32px;
}
.back:hover { background:var(--c-bg-selected); color:var(--c-text-primary); }
.app.m .back { min-height:40px; }

.island { background:var(--c-bg-panel); border:1px solid var(--c-border-light); border-radius:14px; box-shadow:var(--shadow-island); }
.isl-h { display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; background:var(--c-bg-inset); border-radius:14px 14px 0 0; border-bottom:1px solid var(--c-border-light); }
.isl-h h3 { margin:0; font-size:13px; font-weight:600; color:var(--c-text-heading); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.isl-h .aux { font-size:11px; color:var(--c-text-muted); }
.isl-b { padding:14px; }
.app.m .island { border-radius:14px; margin:0 8px 8px; }

/* Кнопки — Button из ui/ (primary / secondary / ghost / danger; sm 32 / md 40) */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; cursor:pointer;
  font-weight:600; font-size:13px; padding:7px 13px; border-radius:10px; min-height:32px; white-space:nowrap;
  transition:background .15s, color .15s, opacity .15s;
}
.btn.md, .app.m .btn { font-size:14px; padding:10px 16px; border-radius:12px; min-height:40px; }
.btn.xs { font-size:12px; padding:0 9px; min-height:24px; height:24px; border-radius:8px; }
.btn.primary { background:var(--c-accent); color:var(--c-on-accent); box-shadow:var(--shadow-button); }
.btn.secondary { background:var(--c-bg-panel); color:var(--c-text-secondary); }
.btn.ghost { background:transparent; color:var(--c-text-secondary); border:1px solid var(--c-border); }
.btn.ghost:hover, .btn.secondary:hover { color:var(--c-text-primary); background:var(--c-bg-selected); }
.btn.danger { background:var(--c-danger); color:var(--c-on-accent); }
.btn:active { box-shadow:var(--shadow-press); }
.btn:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
.btn[disabled] { opacity:.45; cursor:not-allowed; box-shadow:none; }
.btn.full { width:100%; }

/* Статусные тона: цвет + форма глифа (дальтонизм) */
.t-wait   { --tc:var(--c-info);         --tt:var(--c-info);         --tb:var(--c-info-bg); }
.t-loop   { --tc:var(--c-warning);      --tt:var(--c-warning-text); --tb:var(--c-warning-bg); }
.t-crash, .t-reopen { --tc:var(--c-danger); --tt:var(--c-danger-text); --tb:var(--c-danger-bg); }
.t-run    { --tc:var(--c-text-heading); --tt:var(--c-text-heading); --tb:var(--c-bg-selected); }
.t-frozen { --tc:var(--c-text-muted);   --tt:var(--c-text-secondary); --tb:var(--c-bg-selected); }
.t-done   { --tc:var(--c-success);      --tt:var(--c-success-text); --tb:var(--c-success-bg); }
.g { flex-shrink:0; display:inline-block; vertical-align:-2px; }
.pulse { animation:pulse 1.6s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
@keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:.9; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation:none; opacity:.5; } }

/* ===== Табло фич ===== */
.sum { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:8px; }
.app.m .sum { grid-template-columns:1fr 1fr; padding:8px 8px 0; }
.kpi { background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:12px; padding:10px 12px; }
.kpi .v { font-size:22px; font-weight:700; color:var(--c-text-heading); line-height:1.15; font-variant-numeric:tabular-nums; }
.kpi .k { font-size:11px; color:var(--c-text-muted); }
.kpi .h { font-size:11px; color:var(--c-text-secondary); margin-top:2px; }
.kpi.bad .v { color:var(--c-warning-text); }
.app.m .kpi:last-child { grid-column:1 / -1; }

.attn { display:flex; flex-direction:column; gap:6px; }
.attn button {
  display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; cursor:pointer;
  background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:10px; padding:9px 12px; color:var(--c-text-primary);
}
.attn button:hover { background:var(--c-bg-selected); }
.attn .s { color:var(--c-text-secondary); font-size:12px; }
.attn .g { margin-top:2px; }

.boardgrid { display:grid; grid-template-columns:1fr 340px; gap:8px; align-items:start; }
.app.m .boardgrid { display:block; }
.group-h { display:flex; align-items:center; gap:8px; margin:14px 2px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--c-text-muted); }
.group-h:first-child { margin-top:2px; }
.group-h .n { background:var(--c-bg-selected); color:var(--c-text-secondary); border-radius:999px; padding:0 7px; font-size:11px; }
.group-h button { margin-left:auto; }
.app.m .group-h { margin:14px 16px 8px; }
.cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.app.m .cards { grid-template-columns:1fr; padding:0 8px; }

/* Карточка фичи — она же шапка экрана фичи (крупнее) */
.fc {
  background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:14px; box-shadow:var(--shadow-card);
  padding:12px 14px; text-align:left; width:100%; color:var(--c-text-primary); cursor:pointer; display:block;
  transition:box-shadow .15s, border-color .15s;
}
button.fc:hover { box-shadow:var(--shadow-island); border-color:var(--c-border); }
button.fc:active { box-shadow:var(--shadow-press); }
button.fc:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
.fc .top { display:flex; align-items:flex-start; gap:8px; }
.fc .name { flex:1; min-width:0; font-weight:600; font-size:14px; color:var(--c-text-heading); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fc .stl { font-size:13px; color:var(--tt); font-weight:600; margin:2px 0 8px 22px; }
.fc .stl .q { color:var(--c-text-secondary); font-weight:400; }
.fc .met { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--c-text-secondary); margin-top:10px; }
.fc .met b { color:var(--c-text-heading); font-weight:600; font-variant-numeric:tabular-nums; }
.fc .met .bad b { color:var(--c-warning-text); }
.fc .ask { margin-top:10px; display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--c-info); background:var(--c-info-bg); border-radius:8px; padding:6px 10px; }
.fc .ask.danger { color:var(--c-danger-text); background:var(--c-danger-bg); }
.fc .ask.warn { color:var(--c-warning-text); background:var(--c-warning-bg); }
.fc.done { opacity:.85; }
.fc.lg { cursor:default; padding:16px 18px; border-radius:14px; }
.fc.lg .name { font-size:22px; font-weight:700; font-family:"PT Serif",Georgia,serif; white-space:normal; }
.fc.lg .stl { font-size:14px; margin-left:24px; }
.app.m .fc.lg .name { font-size:18px; }

.avs { display:flex; }
.av {
  width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  color:var(--c-on-dark); font-size:10px; font-weight:700; border:2px solid var(--c-bg-card); margin-left:-6px;
}
.av:first-child { margin-left:0; }
.av.lg { width:28px; height:28px; font-size:11px; margin:0; border:none; }

.ruler { display:grid; grid-template-columns:repeat(6,1fr); gap:3px; margin-left:22px; }
.ruler .seg { height:4px; border-radius:999px; background:var(--c-border); }
.ruler .seg.past { background:var(--c-text-muted); opacity:.55; }
.ruler .seg.cur { background:var(--tc); }
.ruler .lab { grid-row:2; font-size:11px; color:var(--tt); white-space:nowrap; font-weight:600; margin-top:2px; }
.fc.lg .ruler { margin-left:24px; }

.prog { display:inline-flex; align-items:center; gap:6px; }
.bar { display:inline-block; width:64px; height:4px; background:var(--c-progress-track); border-radius:999px; overflow:hidden; position:relative; vertical-align:middle; }
.bar i { position:absolute; left:0; top:0; bottom:0; background:var(--c-success); border-radius:999px; }
.bar s { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--c-text-muted); }

/* Плашка решения: заменяет верх шапки */
.plate { border-radius:14px 14px 0 0; padding:14px 18px; margin:-16px -18px 14px; border-bottom:1px solid; }
.plate.info    { background:var(--c-info-bg);    border-color:var(--c-info);   --pc:var(--c-info); }
.plate.warning { background:var(--c-warning-bg); border-color:var(--c-warning);--pc:var(--c-warning-text); }
.plate.danger  { background:var(--c-danger-bg);  border-color:var(--c-danger-border); --pc:var(--c-danger-text); }
.plate.neutral { background:var(--c-bg-selected);border-color:var(--c-border); --pc:var(--c-text-secondary); }
.plate .pt { display:flex; align-items:center; gap:8px; font-weight:700; color:var(--pc); font-size:15px; }
.plate .pw { margin-left:auto; font-size:12px; font-weight:600; color:var(--pc); white-space:nowrap; }
.plate .pr { margin:6px 0 10px; color:var(--c-text-primary); max-width:72ch; }
.plate .pb { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.plate .why { font-size:12px; color:var(--c-text-secondary); margin-top:8px; display:flex; gap:6px; }
.app.m .plate .pw { display:none; }

/* Мобильная плашка снизу */
.dock {
  position:sticky; bottom:0; z-index:6; margin-top:12px; padding:12px 14px 14px; border-top:1px solid;
  box-shadow:var(--shadow-sheet); border-radius:22px 22px 0 0;
}
.dock.info    { background:var(--c-info-bg);    border-color:var(--c-info);   --pc:var(--c-info); }
.dock.warning { background:var(--c-warning-bg); border-color:var(--c-warning);--pc:var(--c-warning-text); }
.dock.danger  { background:var(--c-danger-bg);  border-color:var(--c-danger-border); --pc:var(--c-danger-text); }
.dock.neutral { background:var(--c-bg-selected);border-color:var(--c-border); --pc:var(--c-text-secondary); }
.dock .pt { display:flex; align-items:center; gap:8px; font-weight:700; color:var(--pc); font-size:14px; }
.dock .pw { font-size:12px; color:var(--pc); margin:2px 0 8px 24px; font-weight:600; }
.dock .pr { font-size:12px; color:var(--c-text-primary); margin:0 0 10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.dock .pb { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.dock .pb .btn:first-child { grid-column:1 / -1; }

/* ===== Экран фичи ===== */
.fgrid { display:grid; grid-template-columns:1fr 300px; gap:8px; align-items:start; margin-top:8px; }
.app.m .fgrid { display:block; margin-top:0; }
.col { display:flex; flex-direction:column; gap:8px; }
.app.m .col { gap:0; }

.digest { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.digest li { display:flex; gap:8px; align-items:flex-start; }
.digest .dot { width:7px; height:7px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--c-border); }
.digest li.new .dot { background:var(--c-accent); }
.digest li.new { color:var(--c-text-heading); }
.digest li:not(.new) { color:var(--c-text-secondary); }

.cv-wrap { overflow-x:auto; }
.cv svg { display:block; width:100%; min-width:640px; height:auto; }
.cv text { font-family:"Hanken Grotesk","Segoe UI",sans-serif; }
.hit { cursor:pointer; }
.hit:hover + .hl, .hl:hover { opacity:1; }
.cv-cap { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:12px; color:var(--c-text-secondary); margin-top:6px; }
.legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--c-text-muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--c-border-light); }
.legend span { display:inline-flex; align-items:center; gap:5px; }

.vc { list-style:none; margin:0; padding:0; position:relative; }
.vc li { position:relative; padding:0 0 12px 30px; }
.vc li:before { content:""; position:absolute; left:10px; top:20px; bottom:0; width:var(--w,2px); margin-left:calc(var(--w,2px) / -2 + 1px); background:var(--lc,var(--c-text-muted)); opacity:.5; border-radius:2px; }
.vc li:last-child:before { display:none; }
.vc li.todo:before { background:none; border-left:2px dashed var(--c-dashed); opacity:1; }
.vc .gw { position:absolute; left:0; top:1px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.vc .row { display:flex; align-items:center; gap:8px; min-height:24px; }
.vc .nm { font-weight:600; color:var(--c-text-heading); }
.vc li.past .nm, .vc li.todo .nm { font-weight:400; color:var(--c-text-muted); }
.vc .cur-box { margin-top:6px; background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--c-text-secondary); }
.badge { display:inline-flex; align-items:center; gap:3px; border-radius:999px; padding:0 7px; font-size:11px; font-weight:600; background:var(--c-bg-selected); color:var(--c-text-secondary); border:none; cursor:pointer; min-height:20px; }
.badge.hot { background:var(--c-warning-bg); color:var(--c-warning-text); }
.badge.dng { background:var(--c-danger-bg); color:var(--c-danger-text); }

}

}

textarea, input[type=text], select {

}

/* ===== Шаг ===== */
.rounds { list-style:none; margin:0; padding:0; }
.rounds > li { position:relative; padding:0 0 16px 28px; }

.add { color:var(--c-diff-add-text); background:var(--c-diff-add-bg); border-radius:4px; padding:0 4px; font-family:"JetBrains Mono",monospace; }
.rem { color:var(--c-diff-rem-text); background:var(--c-diff-rem-bg); border-radius:4px; padding:0 4px; font-family:"JetBrains Mono",monospace; }
.chat { display:flex; flex-direction:column; gap:8px; max-height:360px; overflow:auto; padding:2px; }
.msg { max-width:85%; border-radius:12px; padding:8px 10px; font-size:13px; }

/* ===== Шторки, диалоги, тост ===== */
.ov { position:fixed; inset:0; background:var(--c-overlay); z-index:2100; }

}

  background:var(--c-bg-card); border-radius:20px; box-shadow:var(--shadow-modal); padding:22px; max-height:calc(100% - 32px); overflow:auto;
}

.app.m .dlg { left:0; right:0; top:auto; bottom:0; transform:none; width:auto; max-width:none; border-radius:22px 22px 0 0; box-shadow:var(--shadow-sheet); padding:16px 16px 20px; }

.cons { background:var(--c-warning-bg); border-radius:12px; padding:10px 12px; margin:12px 0; }

  border-radius:12px; padding:10px 16px; box-shadow:var(--shadow-dropdown); font-size:13px; max-width:calc(100% - 32px);
}

.cats .r { display:grid; grid-template-columns:140px 1fr 24px; gap:8px; align-items:center; margin-bottom:6px; font-size:12px; }

.empty { text-align:center; padding:24px 12px; color:var(--c-text-secondary); }

/* ===== v2: служебная панель сценария ===== */

/* ===== v2: линейка жизненного цикла ===== */
.ruler { grid-template-columns:repeat(6,1fr); }
.lcr { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin:12px 0 0 24px; }

.lcap { display:none; font-size:12px; color:var(--tt); margin-top:6px; }
.app.m .lcap { display:block; }
.app.m .lcr .pn { display:none; }
.subst { display:flex; flex-wrap:wrap; gap:4px 6px; margin:8px 0 0 24px; font-size:12px; align-items:center; }

.gates { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; margin:8px 0 0 24px; font-size:12px; color:var(--c-text-secondary); }
.app.m .gates { margin-left:0; }
.app.m .gates > .g { display:none; }

/* ===== v2: формы этапов ===== */
.seg { display:inline-flex; flex-wrap:wrap; gap:2px; padding:2px; background:var(--c-bg-selected); border-radius:10px; }

.sw { display:flex; gap:10px; align-items:flex-start; cursor:pointer; border:1px solid var(--c-border); border-radius:12px; padding:10px 12px; background:var(--c-bg-white); width:100%; text-align:left; color:var(--c-text-primary); }

.sw .tg:after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--c-bg-white); box-shadow:var(--shadow-thumb); transition:left .15s; }
.sw.on { border-color:var(--c-accent); }

.mic { width:40px; height:40px; border-radius:12px; border:1px solid var(--c-border); background:var(--c-bg-white); color:var(--c-text-secondary); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.mic.on { color:var(--c-danger); border-color:var(--c-danger); }
.ta-row { display:flex; gap:8px; align-items:flex-start; }
.next-box { background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:12px; padding:10px 12px; font-size:12px; color:var(--c-text-secondary); }
.next-box b { color:var(--c-text-heading); }

.sk { background:var(--c-bg-selected); border-radius:6px; height:12px; margin:8px 0; animation:skp 1.4s ease-in-out infinite; }
@keyframes skp { 0%,100% { opacity:.5; } 50% { opacity:1; } }
@media (prefers-reduced-motion: reduce) { .sk { animation:none; } }

.q { padding:12px 0; border-bottom:1px solid var(--c-border-light); }
.q:last-child { border-bottom:none; }
.q .qt { font-weight:600; color:var(--c-text-heading); display:flex; gap:8px; }
.q .qt .no { color:var(--c-text-muted); font-variant-numeric:tabular-nums; }
.q .qw { font-size:12px; color:var(--c-text-secondary); margin:2px 0 8px 22px; }
.opts { display:flex; flex-direction:column; gap:6px; margin-left:22px; }
.app.m .opts { margin-left:0; }
.opt { display:flex; gap:10px; align-items:flex-start; text-align:left; border:1px solid var(--c-border); background:var(--c-bg-white); border-radius:12px; padding:8px 12px; cursor:pointer; color:var(--c-text-primary); min-height:40px; width:100%; }
.opt:hover { background:var(--c-bg-selected); }

.opt .rec { margin-left:auto; flex-shrink:0; font-size:11px; font-weight:600; color:var(--c-success-text); background:var(--c-success-bg); border-radius:999px; padding:0 8px; }
.opt .why2 { display:block; font-size:12px; color:var(--c-text-secondary); }

.bsec { padding:10px 0; border-bottom:1px solid var(--c-border-light); }
.bsec:last-child { border-bottom:none; }

.bsec ol, .bsec ul { margin:0; padding-left:20px; }
.bsec li { margin:3px 0; }
.wn { background:var(--c-bg-card); border:1px dashed var(--c-dashed); border-radius:12px; padding:10px 12px; }
.wn .wh { font-weight:700; color:var(--c-text-heading); }

.vars { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.app.m .vars { grid-template-columns:1fr; }
.var { text-align:left; border:1px solid var(--c-border); background:var(--c-bg-card); border-radius:14px; padding:12px; cursor:pointer; color:var(--c-text-primary); display:flex; flex-direction:column; gap:8px; }
.var:hover { box-shadow:var(--shadow-card); }
.var.on { border-color:var(--c-accent); box-shadow:var(--shadow-focus); }
.var .vh { display:flex; gap:8px; align-items:flex-start; }
.var .vl { font-family:"PT Serif",Georgia,serif; font-weight:700; font-size:20px; color:var(--c-text-heading); line-height:1; }
.var .vn { font-weight:600; color:var(--c-text-heading); flex:1; }
.var .k { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--c-text-muted); }
.var ul { margin:0; padding-left:16px; font-size:12px; color:var(--c-text-secondary); }
.var .inv { font-size:12px; color:var(--c-warning-text); background:var(--c-warning-bg); border-radius:8px; padding:4px 8px; }
.var .est { font-size:12px; color:var(--c-text-secondary); }
.var .est b { color:var(--c-text-heading); }

.prev { border:1px solid var(--c-border); border-radius:14px; background:var(--c-bg-inset); padding:18px; display:flex; justify-content:center; }
.qrd { width:340px; max-width:100%; background:var(--c-bg-card); border-radius:20px; box-shadow:var(--shadow-modal); padding:18px; text-align:center; }
.qrd.mob { width:260px; border-radius:22px 22px 0 0; }

function ruler(f){
  const s = stg(f.stage), lc = s.lc, lab = LC[lc] + (s.n!==LC[lc] ? ' · '+s.n : '');
  const pos = lc>=4 ? 'grid-column:3 / span 4;justify-self:end' : `grid-column:${lc+1} / span 3`;
  return `<div class="ruler ${TONE[f.st]}">${LC.map((p,i)=>`<span class="seg ${i<lc?'past':i===lc?'cur':''}"></span>`).join('')}
    <span class="lab" style="${pos}">${lab}</span></div>`;
}
// Ворота фичи: у сквозной — живые, у остальных — восстановленные по этапу
function gatesFor(id){
  if (id==='qr') return S.w.gates;
  const f = F[id]||FB[id], cur = stgIdx(f.stage);
  const T = {idea:['отдали идею в проработку','11.10 · 18:20'],clarify:['ответили на вопросы','11.10 · 18:40'],brief:['утвердили бриф','12.10 · 09:15'],
    cut:['выбрали вариант разреза','12.10 · 11:30'],mock:['согласовали макет','12.10 · 15:10'],plan:['утвердили план','12.10 · 16:05'],
    accept:['приняли фичу','14.10 · 17:20'],merge:['разрешили мерж','14.10 · 17:25'],release:['выпустили за флагом','14.10 · 18:05']};
  return STG.slice(0,cur).filter(s=>T[s.k]).map(s=>({st:s.k, what:T[s.k][0], who:'вы', at:T[s.k][1], kind:'gate'}));
}
// Большая линейка в шапке фичи: фазы, этапы текущей фазы, пройденные ворота
function lcRulerBig(f, id){
  const si = stgIdx(f.stage), lc = STG[si].lc, sk = f.skip||[];
  const phases = LC.map((p,i)=>`<div class="ph ${i<lc?'past':i===lc?'cur':''}"><div class="sg"></div><div class="pn">${p}</div></div>`).join('');
  const subs = STG.filter(s=>s.lc===lc);
  const sub = subs.length>1 ? `<div class="subst">${subs.map(s=>{
      const k = stgIdx(s.k), cls = sk.includes(s.k) ? 'skip' : k<si ? 'past' : k===si ? 'cur' : '';
      const g = cls==='cur' ? glyph(f.st,12) : cls ? glyph('past',12) : glyph('todo',12);
      return `<span class="s ${cls}">${g}${s.n}${cls==='skip'?' · пропущен':''}</span>`;
    }).join('<span class="sep">›</span>')}</div>` : '';
  const gs = gatesFor(id).filter(g=>g.kind!=='agent'), fw = gs.filter(g=>g.kind==='gate').length, last = gs[gs.length-1];
  return `<div class="lcr">${phases}</div><div class="lcap">Фаза ${lc+1} из 6 · <b>${LC[lc]}</b></div>${sub}
    <div class="gates">${glyph('past',12)}<span>${gs.length?`Ворот пройдено: <b>${fw}</b> · последнее — ${last.who} ${last.what}, ${last.at}`:'Ворота пока не пройдены'}</span>
    ${gs.length?`<button class="link" data-a="sheet:gates">История решений</button>`:''}</div>`;
}
function progress(f){
  if (!f.tot) return `<span class="mut">шагов нет</span>`;
  const pct = Math.round(f.acc/f.tot*100);
  const mark = f.plan ? `<s style="left:${Math.round(f.plan/f.tot*100)}%" title="план был ${f.plan}"></s>` : '';
  return `<span class="prog"><span class="bar"><i style="width:${pct}%"></i>${mark}</span> принято <b>${f.acc} из ${f.tot}</b>${f.plan?` <span class="mut">· план был ${f.plan}</span>`:''}</span>`;
}

/* ---------- Карточка фичи (табло) = шапка экрана фичи (lg) ---------- */

function plateHtml(f){

function dockHtml(f){

function laneTag(f){
  const t = {wait:'ждёт вас', crash:'стоит', loop:'3-й круг', frozen:'пауза', reopen:'дефект'}[f.st];
  return t ? t + (f.stuckStep && f.st!=='frozen' ? ' · '+f.stuckStep : '') : '';
}
// Конвейер: «Производство» развёрнуто в линии прямо на схеме.
// Толщина линии — проходы (больше возвратов — толще), ↺N — возвраты на линии, метка — где стоит
function conveyor(f){
  const c = f.conv, y = 96, xs = [46,136,345,566,656,730], z = {x1:190, x2:500, y1:46, y2:148};
  const cur = f.phase, tag = laneTag(f);
  let s = `<defs>
    <marker id="ah-m" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--c-text-muted)"/></marker>
    <marker id="ah-w" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--c-warning)"/></marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--c-danger)"/></marker>
  </defs>`;
  const ew = p => Math.min(2+(p-1)*3, 10);
  const stroke = p => p>0 ? `stroke:var(--c-text-muted);stroke-width:${ew(p)};stroke-linecap:round;opacity:.5` : 'stroke:var(--c-dashed);stroke-width:1.5;stroke-dasharray:4 4';
  const passLab = (x,yy,p) => p>1 ? `<text x="${x}" y="${yy}" text-anchor="middle" style="fill:var(--c-text-secondary);font-size:11px;font-weight:600">×${p}</text>` : '';
  // зона «Производство»
  const prodCur = cur===2 && c.st[2]!=='done';
  s += `<rect x="${z.x1}" y="${z.y1}" width="${z.x2-z.x1}" height="${z.y2-z.y1}" rx="14" style="fill:var(--c-bg-inset);stroke:${prodCur?'var(--tc)':'var(--c-border-light)'};stroke-width:${prodCur?1.5:1}"/>`;
  // связи между этапами
  s += `<line x1="${xs[0]+18}" y1="${y}" x2="${xs[1]-18}" y2="${y}" style="${stroke(c.passes[0])}"/>${passLab((xs[0]+xs[1])/2,y-10,c.passes[0])}`;
  for (let i=3;i<5;i++) s += `<line x1="${xs[i]+18}" y1="${y}" x2="${xs[i+1]-18}" y2="${y}" style="${stroke(c.passes[i])}"/>${passLab((xs[i]+xs[i+1])/2,y-10,c.passes[i])}`;
  const L = f.lines.length ? f.lines : [['шагов нет',0,0,0,0]];
  const ly = L.map((_,i)=> y + (i-(L.length-1)/2)*44);
  const lx1 = 210, lx2 = 480;
  L.forEach((l,i)=>{
    const yy = ly[i], [nm,acc,tot,ret,mk] = l, xp = tot ? lx1+(lx2-lx1)*acc/tot : lx1;
    // развилка из «Плана» и слияние в «Проверку»
    s += `<path d="M${xs[1]+18},${y} C${xs[1]+50},${y} ${lx1-30},${yy} ${lx1},${yy}" style="fill:none;${stroke(c.passes[1])}"/>`;
    s += `<path d="M${lx2},${yy} C${lx2+40},${yy} ${xs[3]-50},${y} ${xs[3]-18},${y}" style="fill:none;${stroke(c.passes[2])}"/>`;
    const w = Math.min(2+ret*0.8, 10), hot = mk && f.st==='loop';
    s += `<text x="${lx1}" y="${yy-10}" style="fill:var(--c-text-secondary);font-size:11px">${esc(nm)} · ${acc} из ${tot}</text>`;
    if (xp>lx1) s += `<line x1="${lx1}" y1="${yy}" x2="${xp}" y2="${yy}" style="stroke:var(--c-text-muted);stroke-width:${w};stroke-linecap:round;opacity:.5"/>`;
    if (xp<lx2) s += `<line x1="${xp}" y1="${yy}" x2="${lx2}" y2="${yy}" style="stroke:var(--c-dashed);stroke-width:1.5;stroke-dasharray:4 4"/>`;
    if (ret){
      s += `<text x="${lx2}" y="${yy-10}" text-anchor="end" style="fill:${hot?'var(--c-warning-text)':'var(--c-text-secondary)'};font-size:11.5px;font-weight:700">↺${ret}</text>`;
      s += `<rect x="${lx2-34}" y="${yy-24}" width="38" height="20" class="hit" data-a="sheet:loop" style="fill:transparent"/>`;
    }
    if (mk && tag){
      // метка — на линии, но правее подписи линии, чтобы не наезжать на неё
      const tw = tag.length*6.4+22, labW = (nm.length+9)*6.2, tx = Math.min(Math.max(xp, lx1+labW+tw/2+6), lx2-40-tw/2);
      s += `<g class="hit" data-a="sheet:stuck"><rect x="${tx-tw/2}" y="${yy-11}" width="${tw}" height="22" rx="11" style="fill:var(--tb);stroke:var(--tc);stroke-width:1"/>
        <text x="${tx}" y="${yy+4}" text-anchor="middle" style="fill:var(--tt);font-size:11.5px;font-weight:700">${tag} ›</text></g>`;
    }
  });
  c.loops.forEach(l=>{
    const x1 = xs[l.from], x2 = xs[l.to]+40, col = l.danger?'var(--c-danger)':l.n>=3?'var(--c-warning)':'var(--c-text-muted)';
    const d = `M${x1},${y+18} C${x1},${y+112} ${x2},${y+112} ${x2},${z.y2+3}`;
    s += `<path d="${d}" style="fill:none;stroke:${col};stroke-width:${1.5+l.n};${l.danger?'stroke-dasharray:6 4;':''}opacity:${l.danger||l.n>=3?1:.6}" marker-end="url(#ah-${l.danger?'d':l.n>=3?'w':'m'})"/>`;
    s += `<text x="${(x1+x2)/2}" y="${y+108}" text-anchor="middle" style="fill:${l.danger?'var(--c-danger-text)':'var(--c-text-secondary)'};font-size:12px;font-weight:700">↺${l.n} ${l.danger?'после мержа':'возврат'}</text>`;
    s += `<path d="${d}" class="hit" data-a="sheet:loop" style="fill:none;stroke:transparent;stroke-width:22"/>`;
  });
  PH.forEach((p,i)=>{
    const st = c.st[i], x = xs[i], isCur = i===cur && st!=='done';
    s += `<text x="${x}" y="34" text-anchor="middle" style="fill:${isCur?'var(--c-text-heading)':'var(--c-text-muted)'};font-size:12px;font-weight:${isCur?700:400}">${p}</text>`;
    if (i===2) return; // зона нарисована выше
    if (st==='done') s += `<circle cx="${x}" cy="${y}" r="15" style="fill:var(--c-bg-selected);stroke:var(--c-text-muted);stroke-width:1"/><path d="M${x-5},${y} l3.5,3.5 l6.5,-7" style="fill:none;stroke:var(--c-text-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>`;
    else if (st==='todo') s += `<circle cx="${x}" cy="${y}" r="15" style="fill:var(--c-bg-card);stroke:var(--c-dashed);stroke-width:1.5;stroke-dasharray:3 3"/>`;
    else s += `<circle cx="${x}" cy="${y}" r="16" style="fill:var(--c-bg-card);stroke:var(--tc);stroke-width:2"/><g transform="translate(${x-9},${y-9})">${glyph(st,18)}</g>`;
    if (isCur){
      const w = Math.max(84, f.mark.length*6.6+20), clickable = ['wait','crash','loop','reopen','frozen'].includes(st);
      s += `<g ${clickable?'class="hit" data-a="sheet:stuck"':''}>
        <rect x="${x-w/2}" y="${y-48}" width="${w}" height="22" rx="11" style="fill:var(--tb);stroke:var(--tc);stroke-width:1"/>
        <text x="${x}" y="${y-33}" text-anchor="middle" style="fill:var(--tt);font-size:11.5px;font-weight:700">${f.mark}${clickable?' ›':''}</text></g>`;
    }
  });
  // «идёт» без метки на линии — пульс у подписи зоны
  if (prodCur && !L.some(l=>l[4] && tag)) s += `<g transform="translate(${xs[2]-62},24)">${glyph(f.st,13)}</g>`;
  return `<div class="cv-wrap cv ${TONE[f.st]}"><svg viewBox="0 0 760 216" role="img" aria-label="Конвейер фичи">${s}</svg></div>`;
}
/* ---------- Конвейер вертикальный (мобила): производство — те же линии ---------- */
function conveyorV(f){
  const c = f.conv, tag = laneTag(f);

  }).join('')}</ul>`;
}

function blkForecast(f){
  let body;
  if (f.fc.early) body = `<div class="fcv"><small>рано для прогноза</small></div><div class="sec">Нет утверждённого плана и 3 принятых шагов. Прогноз появится сам.</div>`;
  else if (f.fc.paused) body = `<div class="fcv"><small>на паузе</small></div><div class="sec">Пока фича заморожена, прогноз не считается и не дрейфует.</div>`;
  else if (f.fc.done) body = `<div class="fcv">14 ч <small>факт</small></div><div class="sec">Прогноз на старте: 8–12 ч · промах +2 ч</div>`;
  else body = `<div class="fcv">${f.fc.lo}–${f.fc.hi} <small>· ${f.fc.conf}</small></div>
    <div class="sec">${f.fc.note||'до мержа'} · оценка по ${f.fc.n} фичам</div>
    ${f.fc.shift?`<div class="shift ${f.fc.dir}">${f.fc.dir==='up'?'↑':'↓'} ${f.fc.shift} со вчерашнего обхода</div>`:''}
    ${f.waitYou?`<div class="sec" style="margin-top:4px">плюс ждёт вас <b>${f.waitYou}</b> — время человека в прогноз не входит</div>`:''}`;
  return `<div class="blk"><div class="cap">Прогноз</div>${body}${f.fc.early||f.fc.paused||f.fc.done?'':`<div style="margin-top:6px"><button class="link" data-a="sheet:forecast">Как считали</button></div>`}</div>`;
}
function blkPeople(f){
  if (!f.people.length) return `<div class="blk"><div class="cap">Кто работает</div><div class="mut">Сейчас никто — ${f.idle||(f.st==='done'?'фича смержена':'фича на паузе')}.</div></div>`;
  return `<div class="blk"><div class="cap">Кто работает</div><div class="ppl">${f.people.map(p=>`<div class="p">${av(p[0],true)}<div><div class="n">${P[p[0]].n} <span class="mut">· ${P[p[0]].r}</span></div><div class="t">${p[1]}</div></div></div>`).join('')}</div>
    <div class="sec" style="margin-top:8px">Последнее движение: ${f.moveBad?`<b style="color:var(--c-warning-text)">${f.move}</b>`:f.move}</div></div>`;
}
function blkBuild(f){
  const g = f.build[0]==='ok' ? `<span style="color:var(--c-success)">${IC.ok}</span>` : f.build[0]==='bad' ? glyph('crash',12) : `<span style="color:var(--c-warning-text)">${IC.warn}</span>`;
  return `<div class="blk"><div class="cap">Ветка и соседи</div><div class="mono mut" style="font-size:11px;margin-bottom:6px;word-break:break-all">${f.branch}</div>
    <div class="build">${g}<span>${f.build[1]}</span></div><div class="sec" style="margin-top:6px">${f.neigh}</div></div>`;
}
function blkCourse(f){
  const frozen = f.st==='frozen', off = f.st==='done';
  const menu = S.menu ? `<div class="menu" role="menu">
      <button data-a="dlg:prioUp"><span>${IC.up}</span><span>Поднять приоритет<span class="d">Встанет выше соседей в очереди слотов</span></span></button>
      <button data-a="dlg:prioDown"><span>${IC.down}</span><span>Опустить приоритет<span class="d">Пропустит вперёд другие фичи</span></span></button>
      <hr>
      ${frozen?`<button data-a="dlg:resume"><span>${IC.play}</span><span>Возобновить<span class="d">Шаги вернутся исполнителям</span></span></button>`
        :`<button data-a="dlg:freeze"><span>${IC.pause}</span><span>Заморозить…<span class="d">Остановить с причиной</span></span></button>`}
      <button data-a="dlg:recut"><span>${IC.cut}</span><span>Переразрезать…<span class="d">Позвать архитектора на новый разрез</span></span></button>
    </div>` : '';
  return `<div class="blk"><div class="cap">Ход фичи</div>
    <div class="sec" style="margin-bottom:8px">Приоритет: <b style="color:var(--c-text-heading)">${({stats:2,history:1,pult:6,bg:3,hands:4,multi:5,cleanup:7,voice:8,spheres:'—',qr:3})[S.fid]||'—'}</b> из 8 у куратора</div>
    <div class="menu-wrap">${off?btn('Изменить ход','disabled',''):`<button class="btn ghost full" data-a="menu">Изменить ход ${IC.chev}</button>`}${menu}</div>
    ${off?'<div class="mut" style="margin-top:6px">Фича смержена — менять нечего.</div>':''}</div>`;
}
function blkDigest(f){
  return `<div class="island"><div class="isl-h"><h3>С прошлого визита</h3><span class="aux">вчера в 21:40</span></div><div class="isl-b">
    <ul class="digest">${f.digest.map(d=>`<li class="${d[0]?'new':''}"><span class="dot"></span><span>${d[1]}</span></li>`).join('')}</ul></div></div>`;
}
function blkConveyor(f){
  const lineSum = f.lines.length ? `Производство: ${f.lines.map(l=>`${l[0]} ${l[1]} из ${l[2]}`).join(' · ')}` : 'Шагов пока нет';
  // «Стоит / ждёт вас»: главное — решение в плашке, конвейер сворачивается до строки
  const collapsible = ['wait','crash'].includes(f.st);
  if (collapsible && !S.cvOpen){
    const sl = f.lines.find(l=>l[4]), ret = f.lines.reduce((s,l)=>s+l[3],0);
    return `<div class="island"><div class="isl-h"><h3>Конвейер</h3><span class="aux">свёрнут</span></div><div class="isl-b">
      <div class="cvrow ${TONE[f.st]}">${glyph(f.st,14)}<span><b>${f.st==='crash'?'Стоит':'Ждёт вас'}</b> на линии «${sl?esc(sl[0]):'—'}», шаг ${f.stuckStep||f.step} · ${f.lines.map(l=>`${esc(l[0])} ${l[1]} из ${l[2]}`).join(' · ')} · ↺${ret}</span>${btn('Показать конвейер','ghost','cv')}</div>
      <div class="sec" style="margin-top:6px">Сейчас важнее решение в плашке ${S.mobile?'снизу':'сверху'} — остальные линии идут без вас.</div></div></div>`;
  }
  const body = S.mobile ? conveyorV(f) : conveyor(f);
  const legend = S.mobile ? '' : `<div class="legend">
    <span>${glyph('past',12)} пройдено</span><span>${glyph('run',12)} идёт</span><span>${glyph('wait',12)} ждёт вас</span>
    <span>${glyph('loop',12)} возврат, цвет — от 3 кругов</span><span>${glyph('crash',12)} стоит</span><span>${glyph('frozen',12)} пауза</span>
    <span>толщина линии — проходы · ↺N — возвраты на линии · метка — где стоит</span></div>`;
  return `<div class="island"><div class="isl-h"><h3>Конвейер</h3><span class="aux">по ролям задач · данные 1 мин назад</span>${collapsible?`<button class="btn xs ghost" data-a="cv">Свернуть</button>`:''}</div><div class="isl-b">
    ${body}
    <div class="cv-cap"><span>${lineSum}</span>${f.lines.length?`<button class="link" data-a="lines">${S.linesOpen?'Свернуть шаги':'Шаги по линиям'}</button>`:''}<button class="link" data-a="sheet:timeline">Лента времени</button></div>
    ${S.linesOpen && f.lines.length ? linesHtml(f) : ''}
    ${legend}</div></div>`;
}
function linesHtml(f){
  return `<div class="lines" style="margin-top:12px">${f.lines.map((l,li)=>{
    const pref = l[0].startsWith('фронт')?'F':l[0].startsWith('трек A')?'A':l[0].startsWith('трек D')?'D':'B';
    const cells = Array.from({length:l[2]},(_,i)=>{
      const n = `${pref}${i+1}`, done = i<l[1], cur = i===l[1];
      const r = (f.step===n) ? 3 : (i*7+li*3)%5===0 ? 2 : 1;
      // Шаг, на котором стоит фича, показываем её состоянием, где бы он ни был в линии
      const key = f.step===n && !['run','done'].includes(f.st);
      const g = key ? glyph(f.st,12) : done ? glyph('past',12) : cur ? glyph('run',12) : glyph('todo',12);
      return `<button class="step${r>=3?' hot':''}" data-a="step" title="${n}">${g}<b>${n}</b>${r>1&&(done||cur)?`<span style="color:${r>=3?'var(--c-warning-text)':'inherit'}">↺${r}</span>`:''}</button>`;
    }).join('');
    return `<div class="ln"><span class="lnn">${l[0]} · ${l[1]} из ${l[2]}</span>${cells}</div>`;
  }).join('')}</div>`;
}
function blkChecklist(f){

    ['Все шаги приняты','11 из 11, отменённых нет',1],
    ['Финальное ревью «принято»','Александр, 14:20, второй заход',1],

    ['Проверка Веры пройдена','и регрессия соседних фич: «Медиа», «Редактор картинок»',1],
    ['Мобильная проверка','360, 390 и 768 px — скриншоты в задаче',1],
    ['Тексты новых строк','7 строк, Софья',1],
    ['CI зелёный по ветке', S.ack.ci?'перезапущен, зелёный':'падает MediaHistoryTests.Paging после ребейза', S.ack.ci?1:0, 'ci'],
    ['«Что нового» обновлено','запись от 15.10',1],
    ['Урок записан', S.ack.lesson?'«Пагинацию проверять на пустой странице до ревью»':'не записан', S.ack.lesson?1:0, 'lesson'],
    ['После мержа — smoke на master','будет после мержа, приёмку не блокирует',-1],
  ];
  return `<div class="island"><div class="isl-h"><h3>Чек-лист приёмки</h3><span class="aux">${items.filter(i=>i[2]===1).length} из 9 · блокирует «Принять»</span></div><div class="isl-b">
    ${!(S.ack.ci&&S.ack.lesson)?`<div class="risk" style="margin-bottom:10px">${IC.warn}<span><b>Риски перед приёмкой:</b> CI красный после ребейза; урок не записан. Пока они открыты, «Принять» недоступно.</span></div>`:''}
    <ul class="check">${items.map(i=>`<li class="${i[2]===1?'':i[2]===0?'no':'pend'}">
      ${i[2]===1?`<span style="color:var(--c-success)">${IC.ok}</span>`:i[2]===0?glyph('crash',14):glyph('todo',14)}
      <div class="ci"><span>${i[0]}</span><div class="s">${i[1]}</div></div>
      ${i[3]==='ci'&&!S.ack.ci?btn('Перезапустить CI','ghost','ck:ci'):''}${i[3]==='lesson'&&!S.ack.lesson?btn('Записать урок','ghost','dlg:lesson'):''}
    </li>`).join('')}</ul>
    <div class="mut" style="margin-top:8px">В макете кнопки сразу закрывают пункт, чтобы показать разблокировку «Принять».</div></div></div>`;
}

function blkNoPlan(f){
  return `<div class="island"><div class="isl-h"><h3>Конвейер</h3></div><div class="isl-b">
    ${S.mobile?conveyorV(f):conveyor(f)}

function screenFeature(){
  if (S.fid==='qr') return screenQr();
  const f = F[S.fid];
  const crumb = `<div class="crumb"><button class="back" data-a="nav:board">${IC.back} Все фичи</button>
    ${S.mobile?'':`<span>·</span><span>куратор Андрей · дублёр Софья</span><span>·</span><span>данные обновлены 1 мин назад</span>`}</div>`;
  let main;
  if (f.accept) main = blkChecklist(f);
  else if (f.noplan) main = blkNoPlan(f);
  else main = blkConveyor(f);
  const left = `${f.digest?blkDigest(f):''}${main}${f.st==='done'?blkDone(f):''}`;
  const side = `<div class="island side">${blkForecast(f)}${blkPeople(f)}${blkBuild(f)}${blkCourse(f)}
    <div class="blk"><button class="btn ghost full" data-a="step:orch">Разговор с оркестратором фичи</button></div></div>`;
  if (S.mobile){
    return `${crumb}<div style="padding:0 8px 8px">${card(S.fid,true)}</div>${left}<div class="island side">${blkPeople(f)}${blkBuild(f)}${blkCourse(f)}
      <div class="blk"><button class="btn ghost full" data-a="step:orch">Разговор с оркестратором</button></div></div>${dockHtml(f)}`;
  }
  return `${crumb}${card(S.fid,true)}<div class="fgrid"><div class="col">${left}</div><div class="col">${side}</div></div>`;
}

      <div class="ev">${av('gleb')}<span>Глеб вернул через 25 мин <span class="cat">разрез</span></span></div>
      <div class="quote">«Маска рвётся по краю при повороте головы. В критериях шага поворотов нет — от чего отталкиваться?»</div></li>
    <li><span class="rn">2</span><div class="rh">Круг 2 · 13.10, 18:05</div>

      <div class="ev">${av('gleb')}<span>Глеб вернул через 40 мин <span class="cat">разрез</span> <span class="cat">исполнитель</span></span></div>

// Узор QR детерминированный; бумага и чернила одинаковы в обеих темах — QR должен сканироваться
function qrSvg(){
  let x = 7, r = '';
  for (let i=0;i<21;i++) for (let j=0;j<21;j++){
    const fin = (i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);
    let on;
    if (fin){ const a = i>13?i-14:i, b = j>13?j-14:j; on = a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4); }
    else { x = (x*1103515245+12345)&0x7fffffff; on = ((x>>16)&3)<2; }
    if (on) r += `<rect x="${j}" y="${i}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 23 23" width="100%" height="100%" style="display:block;background:var(--c-on-dark);fill:var(--c-on-warning);border-radius:6px" aria-label="QR-код">${r}</svg>`;
}

function dlgHtml(){
  const f = F[S.fid], d = DLG[S.dlg](f);
  const order = ['history','stats','bg','hands','multi','pult','cleanup','voice'];
  let extra = '';
  if (d.prio){
    const i = order.indexOf(S.fid), j = d.prio==='up' ? Math.max(0,i-1) : Math.min(order.length-1,i+1);
    const nw = order.slice(); nw.splice(i,1); nw.splice(j,0,S.fid);
    extra = `<label class="fl">Новый порядок у куратора</label><ul class="prio">${nw.map((k,n)=>`<li class="${k===S.fid?'me':n===i?'moved':''}"><span class="no">${n+1}</span>${glyph(F[k].st,12)}<span>${esc(F[k].title)}</span>${k===S.fid?`<span class="mut" style="margin-left:auto">было ${i+1}</span>`:''}</li>`).join('')}</ul>`;
  }
  if (d.who) extra = `<div class="who-list">${[['alex','Архитектор: уточнить критерий','≈25 мин · сильная'],['kira','Другой исполнитель','≈40 мин · средняя'],['kuz','Локальный исполнитель','≈60 мин · бесплатно, очередь'],['gleb','Ревьюер: посмотреть раньше очереди','≈10 мин · средняя']]
    .map((w,n)=>`<label><input type="radio" name="who" ${n===0?'checked':''}>${av(w[0],true)}<span><b>${P[w[0]].n}</b><br><span class="mut">${w[1]}</span></span><span class="pr">${w[2]}</span></label>`).join('')}</div>`;
  const cat = d.cat ? `<label class="fl" for="dcat">Категория</label><select id="dcat"><option>Разрез</option><option>Исполнитель</option><option>Критерии шага</option><option>Другое</option></select>` : '';
  const reason = d.reason ? `<label class="fl" for="dreason">${d.reason} <span class="mut">· обязательно</span></label><textarea id="dreason" rows="3" placeholder="${d.reasonPh}"></textarea>` : '';
  const cons = d.cons ? `<div class="cons${d.info?' info':''}"><div class="cap">${d.info?'Что произойдёт':'Последствия'}</div><ul>${d.cons.map(c=>`<li>${c}</li>`).join('')}</ul></div>` : '';
  return `<div class="ov" data-a="close"></div><div class="dlg${d.who||d.prio?'':' confirm'}" role="dialog" aria-label="${esc(d.t)}">
    <h2>${d.t}</h2><p class="lead">${d.lead}</p>${extra}${cat}${reason}${cons}
    <div class="acts">${btn('Отмена','ghost','close')}<button class="btn primary" data-a="confirm" id="dok" ${d.reason?'disabled':''}>${d.ok}</button></div></div>`;
}

function render(){
  F.qr = qrF();
  document.documentElement.setAttribute('data-theme', S.theme);
  const app = document.getElementById('app');
  app.className = 'app' + (S.mobile ? ' m' : '');
  const scr = S.screen==='board' ? screenBoard() : S.screen==='feature' ? screenFeature() : screenStep();
  const nf = S.screen==='board' ? btn(S.mobile?'+ Новая':'+ Новая фича','primary','newfeat') : '';
  const hub = `<div class="hub"><h2 class="ttl serif">Пульт куратора</h2><span class="sp"></span>${S.mobile?'':'<span class="who">Андрей</span>'}${nf}</div>`;
  const inner = `<div class="canvas">${hub}${scr}</div>`;
  app.innerHTML = (S.mobile ? `<div class="scroll">${inner}</div>` : inner)
    + (S.sheet ? sheetHtml() : '') + (S.dlg ? dlgHtml() : '') + (S.toast ? `<div class="toast" role="status">${S.toast}</div>` : '');
  renderBar();
}
function renderBar(){
  const pills = (id, items, cur, key) => document.getElementById(id).innerHTML =
    items.map(i=>`<button class="${cur===i[0]?'on':''}" data-mk="${key}:${i[0]}">${i[1]}</button>`).join('');
  const walk = S.mode==='walk';
  pills('mk-mode', [['overview','Обзор состояний'],['walk','Пройти путь фичи']], S.mode, 'mode');
  ['mk-ov1','mk-ov2'].forEach(id=>document.getElementById(id).style.display = walk?'none':'flex');
  ['mk-w1','mk-w2'].forEach(id=>document.getElementById(id).style.display = walk?'flex':'none');
  pills('mk-screen', [['board','Табло фич'],['feature','Экран фичи'],['step','Шаг']], S.screen, 'screen');
  const curState = (STATES.find(s=>s[2]===S.fid)||[])[0];
  document.getElementById('mk-state').innerHTML = STATES.map(s=>`<button class="${curState===s[0]?'on':''}" data-mk="state:${s[0]}">${glyph(s[0]==='accept'||s[0]==='noplan'?'wait':s[0],11)}${s[1]}</button>`).join('');
  const b = BEATS[S.w.i], ci = stgIdx(b.st);
  document.getElementById('mk-stage').innerHTML = STG.map((s,i)=>`<button class="${i===ci?'on':i<ci?'past':''}" data-mk="stage:${s.k}">${i<ci?'✓ ':''}${s.n}</button>`).join('');
  document.getElementById('mk-clock').textContent = bt() || '—';
  const nx = document.getElementById('mk-next');
  nx.disabled = !!b.gate || b.id==='post:closed';
  document.getElementById('mk-hint').textContent = b.gate ? `Ворота: решение за вами — «${b.id==='idea'&&S.w.small?'Сразу в план':b.gate}» в интерфейсе` : b.id==='post:closed' ? 'Путь пройден до конца' : 'Команда работает — «Дальше» сдвинет время';
  pills('mk-theme', [['light','Светлая'],['dark','Тёмная']], S.theme, 'theme');
  pills('mk-width', [['desk','Десктоп'],['m','Мобильный 360']], S.mobile?'m':'desk', 'width');
}
let toastT;
function toast(t){ S.toast = t; render(); clearTimeout(toastT); toastT = setTimeout(()=>{ S.toast=null; render(); }, 2600); }
function toWalk(){ S.mode = 'walk'; S.fid = 'qr'; S.screen = 'feature'; S.sheet = S.dlg = null; S.menu = false; }

document.addEventListener('click', e=>{
  const mk = e.target.closest('[data-mk]');
  if (mk){
    const [k,v] = mk.dataset.mk.split(':');
    if (k==='mode'){ S.mode = v; if (v==='walk') toWalk(); else { S.fid = 'stats'; S.screen = 'board'; } }
    if (k==='screen') S.screen = v;
    if (k==='state'){ S.fid = STATES.find(s=>s[0]===v)[2]; if (S.screen==='board') S.screen='feature'; S.linesOpen = v==='done'; S.cvOpen = false; }
    if (k==='stage'){ jumpTo(v); toWalk(); }
    if (k==='next'){ nextBeat(); toWalk(); }
    if (k==='restart'){ S.w = freshWalk(); toWalk(); }
    if (k==='theme') S.theme = v;
    if (k==='width') S.mobile = v==='m';
    S.sheet = S.dlg = null; S.menu = false; render(); return;
  }
  const el = e.target.closest('[data-a]');
  if (!el){ if (S.menu){ S.menu=false; render(); } return; }
  const a = el.dataset.a, i = a.indexOf(':'), k = i<0?a:a.slice(0,i), v = i<0?'':a.slice(i+1);
  if (k!=='menu') S.menu = false;
  switch(k){
    case 'nav': S.screen = v; S.sheet = S.dlg = null; break;
    case 'open':
      if (FB[v] && FB[v].walk){ jumpToBeat(FB[v].walk); toWalk(); toast(`Этап «${stg(FB[v].stage).n}» показан на сквозной фиче «Оплата по QR»`); return; }
      if (FB[v]){ toast('Маленькая правка идёт — экран как у любой фичи в производстве'); return; }
      if (v==='qr'){ toWalk(); break; }
      S.mode = 'overview'; S.fid = v; S.screen = 'feature'; S.linesOpen = F[v].st==='done'; S.cvOpen = false; break;
    case 'newfeat': S.w = freshWalk(); toWalk(); break;
    case 'step': S.screen = 'step'; S.sheet = S.dlg = null; if (v==='chat'||v==='orch'){ S.tab='chat'; S.chatWith = v==='orch'?'orch':'exec'; } else S.tab='rounds'; break;
    case 'sheet': S.sheet = v; break;
    case 'dlg': S.dlg = v; S.sheet = null; break;
    case 'close': S.sheet = S.dlg = null; break;
    case 'menu': S.menu = !S.menu; break;
    case 'lines': S.linesOpen = !S.linesOpen; break;
    case 'cv': S.cvOpen = !S.cvOpen; break;
    case 'grp': if (v==='paused') S.showPaused = !S.showPaused; else S.showDone = !S.showDone; break;
    case 'ck': S.ack[v] = true; break;
    case 'tab': S.tab = v; break;
    case 'chat': S.chatWith = v; break;
    case 'send': { const inp = document.getElementById('chatin'); if (inp && inp.value.trim()){ S.chat[S.chatWith].push(['me','Вы',inp.value.trim()]); } break; }
    case 'toast': toast(v); return;
    case 'gate': { const m = doGate(v); if (m){ S.sheet = S.dlg = null; toast(m); return; } break; }
    case 'w': {
      const w = S.w, [x,y,z] = v.split(':');
      if (x==='mic'){ w.mic = !w.mic; if (!w.mic){ w.idea = (w.idea.trim()+' Важно, чтобы с телефона тоже можно было заплатить.').trim(); toast('Голос распознан — текст добавлен в поле'); return; } }
      if (x==='prio') w.prio = y;
      if (x==='small') w.small = !w.small;
      if (x==='ans') w.ans[+y] = +z;
      if (x==='recall') QS.forEach((q,n)=>w.ans[n]=q.r);
      if (x==='var') w.variant = y;
      if (x==='mstate') w.mstate = y;
      if (x==='mdev') w.mdev = y;
      if (x==='rm') w.removed[y] = !w.removed[y];
      if (x==='demo'){ w.demo = true; toast('Стенд открыт в панели «Сервисы» — пункт чек-листа закрыт'); return; }
      if (x==='rel') w.relMode = y;
      if (x==='relWho') w.relWho = y;
      if (x==='relWin') w.relWin = y;
      if (x==='relOk') w.relOk = !w.relOk;
      if (x==='restart'){ S.w = freshWalk(); toWalk(); }
      break; }
    case 'confirm': {
      const d = DLG[S.dlg](F[S.fid]), r = ((document.getElementById('dreason')||{}).value||'').trim();
      if (d.ck) S.ack[d.ck] = true;
      S.dlg = null;
      if (d.go){ toast(doGate(d.go, r) || 'Готово'); return; }
      toast(`Готово: ${d.ok.toLowerCase()} — запись в ленте фичи`); return;
    }
  }
  render();
});
document.addEventListener('input', e=>{
  const id = e.target.id, val = e.target.value;
  if (id==='dreason'){ const ok = document.getElementById('dok'); if (ok) ok.disabled = !val.trim(); }
  if (id==='idea'){ S.w.idea = val; const go = document.getElementById('idea-go'), why = document.getElementById('idea-why');
    if (go) go.disabled = !val.trim(); if (why) why.style.display = val.trim() ? 'none' : 'flex';
    const nx = document.getElementById('mk-next'); }
  if (id==='reltext') S.w.relText = val;
  if (id==='budget') S.w.budget = val;
  if (id==='due') S.w.due = val;
});
document.addEventListener('change', e=>{
  const ex = e.target.dataset && e.target.dataset.exec;
  if (ex){ S.w.exec[ex] = e.target.value; render(); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && (S.sheet||S.dlg||S.menu)){ S.sheet = S.dlg = null; S.menu = false; render(); }
  if (e.key==='Enter' && e.target.id==='chatin'){ document.querySelector('[data-a="send"]').click(); }
});
render();
</script>
</body>
</html>
