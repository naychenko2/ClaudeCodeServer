<style>

  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072;

  --c-border:#3D3830; --c-border-light:#34302A; --c-track:#453F37;

.nc.sel { background:var(--c-accent-light); border-color:var(--c-accent-muted); }
.nc.warn { border-color:var(--c-warning); } .nc.danger { border-color:var(--c-danger-border); }
.nh { display:flex; align-items:center; gap:6px; min-width:0; color:var(--c-text-heading); font:700 12px "JetBrains Mono",monospace; }
.role,.what { overflow:hidden; color:var(--c-text-muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
.what { color:var(--c-text-secondary); }
.big { margin-top:4px; overflow:hidden; color:var(--c-text-heading); font:600 18px/1.25 "JetBrains Mono",monospace; text-overflow:ellipsis; white-space:nowrap; }
.big.warn { color:var(--c-warning-text); } .big.danger { color:var(--c-danger-text); }
.eng { margin-top:4px; padding-top:4px; overflow:hidden; border-top:1px solid var(--c-border-light); color:var(--c-text-muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap; }

/* Уровень 1: крупные KPI. CPU/RAM без level — никакого зелёного светофора. */
.kpis { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }

.kpi-label { display:flex; align-items:center; gap:6px; min-width:0; color:var(--c-text-secondary); font-size:11px; font-weight:600; }

.kpi-value { margin-top:4px; color:var(--c-text-heading); font:600 28px/1.15 "JetBrains Mono",monospace; }

.kpi-detail b { color:var(--c-text-primary); font-family:"JetBrains Mono",monospace; }
.spark { display:block; width:100%; height:24px; margin-top:4px; overflow:visible; }
.spark-na { height:24px; margin-top:4px; border-radius:4px; background:var(--c-bg-inset); }

/* Уровень 2: текущие температуры, история только в TempChart. */
.level-caption { display:flex; flex-wrap:wrap; gap:2px 8px; margin:12px 0 6px; color:var(--c-text-heading); font-size:11px; font-weight:600; }

.temps { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }

.temp.danger { background:var(--c-danger-bg); border-color:var(--c-danger-border); }
.temp-name { display:flex; align-items:center; gap:6px; min-width:0; color:var(--c-text-secondary); font-size:11px; font-weight:600; }
.temp-name span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.temp-value { margin-top:2px; color:var(--c-text-heading); font:600 20px/1.2 "JetBrains Mono",monospace; }
.temp.warn .temp-value { color:var(--c-warning-text); } .temp.danger .temp-value { color:var(--c-danger-text); }
.temp-detail { margin-top:2px; color:var(--c-text-secondary); font-size:10px; line-height:1.4; overflow-wrap:anywhere; }
.temp-detail b { color:var(--c-text-primary); font-family:"JetBrains Mono",monospace; }

/* DisclosureSection: отдельный sibling, 40 px десктоп / 44 px мобильный. */
.disclosure { min-width:0; overflow:hidden; background:var(--c-bg-white); border:1px solid var(--c-border-light); border-radius:12px; }

.sensor-detail { min-width:0; color:var(--c-text-muted); font-size:10px; overflow-wrap:anywhere; }
.sensor-state { color:var(--c-text-muted); font-size:10px; text-align:right; }
.sensor-state.warn { color:var(--c-warning-text); } .sensor-state.danger { color:var(--c-danger-text); }

/* ИБП: одна KPI, одна сводка и одна полоса из трёх ячеек. */

.temp-head { align-items:flex-start; }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }

.stale .kpi-value,.stale .temp-value,.stale .sensor-value,.stale .ups-cell-value,.stale .big { color:var(--c-text-muted)!important; }

<div class="bar" data-theme="light">

<div class="cols" id="root"></div>
<script>
// Иконки — контуры lucide; в продукте использовать lucide-react и ICON_SIZE/ICON_STROKE.
const ICONS = {

  Battery:'<rect x="2" y="6" width="16" height="12" rx="2"/><path d="M22 13v-2"/><path d="M6 10v4"/><path d="M10 10v4"/>',
  Chevron:'<path d="m6 9 6 6 6-6"/>', Alert:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  Message:'<path d="M22 17a2 2 0 0 1-2 2H6.8a2 2 0 0 0-1.4.6l-2.2 2.2A.7.7 0 0 1 2 21.3V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/><path d="M7 11h10"/><path d="M7 15h6"/><path d="M7 7h8"/>',
  Media:'<path d="m12.3 6.5 3 4"/><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m6.2 5.3 3.1 3.9"/>'
};
const icon = (name,size=14,cls='') => `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
const clone = o => JSON.parse(JSON.stringify(o));
const nd = '<span class="na">нет данных</span>';
const noSensor = '<span class="na">датчика нет</span>';
const val = (v,unit='',dec=false) => v == null ? nd : `${dec ? String(Math.round(v*10)/10).replace('.',',') : Math.round(v)}${unit ? ` ${unit}` : ''}`;
const detailVal = (v,unit='°C') => v == null ? '<span class="na">нет данных</span>' : `<b>${Math.round(v)} ${unit}</b>`;
const pill = (label,level='none',status=false) => `<span class="pill p-${level}"${status?' role="status"':''}>${label}</span>`;

function hist(cur,seed=1,stale=false,gap=false) {
  const n=90, cut=77;
  return Array.from({length:n},(_,i)=>{
    if (stale && i>=cut) return null;
    if (gap && (i===24 || i===25 || i===58)) return null;
    const f=x=>1.6*Math.sin(x/10+seed)+.8*Math.sin(x/2.3+seed*1.7);
    return Math.max(0,cur+f(i)-f(stale?cut-1:n-1));
  });
}
function spark(values,color='var(--c-text-muted)',label='Динамика за 15 минут') {
  const vs=values.filter(v=>v!=null); if (!vs.length) return '<div class="spark-na" aria-label="Нет данных"></div>';
  const lo=Math.min(...vs)-1,hi=Math.max(...vs)+1,W=120,H=24,X=i=>i*W/(values.length-1),Y=v=>H-2-(v-lo)/(hi-lo||1)*(H-4);
  const segs=[]; let cur=[];
  values.forEach((v,i)=>{ if(v==null){if(cur.length){segs.push(cur);cur=[];}}else cur.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`); });
  if(cur.length)segs.push(cur);
  let li=0; values.forEach((v,i)=>{if(v!=null)li=i;});
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}">
    ${segs.map(s=>`<polyline points="${s.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`).join('')}
    <circle cx="${X(li)}" cy="${Y(values[li])}" r="2.5" fill="${color}" vector-effect="non-scaling-stroke"/></svg>`;
}

const FAMILY={mem:{label:'Память карт',color:'var(--c-accent)'},core:{label:'Ядро карт',color:'var(--c-info)'},cpu:{label:'Процессор',color:'var(--c-success)'},board:{label:'Плата',color:'var(--c-text-muted)'},disk:{label:'Диски',color:'var(--c-warning)'}};
function tempChart(n,theme) {
  const stale=n.status!=='ok', selected=S.families;
  const series=[];
  selected.forEach(f=>{
    if(f==='mem'||f==='core')n.gpus.forEach(g=>series.push({family:f,label:`Карта ${g.index+1}`,current:g[f],dash:g.index? '4 3':''}));
    if(f==='cpu'&&n.cpu.temp!=null)series.push({family:f,label:'Процессор',current:n.cpu.temp,dash:''});
    if(f==='board'){const d=n.details.find(x=>x.key==='board');if(d?.value!=null)series.push({family:f,label:'Плата',current:d.value,dash:''});}
    if(f==='disk'){const d=n.details.find(x=>x.key==='system');if(d?.value!=null)series.push({family:f,label:'Системный диск',current:d.value,dash:''});}
  });
  const W=340,H=110,PR=26,pw=W-PR,N=90;
  const currents=series.map(s=>s.current).filter(v=>v!=null); if(selected.length===1&&selected[0]==='mem')currents.push(95);
  const lo=currents.length?Math.floor((Math.min(...currents)-5)/10)*10:30,hi=currents.length?Math.ceil((Math.max(...currents)+3)/10)*10:100;
  const X=i=>i*pw/(N-1),Y=v=>H-(v-lo)/(hi-lo||1)*H;
  const grid=[lo,(lo+hi)/2,hi].map((v,i)=>`<line x1="0" x2="${pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="${i===0?'var(--c-border)':'var(--c-border-light)'}"/><text x="${W-2}" y="${Y(v)+3}" text-anchor="end" fill="var(--c-text-muted)" font-size="10" font-family="monospace">${Math.round(v)}</text>`).join('');
  const lines=series.map((s,si)=>{
    const points=hist(s.current,si+2,stale,true),segs=[];let cur=[];
    points.forEach((v,i)=>{if(v==null){if(cur.length){segs.push(cur);cur=[];}}else cur.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);});if(cur.length)segs.push(cur);
    return segs.map(seg=>`<polyline points="${seg.join(' ')}" fill="none" stroke="${FAMILY[s.family].color}" stroke-width="1.75" stroke-dasharray="${s.dash}" stroke-linejoin="round"/>`).join('');
  }).join('');
  const threshold=selected.length===1&&selected[0]==='mem'?`<line x1="0" x2="${pw}" y1="${Y(95)}" y2="${Y(95)}" stroke="var(--c-warning)" stroke-dasharray="3 3"/><text x="2" y="${Y(95)-3}" fill="var(--c-warning-text)" font-size="10">замедление памяти 95</text>`:'';
  const off=stale?`<rect x="${X(77)}" y="0" width="${pw-X(77)}" height="${H}" fill="var(--c-bg-inset)" opacity=".6"/><text x="${(X(77)+pw)/2}" y="${H/2}" text-anchor="middle" fill="var(--c-text-muted)" font-size="10">нет связи</text>`:'';
  const chips=Object.entries(FAMILY).map(([k,f])=>{const on=selected.includes(k),dis=!on&&selected.length>=3;return `<button type="button" class="chip ${on?'on':''}" data-family="${k}" aria-pressed="${on}" ${dis?'disabled':''} style="--chip-color:${f.color}"><i></i>${f.label}</button>`;}).join('');
  const times={ '1m':['−1 мин','−30 с','сейчас'],'5m':['−5 мин','−2,5','сейчас'],'15m':['−15 мин','−10','−5','сейчас'],'1h':['−1 ч','−30','сейчас'] };
  const windows=[['1m','1 мин'],['5m','5 мин'],['15m','15 мин'],['1h','1 ч']].map(([v,t])=>`<button type="button" data-window="${v}" class="${S.window===v?'on':''}" aria-pressed="${S.window===v}">${t}</button>`).join('');
  return `<section class="card ${stale?'stale':''}" aria-labelledby="${theme}-temp-title"><div class="ch temp-head"><h3 id="${theme}-temp-title">Температуры</h3><span class="seg windows">${windows}</span></div>
    <div class="chips">${chips}</div>${series.length?`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График температур узла ${n.key}">${grid}${off}${threshold}${lines}</svg>
    <div class="chart-times">${times[S.window].map(t=>`<span>${t}</span>`).join('')}</div><div class="legend">${series.map(s=>`<span style="color:${FAMILY[s.family].color}">— ${s.label} <b>${s.current==null?'—':Math.round(s.current)+'°'}</b></span>`).join('')}</div>`:'<div class="summary">Выберите, что показать</div>'}</section>`;
}
function gpuCards(n) {
  if(!n.gpus.length)return '';
  const stale=n.status!=='ok';
  return `<section class="card ${stale?'stale':''}"><div class="ch"><h3>${n.gpus.length>1?'Видеокарты':'Видеокарта'}</h3></div>
    ${n.gpus.map(g=>`<div class="sensor-row"><div class="sensor-name">${dot(stale?'none':g.level)}<span>Карта ${g.index+1} · RTX 3090</span></div><div class="sensor-value ${stale?'':g.level}">${val(g.mem,'°C')}</div><div class="sensor-detail">загрузка ${g.util} % · видеопамять ${g.used} из ${g.total} ГБ</div><div class="sensor-state">${g.level==='danger'?'сбрасывает частоту от перегрева':'в норме'}</div></div>`).join('')}</section>`;
}
function island(theme,data) {
  const n=data.nodes[S.node], stale=n.status!=='ok', mobile=S.width<380;
  const tabs=`<span class="seg"><button type="button">${icon('Message',12)} LLM</button><button type="button">${icon('Media',12)} Медиа</button><button type="button" class="on">${icon('Cpu',12)} Стенды ${n.level==='danger'&&!stale?dot('danger'):''}</button></span>`;
  const body=`${farmCard(data.nodes,theme)}${upsDataCard(data.ups,theme)}${upsDynamics(data.ups,theme)}${staleBanner(n)}${standCard(n,theme)}${otherDetails(n,theme,stale)}${tempChart(n,theme)}${gpuCards(n)}`;
  return `<div class="isl ${mobile?'sheet':''}" style="max-width:${S.width}px" data-panel>${mobile?'<div class="grab"></div>':''}<div class="hd">${mobile?'Локальные модели':tabs}<span class="x">✕</span></div><div class="body">${mobile?`<div>${tabs}</div>`:''}${body}</div></div>`;
}
function render() {
  const data=makeData(), themes=S.theme==='both'?['light','dark']:[S.theme];
  document.getElementById('root').innerHTML=themes.map(theme=>`<div class="col" data-theme="${theme}"><h2>${theme==='light'?'Светлая':'Тёмная'} тема</h2>
    <p class="note"><b>${STATES[S.state].label}.</b> ${STATES[S.state].caption}<br>${S.width} CSS px · свёртки ${S.detailsOpen||S.upsOpen?'сохраняют выбранное состояние':'закрыты по умолчанию'}.</p>
    <div class="mock">${island(theme,data)}<p class="pcap">Два крупных KPI → средние текущие температуры → компактная свёртка. TempChart не вложен в свёртку; GpuDetailCard и EngineCard ниже — без изменений.</p></div></div>`).join('');
  bind(); bar();
}
function bar() {
  tog('tState','state',Object.entries(STATES).map(([k,v])=>[k,v.label]));
  tog('tTheme','theme',[['light','Светлая'],['dark','Тёмная'],['both','Обе']]);
  tog('tWidth','width',[[380,'Рельс 380'],[360,'Телефон 360'],[320,'Узкий 320']]);
}
function tog(id,key,opts) {
  const el=document.getElementById(id); el.innerHTML=opts.map(([v,t])=>`<button type="button" class="${String(S[key])===String(v)?'on':''}" data-v="${v}" aria-pressed="${String(S[key])===String(v)}">${t}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    S[key]=key==='width'?+b.dataset.v:b.dataset.v;
    if(key==='state'){S.node=S.state==='stale'?'video':'ai';S.detailsOpen=false;S.upsOpen=false;}
    render();
  });
}
function bind() {
  document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{S.node=b.dataset.node;S.detailsOpen=false;render();});
  document.querySelectorAll('[data-disclosure]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.disclosure, open=key==='details'?!S.detailsOpen:!S.upsOpen;
    if(key==='details')S.detailsOpen=open;else S.upsOpen=open;
    document.querySelectorAll(`[data-disclosure="${key}"]`).forEach(x=>x.setAttribute('aria-expanded',String(open)));
    document.querySelectorAll(`[data-body="${key}"]`).forEach(x=>x.style.display=open?'block':'none');
  });
  document.querySelectorAll('[data-window]').forEach(b=>b.onclick=()=>{S.window=b.dataset.window;render();});
  document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.family;S.families=S.families.includes(f)?S.families.filter(x=>x!==f):S.families.length<3?[...S.families,f]:S.families;render();
  });
}
render();
</script>
</body>
</html>
