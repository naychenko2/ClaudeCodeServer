# Защита ccs-agents.slice от oomd: ManagedOOMMemoryPressure=kill разрешает
# oomd при PSI-давлении на память убивать процессы внутри slice. oomd выбирает
# жертву по PSI (кто активнее рефолтит страницы), а не по объёму, — поэтому
# бьёт по нашим сборкам, хотя память заняли qemu и vLLM.
#
# Это второй замок защиты ccs.service от повторения инцидента 2026-09-19/21.
# Первый — MemoryHigh/MemoryMax выше (50-memory-limits.conf), он срабатывает
# раньше oomd и обычно успевает остановить рост.
[Slice]
ManagedOOMMemoryPressure=kill
