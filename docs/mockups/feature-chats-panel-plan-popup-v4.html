<!--
  Макет v4. Андрей выбрал вторую строку шапки В2 «Трек» (feature-chat-header-row2-v3.html).
  Здесь — в том же языке (полоса трекера из корзин) ещё две поверхности фичи:
    • плашка группы фичи в панели чатов (FeatureGroupHeader) — С1 «Трек снизу», С2 «Трек вместо рельсы», С3 «Кромка»;
    • пилюля и попап «План хода» в чате (TurnPlanPill → FeatureModeBody) — П1 «Сводка», П2 «Мой шаг», П3 «Шаги по корзинам».
  Подложка — снимок живого стенда этой ветки (29.10, Playwright, DPR 2): настоящие сайдбар с группой фичи,
  шапка-остров, лента, пилюля и композер. Старый FeatureBanner на снимке скрыт, ленте добавлено место под
  строку В2 (42 / 48 px) — как будет в продукте. Варианты наложены HTML-ом точно по координатам настоящих
  элементов (плашка 57,103 · 322×55; пилюля справа до x 1336, y 372; мобила — плашка 8,127 · 344×55, пилюля 16,384).
  Предложение — feature-chats-panel-plan-popup-v4-proposal.md.
  Привязка: задача da0036ba (role=design), featureId эпика d2d8c8a5. Код продукта не правится.
  Сырые значения цветов — ТОЛЬКО в блоке токенов (копия theme.css); дальше — var(--c-*).
-->

/* ===== В2 «Трек» — вторая строка шапки (выбрана) ===== */

/* ===== Плашка группы фичи (FeatureGroupHeader): 55 px, шеврон 26 / 40 ===== */

.fgh.c1 .body { padding:6px 10px 2px 2px; gap:3px; }

/* ===== Пилюля «План хода» (TurnPlanPill) ===== */
.tpp { display:flex; align-items:center; gap:7px; height:22px; padding:0 11px; border-radius:8px; background:var(--c-bg-selected);

.pop { background:var(--c-bg-white); border:1px solid var(--c-border); border-radius:10px; box-shadow:var(--shadow-dropdown);

<script>
const I = {

// Данные — как на стенде: принято 5 из 9, 1 в ревью, 2 в работе, 1 не заведён

  title:'Правда о прогрессе фичи', pct:56, acc:5, total:9,

  disc:['Ш9 есть в плане, задачи нет'],
};
const ST = {
  run:  { tone:null, color:'var(--c-success)', glyph:'run', glyphColor:'var(--c-accent)' },
  wait: { tone:'warn', color:'var(--c-warning)', glyph:'wait', glyphColor:'var(--c-warning)', word:'Ждёт вас', who:'Полина', why:'Полина спрашивает про отступы', act:'Ответить', mact:'Ответить' },
  stop: { tone:'stop', color:'var(--c-danger)', glyph:'stop', glyphColor:'var(--c-danger)', word:'Стоит', who:'Тимур', why:'у Тимура упала сборка Ш6', act:'Чат Тимура', mact:'Чат' },
};
const S = { side:'1', pop:'1', st:'run', open:true, theme:'light', acc:false };
const bar = (cls = '') => `<div class="bar ${cls}">${F.buckets.map(([k, n]) => `<i class="k-${k}" style="flex:${n}"></i>`).join('')}</div>`;
const legend = () => `<div class="leg">${F.buckets.map(([k, n, l]) => `<span><i class="k-${k}"></i>${l} ${n}</span>`).join('')}</div>`;
const av = () => `<span class="av">${['ГЛ','ПО','ТИ'].map(x => `<i>${x}</i>`).join('')}</span>`;
const tcls = () => ST[S.st].tone === 'warn' ? 't-warn' : 't-stop';
const glyph = () => { const st = ST[S.st]; return `<span style="color:${st.glyphColor};display:flex">${ic(st.glyph, 14)}</span>`; };

// ===== В2 «Трек» — строка шапки (выбрана; та же, что в v3) =====
function b2(mob) {
  const st = ST[S.st];
  const left = st.tone ? `<span class="ph ${tcls()}">${st.word} · ${mob ? st.who : st.why}</span>`
    : (mob ? `<span class="ph"><b>${F.pct} %</b> · Сейчас <b>Полина</b> +2</span>` : `<span class="ph"><b>${F.title}</b> · Сейчас <b>Полина</b> — Ш8 · вёрстка шапки +2</span>`);
  const right = st.tone ? `<button class="btn">${mob ? st.mact : st.act}</button>`
    : (mob ? `<span class="mono" style="font-size:12px;color:var(--c-text-muted)">≈ 18:30</span>`
           : `<span class="mono" style="font-size:12px;font-weight:700;color:var(--c-text-heading)">${F.pct} %</span><span class="mono" style="font-size:12px;color:var(--c-text-muted)">· ≈ 18:30</span>`);
  return `<div class="b2" data-b2><div class="stack"><div class="tl">${left}<span class="right">${right}</span></div>${bar()}</div><span class="chev">${ic('chevD', 16)}</span></div>`;
}

// ===== Плашка группы фичи =====
function side(mob) {
  const st = ST[S.st];
  const v = S.side;
  const toneCls = st.tone === 'warn' ? 'warn' : st.tone === 'stop' ? 'stop' : '';
  const cv = `<span class="cv">${ic('chevD', 12)}</span>`;
  const r1 = `<div class="r1">${glyph()}<span class="ttl" title="${F.title}">${F.title}</span><span class="age">${st.tone ? '3 мин' : '11 мин'}</span></div>`;
  const status = st.tone ? `<span class="st ${tcls()}">${st.word} · ${st.who}</span>` : `<span class="st">Сейчас <b>Полина</b> +2</span>`;
  if (v === '0') {
    // как сейчас: мини-рельса из 8 точек + аватары + «принято 5 из 9 · 1 в ревью…»
    const dots = ['n','n','a','w2','n','n','n','n'].map(d => d === 'w2' ? `<i style="width:16px;height:5px;border-radius:3px;background:var(--c-text-heading)"></i>` : `<i style="width:5px;height:5px;border-radius:50%;background:${d === 'a' ? 'var(--c-success)' : 'var(--c-progress-track)'}"></i>`).join('');
    return `<div class="fgh ${toneCls}" data-fgh>${cv}<div class="body">${r1}<div class="r2"><span style="display:inline-flex;gap:3px;align-items:center;flex-shrink:0">${dots}</span>${av()}<span class="num" style="flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis">принято 5 из 9 · 1 в ревью · 2 в работе</span></div></div></div>`;
  }
  if (v === '1') return `<div class="fgh c1 ${toneCls}" data-fgh>${cv}<div class="body">${r1}<div class="r2">${av()}${status}<span class="num"><b>${F.pct} %</b>${mob ? '' : ' · ≈ 18:30'}</span></div>${bar()}</div></div>`;
  if (v === '2') return `<div class="fgh ${toneCls}" data-fgh>${cv}<div class="body">${r1}<div class="r2">${bar('mini')}<span class="num"><b>${F.pct} %</b></span>${av()}${st.tone ? status : `<span class="st">${mob ? 'Полина +2' : '5 из 9 · 1 в ревью · 2 в работе'}</span>`}</div></div></div>`;
  // С3: нижняя кромка плашки — полоса корзин (тон тревоги красит кромку слева 3 px, а не полосу)
  return `<div class="fgh ${toneCls}" data-fgh style="border-bottom-color:transparent">${cv}<div class="body">${r1}<div class="r2">${av()}${status}<span class="num"><b>${F.pct} %</b> · ≈ 18:30</span></div></div>
    <div class="edge">${F.buckets.map(([k, n]) => `<i class="k-${k}" style="flex:${n}"></i>`).join('')}</div></div>`;
}

// ===== Пилюля «План хода» =====
function pill(mob) {
  const st = ST[S.st];
  const dot = st.tone ? `<span class="dot" style="background:${st.color}"></span>` : '';
  const icon = `<span style="position:relative;display:flex;flex-shrink:0">${ic('route', 12)}${dot}</span>`;
  const tone = st.tone ? `class="tx ${tcls()}"` : 'class="tx"';
  if (S.pop === '2') return `<button class="tpp" data-pill aria-expanded="${S.open}">${icon}<span ${tone}>${st.tone ? `${st.word} · ${st.who}` : `Ш8 · <b>в работе</b> · 24 мин`}</span></button>`;
  if (S.pop === '3') return `<button class="tpp" data-pill aria-expanded="${S.open}">${icon}<span ${tone}>${st.tone ? `${st.word} · ${st.who}` : `шаги · <b>5 из 9</b>`}</span>${bar()}</button>`;
  return `<button class="tpp" data-pill aria-expanded="${S.open}">${icon}<span ${tone}>${st.tone ? `${st.word} · ${st.who}` : `фича · <b>${F.pct} %</b>`}</span>${bar()}</button>`;
}

// ===== Попап =====
function alarm(mob) {
  const st = ST[S.st];
  if (!st.tone) return '';
  return `<div class="alarm ${st.tone}"><span class="tx"><b>${st.word}.</b> ${st.tone === 'warn' ? 'Полина спрашивает про отступы карточки — ответ нужен в этом чате.' : 'У Тимура упала сборка Ш6, 14 мин назад.'}</span><button class="btn">${mob ? st.mact : st.act}</button></div>`;
}
const foot = () => `<div class="foot">этот чат — <span class="role">Ш8 · фронт</span><button class="lnk">Страница фичи ${ic('arrow', 12)}</button></div>`;
function popBody(mob) {
  const head = `<div class="pt"><span class="tx">${F.title}</span><span class="more">· ещё 1</span></div>`;
  if (S.pop === '1') {
    return head + alarm(mob)
      + `<div class="meter"><div class="h"><span>По трекеру</span><span class="vl">${F.pct} % · ${F.acc} из ${F.total}</span></div>${bar()}${legend()}</div>`
      + `<div class="sec">Сейчас · 3</div>${F.now.map(r => `<div class="br"><span class="w"><b>${r[0]}</b> — ${r[1]}${r[3] ? ' <span class="me">· этот чат</span>' : ''}</span><span class="v">${r[2]}</span></div>`).join('')}`
      + `<div class="sec">Дальше</div>${F.next.map(r => `<div class="br"><span class="w"><b>${r[0]}</b> — ${r[1]}</span></div>`).join('')}`
      + `<div class="pair"><div class="pc"><div class="k">Готовность</div><div class="val">60 %</div><div class="s">оценка Софьи · 18:02</div></div><div class="pc"><div class="k">Срок</div><div class="val">≈ 2 ч 40</div><div class="s">к 18:30 · с запасом</div></div></div>`
      + foot();
  }
  if (S.pop === '2') {
    return alarm(mob)
      + `<div class="sec" style="margin-top:2px">Этот чат</div>
         <div class="step"><div class="t"><span class="tx">Ш8 · Вёрстка шапки</span><span class="chip w">в работе · 24 мин</span></div>
         <div class="m">Полина · линия фронт · сдача ещё не было</div></div>
         <div class="sec">Цепочка шага</div>
         <div class="chain">
           <div class="br"><span class="w"><span class="dt" style="background:var(--c-success)"></span><b>Ш7 · тексты</b> — принят, от него зависит</span><span class="v">13:40</span></div>
           <div class="br"><span class="w"><span class="dt" style="background:var(--c-accent)"></span><b>Ш8 · вёрстка</b> — работа идёт</span><span class="v">сейчас</span></div>
           <div class="br"><span class="w"><span class="dt" style="background:var(--c-progress-track)"></span><b>Ревью</b> — Глеб, после сдачи</span><span class="v">—</span></div>
           <div class="br"><span class="w"><span class="dt" style="background:var(--c-progress-track)"></span><b>Ш9 · e2e</b> — ждёт этот шаг, не заведён</span><span class="v">—</span></div>
         </div>
         <div class="sec">Фича</div>
         <div class="meter" style="margin-top:0"><div class="h"><span class="ph" style="font-size:13px"><b>${F.title}</b></span><span class="vl">${F.pct} % · ≈ 18:30</span></div>${bar()}</div>`
      + foot();
  }
  // П3: шаги по корзинам
  const group = (k, title, rows, open = true) => `<div class="sec"><i style="width:7px;height:7px;border-radius:2px;display:inline-block" class="k-${k}"></i>${title}</div>${open ? rows.map(r => `<div class="br"><span class="w"><b>${r[0]}</b> — ${r[1]}${r[3] ? ' <span class="me">· этот чат</span>' : ''}</span><span class="v">${r[2]}</span></div>`).join('') : ''}`;
  return head + alarm(mob)
    + `<div class="meter" style="margin-top:2px"><div class="h"><span>По трекеру</span><span class="vl">${F.pct} % · ${F.acc} из ${F.total}</span></div>${bar()}</div>`
    + group('w', 'В работе · 2', [['Ш8','вёрстка шапки · Полина','24 мин',true],['Ш6','проекция мержа · Тимур','1 ч 10']])
    + group('r', 'В ревью · 1', [['Ш5','расхождения трекера · Глеб','8 мин']])
    + group('n', 'Не заведено · 1', [['Ш9','e2e шапки','—']])
    + `<div class="sec"><i style="width:7px;height:7px;border-radius:2px;display:inline-block" class="k-a"></i>Принято · 5</div>
       <button class="coll" data-acc aria-expanded="${S.acc}">${ic(S.acc ? 'chevD' : 'chevR', 12)}${S.acc ? 'Свернуть' : 'Ш1 · Ш2 · Ш3 · Ш4 · Ш7'}<span class="v mono" style="font-size:11px;color:var(--c-text-muted)">13:40</span></button>
       ${S.acc ? [['Ш1','модель прогресса'],['Ш2','проекция трекера'],['Ш3','корзины «в master»'],['Ш4','сводка на странице'],['Ш7','тексты интерфейса']].map(r => `<div class="br"><span class="w"><b>${r[0]}</b> — ${r[1]}</span><span class="v">принят</span></div>`).join('') : ''}`
    + `<div class="br" style="margin-top:8px"><span class="w" style="color:var(--c-warning-text)">Трекер расходится · 1 — ${F.disc[0]}</span></div>`
    + foot();
}
function popup(mob) {
  return `<div class="pop" data-pop role="dialog" aria-label="Исполнение фичи"><div class="hd"><span class="mode"><span>План хода</span><span class="on">Исполнение фичи</span></span></div><div class="bd">${popBody(mob)}</div></div>`;
}

// ===== Раскладка по координатам настоящих элементов =====
function render() {
  document.documentElement.dataset.theme = S.theme;
  const D = { group:[57,103,322,55], row:[427,140,904,42], pillR:1336, pillY:371.7 };
  document.getElementById('desk').innerHTML =
    `<div class="ov" style="left:${D.group[0]}px;top:${D.group[1]}px;width:${D.group[2]}px">${side(false)}</div>
     <div class="ov" style="left:${D.row[0]}px;top:${D.row[1]}px;width:${D.row[2]}px;height:32px">${b2(false)}</div>
     <div class="ov" style="right:${1400 - D.pillR}px;top:${D.pillY}px;display:flex;justify-content:flex-end;width:340px">${pill(false)}</div>
     ${S.open ? `<div class="ov" style="right:${1400 - D.pillR}px;top:${D.pillY + 28}px;width:380px;max-height:${900 - D.pillY - 38}px;display:flex"><div style="width:100%;max-height:inherit;display:flex;flex-direction:column">${popup(false)}</div></div>` : ''}`;
  document.getElementById('mlist').innerHTML = `<div class="ov mobile" style="left:8px;top:127px;width:344px">${side(true)}</div>`;
  document.getElementById('mchat').innerHTML =
    `<div class="ov mobile b2row" style="left:0;top:57px;width:360px;height:48px;display:flex;align-items:center">${b2(true)}</div>
     <div class="ov mobile" style="left:16px;top:384px;max-width:288px;display:flex">${pill(true)}</div>
     ${S.open ? `<div class="ov mobile" style="left:8px;right:8px;top:113px;max-height:${740 - 113 - 8}px;display:flex;flex-direction:column">${popup(true)}</div>` : ''}`;
  const NOTE = {
    '0':'<b>Плашка «как сейчас»</b> — для сравнения: 8 точек этапов, аватары, «принято 5 из 9 · 1 в ревью…».',
    '1':'<b>С1 · Трек снизу</b> — та же плашка 55 px, точки этапов заменены полосой трекера во всю ширину под текстом, как у В2. Во второй строке — кто сейчас и «56 %».',
    '2':'<b>С2 · Трек вместо рельсы</b> — минимальная правка: на месте 8 точек короткая полоса 64 px из тех же корзин, рядом процент.',
    '3':'<b>С3 · Кромка</b> — полоса трекера становится нижней кромкой плашки (3 px), текст не тронут. Самая тихая.',
  };
  const PNOTE = {
    '1':'<b>П1 · Сводка</b> — пилюля «фича · 56 %» с мини-полосой; попап — то же содержимое, что раскрытие В2 (трекер, Сейчас, Дальше, Готовность|Срок). Этапы-аккордеон убраны.',
    '2':'<b>П2 · Мой шаг</b> — пилюля говорит про шаг ЭТОГО чата («Ш8 · в работе · 24 мин»); попап — карточка шага, его цепочка (от чего зависит, ревью, кто ждёт) и одна строка фичи с полосой. Фича целиком — в В2 и на странице.',
    '3':'<b>П3 · Шаги по корзинам</b> — пилюля «шаги · 5 из 9» с полосой; попап — шаги плана, разложенные по тем же корзинам, что полоса: в работе, в ревью, не заведено, принято (свёрнуто).',
  };
  document.getElementById('note').innerHTML = NOTE[S.side] + ' ' + PNOTE[S.pop] + ' Подложка — снимок живого стенда; варианты наложены точно на места настоящих элементов.';
  document.querySelectorAll('[data-ctl]').forEach(g => {
    const cur = g.dataset.ctl === 'open' ? String(+S.open) : S[g.dataset.ctl];
    g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === cur));
  });
}
document.querySelector('[data-mk]').addEventListener('click', e => {
  const b = e.target.closest('button[data-val]'); if (!b) return;
  const k = b.parentElement.dataset.ctl;
  if (k === 'open') S.open = b.dataset.val === '1'; else S[k] = b.dataset.val;
  render();
});
document.querySelector('.stage').addEventListener('click', e => {
  if (e.target.closest('[data-pill]')) { S.open = !S.open; render(); return; }
  if (e.target.closest('[data-acc]')) { S.acc = !S.acc; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) { S.open = false; render(); } });
render();
</script>
</body>
</html>
