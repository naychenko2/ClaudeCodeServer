# Сессионный порог systemd-oomd для user@.service.
#
# Поставка Ubuntu (/usr/lib/systemd/system/user@.service.d/10-oomd-user-service-defaults.conf)
# держит ManagedOOMMemoryPressure=kill при 50 % PSI за 20 с на ВСЮ сессию
# пользователя — рабочий стол, браузеры и ccs.slice вместе. Разбор 2026-09-22:
# 7 из 9 убийств агентских scope 19–21.09 сработали по этому порогу, а давление
# создавали наши же сборки под дросселем MemoryHigh.
#
# Kill не снимаем — это единственная защита рабочего стола от собственных утечек,
# но порог поднимаем до 80 %: при таком стойле сессия и так неработоспособна.
# Жёсткий рубеж для агентов теперь — MemoryMax ядра на ccs-agents.slice.
#
# Системный файл (root): раскладывается deploy/systemd/install-system-tuning.sh.
[Service]
ManagedOOMMemoryPressureLimit=80%
