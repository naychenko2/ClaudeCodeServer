[Service]
# Решение Андрея 2026-09-19: размышления с бюджетом 512 + фраза перехода (--reasoning-config
# в .env стенда vLLM). 2026-09-23 бюджет поднят до 1024 после серии по обрезке thinking:
# старые блоки текущего хода снимает прокси, блоки прошлых ходов отбрасывал шаблон Qwen3.
# 2026-10-08: стенд переведён на preserve_thinking true (.env hyperqwen) — блоки прошлых ходов
# теперь остаются в промпте. Замер на двух задачах Кузьмы: та же точность фактов, −37 %/−60 %
# сгенерированных токенов, −28 %/−55 % времени, кэш 94–97 % (заметка «Контрольный прогон
# размышлений на Кузьме 2026-10-08»). Режим off отвергнут: 1 петля из 3 прогонов без presence_penalty.
# 2026-10-15: петля в чате спайка (local-qwen, контекст ~100K): срез бюджета посреди плана, модель
# продолжила план в ответе и зациклилась. Бюджет 1024 → 2048 (меньше срезов). presence_penalty 1.0
# ставили на 20 минут и откатили: карточка Qwen3.8 для режима размышлений даёт 0.0 (1.5 — только без
# размышлений), штраф давит ключи JSON вызовов и идентификаторы кода. Гибрид не взят — отвергнут
# замером 08.10. Защита от петель — детектор в прокси (задача 796f6c4b). Откат бюджета: вернуть 1024.
Environment=THINKING_MODE=budget THINKING_BUDGET=2048
# Прунинг старых выводов инструментов и тел Write/Edit.
# PRUNE_INPUTS включён после повторов 2026-09-22 с честным лимитом вывода: метка в истории на
# письмо модели не влияет (12 из 12 запросов — полноценный текст), прежняя тревога о подражании
# была обрывом по лимиту 2500.
#
# PRUNE_THINKING ВЫКЛЮЧЕН по итогу опыта 2026-09-23 (задача f5983982). Прежнее включение опиралось
# на серию прямых запросов: отчёты с обрезкой несли те же факты, что контроль. Контролируемый
# прогон реальной задачи показал обратное — считает модель именно в черновых блоках, и без них
# она заканчивает фразу по памяти. Два прогона, отличавшиеся ТОЛЬКО этим флагом:
#   on : 12 ошибок фактов (3 major), неверны 5 чисел из 5 проверенных, документ 333 строки
#   off:  8 ошибок фактов (0 major), неверны 6 чисел из 32,            документ 796 строк
# Взамен обрезка не покупает ничего: прогон без неё даже короче (18,1 против 19,7 мин), пик
# занятости окна тот же (176 907 против 179 317). Подробности — README и итог задачи.
Environment=PRUNE_TOOL_RESULTS=on PRUNE_INPUTS=on PRUNE_THINKING=off
# Гейт прунинга PRUNE_MIN_CONTEXT_TOKENS здесь НЕ задаём: живёт дефолтом proxy.py (150000 с
# 2026-10-15), его держит тест неравенства — README «Выбор гейта — одно неравенство».
# Мера 4 (a68ac431): запрос автосжатия уходит на MiniMax вместо локали — 20,7 с против 330–450 с
# на локальной модели, сводка содержательнее. Ключ прокси читает сам из appsettings.Local.json,
# здесь только адрес. Без этой строки сжатие молча возвращается на локаль (`"compact": "off"`
# в /__proxy/stats).
Environment=COMPACT_UPSTREAM=https://api.minimax.io/anthropic
# Сохранение дословного при сжатии (шаг 5 плана «сжатие с сохранением дословного», задача
# cced3293; README «Сохранение дословного»): к сводке в ответе сжатия дописывается <ccs-preserved>
# с постановкой, репликами человека, файлами, проверками, планом и якорями из compactor.py.
# Выключено до замера шага 6 на корпусе. Включение — COMPACT_PRESERVE=on и рестарт.
Environment=COMPACT_PRESERVE=off
# Карточка обрезки контекста в ленте чата (3533ae5a): прокси шлёт событие бэкенду. Хост именно
# localhost — 127.0.0.1 нет в AllowedHosts прода. Без строки обрезка происходит молча.
Environment=BACKEND_EVENTS_URL=http://localhost/api/internal/llm-proxy/events
# ВАЖНО: этот файл — источник правды для боевой машины. Всё, что добавлено только в
# /etc/systemd/system/thinking-strip-proxy.service.d/, теряется при следующей раскатке отсюда:
# ровно так 2026-09-23 были потеряны две строки выше (сжатие ушло с облака на локаль, карточка
# обрезки перестала слаться) — правку на машине не перенесли сюда.
# Сэмплинг 27B (замер 2026-10-08, итог в flashnext-logs/sweep/verb-results.txt): CLI шлёт
# temperature=1, прокси перебивает на рекомендованные Qwen 0.7/0.8/20 — вызовы инструментов
# надёжнее (ложный текст вместо вызова 4,7% → 0,7%), ответы короче на 15%. presence_penalty
# Anthropic-роутер vLLM не принимает, и замер показал, что на длину он не влияет. Откат — убрать строку.
# presence_penalty с 08.10 принимает патченный роутер (vllm-patch/presence-penalty, в образе 0.31 есть),
# но в режиме размышлений не применяется (см. выше).
Environment=SAMPLING=temperature=0.7,top_p=0.8,top_k=20
# Предохранитель от петли в потоке (2026-10-15, задача 796f6c4b; README «Предохранитель от петли»):
# повтор длинного куска 3 раза в окне 400 слов → обрыв генерации и один повтор запроса с
# presence_penalty 0.5 и temperature +0.1 (только для этого повтора). Прогнан на стенде :18031.
# Откат: LOOP_GUARD=off и рестарт.
Environment=LOOP_GUARD=on
# Предохранитель от мусорной генерации (2026-10-15, задача dab84d17; README «Предохранитель от
# мусорной генерации»): DFlash2 + prefix cache (vLLM #60174) после кэш-хита выдаёт шум до лимита
# 20 000 токенов (569 с на ход). Доля мусорных слов ≥ 35 % в окне 80 слов → обрыв генерации и
# пометка «Повтори ход» в чате, без повтора запроса: кэш-хит повторил бы мусор.
# Откат: JUNK_GUARD=off и рестарт.
Environment=JUNK_GUARD=on
# Прунинг картинок (2026-10-15, задача b23c9a3e; README «Прунинг картинок»): старые скриншоты и
# вложения — текстовой заглушкой с размером, остаются картинки последнего сообщения человека и
# IMAGE_KEEP самых свежих; сверх IMAGE_MAX на запрос режутся старейшие — 400 «At most N image(s)»
# от движка (--limit-mm-per-prompt 64) невозможен, мёртвый чат 14.09 не повторится. Картинка
# 1920×1080 — ~2K токенов контекста и KV на каждом ходу. Откат: IMAGE_PRUNE=off и рестарт.
Environment=IMAGE_PRUNE=on IMAGE_KEEP=4 IMAGE_MAX=12
# Снимок префикса первого хода для хранителя кэша (prefix_keeper.py по user-таймеру prefix-keeper.timer,
# 2026-10-08): model + tools + system первого запроса сессии, без текста человека. Каталог 0700, файлы 0600.
Environment=PREFIX_SNAPSHOT_DIR=/var/lib/thinking-strip-proxy/prefix
