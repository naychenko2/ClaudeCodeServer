  Привязка: featureId 05c5938f-98ae-4726-884f-d7140c91b937 (эпик «Заметки+Вики: один раздел, который ведут человек и ИИ вместе»),
  задача дизайна 5dc008cc. Шаги реализации ещё не нарезаны (stepRef появится у Егора) — первым пойдёт «навигация в боковые панели».
  Модель — разрез Александра (задача ef7a0732), рекомендованный вариант Б: страница — один текст, файлы пишет только Хранитель,
  правка человека идёт через него под именем автора, у каждого утверждения есть происхождение.
  v2 (02.11) — под принятый ADR-038: ИИ сам заменяет и оспаривает утверждения человека, постфактум — метка «заменил вашу»,
  «Вернуть мою», прежняя формулировка в «Истории», фильтр «ИИ поменял моё» в «Журнале»; во «Входящих» — только то, что
  автомат не смог применить сам. Секции страницы — по ADR-035 §3. В «Настройках» — блок «Ночной разбор чатов» из среза Ф2
  (эпик 7f63f1bd, llm-wiki-v2.html, «Срез Ф2 02.11»).
  Главное правило макета: в контентной зоне нет навигации — ни вкладок, ни «Назад», ни крошек. Дерево — левая панель,
  «Входящие / Журнал / Здоровье / Настройки» — правая панель и её рельса (на 360 — выезжающие шторки).
-->

function editTexts(doc) {

}
function editStats(doc) {
  let n = 0, blocked = false;

    if (linkIssues(r.t, doc).some(x => x.kind === 'foreign')) blocked = true;
  }
  return { n, blocked };
}

/* --- Конфликт 409 --- */
function diffMark(a, b) {
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  const mid = b.slice(i, b.length - j);
  return esc(b.slice(0, i)) + (mid ? `<span class="add">${esc(mid)}</span>` : '') + esc(b.slice(b.length - j));
}
function buildConflict(doc) {
  const E = A.edit, loc = find(doc, 'f1'), f1 = loc[0].items[loc[1]];
  const touched = [...new Set(editTexts(doc).filter(r => r.gone || (r.added ? r.t.trim() : r.t.trim() !== r.it.t)).map(r => r.sec))];
  const mineT = E.gone.f1 ? null : (E.draft.f1 !== undefined && E.draft.f1.trim() !== f1.t ? E.draft.f1.trim() : undefined);
  const rows = [], auto = [];
  if (mineT !== undefined) rows.push({ title:'Сводка · сноска 3', mine:mineT, theirs:THEIRS_F1, was:f1.t, state:'', val:'', merging:false });
  else auto.push(['Сводка', touched.includes('Сводка') ? 'правили разные утверждения — сольётся само' : 'правил только ИИ — его правка применится']);
  touched.filter(s => s !== 'Сводка').forEach(s => auto.push([s, 'правили только вы — ваши правки применятся']));
  A.cf = { rows, auto };
}
function docConflict() {
  const cf = A.cf, total = cf.rows.length + cf.auto.length, done = cf.auto.length + cf.rows.filter(r => r.state).length, ready = done === total;
  const LBL = { mine:'взято моё', theirs:'взята правка ИИ', merge:'слито вручную' };
  const row = (r, i) => {
    const head = `<div class="cfh">${r.title}<span class="s" style="color:${r.state ? 'var(--c-success-text)' : 'var(--c-warning-text)'}">${r.state ? I('check', 13) + ' решено: ' + LBL[r.state] : 'изменили и вы, и ИИ'}</span></div>`;
    if (r.state) return `<div class="cf done">${head}<div class="col" style="border:0">${esc(r.val ?? '(убрано)')}<div style="margin-top:6px"><button class="lnk" data-a="cf-reopen" data-i="${i}">Изменить выбор</button></div></div></div>`;
    if (r.merging) return `<div class="cf">${head}<div class="col" style="border:0"><div class="cl">${I('merge', 11)}Слейте вручную — начали с вашего варианта</div>
        <div class="nedit" contenteditable="true" role="textbox" data-cfm="${i}">${esc(r.mine ?? r.theirs)}</div>
        <div class="hint mut" style="margin:6px 0 0;padding:0">ИИ дописал: «с увеличением до 1440p — ещё около 15».</div></div>
      <div class="cfa"><button class="btn xs pri" data-a="cf-merge-done" data-i="${i}">${I('check', 13)}Готово</button><button class="btn xs gh" data-a="cf-merge-cancel" data-i="${i}">Отмена</button></div></div>`;
    return `<div class="cf">${head}<div class="cols">
        <div class="col mine"><div class="cl">${og('me', 10)}Моё</div>${r.mine === null ? '<i>вы убрали это утверждение</i>' : diffMark(r.was, r.mine)}</div>
        <div class="col"><div class="cl">${og('ai', 10)}ИИ · сегодня 09:20</div>${diffMark(r.was, r.theirs)}</div>
        <div class="col"><div class="cl">${I('history', 11)}Было, когда вы начали</div>${esc(r.was)}</div></div>
      <div class="cfa"><button class="btn xs sec" data-a="cf-pick" data-v="mine" data-i="${i}">Оставить моё</button><button class="btn xs sec" data-a="cf-pick" data-v="theirs" data-i="${i}">Взять их</button><button class="btn xs gh" data-a="cf-merge" data-i="${i}">${I('merge', 13)}Слить вручную</button></div></div>`;
  };
  return `<div class="doc">
    <div class="ebar"><span class="bdg t-warning">${I('alert', 12)}Нужно решить</span><span class="s">${ready ? 'Все разделы решены' : `Решено ${done} из ${total} ${plural(total, 'раздела', 'разделов', 'разделов')}`}</span>
      <button class="btn xs gh" data-a="cf-drop">Отменить мою правку</button><button class="btn xs pri" data-a="cf-save" ${ready ? '' : 'disabled'}>${I('check', 13)}Сохранить</button></div>
    <div class="docin">
      <div class="ntc n-warn">${I('alert', 18)}<div class="b"><div class="tt">Страница изменилась, пока вы правили</div>
        <div>Сегодня в 09:20 ИИ дописал её после разбора чата. Ваш текст не потерян: выберите, что оставить там, где вы с ИИ правили одно и то же. Остальное сольётся само.</div></div></div>
      ${cf.rows.map(row).join('')}
      ${cf.auto.map(([t, s]) => `<div class="cf done"><div class="cfh">${esc(t)}<span class="s" style="color:var(--c-success-text)">${I('check', 13)} ${s}</span></div></div>`).join('')}
      ${cf.rows.length ? `<div class="hint mut" style="margin:12px 0 0">${I('info', 13)}<span>«Слить вручную» откроет раздел для правки с вашим вариантом и тем, что дописал ИИ.</span></div>` : ''}
    </div></div>`;
}

function addJournal(e) { A.journal.unshift({ id:uid('j'), day:'Сегодня', tm:now(), ...e }); }

function applyUndo(u) {
  if (u.kind === 'ops') u.ops.forEach(op => {
    const doc = A.docs[op.doc], loc = find(doc, op.id);
    if (!loc) return;
    const [sec, i] = loc;
    toHistory(doc, sec.items[i], sec.h, u.why);
    if (op.prev) { const p = clone(op.prev); if (p.n === 'new') p.n = doc.nextN++; sec.items[i] = p; } else sec.items.splice(i, 1);
  });

    doc.sections.forEach(s => s.items.forEach(x => { if (before.get(x.id) !== x.t) toHistory(doc, x, s.h, u.why); }));
    doc.sections = clone(u.sections);

  if (u.kind === 'restoreHist') restoreHist(A.docs[u.doc], A.docs[u.doc].history.findIndex(h => h.id === u.hid));

/* «Вернуть мою» — пакет human: обратный supersede на исходную карточку человека; засчитывается откатом и включает карантин N7d */

  const [sec, i] = loc, now0 = sec.items[i], tm = now();
  const hi = doc.history.findIndex(h => h.id === now0.rep.hid);
  if (hi < 0) return;
  const [h] = doc.history.splice(hi, 1), { sec:_s, why:_w, ovr:_o, ...mine } = h, { rep:_r, ...aiIt } = now0;
  doc.history.unshift({ ...clone(aiIt), sec:sec.h, why:`формулировка ИИ · вы вернули свою сегодня в ${tm}` });
  sec.items[i] = { ...mine, id };
  doc.updated = `сегодня в ${tm}`;
  A.journal.forEach(j => { if (j.rep && j.rep[0] === docId && j.rep[1] === id) j.done = 'вы вернули своё'; });
  addJournal({ o:'me', ovr:1, t:'Вы вернули свою формулировку', s:`«${doc.title}» · ${sec.h} · 7 дней ИИ не меняет ваше на этой странице сам` });
  toast('Вернули вашу формулировку. 7 дней ИИ не меняет ваше на этой странице сам');
}
function resolveDispute(cxId, how) {
  const doc = cur(), loc = find(doc, cxId); if (!loc) return;
  const [csec, ci] = loc, cx = csec.items[ci], mloc = find(doc, cx.vs), tm = now();
  csec.items.splice(ci, 1);
  const { vs:_v, ...claim } = cx;
  if (mloc) {
    const [msec, mi] = mloc, mine = msec.items[mi];
    delete mine.disp;
    if (how === 'take') { toHistory(doc, mine, msec.h, `ваша формулировка · заменена доводом ИИ с вашего согласия ${TODAY}`); msec.items[mi] = claim; }
  }
  if (how === 'keep') toHistory(doc, claim, csec.h, `довод ИИ · вы оставили своё сегодня в ${tm}`);
  doc.updated = `сегодня в ${tm}`;
  A.journal.forEach(j => { if (j.open === doc.id) j.done = how === 'keep' ? 'вы оставили своё' : 'вы взяли довод ИИ'; });
  addJournal({ o:'me', ovr:1, t:how === 'keep' ? 'Вы оставили своё утверждение' : 'Вы взяли формулировку ИИ', s:`«${doc.title}» · спор закрыт, автоматика снова работает со страницей` });
  toast(how === 'keep' ? 'Спор закрыт: ваше утверждение осталось' : 'Спор закрыт: формулировка ИИ встала на место вашей');
}

  note:'Заметка в том же дереве: «Править» → «Готово», ссылка [[…]] открывает страницу, «Перенести в вики» спрашивает подтверждение: заметка станет страницей, а на её месте останется ссылка.',
  loading:'Скелетон дерева и документа. Выйти — любой другой пункт «Перейти к состоянию». При открытии строки дерева скелетон мелькает и сам.',
  empty:'Ни заметок, ни вики: «Новая заметка» заводит первую запись, «Входящие» — «Спорного нет», «Журнал» пуст.',
  nofind:'Поиск «апскейл» с фильтром «Мои» ничего не нашёл. «Искать во всех» снимает фильтр — найдётся страница, которую ведёте вместе с ИИ.',
};
const GUIDE = 'Всё нажимается прямо в макете. Сценарии: плашка «ИИ заменил вашу формулировку» → «Вернуть мою»; «Править» → поменяйте третье утверждение «Сводки» → «Сохранить» (конфликт 409); «Входящие» → «Заменить» / «Оставить моё»; кнопка шапки «Изменить страницу снаружи»; «Журнал» → «ИИ поменял моё». Кнопки, которые уводят из раздела (рельса продукта слева, граф, «Открыть в чате»), отвечают подсказкой «в прототипе не работает».';

/* ===== Обвязка ===== */
function mk() {
  const pills = (a, cur, opts) => `<div class="pills">${opts.map(([v, l]) => `<button class="${cur === v ? 'on' : ''}" data-a="${a}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const f2 = A.docs.gpu && find(A.docs.gpu, 'f2');
  return `<h1>Заметки + Вики · v2 · прототип</h1>
    <div class="grp"><span class="lbl">Перейти к состоянию</span>${pills('preset', A.preset, PRESETS)}</div>
    <div class="grp"><span class="lbl">События</span><button class="btn xs sec" data-a="ev-drift" ${A.drift || !f2 ? 'disabled' : ''}>${I('alert', 13)}Изменить страницу «снаружи»</button>
      <button class="btn xs sec" data-a="notif-show" ${A.notif ? 'disabled' : ''}>${I('bell', 13)}Утреннее уведомление</button>
      <label><input type="checkbox" data-chk="cf" ${A.cfSim ? 'checked' : ''}> пока правите «Очередь локальной GPU», ИИ меняет сноску 3 (→ 409)</label></div>
    <div class="grp"><span class="lbl">Итог ночи</span>${pills('night-out', A.night.out, [['completed', 'всё разобрано'], ['budget', 'не хватило бюджета'], ['open_limit', 'лимит «Входящих»'], ['none', 'ещё не было']])}</div>
    <div class="grp"><span class="lbl">Ширина</span>${pills('width', S.w, [['d', '1280'], ['m', '360']])}</div>
    <div class="grp"><span class="lbl">Тема</span>${pills('theme', S.t, [['light', 'светлая'], ['dark', 'тёмная']])}</div>
`;
}
function render() {
  document.documentElement.dataset.theme = S.t;
  document.getElementById('mk').innerHTML = mk();
  const p = A.preset && PRESETS.find(x => x[0] === A.preset);
  document.getElementById('note').innerHTML = (p ? `<b>${p[1]}.</b> ${NOTES[p[0]]} ` : `<b>Как пройти руками.</b> ${GUIDE} `) +
    `Решения Андрея от 02.11 приняты (ADR-038): меток «зависит от решения» больше нет.`;
  document.getElementById('root').innerHTML = S.w === 'm' ? mobile() : desktop();
  placeToast();
  if (A.focusScroll) { const el = document.querySelector(A.focusScroll); A.focusScroll = null; if (el) el.scrollIntoView({ block:'center' }); }
  if (A.focus) { const el = document.querySelector(A.focus); A.focus = null; if (el) { el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  let dirty = false;
  if (A.fn && S.w === 'd' && !e.target.closest('.pop') && !(t && t.dataset.a === 'fn')) { A.fn = ''; dirty = true; }
  if (A.menu && !e.target.closest('.menu') && !(t && t.dataset.a === 'menu')) { A.menu = false; dirty = true; }
  if (!t || t.disabled) { if (dirty) render(); return; }
  const a = t.dataset.a;
  if (!['preset', 'theme', 'width'].includes(a)) A.preset = '';
  const fn = ACT[a];
  if (!fn) { console.error('Нет обработчика действия', a); return; }
  fn(t.dataset, t);
  render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('js-q')) { A.q = el.value; A.preset = ''; renderTree(); return; }
  if (el.dataset.sid !== undefined && A.edit) { A.edit.draft[el.dataset.sid] = el.innerText; updateEditMeta(el.dataset.sid); return; }
  if (el.dataset.ntitle !== undefined) { document.querySelectorAll('.js-mtitle').forEach(x => x.textContent = 'Правка'); }
});
document.addEventListener('change', e => {
  const nf = e.target.dataset.nf;
  if (nf) { A.night[nf] = nf === 'from' || nf === 'to' ? +e.target.value : e.target.value.trim(); render(); return; }
  const k = e.target.dataset.chk;
  if (!k) return;
  if (k === 'cf') A.cfSim = e.target.checked;
  else { S[k] = e.target.checked ? 1 : 0; writeHash(); }
  render();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (A.modal) A.modal = null; else if (A.menu) A.menu = false; else if (A.fn) { A.fn = ''; if (A.d === 'sheet') A.d = ''; } else if (A.d) A.d = ''; else return;
  render();
});
readHash();
applyPreset(PRESETS.some(p => p[0] === S.s) ? S.s : 'page', false);
render();
</script>
</body>
</html>
