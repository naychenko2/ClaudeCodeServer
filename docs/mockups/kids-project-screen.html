<!DOCTYPE html>

<head>

<title>Детский режим — взрослый экран проекта-предмета в детской подаче · макет v1</title>
<!--
  Детская сторона по новой основе Андрея 19.11: отдельной детской оболочки нет. Ребёнок работает во
  взрослом экране проекта-предмета с урезанным набором; визуальный язык взрослый (острова на холсте,
  рельса панелей, док проектов), подача — крупнее и теплее (цели касания 44, текст ленты 16, PT Serif
  в заголовках). Эпик 45af8178-8435-4746-8f13-bd3cc781585e, задача 5eb76cc9 (role=design).
  Записка — kids-project-screen-proposal.md. Окно настроек — kids-settings-window.html (4 раздела).
  Заменяет детскую оболочку kids-tutors.html и схему kids-subject-folder.html в части оболочки; правила папки
  (Материалы под замком, корзина, «Отправить в урок») — оттуда без изменений.
  Только var(--c-*) из theme.css; сырой hex — лишь в блоке темы.
  Якорь адреса повторяет пульт: #scr=project&pn=files&w=mob&t=dark
-->
<style>
/* ===== Тема: frontend/src/lib/theme.css ===== */
:root, [data-theme="light"] {

  --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E;

  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5; --c-accent-soft:#E8A990;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-divider:#DDD4C4; --c-dashed:#D0C6B4;
  --c-track:#D8CFBE; --c-smoke:#B4A899;

  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;

  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F; --c-danger-border:#F5C6BF;

[data-theme="dark"] {

  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C; --c-accent-soft:#9A5E48;

  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;

  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72; --c-danger-border:#5A302A;
  --c-info:#5FA0CC; --c-info-bg:#1E2A33;

  --c-plan:#9385D8; --c-plan-light:#2A2540; --c-plan-text:#B0A4E6;
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
  --shadow-island:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.45);
  --shadow-modal:0 28px 70px rgba(0,0,0,.65);

}

*{box-sizing:border-box}
body{margin:0;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--c-bg-inset);color:var(--c-text-primary)}
button{font-family:inherit}
svg.i{display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{font-size:13px;color:var(--c-text-muted);line-height:1.45}
.serif{font-family:'PT Serif',Georgia,serif}

/* Пульт (не продукт) */
.pult{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--c-bg-panel);border-bottom:1px solid var(--c-border);font-size:12px;color:var(--c-text-secondary)}
.pult b{color:var(--c-text-heading);margin-right:4px}
.pult .grp{display:flex;align-items:center;gap:4px}
.pill{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--c-bg-selected);flex-wrap:wrap}
.pill button{border:none;cursor:pointer;background:transparent;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--c-text-secondary)}
.pill button[aria-pressed="true"]{background:var(--c-bg-white);color:var(--c-text-heading);box-shadow:var(--shadow-thumb)}
.stage{padding:24px 16px 32px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow-x:auto}

/* Холст и острова (CanvasBackdrop, Island) */
.frame{position:relative;isolation:isolate;flex-shrink:0;height:820px;border-radius:14px;overflow:hidden;background:var(--c-bg-main);display:flex;box-shadow:var(--shadow-peek)}
.frame::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--canvas-glow)}
.frame.m{height:740px;flex-direction:column}
.island{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--c-bg-card);border:1px solid var(--c-border-light);border-radius:16px;box-shadow:var(--shadow-island)}
.ihead{flex-shrink:0;min-height:52px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--c-border-light);font-size:15px;font-weight:600;color:var(--c-text-heading)}
.ihead .sp{flex:1;min-width:0}
.ibody{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

/* Кнопки (Button, IconButton, RailIconButton) — детская подача: 44 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--c-accent);color:var(--c-on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--c-border);color:var(--c-text-secondary)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.ib{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:var(--c-text-secondary);display:grid;place-items:center;cursor:pointer;flex-shrink:0;position:relative}
.ib:hover{background:var(--c-bg-selected)}
.ib[aria-pressed="true"]{background:var(--c-accent-light);color:var(--c-accent)}
.ib .cnt{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--c-accent);color:var(--c-on-accent);font-size:10px;font-weight:700;display:grid;place-items:center}
.btn:focus-visible,.ib:focus-visible,.dk:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge.neutral{background:var(--c-bg-inset);color:var(--c-text-muted)}
.badge.warn{background:var(--c-warning-bg);color:var(--c-warning-text)}
.badge.ok{background:var(--c-success-bg);color:var(--c-success-text)}
.badge.info{background:var(--c-info-bg);color:var(--c-info)}
.pav{border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:var(--c-on-dark);font-weight:700;line-height:1}
.glyph{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;font-family:'PT Serif',Georgia,serif;font-size:16px;font-weight:700}
.glyph.sm{width:28px;height:28px;border-radius:8px;font-size:12px}
.pal-info{background:var(--c-info-bg);color:var(--c-info)}
.pal-rose{background:color-mix(in srgb,var(--c-rose) 14%,var(--c-bg-card));color:var(--c-rose-text)}
.pal-success{background:var(--c-success-bg);color:var(--c-success-text)}
.pal-warning{background:var(--c-warning-bg);color:var(--c-warning-text)}

/* Левая рельса: док проектов-предметов (ProjectRail) */
.dock{width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.dcap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;border-radius:16px;background:var(--c-bg-panel);border:1px solid var(--c-border-light)}
.dk{width:48px;height:48px;border-radius:14px;border:2px solid transparent;background:none;padding:0;display:grid;place-items:center;cursor:pointer;position:relative}
.dk .glyph{width:44px;height:44px}
.dk[aria-current="true"]{border-color:var(--c-accent)}
.dk .dot{position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--c-warning);border:2px solid var(--c-bg-panel)}
.dk.dh{background:var(--c-bg-card);border-color:var(--c-border-light);color:var(--c-text-secondary)}
.dk.dh[aria-current="true"]{border-color:var(--c-accent);color:var(--c-accent)}
.dsep{width:28px;height:1px;background:var(--c-border)}
.flyout{position:absolute;left:72px;padding:6px 12px;border-radius:10px;background:var(--c-text-heading);color:var(--c-bg-main);font-size:13px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow-island);z-index:3}

/* Правая рельса панелей (PanelRail) */
.prail{width:60px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:12px 0}
.prail .dcap{gap:6px}
.time{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;background:var(--c-bg-inset);color:var(--c-text-secondary);font-size:13px;white-space:nowrap}
.time b{color:var(--c-text-heading)}
.time .bar{width:48px;height:4px;border-radius:999px;background:var(--c-track);overflow:hidden}
.time .bar i{display:block;height:100%;width:60%;background:var(--c-success)}

/* Чат: шапка, лента, поле ввода */
.main{flex:1;min-width:0;display:flex;gap:10px;padding:12px 0}
.chat{flex:1}
.chead{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--c-border-light)}
.chead h1{margin:0;font-family:'PT Serif',Georgia,serif;font-size:22px;font-weight:500;color:var(--c-text-heading);line-height:1.2}
.lsw{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:2px 8px;border-radius:8px;border:none;background:var(--c-bg-inset);font-size:13px;color:var(--c-text-secondary);cursor:pointer;min-height:28px}
.feed{flex:1;min-height:0;overflow:auto;padding:20px 16px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.u{align-self:flex-end;max-width:80%;background:var(--c-bg-white);border:1px solid var(--c-border-light);box-shadow:var(--shadow-card);border-radius:18px 18px 4px 18px;padding:12px 16px;font-size:16px;line-height:1.55}
.a{font-size:16px;line-height:1.6;color:var(--c-text-heading);display:flow-root}
.a .pav{float:left;margin:2px 10px 4px 0}
.card{border:1px solid var(--c-border-light);border-radius:14px;background:var(--c-bg-white);padding:12px 14px}
.ask .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ask .opt{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-bg-card);font-size:15px;font-weight:600;color:var(--c-text-heading);cursor:pointer}
.widget{border-radius:14px;border:1px solid var(--c-border-light);background:var(--c-bg-card);padding:14px;display:flex;flex-direction:column;gap:10px}
.road{position:relative;height:56px;border-radius:10px;background:var(--c-bg-inset)}
.road .p{position:absolute;top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--c-on-dark)}
.edit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--c-bg-card);border:1px dashed var(--c-dashed);font-size:14px}
.att{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;border-radius:10px;background:var(--c-bg-card);border:1px solid var(--c-border-light);font-size:13px}
.composer{flex-shrink:0;padding:0 16px 16px}
.cbox{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;padding:8px 8px 8px 16px;border-radius:20px;border:1px solid var(--c-border);background:var(--c-bg-white);box-shadow:var(--shadow-card)}
.cbox .ph{flex:1;font-size:16px;color:var(--c-text-muted);padding:10px 0}
.send{width:44px;height:44px;border-radius:12px;border:none;background:var(--c-accent);color:var(--c-on-accent);display:grid;place-items:center}

/* Панели (PanelShell) */
.panel{width:340px;flex-shrink:0}
.tr{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 8px;border-radius:10px;font-size:14px;color:var(--c-text-primary)}
.tr.in{padding-left:30px}
.tr .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr:hover{background:var(--c-bg-selected)}
.seen{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--c-info-bg);font-size:13px}
.ro{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--c-bg-inset);font-size:13px;color:var(--c-text-secondary)}
.inp{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-bg-white);font-size:15px;color:var(--c-text-muted)}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:12px;background:var(--c-bg-white);border:1px solid var(--c-border-light)}
.task .bx{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--c-border);flex-shrink:0;margin-top:1px;display:grid;place-items:center}
.task.done .bx{background:var(--c-success);border-color:var(--c-success);color:var(--c-on-accent)}
.task.done .tt{text-decoration:line-through;color:var(--c-text-muted)}
.task .tt{font-size:15px;font-weight:600;color:var(--c-text-heading)}
.ctx{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--c-bg-white);border:1px solid var(--c-border-light);font-size:14px}

/* Мобила */
.mtop{flex-shrink:0;height:60px;display:flex;align-items:center;gap:6px;padding:0 6px;border-bottom:1px solid var(--c-border);background:var(--c-bg-main)}
.mtop .tt{flex:1;min-width:0}
.mtop .n{font-size:16px;font-weight:600;color:var(--c-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .s{font-size:12px;color:var(--c-text-muted)}
.mbar{flex-shrink:0;display:flex;justify-content:space-around;padding:6px 4px;border-top:1px solid var(--c-border);background:var(--c-bg-main)}
.mbar .ib{flex-direction:column;width:64px;height:52px;display:flex;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600}
.scrim{position:absolute;inset:0;background:var(--c-overlay);z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;top:56px;z-index:5;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.grab{width:36px;height:4px;border-radius:999px;background:var(--c-track);margin:8px auto 0;flex-shrink:0}
.drawer{position:absolute;top:8px;right:8px;bottom:8px;z-index:5;display:flex}

/* Главная */
.home{flex:1;min-width:0;overflow:auto;padding:28px 24px}
.m .home{padding:20px 16px}
.hwrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hello{font-family:'PT Serif',Georgia,serif;font-size:34px;font-weight:500;color:var(--c-text-heading);line-height:1.2}
.m .hello{font-size:28px}
.secl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tab .tiles{grid-template-columns:repeat(2,1fr)}
.m .tiles{grid-template-columns:1fr}
.tile{display:flex;align-items:center;gap:12px;padding:16px;min-height:80px;background:var(--c-bg-card);border:1px solid var(--c-border-light);border-radius:16px;box-shadow:var(--shadow-card);text-align:left;cursor:pointer;color:inherit}
.tile .tl{font-size:16px;font-weight:600;color:var(--c-text-heading)}
.tile .tt{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--c-text-muted)}
.cont{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px;border-radius:16px;background:var(--c-bg-card);border:1px solid var(--c-border-light);box-shadow:var(--shadow-card)}

/* Записка */
.notes{max-width:1280px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:13px;line-height:1.5}
.notes .nb{padding:16px;border-radius:14px;background:var(--c-bg-card);border:1px solid var(--c-border-light)}
.notes h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--c-text-secondary)}
.notes ul{margin:0;padding-left:18px}
@media (max-width:900px){.notes{grid-template-columns:1fr}}
</style>
</head>

  layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  clip:'<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  speaker:'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', down:'<path d="m6 9 6 6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>', left:'<path d="m15 18-6-6 6-6"/>',
  more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  pen:'<path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>', grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  stop:'<path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86z"/><path d="M12 8v4M12 16h.01"/>',
};
const ic = (n, s = 18) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24">${P[n]}</svg>`;

const KID = 'Маша';
const SUBJ = [
  { id:'math', label:'Математика', glyph:'2+2', c:'info', tutor:'Сова Ульяна', ini:'СУ', bg:'--group-blue', hw:1 },
  { id:'rus', label:'Русский язык', glyph:'Аа', c:'rose', tutor:'Кот Учёный', ini:'КУ', bg:'--group-violet', hw:0 },
  { id:'world', label:'Окружающий мир', glyph:'ОМ', c:'success', tutor:'Лесовичок Тимофей', ini:'ЛТ', bg:'--group-green', hw:1 },
];
const S = { scr:'project', pn:'files', w:'desk', t:'light' };
location.hash.slice(1).split('&').forEach((kv) => { const [k, v] = kv.split('='); if (k && v && k in S) S[k] = decodeURIComponent(v); });
const PANELS = [['files','Файлы','folder'],['knowledge','Знания','book'],['notes','Заметки','note'],['context','Контекст','layers'],['tasks','Задачи','list']];
const PULT = [
  ['scr','Экран',[['home','Главная'],['project','Проект-предмет']]],
  ['pn','Панель',[['none','Закрыта']].concat(PANELS.map(([k, l]) => [k, l]))],
  ['w','Ширина',[['desk','1280'],['tab','768'],['mob','360']]],
  ['t','Тема',[['light','Светлая'],['dark','Тёмная']]],
];
function renderPult() { document.getElementById('pult').innerHTML = PULT.map(([k, t, o]) => `<div class="grp"><b>${t}</b><div class="pill">${o.map(([v, l]) => `<button aria-pressed="${S[k] === v}" onclick="set('${k}','${v}')">${l}</button>`).join('')}</div></div>`).join(''); }
function set(k, v) { S[k] = v; location.hash = Object.entries(S).map(([a, b]) => `${a}=${b}`).join('&'); render(); }
const M = () => S.w === 'mob', T = () => S.w === 'tab';
const g = (s, sm) => `<span class="glyph pal-${s.c}${sm ? ' sm' : ''}">${s.glyph}</span>`;
const tav = (s, n = 32) => `<span class="pav" style="width:${n}px;height:${n}px;background:var(${s.bg});font-size:${Math.round(n * .36)}px">${s.ini}</span>`;
const cur = SUBJ[0];
const timePill = `<span class="time">Ещё <b>35 мин</b><span class="bar"><i></i></span></span>`;

/* ===== Док проектов-предметов (ProjectRail) — вместо «Уроков» ===== */
function dock() {
  return `<div class="dock"><div class="dcap">
    <button class="dk dh" aria-label="Главная" ${S.scr === 'home' ? 'aria-current="true"' : ''}>${ic('home', 22)}</button><span class="dsep"></span>
    ${SUBJ.map((s) => `<button class="dk" aria-label="${s.label}" ${S.scr === 'project' && s === cur ? 'aria-current="true"' : ''}>${g(s)}${s.hw ? '<span class="dot" title="Есть домашка"></span>' : ''}</button>`).join('')}
  </div>${S.scr === 'project' && !T() ? `<div class="flyout" style="top:126px">${cur.label} · ${cur.tutor}</div>` : ''}</div>`;
}
/* ===== Рельса панелей (PanelRail) — пять панелей ребёнка ===== */
function prail() {
  return `<div class="prail"><div class="dcap">${PANELS.map(([k, l, i]) => `<button class="ib" aria-label="${l}" aria-pressed="${S.pn === k}">${ic(i, 20)}${k === 'tasks' ? '<span class="cnt">1</span>' : ''}</button>`).join('')}</div></div>`;
}

/* ===== Лента ===== */
function feed() {
  return `<div class="feed"><div class="col">
    <div class="a">${tav(cur)}Привет, ${KID}! Вижу твою домашку. Давай начнём с задачи 3 про пешеходов.</div>
    <div class="u"><div class="att">${ic('image', 16)}Домашка 19 ноября.jpg</div>Давай разберём</div>
    <div class="a">${tav(cur)}Посмотри, как они идут навстречу. Нажми «Пуск» и следи, где они встретятся.</div>
    <div class="widget"><div style="font-size:14px;font-weight:600;color:var(--c-text-heading)">Пешеходы на дороге · 18 км</div>
      <div class="road"><span class="p" style="left:10%;background:var(--group-blue)">4</span><span class="p" style="left:78%;background:var(--group-orange)">5</span></div>
      <div style="display:flex;gap:8px;align-items:center"><button class="btn sm primary">Пуск</button><span class="muted">Прошло: 1 час · между ними 9 км</span></div></div>
    <div class="a ask">${tav(cur)}Через сколько часов они встретятся?<div class="opts">${['1 час', '2 часа', '3 часа'].map((x) => `<button class="opt">${x}</button>`).join('')}</div></div>
    <div class="u">2 часа</div>
    <div class="a">${tav(cur)}Верно! Я записала решение в твой файл, загляни.</div>
    <div class="edit">${ic('pen', 16)}<div style="flex:1;min-width:0"><b style="color:var(--c-text-heading)">Сова Ульяна изменила файл</b><div class="muted">Домашка / Задача 3 — решение.md · прежняя версия в корзине</div></div><button class="btn sm ghost">Открыть</button></div>
  </div></div>`;
}
function composer() {
  return `<div class="composer"><div class="cbox"><button class="ib" aria-label="Прикрепить файл">${ic('clip', 20)}</button><span class="ph">Напиши ответ…</span>
    <button class="ib" aria-label="Читать ответы вслух" aria-pressed="true">${ic('speaker', 20)}</button><button class="ib" aria-label="Сказать голосом">${ic('mic', 20)}</button><button class="send" aria-label="Отправить">${ic('send', 18)}</button></div></div>`;
}
function chatHead() {
  return `<div class="chead">${tav(cur, 44)}<div style="flex:1;min-width:0"><h1>${cur.tutor}</h1><button class="lsw">${g(cur, true)}${cur.label} · Задача про пешеходов ${ic('down', 14)}</button></div>
    ${M() ? '' : `${timePill}<button class="ib" aria-label="Мне неприятно" style="color:var(--c-danger-text)">${ic('stop', 20)}</button>`}</div>`;
}

/* ===== Панели ===== */
function panelBody(k) {
  if (k === 'files') return `<div class="seen">${ic('eye', 16)}Эту папку видят: ты, Андрей, Ольга</div>
    <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1">${ic('upload')}Загрузить</button><button class="ib" aria-label="Новый файл">${ic('plus')}</button><button class="ib" aria-label="Поиск">${ic('search')}</button></div>
    <div class="tr">${ic('down', 14)}${ic('folder')}<span class="n"><b>Материалы</b></span><span class="badge neutral">${ic('lock', 11)}только чтение</span></div>
    <div class="tr in">${ic('file')}<span class="n">Таблица умножения.pdf</span>${ic('lock', 14)}</div>
    <div class="tr">${ic('down', 14)}${ic('folder')}<span class="n">Домашка</span></div>
    <div class="tr in">${ic('image')}<span class="n">Домашка 19 ноября.jpg</span>${ic('more', 16)}</div>
    <div class="tr in">${ic('file')}<span class="n">Задача 3 — решение.md</span><span class="badge info">изменён</span></div>
    <div class="tr">${ic('file')}<span class="n">Что я не поняла.md</span>${ic('more', 16)}</div>
    <div class="tr" style="border-top:1px solid var(--c-border-light);border-radius:0">${ic('trash')}<span class="n">Корзина</span><span class="badge neutral">2</span></div>`;
  if (k === 'knowledge') return `<div class="ro">${ic('lock', 16)}Только читать: что знает Сова Ульяна</div><div class="inp">${ic('search', 16)}Найти в знаниях…</div>
    ${[['Таблица умножения.pdf', 'Материалы'], ['Правила задач на движение', 'Материалы'], ['Домашка 19 ноября.jpg', 'твой файл · распознан текст']].map(([n, s]) => `<div class="tr" style="min-height:52px">${ic('book')}<span class="n">${n}<br><span class="muted" style="font-size:12px">${s}</span></span></div>`).join('')}
    <span class="muted">Сюда попадает всё из папки предмета, кроме корзины. Добавить знания — загрузи файл в «Файлы».</span>`;
  if (k === 'notes') return `<button class="btn ghost">${ic('plus')}Новая заметка</button>
    ${[['Что я не поняла', 'сегодня'], ['Слова на завтра', 'вчера']].map(([n, d]) => `<div class="tr" style="min-height:52px">${ic('note')}<span class="n">${n}<br><span class="muted" style="font-size:12px">${d}</span></span>${ic('more', 16)}</div>`).join('')}
    <span class="muted">Заметки лежат в папке предмета — их видят те же, кто видит папку.</span>`;
  if (k === 'context') return `<div class="ro">${ic('eye', 16)}Только посмотреть, что сейчас видит Сова Ульяна</div>
    <div class="ctx">${tav(cur, 32)}<div style="flex:1"><b style="color:var(--c-text-heading)">Сова Ульяна</b><div class="muted">репетитор предмета</div></div></div>
    <div class="ctx">${ic('image')}<span style="flex:1">Домашка 19 ноября.jpg</span><span class="badge neutral">в уроке</span></div>
    <div class="ctx">${ic('folder')}<span style="flex:1">Папка «Математика»</span><span class="badge neutral">весь урок</span></div>
    <span class="muted">Модель и настройки урока выбирает взрослый — здесь их нет.</span>`;
  return `<div class="seen" style="background:var(--c-warning-bg);color:var(--c-warning-text)">${ic('list', 16)}1 задание на завтра</div>
    <div class="task"><span class="bx"></span><div style="flex:1"><div class="tt">Задачи 3–5 на движение</div><div class="muted">к 20 ноября · от Андрея</div></div><button class="btn sm ghost">${ic('send', 14)}В урок</button></div>
    <div class="task"><span class="bx"></span><div style="flex:1"><div class="tt">Выучить таблицу на 7</div><div class="muted">к 22 ноября · сама добавила</div></div></div>
    <div class="task done"><span class="bx">${ic('check', 14)}</span><div style="flex:1"><div class="tt">Прочитать с. 42</div><div class="muted">сделано вчера</div></div></div>
    <button class="btn ghost">${ic('plus')}Своё задание</button>`;
}
function panel(k) {
  const [, l, i] = PANELS.find(([x]) => x === k);
  return `<div class="island panel">${M() ? '<div class="grab"></div>' : ''}<div class="ihead">${ic(i, 18)}<span class="sp">${l}</span><button class="ib" aria-label="Закрыть">${ic('x', 18)}</button></div><div class="ibody">${panelBody(k)}</div></div>`;
}

/* ===== Главная ===== */
function homeBody() {
  return `<div class="hwrap">
    <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div class="hello">Привет, ${KID}</div><div style="font-size:16px;color:var(--c-text-secondary);margin-top:6px">Уроки открыты до 19:30.</div></div>${timePill}</div>
    <div class="cont">${g(cur)}<div style="flex:1;min-width:200px"><div class="muted">Вчера остановились тут</div><div style="font-size:17px;font-weight:600;color:var(--c-text-heading);margin-top:2px">Математика · Задача про пешеходов</div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:4px;font-size:13px;color:var(--c-text-muted)">${tav(cur, 22)}${cur.tutor}</div></div><button class="btn primary"${M() ? ' style="width:100%"' : ''}>Продолжить</button></div>
    <div class="secl">Домашние задания</div>
    <div class="island" style="border-radius:16px"><div class="ibody" style="padding:8px">
      ${[[SUBJ[0], 'Задачи 3–5 на движение', 'к завтра', 'warn'], [SUBJ[2], 'Нарисовать круговорот воды', 'к пятнице', 'neutral']].map(([s, t, d, tone]) => `<div class="task" style="border:none;align-items:center">${g(s, true)}<div style="flex:1;min-width:0"><div class="tt">${t}</div><div class="muted">${s.label}</div></div><span class="badge ${tone}">${d}</span></div>`).join('')}
    </div></div>
    <div class="secl">Предметы</div>
    <div class="tiles">${SUBJ.map((s) => `<button class="tile">${g(s)}<div style="min-width:0;flex:1"><div class="tl">${s.label}</div><div class="tt">${tav(s, 20)}<span>${s.tutor}</span></div></div>${s.hw ? '<span class="badge warn">домашка</span>' : ''}</button>`).join('')}</div>
  </div>`;
}

/* ===== Сборка по ширине ===== */
function screen() {
  if (M()) {
    const top = S.scr === 'home'
      ? `<div class="mtop"><span style="padding-left:10px;font-family:'PT Serif',Georgia,serif;font-size:20px;color:var(--c-text-heading)" class="tt">Уроки</span>${timePill}</div>`
      : `<div class="mtop"><button class="ib" aria-label="На главную">${ic('left', 22)}</button>${tav(cur, 34)}<div class="tt"><div class="n">${cur.tutor}</div><div class="s">${cur.label} · Задача про пешеходов</div></div><button class="ib" aria-label="Мне неприятно" style="color:var(--c-danger-text)">${ic('stop', 20)}</button></div>`;
    if (S.scr === 'home') return `${top}<div class="home">${homeBody()}</div>`;
    const bar = `<div class="mbar">${PANELS.map(([k, l, i]) => `<button class="ib" aria-pressed="${S.pn === k}">${ic(i, 20)}${l}</button>`).join('')}</div>`;
    const sheet = S.pn === 'none' ? '' : `<div class="scrim"></div><div class="sheet">${panel(S.pn).replace('class="island panel"', 'class="island panel" style="width:100%;flex:1;border-radius:22px 22px 0 0"')}</div>`;
    return `${top}<div style="flex:1;min-height:0;display:flex;flex-direction:column">${feed()}${composer()}</div>${bar}${sheet}`;
  }
  if (S.scr === 'home') return `${dock()}<div class="home">${homeBody()}</div>`;
  const chat = `<div class="island chat">${chatHead()}${feed()}${composer()}</div>`;
  if (T()) {
    const dr = S.pn === 'none' ? '' : `<div class="scrim"></div><div class="drawer">${panel(S.pn)}</div>`;
    return `${dock()}<div class="main">${chat}</div>${prail()}${dr}`;
  }
  return `${dock()}<div class="main">${chat}${S.pn === 'none' ? '' : panel(S.pn)}</div>${prail()}`;
}
function notes() {
  return `<div class="notes">
    <div class="nb"><h4>Что осталось от взрослого</h4><ul><li>Острова на холсте, док проектов слева, рельса панелей справа</li><li>Пять панелей: Файлы, Знания, Заметки, Контекст, Задачи</li><li>Лента: реплики, виджеты, вопросы с кнопками, «изменил файл»</li></ul></div>
    <div class="nb"><h4>Что убрано</h4><ul><li>Режимы, выбор модели, «/» и @ в поле ввода</li><li>Откат правки репетитора — только корзина в «Файлах»</li><li>Остальные панели рельсы, чаты-сайдбар, хаб-навигация</li></ul></div>
    <div class="nb"><h4>Детская подача</h4><ul><li>Цели касания 44, текст ленты 16, заголовок урока PT Serif</li><li>Плашка времени и стоп-сигнал в шапке урока</li><li>На 360 панели — нижняя полоса и шторка</li></ul></div></div>`;
}
function render() {
  document.documentElement.setAttribute('data-theme', S.t);
  renderPult();
  const W = { desk:1280, tab:768, mob:360 }[S.w];
  document.getElementById('stage').innerHTML = `<div class="frame${M() ? ' m' : ''}${T() ? ' tab' : ''}" data-theme="${S.t}" style="width:${W}px" data-frame="kid">${screen()}</div>${notes()}`;
}
render();
</script>
</body>
</html>
