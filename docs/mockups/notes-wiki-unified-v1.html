<!--
  Макет к записке notes-wiki-unified-v1.md. Код продукта не правится.
  Привязка: featureId 05c5938f-98ae-4726-884f-d7140c91b937 (эпик «Заметки+Вики: один раздел, который ведут человек и ИИ вместе»),
  задача дизайна 5dc008cc. Шаги реализации ещё не нарезаны (stepRef появится у Егора) — первым пойдёт «навигация в боковые панели».
  Модель — разрез Александра (задача ef7a0732), рекомендованный вариант Б: страница — один текст, файлы пишет только Хранитель,
  правка человека идёт через него под именем автора, у каждого утверждения есть происхождение. Решения Андрея ещё не приняты:
  места, которые от них зависят, обведены пунктиром C.planBorder с меткой «зависит от решения N» (номера — вопросы Андрею из разреза).
  Главное правило макета: в контентной зоне нет навигации — ни вкладок, ни «Назад», ни крошек. Дерево — левая панель,

-->

function leftPanel(mobile) {

    <div style="display:flex;align-items:center;gap:8px;padding:8px 2px 4px;font-size:12px;color:var(--c-text-secondary)"><span style="flex:1">Проверено сегодня в 06:00</span><button class="btn xs sec">Проверить сейчас</button></div>
    ${drift ? `<div class="item on"><div class="t">${og('ext',11)}Изменили снаружи: «Очередь локальной GPU»</div><div class="s">сегодня 08:47 · 1 место</div>
      <div class="op"><div class="ot">Факты</div><div class="df"><div class="r">Ночью очередь свободна, поэтому длинные задачи лучше ставить вечером.</div><div class="a">Ночью очередь свободна — длинные задачи ставим после 22:00.</div></div>
      <div class="acts"><button class="btn xs pri">Принять как мою правку</button><button class="btn xs sec">Принять как есть</button></div></div></div>` : ''}
    <div class="hrow"><span class="bdg t-danger">2</span><div class="b"><div style="font-weight:600;color:var(--c-text-heading)">Ссылки ведут в никуда</div><div style="font-size:12px;color:var(--c-text-secondary)">«Модули и MF-remote» → «Старый реестр модулей»</div></div></div>
    <div class="hrow"><span class="bdg t-warning">3</span><div class="b"><div style="font-weight:600;color:var(--c-text-heading)">Источник пропал</div><div style="font-size:12px;color:var(--c-text-secondary)">Чат удалён — утверждения ИИ остались без подтверждения</div></div></div>
    <div class="hrow"><span class="bdg t-neutral">1</span><div class="b"><div style="font-weight:600;color:var(--c-text-heading)">Страница без ссылок на неё</div><div style="font-size:12px;color:var(--c-text-secondary)">«Правила релизов»</div></div></div>
  </div>`;
}
function panelSettings() {
  const R = (t, s, on, extra = '') => `<div class="srow"><div class="b"><div class="t">${t}</div><div class="s">${s}</div>${extra}</div><span class="tgl ${on ? 'on' : ''}"></span></div>`;
  return `<div class="pbody">
    ${R('Ночной разбор', 'В 03:00 ИИ разбирает вчерашние чаты и дописывает страницы', 1)}
    ${R('Бесспорное — применять сразу', 'Иначе каждая правка ИИ будет ждать вас во «Входящих»', 1)}
    ${dep(2, R('Ваши утверждения — только через вас', 'ИИ не заменяет и не помечает ваш текст сам: всегда спрашивает во «Входящих»', 1, '<div class="s" style="color:var(--c-text-muted)">Выключить нельзя</div>'), true)}
    ${R('Показывать сноски ИИ', 'Номера сносок у утверждений ИИ; ваши — «✎ имя, дата»', 1)}
  </div>`;
}
function panelBody() {
  return { inbox:panelInbox, journal:panelJournal, health:panelHealth, settings:panelSettings }[S.p]();
}
function panelSeg() {
  return `<div class="iseg" role="tablist" aria-label="Разделы панели">${PANELS.map(([k, l, ic]) =>
    `<button class="${S.p === k ? 'on' : ''}" data-p="${k}" title="${l}" role="tab">${I(ic, S.w === 'm' ? 18 : 15)}${k === 'inbox' && S.s !== 'empty' ? '<span class="cnt">3</span>' : ''}</button>`).join('')}</div>`;
}
const PTITLE = () => PANELS.find(p => p[0] === S.p)[1];

/* ===== Сборка десктопа и мобилы ===== */
function desktop() {
  const open = !!S.p;
  return `<div class="app">
    <div class="rail">${['home','chat','tasks','book','wave'].map((n, i) => `<button class="rb ${n === 'book' ? 'on' : ''}" title="${['Главная','Чаты','Задачи','Заметки','Видео'][i]}">${I(n,18)}</button>`).join('')}</div>
    <div class="isl left">${leftPanel(false)}</div>
    <div class="isl center">${center()}</div>
    ${open ? `<div class="isl right"><div class="ph"><span class="ttl ui">${PTITLE()}</span>${S.p === 'inbox' && S.s !== 'empty' ? '<span class="cnt muted">3</span>' : ''}
      <button class="ib" title="Свернуть панель" data-p="">${I('x')}</button></div>${panelBody()}</div>` : ''}
    <div class="rail" aria-label="Панель вики">${PANELS.map(([k, l, ic]) =>
      `<button class="rb ${S.p === k ? 'on' : ''}" data-p="${S.p === k ? '' : k}" title="${l}">${I(ic,18)}${k === 'inbox' && S.s !== 'empty' ? '<span class="cnt">3</span>' : ''}${k === 'health' && S.s === 'drift' ? '<span class="dot" style="top:4px;right:4px"></span>' : ''}</button>`).join('')}</div>
  </div>`;
}
function mobile() {
  const isDoc = !['empty','nofind'].includes(S.s);
  const title = S.s === 'note' ? 'Идеи для раздела «Видео»' : S.s === 'empty' ? 'Заметки' : S.s === 'nofind' ? 'Заметки' : S.s === 'edit' ? 'Правка' : 'Очередь локальной GPU';
  let layer = '';
  if (S.d === 'tree') layer = `<div class="ov" data-d=""></div><div class="drawer l">${leftPanel(true)}</div>`;
  if (S.d === 'panel') layer = `<div class="ov" data-d=""></div><div class="drawer r"><div class="dh">${panelSeg()}<span style="flex:1"></span><button class="ib" data-d="" title="Закрыть">${I('x',18)}</button></div>
     <div style="padding:10px 14px 0;font-weight:600;color:var(--c-text-heading)">${PTITLE()}</div>${panelBody()}</div>`;
  if (S.d === 'sheet') {
    const all = PAGE.flatMap((sec, si) => sec.items.map((x, ii) => [String(x.n ?? `m${si}${ii}`), x]));
    const it = (all.find(([k]) => k === S.fn) ?? all[2])[1];
    layer = `<div class="ov" data-d=""></div><div class="sheet"><div class="grab"></div>${footPop(it).replace('class="pop"', 'style="font-size:13px"')}</div>`;
  }
  return `<div class="app m">
    <div class="mhead">
      <button class="ib" data-d="tree" title="Дерево заметок и вики">${I('pleft',20)}</button>
      <span class="ttl">${title}</span>
      <button class="ib" data-d="panel" title="Входящие, журнал, здоровье, настройки">${I('inbox',20)}${S.s !== 'empty' ? '<span class="cnt">3</span>' : ''}</button>
      ${isDoc ? `<button class="ib" title="Ещё">${I('more',20)}</button>` : ''}
    </div>
    <div class="mbody">${center()}</div>
    ${layer}
  </div>`;
}

/* ===== Обвязка ===== */
function mk() {
  const pills = (key, opts) => `<div class="pills">${opts.map(([v, l]) => `<button class="${String(S[key]) === String(v) ? 'on' : ''}" data-set="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
  return `<h1>Заметки + Вики · v1</h1>
    <div class="grp"><span class="lbl">Экран</span>${pills('s', SCREENS)}</div>
    <div class="grp"><span class="lbl">Панель</span>${pills('p', [['','скрыта'], ...PANELS.map(p => [p[0], p[1]])])}</div>
    <div class="grp"><span class="lbl">Ширина</span>${pills('w', [['d','1280'],['m','360']])}</div>
    ${S.w === 'm' ? `<div class="grp"><span class="lbl">Шторка</span>${pills('d', [['','нет'],['tree','дерево'],['panel','панель'],['sheet','сноска']])}</div>` : ''}
    <div class="grp"><span class="lbl">Тема</span>${pills('t', [['light','светлая'],['dark','тёмная']])}</div>
    <div class="grp"><label><input type="checkbox" data-chk="n" ${S.n ? 'checked' : ''}> секция «Заметки» (решение 1)</label>
      <label><input type="checkbox" data-chk="marks" ${S.marks ? 'checked' : ''}> метки решений</label></div>`;
}
const NOTES = {
  page:'Страница, которую ведут вместе. Сноска ИИ — номер (наведите или нажмите: цитата, источник, «Открыть в чате»), ваша — «✎ Андрей, 02.11». Сводный значок — «Ведёте вместе». В центре только документ и «Править».',
  edit:'Правка той же страницы. Фокус на формулировке ИИ — предупреждение про «Историю». Убранное зачёркнуто с «Вернуть». Ссылка в чужой проект — понятный отказ прямо под строкой.',
  prop:'ИИ хочет заменить ваше утверждение: плашка на странице, пунктир у строки, новое утверждение — бледно. Сравнение и решения — в правой панели «Входящие», не в центре.',
  conflict:'Сохранение на изменившейся странице (409). Сравнение по разделам: моё / ИИ / было. Нажмите «Оставить моё» — раздел станет решённым, «Сохранить» включится.',
  drift:'Страницу поправили в Obsidian. Плашка с двумя решениями, а сравнение — в «Здоровье» (кнопка «Что изменилось»). Значок в рельсе — жёлтая точка.',
  note:'Заметка в том же дереве и в том же центре. «Перенести в вики» — зависит от решения 3.',
  loading:'Скелетон дерева и документа: формы повторяют строки, ширины разные.',
  empty:'Ни заметок, ни вики: одно пустое состояние в центре, «Входящие» — «Спорного нет».',
  nofind:'Поиск с фильтром «Мои» ничего не нашёл: в дереве — объяснение и «Искать во всех», центр — подсказка.',
};

function render() {
  document.documentElement.dataset.theme = S.t;
  document.body.classList.toggle('nodep', !S.marks);
  document.getElementById('mk').innerHTML = mk();
  document.getElementById('note').innerHTML = `<b>${SCREENS.find(x => x[0] === S.s)[1]}.</b> ${NOTES[S.s]} Пунктир <span class="deptag">зависит от решения N</span> — место ждёт ответа Андрея (номера — вопросы из разреза ef7a0732).`;
  document.getElementById('root').innerHTML = S.w === 'm' ? mobile() : desktop();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-p],[data-d],[data-fn],[data-cf],[data-jc],[data-open]');
  if (!t) return;
  if (t.dataset.set) return set({ [t.dataset.set]: t.dataset.set === 'n' ? +t.dataset.v : t.dataset.v, ...(t.dataset.set === 'w' ? { d:'' } : {}) });
  if (t.dataset.p !== undefined) return set(S.w === 'm' ? { p: t.dataset.p || S.p, d: t.dataset.p ? 'panel' : '' } : { p: t.dataset.p });
  if (t.dataset.d !== undefined) return set({ d: t.dataset.d });
  if (t.dataset.fn) return set(S.w === 'm' ? { fn: t.dataset.fn, d:'sheet' } : { fn: S.fn === t.dataset.fn ? '' : t.dataset.fn });
  if (t.dataset.cf) return set({ cf: 1 });
  if (t.dataset.jc !== undefined) return set({ jc: +t.dataset.jc });
  if (t.dataset.open) return set({ s: ['ideas','call','recipes'].includes(t.dataset.open) ? 'note' : 'page', d:'' });
});
document.addEventListener('change', e => { const k = e.target.dataset.chk; if (k) set({ [k]: e.target.checked ? 1 : 0 }); });
readHash(); render();
</script>
</body>
</html>
