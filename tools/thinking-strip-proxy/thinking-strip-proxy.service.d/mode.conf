[Service]
# Решение Андрея 2026-09-19 по итогам эксперимента: размышления с бюджетом 512 + фраза перехода
# (--reasoning-config в .env стенда vLLM).
Environment=THINKING_MODE=budget THINKING_BUDGET=512
# Прунинг старых выводов инструментов: off по умолчанию, on — на замер.
Environment=PRUNE_TOOL_RESULTS=off
