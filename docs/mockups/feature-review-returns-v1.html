<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Home · «Разбор»: блоки «Объём» и «Возвраты и потери» — как сейчас и три варианта</title>
<!--
  Кликабельный макет к записке feature-review-returns-v1.md. Код продукта не правится.
  Задача be55bad8-ca2d-4ffa-80a8-1f82ef16bc2a (запрос Андрея 11.11). Фича-образец — эпик
  11041582-a74b-4f54-9d6d-6c0e3e610245 «Фичи: упрощение и прозрачность раздела» (закрытая).
  Компоненты продукта: FeatureReviewVolume.tsx (секция rz-volume), FeatureReviewReturns.tsx (rz-returns),
  внутри — FeatureStatsTiles only=['loops'], ReviewKv, FeatureStatsLosses.
  Числа — со скриншота Андрея: возвраты 52 (ревью 50 · проверка 1 · финал 1), приняты 80, с замечаниями 32;
  отсюда возвращено 52 − 32 = 20, всего вердиктов 132. Медианы шага — образец (в подсказке «образец»).
  «Сейчас» — реконструкция по коду (та же сетка, токены и размеры значков), а не снимок прода.
-->
<style>
/* ===== Токены: значения из frontend/src/lib/theme.css, имена — C.* / SHADOW.* из design.ts.
   Единственное место с сырыми значениями; ниже — только var(--…). ===== */
:root {
  --c-bg-main:#F4F0E8; --c-bg-panel:#EDE7DC; --c-bg-card:#FBF8F2; --c-bg-white:#FFFFFF; --c-bg-selected:#E8E1D4; --c-bg-inset:#E7E0D2;
  --c-text-heading:#2A251F; --c-text-primary:#39332B; --c-text-secondary:#756B5E; --c-text-muted:#9A8F7E; --c-on-accent:#FBF8F2;
  --c-accent:#D97757; --c-accent-light:#F4ECE1; --c-accent-muted:#EAD3C5;
  --c-border:#E0D7C8; --c-border-light:#E8E1D4; --c-progress-track:#D8CFBE; --c-dashed:#D0C6B4; --c-smoke:#B4A899;
  --c-success:#5E8B4E; --c-success-bg:#E9F1E8; --c-success-text:#3F7A4F;
  --c-warning:#C9923E; --c-warning-bg:#FBEFE0; --c-warning-text:#8A6A28;
  --c-danger:#B4452F; --c-danger-bg:#FBF1EC; --c-danger-text:#B4452F; --c-danger-border:#F5C6BF;
  --shadow-focus:0 0 0 3px rgba(217,119,87,.14);
  --shadow-card:0 2px 8px rgba(60,50,35,.05);
  /* FS */ --fs-xxs:10px; --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:14px; --fs-lg:16px; --fs-xl:18px; --fs-h2:22px;
  /* SP */ --sp-xxs:2px; --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px; --sp-xxl:32px;
  /* R  */ --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:12px; --r-max:999px;
  --font-sans:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-serif:'PT Serif',Georgia,serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}
:root[data-theme="dark"] {
  --c-bg-main:#201C18; --c-bg-panel:#272320; --c-bg-card:#2E2A25; --c-bg-white:#2E2A25; --c-bg-selected:#38332D; --c-bg-inset:#1B1815;
  --c-text-heading:#F2ECE1; --c-text-primary:#EDE6DB; --c-text-secondary:#B3A897; --c-text-muted:#8A8072; --c-on-accent:#201C18;
  --c-accent:#E38A6A; --c-accent-light:#3A2E27; --c-accent-muted:#4A362C;
  --c-border:#3D3830; --c-border-light:#34302A; --c-progress-track:#5C544A; --c-dashed:#4A443B; --c-smoke:#7E7566;
  --c-success:#7CB86A; --c-success-bg:#232E20; --c-success-text:#8FCB79;
  --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E;
  --c-danger:#E8785E; --c-danger-bg:#331F1B; --c-danger-text:#EE8A72; --c-danger-border:#5A302A;
  --shadow-focus:0 0 0 3px rgba(227,138,106,.24);
  --shadow-card:0 2px 10px rgba(0,0,0,.35);
}
/* ===== дальше — только переменные ===== */
* { box-sizing:border-box; }
body { margin:0; background:var(--c-bg-main); color:var(--c-text-primary); font:var(--fs-base)/1.45 var(--font-sans); }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible { outline:none; box-shadow:var(--shadow-focus); }

/* --- пульт макета (не продукт) --- */
.ctl { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:var(--sp-sm) var(--sp-md); align-items:center;
  padding:var(--sp-sm) var(--sp-lg); background:var(--c-bg-panel); border-bottom:1px solid var(--c-border); }
.ctl h1 { font:600 var(--fs-md)/1.2 var(--font-serif); margin:0 var(--sp-sm) 0 0; color:var(--c-text-heading); }
.ctl .lb { font-size:var(--fs-xs); color:var(--c-text-muted); }
.pseg { display:inline-flex; flex-wrap:wrap; gap:var(--sp-xxs); }
.pseg button { border:1px solid var(--c-border); background:var(--c-bg-card); padding:0 var(--sp-md); border-radius:var(--r-lg); font-size:var(--fs-sm); color:var(--c-text-secondary); min-height:32px; }
.pseg button[aria-pressed="true"] { background:var(--c-text-heading); border-color:var(--c-text-heading); color:var(--c-bg-main); font-weight:600; }
.stage { padding:var(--sp-xl); }
.note { max-width:880px; margin:0 auto var(--sp-md); font-size:var(--fs-sm); color:var(--c-text-secondary); background:var(--c-bg-panel);
  border:1px dashed var(--c-dashed); border-radius:var(--r-md); padding:var(--sp-sm) var(--sp-md); }
.note b { color:var(--c-text-heading); }
.frame { margin:0 auto; background:var(--c-bg-main); }
.frame.w1240 { width:min(880px,100%); }
.frame.w360 { width:360px; border:1px solid var(--c-border); border-radius:var(--r-xl); padding:var(--sp-md); }
@media (max-width:480px) { .stage { padding:var(--sp-sm); } .frame.w360 { width:100%; } }

/* --- продукт: секция «Разбора» (ReviewSection / ReviewKv) --- */
.sec { margin:0 0 var(--sp-xl); }
.sec-h { font:700 var(--fs-xs)/1.3 var(--font-sans); letter-spacing:.04em; text-transform:uppercase; color:var(--c-text-muted);
  margin:0 0 var(--sp-sm); padding:var(--sp-xxs) var(--sp-sm); }
.kv { display:flex; flex-direction:column; }
.kv-r { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-md); padding:var(--sp-xs) 0; border-bottom:1px solid var(--c-border-light); }
.kv-r:last-child { border-bottom:0; }
.kv-l { font-size:var(--fs-sm); color:var(--c-text-secondary); }
.kv-v { font-size:var(--fs-sm); font-weight:600; color:var(--c-text-heading); text-align:right; }
.kv-r.cut .kv-l, .kv-r.cut .kv-v { text-decoration:line-through; color:var(--c-text-muted); font-weight:400; }
.kv-r.sus .kv-v { color:var(--c-warning-text); }
.tag { display:inline-block; margin-left:var(--sp-xs); padding:0 var(--sp-xs); border-radius:var(--r-sm); font-size:var(--fs-xxs); font-weight:700;
  vertical-align:middle; text-decoration:none; }
.tag.cut { background:var(--c-bg-inset); color:var(--c-text-muted); }
.tag.move { background:var(--c-accent-light); color:var(--c-accent); }
.tag.sus { background:var(--c-warning-bg); color:var(--c-warning-text); }
.sub { display:block; font-size:var(--fs-xs); font-weight:400; color:var(--c-text-muted); }
.card { background:var(--c-bg-card); border:1px solid var(--c-border-light); border-radius:var(--r-lg); box-shadow:var(--shadow-card); padding:var(--sp-lg); }
.m .card { padding:var(--sp-md); }

/* «Сейчас»: сетка плиток на 4 колонки, плитка одна (FeatureStatsTiles only=['loops']) */
.tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-md); }
.m .tiles { grid-template-columns:repeat(2,1fr); gap:var(--sp-sm); }
.t-lb { font-size:var(--fs-sm); font-weight:600; color:var(--c-text-secondary); }
.t-big { font:700 var(--fs-h2)/1.2 var(--font-serif); color:var(--c-text-heading); margin:var(--sp-xs) 0; }
.m .t-big { font-size:var(--fs-xl); }
.t-hint { font-size:var(--fs-xs); color:var(--c-text-muted); }
.marks { display:flex; flex-wrap:wrap; gap:var(--sp-xs); margin-top:var(--sp-sm); }
.mk { width:14px; height:14px; border-radius:var(--r-sm); display:inline-flex; align-items:center; justify-content:center;
  font-size:var(--fs-xxs); font-weight:700; font-style:normal; }
.mk.ok { background:var(--c-success-bg); color:var(--c-success-text); }
.mk.ret { background:var(--c-danger-bg); color:var(--c-danger-text); }
.losses { margin-top:var(--sp-md); border:1px dashed var(--c-dashed); border-radius:var(--r-lg); padding:var(--sp-md); color:var(--c-text-muted); font-size:var(--fs-sm); }
.losses b { color:var(--c-text-secondary); }

/* Вариант А: строка-итог */
.line-big { font:700 var(--fs-xl)/1.3 var(--font-serif); color:var(--c-text-heading); margin:0; }
.m .line-big { font-size:var(--fs-lg); }
.line-sm { font-size:var(--fs-sm); color:var(--c-text-secondary); margin:var(--sp-xs) 0 0; }
.dot { display:inline-block; width:8px; height:8px; border-radius:var(--r-max); margin-right:var(--sp-xs); vertical-align:middle; }
.dot.ok { background:var(--c-success); } .dot.rem { background:var(--c-warning); } .dot.ret { background:var(--c-danger); }

/* Вариант Б: полоса исходов */
.bar-h { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-md); flex-wrap:wrap; margin:0 0 var(--sp-sm); }
.bar-h .line-big { font-size:var(--fs-lg); }
.bar { display:flex; height:10px; border-radius:var(--r-max); overflow:hidden; background:var(--c-progress-track); gap:var(--sp-xxs); }
.seg { height:100%; transition:opacity .15s; }
.seg.ok { background:var(--c-success); } .seg.rem { background:var(--c-warning); } .seg.ret { background:var(--c-danger); }
.bar.focus .seg { opacity:.25; } .bar.focus .seg.on { opacity:1; }
.leg { display:flex; flex-wrap:wrap; gap:var(--sp-xs) var(--sp-sm); margin-top:var(--sp-sm); }
.leg button { display:inline-flex; white-space:nowrap; align-items:center; gap:var(--sp-xs); min-height:32px; padding:0 var(--sp-sm); border:1px solid var(--c-border-light);
  border-radius:var(--r-max); background:var(--c-bg-white); font-size:var(--fs-sm); color:var(--c-text-primary); }
.leg button:hover { border-color:var(--c-border); background:var(--c-bg-selected); }
.leg button[aria-pressed="true"] { border-color:var(--c-text-secondary); background:var(--c-bg-selected); }
.leg b { color:var(--c-text-heading); }
.leg .pc { color:var(--c-text-muted); }
.m .leg { flex-direction:column; }
.m .leg button { min-height:40px; width:100%; justify-content:flex-start; }
.leg button .pc { margin-left:auto; padding-left:var(--sp-sm); }
.src { margin:var(--sp-sm) 0 0; font-size:var(--fs-xs); color:var(--c-text-muted); }

.empty { text-align:center; padding:var(--sp-xl) var(--sp-md); color:var(--c-text-muted); font-size:var(--fs-sm); border:1px dashed var(--c-dashed); border-radius:var(--r-lg); }
.anch { display:flex; gap:var(--sp-xs); overflow-x:auto; margin:0 0 var(--sp-lg); }
.anch span { flex:none; border:1px solid var(--c-border); border-radius:var(--r-max); padding:var(--sp-xxs) var(--sp-md); font-size:var(--fs-sm); color:var(--c-text-secondary); background:var(--c-bg-card); }
.anch span.gone { text-decoration:line-through; color:var(--c-text-muted); border-style:dashed; }
.m .anch span { min-height:40px; display:inline-flex; align-items:center; }
</style>
</head>
<body>
<div class="ctl" role="toolbar" aria-label="Пульт макета">
  <h1>«Разбор» · Объём и Возвраты</h1>
  <span class="lb">Вариант</span>
  <div class="pseg" data-k="v">
    <button data-v="now" aria-pressed="true">Сейчас</button>
    <button data-v="a" aria-pressed="false">А · строка</button>
    <button data-v="b" aria-pressed="false">Б · полоса ★</button>
    <button data-v="c" aria-pressed="false">В · убрать</button>
  </div>
  <span class="lb">«Объём»</span>
  <div class="pseg" data-k="vol">
    <button data-v="now" aria-pressed="true">как сейчас</button>
    <button data-v="diff" aria-pressed="false">разметка правок</button>
    <button data-v="new" aria-pressed="false">предлагаю</button>
  </div>
  <span class="lb">Тема</span>
  <div class="pseg" data-k="theme">
    <button data-v="light" aria-pressed="true">светлая</button>
    <button data-v="dark" aria-pressed="false">тёмная</button>
  </div>
  <span class="lb">Ширина</span>
  <div class="pseg" data-k="w">
    <button data-v="w1240" aria-pressed="true">1240</button>
    <button data-v="w360" aria-pressed="false">360</button>
  </div>
</div>
<div class="stage">
  <p class="note" id="note"></p>
  <div class="frame w1240" id="frame"></div>
</div>
<script>
// Числа фичи-образца (скриншот Андрея 11.11). returned = loops − remarks.
const D = { accepted: 80, remarks: 32, returned: 20, bySrc: { review: 50, qa: 1, final: 1 },
  steps: 78, back: 33, front: 45, tasks: 325, packs: 129, merges: 2, tails: 32 };
D.total = D.accepted + D.remarks + D.returned;      // 132 вердикта
D.loops = D.remarks + D.returned;                     // 52 — то, что сейчас подписано «возвратов»
const pc = (n) => Math.round(n * 100 / D.total) + ' %';
const S = { v: 'now', vol: 'now', theme: 'light', w: 'w1240', focus: null };

const NOTES = {
  now: '<b>Сейчас</b> (реконструкция FeatureReviewReturns по коду): плитка «Возвраты» одна в сетке на 4 колонки → узкая; по значку на каждый виток (132 шт.) — высота растёт с числом ревью. «52 возврата» = 20 возвратов + 32 «принято с замечаниями».',
  a: '<b>А · одна строка.</b> Сетки нет; итог фразой и вторая строка с разбивкой. Высота постоянная (~3 строки), на 360 — перенос по словам.',
  b: '<b>Б · полоса исходов (рекомендую).</b> Одна полоса 10 px «сразу / с замечаниями / возвращены» + легенда-кнопки (нажми — подсветит долю). Высота не зависит от числа ревью; на 360 легенда в 2 колонки, цели 40 px.',
  c: '<b>В · убрать блок.</b> Секции «Возвраты и потери» нет, якорей пять; в «Объёме» — одна строка «Ревью». Цена: «Главные потери» придётся переносить (в «Время») или терять.',
};

function marksHtml() {
  // Детерминированная перетасовка: возвраты разбросаны по ряду, как витки по шагам.
  const out = []; let r = 0;
  for (let i = 0; i < D.total; i++) {
    const isRet = r < D.returned && (i * 7) % 13 < 2;
    if (isRet) r++;
    out.push(isRet ? '<i class="mk ret">↩</i>' : '<i class="mk ok">✓</i>');
  }
  return out.join('');
}
const kv = (rows) => '<div class="kv">' + rows.map(([l, v, cls]) =>
  `<div class="kv-r ${cls || ''}"><span class="kv-l">${l}</span><span class="kv-v">${v}</span></div>`).join('') + '</div>';
const losses = '<div class="losses"><b>Главные потери</b> — карточки FeatureStatsLosses без изменений (самый долгий шаг, шаг с наибольшим числом витков, ожидание вас).</div>';

function returnsBlock() {
  if (S.v === 'now') {
    return `<div class="tiles"><div class="card">
        <div class="t-lb">Возвраты</div><div class="t-big">${D.loops}</div>
        <div class="t-hint">${D.loops} возврата · ревью ${D.bySrc.review} · проверка ${D.bySrc.qa} · финал ${D.bySrc.final}</div>
        <div class="marks" aria-hidden="true">${marksHtml()}</div></div></div>
      <div style="height:var(--sp-md)"></div>
      ${kv([['Приняты', D.accepted], ['С замечаниями', D.remarks], ['Возвращены', D.returned], ['Отозваны', 0]])}
      ${losses}`;
  }
  if (S.v === 'a') {
    return `<div class="card">
        <p class="line-big">${D.returned} возвратов и ${D.remarks} замечания на ${D.total} ревью</p>
        <p class="line-sm"><span class="dot ok"></span>сразу приняты ${D.accepted} (${pc(D.accepted)}) ·
          <span class="dot rem"></span>с замечаниями ${D.remarks} (${pc(D.remarks)}) ·
          <span class="dot ret"></span>возвращены ${D.returned} (${pc(D.returned)})</p>
        <p class="src">Где правили: ревью ${D.bySrc.review} · проверка ${D.bySrc.qa} · финал ${D.bySrc.final}</p>
      </div>${losses}`;
  }
  if (S.v === 'b') {
    const seg = (k, n) => `<div class="seg ${k} ${S.focus === k ? 'on' : ''}" style="flex:${n}" title="${n} из ${D.total}"></div>`;
    const lg = (k, label, n) => `<button data-f="${k}" aria-pressed="${S.focus === k}"><span class="dot ${k}"></span>${label} <b>${n}</b> <span class="pc">${pc(n)}</span></button>`;
    return `<div class="card">
        <div class="bar-h"><p class="line-big">${pc(D.accepted)} ревью — с первого раза</p>
          <span class="t-hint">${D.total} ревью · отозвано 0</span></div>
        <div class="bar ${S.focus ? 'focus' : ''}" role="img" aria-label="Исходы ревью: сразу ${D.accepted}, с замечаниями ${D.remarks}, возвращены ${D.returned} из ${D.total}">
          ${seg('ok', D.accepted)}${seg('rem', D.remarks)}${seg('ret', D.returned)}</div>
        <div class="leg">${lg('ok', 'Сразу', D.accepted)}${lg('rem', 'С замечаниями', D.remarks)}${lg('ret', 'Возвращены', D.returned)}</div>
        <p class="src">Где правили (замечания + возвраты): ревью ${D.bySrc.review} · проверка ${D.bySrc.qa} · финал ${D.bySrc.final}</p>
      </div>${losses}`;
  }
  return '';
}

function volumeBlock() {
  const lanesNow = [['бэк', `${D.back} шага · принято 29 · возвратов 29`], ['фронт', `${D.front} шагов · принято 43 · возвратов 43`]];
  if (S.vol === 'now' || S.vol === 'diff') {
    const d = S.vol === 'diff';
    const t = (cls, txt) => d ? ` <span class="tag ${cls}">${txt}</span>` : '';
    const rows = [
      ...lanesNow.map(([l, v]) => [l + t('sus', 'принято = возвратов?'), v, d ? 'sus' : '']),
      ['Медиана шага по проекту' + t('move', '→ «Время»'), '48 мин <span class="sub">образец</span>', d ? 'cut' : ''],
      ['Медиана шага этой фичи' + t('move', '→ «Время»'), '1 ч 05 мин <span class="sub">образец</span>', d ? 'cut' : ''],
      ['Смены знаменателя' + t('move', '→ шкала срока'), 3, d ? 'cut' : ''],
      ['Шагов', D.steps, ''],
      ['Задач всего' + t('cut', 'убрать'), D.tasks, d ? 'cut' : ''],
      ['Пачек ревью' + t('cut', 'дубль базы'), D.packs, d ? 'cut' : ''],
      ['Слияний', D.merges, ''],
      ['Хвостов после мержа' + t('move', 'переименовать'), D.tails, ''],
    ];
    return kv(rows);
  }
  const rows = [
    ['Шагов', `${D.steps}<span class="sub">бэк ${D.back} · фронт ${D.front} (фронт — по разности, образец)</span>`],
    ['Слияний', D.merges],
    ['Доработок после мержа', D.tails],
  ];
  if (S.v === 'c') rows.push(['Ревью', `${D.total}<span class="sub">с правками ${D.loops} (${pc(D.loops)}) · возвращены ${D.returned}</span>`]);
  return kv(rows);
}

function render() {
  document.documentElement.dataset.theme = S.theme;
  const f = document.getElementById('frame');
  f.className = 'frame ' + S.w + (S.w === 'w360' ? ' m' : '');
  document.getElementById('note').innerHTML = NOTES[S.v];
  const names = ['Время', 'Объём', 'Возвраты и потери', 'Кто', 'Расход', 'Хронология'];
  const anch = '<div class="anch">' + names.map((n, i) =>
    `<span class="${S.v === 'c' && i === 2 ? 'gone' : ''}">${i + 1}. ${n}</span>`).join('') + '</div>';
  let html = anch + `<section class="sec"><h2 class="sec-h">Объём</h2>${volumeBlock()}</section>`;
  if (S.v !== 'c') html += `<section class="sec"><h2 class="sec-h">Возвраты и потери</h2>${returnsBlock()}</section>`;
  else html += `<section class="sec"><div class="empty">Секции «Возвраты и потери» нет.<br>«Главные потери» — перенести в «Время» (отдельный шаг) или убрать.</div></section>`;
  f.innerHTML = html;
  document.querySelectorAll('.pseg').forEach((g) => g.querySelectorAll('button').forEach((b) =>
    b.setAttribute('aria-pressed', String(S[g.dataset.k] === b.dataset.v))));
}
document.querySelectorAll('.pseg').forEach((g) => g.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  S[g.dataset.k] = b.dataset.v; S.focus = null; render();
}));
document.getElementById('frame').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-f]'); if (!b) return;
  S.focus = S.focus === b.dataset.f ? null : b.dataset.f; render();
});
// Параметры адреса: ?v=b&vol=new&theme=dark&w=w360 — для скриншотов.
new URLSearchParams(location.search).forEach((val, key) => { if (key in S) S[key] = val; });
render();
</script>
</body>
</html>
