<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Прототип: полосы Git и «Картинки» над композером чата проекта</title>
<style>
  /* Токены — копия theme.css (значения обеих тем), чтобы макет был самодостаточным */
  /* Токены — копия theme.css (значения обеих тем), чтобы макет был самодостаточным */
  :root {
    --c-bg-main:     #F4F0E8;
    --c-bg-panel:    #EDE7DC;
    --c-bg-card:     #FBF8F2;
    --c-bg-white:    #FFFFFF;
    --c-bg-selected: #E8E1D4;
    --c-bg-inset:    #E7E0D2;
    --c-text-heading:   #2A251F;
    --c-text-primary:   #39332B;
    --c-text-secondary: #756B5E;
    --c-text-muted:     #9A8F7E;
    --c-on-accent:      #FBF8F2;
    --c-on-dark:        #FFFFFF;
    --c-accent:       #D97757;
    --c-accent-light: #F4ECE1;
    --c-accent-muted: #EAD3C5;
    --c-border:       #E0D7C8;
    --c-border-light: #E8E1D4;
    --c-divider:      #DDD4C4;
    --c-dashed:       #D0C6B4;
    --c-track:        #D8CFBE;
    --c-overlay: rgba(23, 19, 15, 0.42);
    --c-media-scrim: rgba(0, 0, 0, 0.55);
    --c-success:      #5E8B4E;
    --c-success-bg:   #E9F1E8;
    --c-success-text: #3F7A4F;
    --c-warning:      #C9923E;
    --c-warning-bg:   #FBEFE0;
    --c-warning-text: #8A6A28;
    --c-danger:        #B4452F;
    --c-danger-bg:     #FBF1EC;
    --c-danger-text:   #B4452F;
    --c-danger-border: #F5C6BF;
    --c-info:    #3E7CA6;
    --c-info-bg: #E7EFF5;
    --shadow-focus:    0 0 0 3px rgba(217, 119, 87, 0.14);
    --shadow-card:     0 2px 8px rgba(60, 50, 35, 0.05);
    --shadow-island:   0 1px 2px rgba(60, 50, 35, 0.06), 0 6px 20px rgba(60, 50, 35, 0.10);
    --shadow-dropdown: 0 8px 28px rgba(60, 50, 35, 0.16);
    --shadow-modal:    0 24px 60px rgba(23, 19, 15, 0.40);
    --shadow-sheet:    0 -8px 40px rgba(23, 19, 15, 0.22);
    --shadow-button:   0 4px 14px rgba(217, 119, 87, 0.30);
    --c-skeleton: #E4DCCC;
    --canvas-ink: 42, 37, 31;
  }
  [data-theme="dark"] {
    --c-bg-main:     #201C18;
    --c-bg-panel:    #272320;
    --c-bg-card:     #2E2A25;
    --c-bg-white:    #2E2A25;
    --c-bg-selected: #38332D;
    --c-bg-inset:    #1B1815;
    --c-text-heading:   #F2ECE1;
    --c-text-primary:   #EDE6DB;
    --c-text-secondary: #B3A897;
    --c-text-muted:     #8A8072;
    --c-on-accent:      #201C18;
    --c-accent:       #E38A6A;
    --c-accent-light: #3A2E27;
    --c-accent-muted: #4A362C;
    --c-border:       #3D3830;
    --c-border-light: #34302A;
    --c-divider:      #454037;
    --c-dashed:       #4A443B;
    --c-track:        #454037;
    --c-overlay: rgba(0, 0, 0, 0.58);
    --c-success:      #7CB86A;
    --c-success-bg:   #1F2B1C;
    --c-success-text: #8FC47E;
    --c-warning:      #E0A955;
    --c-warning-bg:   #322717;
    --c-warning-text: #E7B96E;
    --c-danger:        #E8785E;
    --c-danger-bg:     #331F1B;
    --c-danger-text:   #EE8A72;
    --c-danger-border: #5A302A;
    --c-info:    #5FA0CC;
    --c-info-bg: #1E2A33;
    --shadow-focus:    0 0 0 3px rgba(227, 138, 106, 0.24);
    --shadow-card:     0 2px 10px rgba(0, 0, 0, 0.35);
    --shadow-island:   0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.45);
    --shadow-dropdown: 0 10px 32px rgba(0, 0, 0, 0.5);
    --shadow-modal:    0 24px 60px rgba(0, 0, 0, 0.6);
    --shadow-sheet:    0 -10px 46px rgba(0, 0, 0, 0.55);
    --shadow-button:   0 4px 16px rgba(227, 138, 106, 0.34);
    --c-skeleton: #38332D;
    --canvas-ink: 237, 230, 219;
  }
  /* Шкалы из lib/design.ts: FS xs 11 · sm 12 · base 13 · md 14 · lg 16; SP 2/4/8/12/16/24; R sm 6 · md 8 · lg 10 · xl 12 · xxl 14 · sheet 22 */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--c-bg-main); color: var(--c-text-primary);
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; }
  button, textarea, input { font: inherit; color: inherit; }
  .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--c-text-muted); }
  .hint { font-size: 11px; color: var(--c-text-muted); line-height: 1.45; }

  /* Угловые переключатели прототипа — не часть продукта */
  #ctl { height: 34px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 0 8px; }
  #ctl button { height: 24px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--c-border); background: var(--c-bg-card); cursor: pointer; font-size: 11px; color: var(--c-text-secondary); white-space: nowrap; }
  #ctl button:hover { background: var(--c-bg-selected); }
  #ctl .v { color: var(--c-accent); border-color: var(--c-accent-muted); font-weight: 600; }
  #stage { display: flex; justify-content: center; }

  /* Приложение */
  .app { position: relative; height: calc(100vh - 34px); min-height: 620px; display: flex; gap: 8px; padding: 0 8px 8px; overflow: hidden; }
  .app.mob { padding: 0; gap: 0; border: 1px solid var(--c-border); border-radius: 22px 22px 0 0; }
  .rail { width: 40px; flex: 0 0 40px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; }
  .ri { width: 34px; height: 34px; border-radius: 10px; border: none; background: transparent; color: var(--c-text-muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ri:hover { background: var(--c-bg-selected); color: var(--c-text-primary); }
  .ri.on { background: var(--c-accent-light); color: var(--c-accent); }
  .island { background: var(--c-bg-panel); border: 1px solid var(--c-border-light); border-radius: 14px; box-shadow: var(--shadow-island);
    display: flex; flex-direction: column; overflow: hidden; min-height: 0; min-width: 0; position: relative; }
  .island.main { flex: 1; }
  .app.mob .island.main { border: none; border-radius: 22px 22px 0 0; box-shadow: none; }
  .zone { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .ph { height: 42px; flex: 0 0 42px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--c-border-light); background: var(--c-bg-inset); min-width: 0; }
  .ph .ttl { font-size: 13px; font-weight: 600; color: var(--c-text-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph .sub { font-size: 11px; color: var(--c-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pbody { flex: 1; overflow: auto; min-height: 0; padding: 8px; }

  /* Примитивы — внешний вид components/ui */
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  svg.i.s { width: 14px; height: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--c-border); background: var(--c-bg-card); cursor: pointer; font-size: 13px; white-space: nowrap; color: var(--c-text-heading); }
  .btn:hover { background: var(--c-bg-selected); }
  .btn.pri { background: var(--c-accent); color: var(--c-on-accent); border-color: transparent; box-shadow: var(--shadow-button); font-weight: 600; }
  .btn.pri:hover { filter: brightness(1.04); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--c-text-secondary); }
  .btn.ghost:hover { background: var(--c-bg-selected); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .btn.xs { height: 24px; padding: 0 8px; font-size: 11px; border-radius: 6px; }
  .btn[disabled] { opacity: .5; cursor: default; box-shadow: none; }
  .btn:focus-visible, .ib:focus-visible, .chip:focus-visible, .gb:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
  .ib { width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent; color: var(--c-text-muted); display: inline-grid; place-items: center; cursor: pointer; flex: 0 0 auto; padding: 0; position: relative; }
  .ib:hover { background: var(--c-bg-selected); color: var(--c-text-primary); }
  .ib.on { background: var(--c-accent-light); color: var(--c-accent); }
  .ib.sm { width: 24px; height: 24px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--c-border);
    background: var(--c-bg-card); cursor: pointer; font-size: 12px; white-space: nowrap; min-width: 0; max-width: 100%; color: var(--c-text-primary); }
  .chip:hover { border-color: var(--c-accent-muted); }
  .chip.acc { border-color: var(--c-accent); color: var(--c-accent); background: var(--c-accent-light); }
  .chip.dash { border-style: dashed; color: var(--c-text-secondary); }
  .chip .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chip .x { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--c-text-muted); flex: 0 0 18px; margin-right: -4px; }
  .chip .x:hover { background: var(--c-bg-selected); color: var(--c-text-primary); }
  .th { width: 20px; height: 20px; border-radius: 5px; overflow: hidden; flex: 0 0 20px; display: inline-block; }
  .th svg { width: 100%; height: 100%; display: block; }
  .th.round { border-radius: 50%; }
  .badge { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: var(--c-success-bg); color: var(--c-success-text); }
  .badge.draft { background: var(--c-warning-bg); color: var(--c-warning-text); }
  .badge.acc { background: var(--c-accent); color: var(--c-on-accent); }
  .badge.info { background: var(--c-info-bg); color: var(--c-info); }
  .cbadge { position: absolute; top: -3px; right: -3px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px; background: var(--c-accent); color: var(--c-on-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .dot { position: absolute; top: 2px; right: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--c-accent); }
  .dd { position: relative; display: inline-flex; min-width: 0; }
  .menu { position: absolute; z-index: 40; min-width: 230px; background: var(--c-bg-card); border: 1px solid var(--c-border); border-radius: 10px; box-shadow: var(--shadow-dropdown); padding: 4px; }
  .menu.up { bottom: calc(100% + 6px); left: 0; }
  .menu.r { left: auto; right: 0; }
  .menu.down { top: calc(100% + 4px); right: 0; }
  .mi { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; border: none; background: transparent; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--c-text-primary); }
  .mi:hover:not([disabled]) { background: var(--c-bg-selected); }
  .mi.on { color: var(--c-accent); }
  .mi[disabled] { opacity: .45; cursor: default; }
  .mi small { display: block; font-size: 11px; color: var(--c-text-muted); margin-top: 1px; }
  .mi .ico { color: var(--c-text-muted); padding-top: 1px; display: inline-grid; }
  .mi.on .ico { color: var(--c-accent); }
  .msep { height: 1px; background: var(--c-divider); margin: 4px 2px; }
  .seg { display: inline-flex; background: var(--c-bg-inset); border-radius: 9px; padding: 2px; gap: 2px; flex: 0 0 auto; }
  .seg button { border: none; background: transparent; color: var(--c-text-secondary); height: 26px; padding: 0 9px; border-radius: 7px; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .seg button.on { background: var(--c-bg-card); color: var(--c-accent); box-shadow: var(--shadow-card); font-weight: 600; }
  .count { display: inline-flex; align-items: center; border: 1px solid var(--c-border); border-radius: 8px; height: 28px; background: var(--c-bg-white); flex: 0 0 auto; }
  .count button { border: none; background: transparent; width: 22px; height: 26px; cursor: pointer; color: var(--c-text-secondary); padding: 0; }
  .count span { min-width: 14px; text-align: center; font-size: 12px; font-weight: 600; }
  .price { font-size: 12px; color: var(--c-text-secondary); white-space: nowrap; flex: 0 0 auto; }

  /* Лента */
  .feed { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 18px 8px; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .app.mob .feed { padding: 12px 12px 6px; }
  .msg { max-width: 660px; line-height: 1.55; min-width: 0; }
  .msg.user { align-self: flex-end; background: var(--c-bg-card); border: 1px solid var(--c-border-light); border-radius: 14px 14px 4px 14px; padding: 8px 12px; max-width: 480px; }
  .msg .who { font-size: 11px; font-weight: 600; color: var(--c-accent); margin-bottom: 2px; }
  .quiet { align-self: center; font-size: 11px; color: var(--c-text-muted); text-align: center; max-width: 560px; line-height: 1.45; }
  .quiet b { color: var(--c-text-secondary); }
  .run { font-size: 12px; color: var(--c-text-secondary); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .run .p { color: var(--c-text-muted); font-style: italic; }
  .batch { display: flex; flex-wrap: wrap; gap: 10px; }
  .vcard { width: 300px; max-width: 100%; background: var(--c-bg-card); border: 1px solid var(--c-border); border-radius: 12px; padding: 8px; }
  .app.mob .vcard { width: 100%; }
  .vcard.cur { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-light); }
  .vcard .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; min-width: 0; }
  .vcard .nm { font-size: 12px; font-weight: 600; color: var(--c-text-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .vcard .pic { aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; border: 1px solid var(--c-border-light); background: var(--c-bg-inset); cursor: zoom-in; position: relative; }
  .vcard .pic svg.img { width: 100%; height: 100%; display: block; }
  .vcard .meta { font-size: 11px; color: var(--c-text-muted); margin: 5px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vcard .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .skel { width: 100%; height: 100%; background: var(--c-skeleton); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .prog { height: 4px; border-radius: 4px; background: var(--c-track); overflow: hidden; margin: 6px 0 2px; }
  .prog > i { display: block; height: 100%; width: 60%; background: var(--c-accent); }
  .draftbox { width: 300px; max-width: 100%; border: 1.5px dashed var(--c-dashed); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; color: var(--c-text-muted); font-size: 12px; background: var(--c-bg-inset); }
  .draftbox.cur { border-color: var(--c-accent); }
  .draftbox b { color: var(--c-text-heading); font-size: 13px; }

  /* ===== Полосы над композером ===== */
  /* Эталон — ProjectGitBar: 51 px, R.xxl, bgPanel, рамка border; кнопки 28 px, R.md */
  .strip { margin: 10px 14px 8px; display: flex; align-items: center; gap: 8px; height: 51px; padding: 0 8px 0 8px; background: var(--c-bg-panel);
    border: 1px solid var(--c-border); border-radius: 14px; min-width: 0; position: relative; }
  .app.mob .strip { margin: 6px 10px; height: 44px; padding: 0 6px 0 6px; gap: 6px; }
  .swb { position: relative; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 6px; border: none; border-radius: 8px; background: transparent; cursor: pointer;
    font-size: 12px; font-weight: 600; color: var(--c-text-heading); white-space: nowrap; flex: 0 0 auto; }
  .swb:hover { background: var(--c-bg-selected); }
  .swb .cv { color: var(--c-text-muted); display: inline-grid; }
  /* Сжимается только чип «Работаем с» и метка ветки — кнопки и списки держат свою ширину */
  .strip .dd, .mini .dd, .strip .count, .strip .price, .strip .ava, .strip .gb { flex-shrink: 0; }
  .strip .chip.acc { min-width: 72px; }
  .vsep { width: 1px; height: 22px; background: var(--c-divider); flex: 0 0 1px; }
  .br { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 0 1 auto; }
  .br .lb { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--c-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gst { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--c-text-muted); white-space: nowrap; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .gst i { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; display: inline-block; }
  .gb { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--c-border); background: var(--c-bg-card); cursor: pointer;
    font-size: 12.5px; color: var(--c-text-heading); white-space: nowrap; flex: 0 0 auto; }
  .gb:hover { background: var(--c-bg-selected); }
  .gb.pill { background: var(--c-bg-white); font-family: 'JetBrains Mono', monospace; }
  .gb.pub { background: var(--c-accent); color: var(--c-on-accent); border-color: transparent; font-weight: 600; }
  .gb.pub:hover { filter: brightness(1.05); }
  .app.mob .gb { height: 32px; }
  .add { color: var(--c-diff-add-text, var(--c-success-text)); } .del { color: var(--c-diff-rem-text, var(--c-danger-text)); }
  /* Свёрнутая строка — микрострока git-бара: 30 px, R.lg, вся строка — одна цель */
  .mini { margin: 4px 14px 6px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 4px; background: var(--c-bg-panel); border: 1px solid var(--c-border);
    border-radius: 10px; cursor: pointer; min-width: 0; position: relative; }
  .app.mob .mini { margin: 4px 10px; height: 32px; }
  .mini:hover { background: var(--c-bg-selected); }
  .mini .swb { height: 24px; }
  .mini .vsep { height: 16px; }
  .mini .sum { font-size: 12px; color: var(--c-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .mini .n { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; flex: 0 0 auto; }
  /* Картинки: общее */
  .ddb { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--c-border); background: var(--c-bg-white);
    cursor: pointer; font-size: 12px; white-space: nowrap; min-width: 0; color: var(--c-text-heading); }
  .ddb:hover { background: var(--c-bg-selected); }
  .ddb .t { overflow: hidden; text-overflow: ellipsis; }
  .ddb .cv { color: var(--c-text-muted); display: inline-grid; }
  .ava { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--c-accent); flex: 0 0 28px; cursor: pointer; padding: 0; background: none; }
  .ava svg { width: 100%; height: 100%; display: block; }
  /* Вариант B — двухэтажная плашка */
  .strip.two { flex-direction: column; align-items: stretch; height: auto; padding: 0; gap: 0; }
  .strip.two .r1 { display: flex; align-items: center; gap: 8px; height: 49px; padding: 0 8px; min-width: 0; }
  .strip.two .r2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px; border-top: 1px solid var(--c-border-light); min-width: 0; }
  .app.mob .strip.two { height: auto; padding: 0; }
  .app.mob .strip.two .r1 { height: 42px; padding: 0 6px; gap: 6px; }
  /* Вариант C — строка-сводка и карточка настроек над полосой */
  .sumb { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--c-border); background: var(--c-bg-white);
    cursor: pointer; font-size: 12px; white-space: nowrap; min-width: 0; flex: 0 1 auto; color: var(--c-text-heading); }
  .sumb:hover { background: var(--c-bg-selected); }
  .sumb .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sumb.on { border-color: var(--c-accent); }
  .setcard { position: absolute; z-index: 45; right: 0; bottom: calc(100% + 6px); width: 380px; max-width: calc(100vw - 40px); background: var(--c-bg-card); border: 1px solid var(--c-border);

    font-size: 12.5px; box-shadow: var(--shadow-dropdown); max-width: calc(100% - 24px); width: max-content; }

<script>
// ---------- Иконки (lucide) ----------
const IC = {

  brush: '<path d="M9.06 11.9 17.1 3.86a2.1 2.1 0 0 1 3 3l-8.05 8.05"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/>',

const ic = (n, s) => `<svg class="i${s ? ' s' : ''}" viewBox="0 0 24 24">${IC[n]}</svg>`;

// ---------- Картинки сцены (это «фото», от темы не зависят) ----------
let uid = 0;
function scene(d = {}) {
  const k = 'g' + (++uid), ev = d.ev;
  const sky = ev == null ? ['#9ECBE8', '#E6F0F2'] : [['#2B3A67', '#E7976A'], ['#1E2748', '#8E6C8A'], ['#3B4E7A', '#F0B27A'], ['#232C4A', '#C98B6B']][ev % 4];
  const lampC = ['#C9A25A', '#F3E6CF', '#3C4A5A', '#B85C3C'][(d.lamp || 0) % 4];
  const tr = [];
  if (d.flip) tr.push('translate(640 0) scale(-1 1)');
  if (d.rot) tr.push(`rotate(${d.rot} 320 200)`);
  if (d.crop) tr.push('translate(-58 -36) scale(1.18)');
  const bg = d.nobg ? `<rect width="640" height="400" fill="#F2F2F2"/><path d="M0 0h40v40H0zM80 0h40v40H80zM40 40h40v40H40z" fill="#E2E2E2" opacity=".6"/>` : `
    <rect width="640" height="300" fill="url(#${k}w)"/><rect y="300" width="640" height="100" fill="#8E6B4A"/>
    <rect x="60" y="50" width="150" height="160" rx="4" fill="#F6F0E4"/><rect x="70" y="60" width="130" height="140" fill="url(#${k}s)"/>
    <path d="M70 170 Q110 140 150 165 T200 160 L200 200 L70 200Z" fill="${ev == null ? '#8DB38A' : '#3F5A4A'}"/><rect x="135" y="60" width="4" height="140" fill="#F6F0E4"/>
    <rect x="300" y="70" width="120" height="84" rx="2" fill="#5B4A3A"/><rect x="306" y="76" width="108" height="72" fill="#C98B6B"/><circle cx="340" cy="104" r="12" fill="#F2C28B"/>
    <path d="M40 300 Q30 250 50 220 Q60 260 58 300Z M58 300 Q70 240 95 215 Q80 265 72 300Z" fill="#5E8B4E"/><rect x="36" y="296" width="44" height="34" rx="5" fill="#B7704E"/>`;
  return `<svg class="img" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg"><defs>
    <linearGradient id="${k}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9DCC6"/><stop offset="1" stop-color="#D8C6A8"/></linearGradient>

function cafe(d = {}) {
  const v = d.v || 0;

}
const art = d => d.cafe ? cafe(d) : scene(d);
const FACE_BG = ['#DCE6EE', '#EFE3CF', '#D9D2E6', '#CFE0D2'];
function faceSVG(i = 0, hair = '#7A3B22') {

    <circle cx="28" cy="29" r="1.3" fill="#3A2A20"/><circle cx="36" cy="29" r="1.3" fill="#3A2A20"/></svg>`;
}
function sampleSVG(kind) {

  switch (k) {
    case 'u':
      if (arg === 'v') U.v = { A: 'B', B: 'C', C: 'A' }[U.v];

      if (arg === 'w') { U.w = U.w === 390 ? 1360 : 390; Object.values(S.chats).forEach(x => { x.col = { git: mob(), img: mob() }; }); S.sheet = null; }

    case 'strip': c.strip = arg; c.auto = false; c.prev = null; if (S.sheet === 'strips') S.sheet = null; break;
    case 'collapse': c.col[c.strip] = true; if (S.sheet) S.sheet = null; break;
    case 'expand': c.col[c.strip] = false; if (S.sheet) S.sheet = null; break;
    case 'commit': {
      const take = arg === 'own' ? G.files.filter(f => f.chat === S.chat) : G.files.slice();
      if (!take.length) break;
      G.files = G.files.filter(f => !take.includes(f));
      const h = (hashN += 0x9e37).toString(16).padStart(7, '0').slice(-7);
      G.log.push(`${h} ${arg === 'own' ? 'feat(header): правки из чата «' + c.name + '»' : 'chore: изменения рабочего дерева'}`);
      G.ahead++;
      toast(`Зафиксировано: ${filesW(take.length)} · коммит ${h}`);

    }
    case 'pubAsk': S.pub = true; break;
    case 'pubNo': S.pub = false; break;
    case 'pubGo': toast(`Опубликовано: ${commitsW(G.ahead)} в origin/${G.branch}`); G.ahead = 0; S.pub = false; break;
    case 'chat': S.chat = arg; S.sheet = null; S.stick = true; break;
    case 'panel': S.panels[arg] = !S.panels[arg]; break;
    case 'sheet': S.sheet = arg; break;
    case 'sheetClose': S.sheet = null; break;
    case 'focus': { const [pid, i] = arg.split(':'); focusPic(pid, +i); break; }
    case 'cont': { const [pid, i] = arg.split(':'); S.pics[pid].cur = +i; toast(`Следующая правка пойдёт от версии ${+i + 1}`); break; }
    case 'unfocus': unfocus(); break;
    case 'mode': c.mode = arg; break;
    case 'drawNew': {
      const folder = arg || 'images';
      const pid = newPic(`new-${S.pseq + 1}.png`, folder, S.chat);
      c.feed.push({ t: 'draft', pic: pid });
      focusPic(pid, 0); S.sheet = null; S.stick = true;
      break;
    }
    case 'workFile': {
      const name = arg.split('/').pop(), folder = arg.split('/').slice(0, -1).join('/');
      let pid = Object.keys(S.pics).find(id => S.pics[id].chat === S.chat && S.pics[id].vers.some(v => v.file === arg));
      if (!pid) { pid = newPic(name, folder, S.chat); addVer(pid, { d: { lamp: 3, ev: 2 }, from: null, k: 0, of: 1, model: 'из проекта', file: arg }); c.feed.push({ t: 'batch', pic: pid, vs: [0] }); }
      focusPic(pid, S.pics[pid].vers.findIndex(v => v.file === arg)); S.sheet = null; S.stick = true;
      break;
    }
    case 'gen': {
      const p = fpic(); if (!p) break;
      runGen(p.id, p.vers.length ? p.cur : null, { prompt: c.prompt.trim() || (p.vers.length ? 'Сделай вечер, тёплый свет лампы' : 'Аня в кафе у окна') });
      c.prompt = '';
      break;
    }
    case 'send': {
      const text = c.draft.trim() || 'Поправь отступы в шапке';
      c.feed.push({ t: 'user', text }); c.draft = ''; S.typing = true; S.stick = true;
      const chat = S.chat;
      setTimeout(() => {
        S.typing = false;
        S.chats[chat].feed.push({ t: 'bot', text: 'Сделал: поправил отступы в <span class="mono">src/Header.css</span> — изменения видны в полосе Git.' });
        const f = G.files.find(x => x.p === 'src/Header.css');
        if (f) { f.a += 6; f.d += 2; } else G.files.push({ p: 'src/Header.css', a: 6, d: 2, chat });
        S.stick = true; render();
      }, 500);
      break;
    }
    case 'open': { const [pid, i] = arg.split(':'); S.ed = { pic: pid, v: +i }; break; }
    case 'edClose': S.ed = null; S.stick = true; break;
    case 'edVer': S.ed.v = +arg; break;
    case 'tool': S.tool = arg; break;
    case 'mark': {
      const el = ev.target.closest('.cw'), b = el.getBoundingClientRect();
      const x = Math.round((ev.clientX - b.left) / b.width * 640), y = Math.round((ev.clientY - b.top) / b.height * 400);
      S.pics[S.ed.pic].vers[S.ed.v].marks.push({ type: S.tool, x, y });
      break;
    }
    case 'clearMarks': S.pics[S.ed.pic].vers[S.ed.v].marks = []; break;
    case 'quick': {
      const { pic, v } = S.ed;
      if (C().focus !== pic) focusPic(pic, v); else S.pics[pic].cur = v;
      runGen(pic, v, { prompt: QUICK.find(q => q[0] === arg)[1], d: arg === 'bg' ? { nobg: true } : undefined });
      S.ed = null;
      break;
    }
    case 'noai': {
      const { pic, v } = S.ed;
      const d = arg === 'rot' ? { rot: ((S.pics[pic].vers[v].d.rot || 0) + 90) % 360 } : arg === 'flip' ? { flip: !S.pics[pic].vers[v].d.flip } : { crop: true };
      const [ni] = runGen(pic, v, { n: 1, free: true, d, prompt: NOAI.find(q => q[0] === arg)[1] });
      S.ed.v = ni;
      if (C().focus === pic) S.pics[pic].cur = ni;
      break;
    }
    case 'save': { const [pid, i] = arg.split(':'); saveVer(pid, +i); break; }
    case 'saveAsOpen': { const [pid, i] = arg.split(':'); const p = S.pics[pid]; S.saveAs = { pid, v: +i, name: `${p.name.replace(/\.(png|jpg)$/, '')}-v${+i + 1}.png`, folder: 'images/generated' }; break; }
    case 'saveFolder': S.saveAs.folder = arg; break;
    case 'saveAsNo': S.saveAs = null; break;
    case 'saveAsGo': { const F = S.saveAs; S.saveAs = null; saveVer(F.pid, F.v, F.name, F.folder); break; }
    case 'setProv': S.provider = arg; S.model = prov().models[0].id; if (S.menu !== 'sets') S.menu = null; break;
    case 'setModel': S.model = arg; if (S.menu === 'model') S.menu = null; break;
    case 'cnt': S.count = Math.max(1, Math.min(4, S.count + +arg)); break;
    case 'charOn': S.charOn = arg; toast('Персонаж подключён — виден в полосе «Картинки»'); break;
    case 'charOff': S.charOn = null; break;
    case 'openChars': if (mob()) S.sheet = 'chars'; else { S.panels.chars = true; toast('Персонажи — в правой зоне'); } break;
    case 'addSample': S.samples.push({ kind: 'lamp', name: 'лампа' }); break;
    case 'rmSample': S.samples.splice(+arg, 1); break;
    case 'keep': S.keep = !S.keep; break;
  }
  render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) { e.preventDefault(); act(el.dataset.act, e); return; }
  // Клик мимо — закрыть меню и карточку настроек
  if (S.menu && !e.target.closest('.menu, .setcard')) { S.menu = null; render(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.in, c = C();
  if (k === 'draft') { if (c.mode === 'image' && c.focus) c.prompt = e.target.value; else c.draft = e.target.value; }
  if (k === 'saveName') S.saveAs.name = e.target.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { S.menu = null; S.sheet = null; S.ed = null; S.pub = false; S.saveAs = null; render(); } });
init();
render();
</script>
</body>
</html>
