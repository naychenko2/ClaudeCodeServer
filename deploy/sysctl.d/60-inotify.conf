# Лимиты inotify для машины с ccs.
#
# max_user_instances — инцидент 2026-09-19: FileSystemWatcher при исчерпании
# лимита давал синхронную ошибку и рекурсивно плодил наблюдателей.
#
# max_user_watches — разбор 2026-09-22: дефолт 65 536 бэкенд выедает почти целиком
# (61 325). FileSystemWatcher с IncludeSubdirectories на Linux ставит watch на
# КАЖДЫЙ каталог дерева, включая .git/node_modules/bin/obj (фильтры проекта режут
# только события, не подписку) — 22 453 на репозиторий ClaudeCodeServer за один
# ход. При исчерпании user-инстанс systemd не может завести watch на новые scope
# («Failed to add memory inotify watch descriptor … No space left on device») и
# не видит их memory.events. Один watch стоит ~1 KB ядра, миллион — ~1 GB
# потолка, фактическое потребление по числу каталогов.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
