  const m = stageModel('prod', T());
  const ids = new Set(card.work.map(x => x.id));
  document.querySelectorAll('[data-lane="prod"] .iv').forEach(el => { const iv = m.ivs[+el.dataset.i]; const hit = iv.parts.some(p => ids.has(p.x.id)); el.classList.toggle('hl', hit); el.classList.toggle('dim', !hit); });
  const lane = document.querySelector('[data-lane="prod"]'); if (lane) lane.scrollIntoView({ block:'center', behavior:'auto' });
  setTimeout(() => document.querySelectorAll('[data-lane="prod"] .iv').forEach(el => el.classList.remove('hl', 'dim')), 2400);
}
function openTask(id) {
  UI.from = { open:UI.open, card:UI.card, xopen:UI.xopen, y:window.scrollY };
  UI.task = id; S.s = S.s === 'task' ? 'task' : 'live'; render(); window.scrollTo(0, 0);
}
function goBack() {
  const f = UI.from || {};
  UI.task = null; UI.open = f.open ?? UI.open; UI.card = f.card ?? null; UI.xopen = f.xopen ?? null;
  if (S.s === 'task') S.s = 'live';
  render(); window.scrollTo(0, f.y || 0);
  const sel = f.card ? `[data-card="${cssEsc(f.card)}"]` : f.xopen ? `[data-x="${f.xopen}"]` : null;
  if (sel) refocus(sel);
}
function toast(text) { const el = document.getElementById('toast'); el.textContent = text; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }

/* ===== Сцены: заранее собранные состояния для показа ===== */
function applyScene() {
  UI.task = null; UI.open = null; UI.card = null; UI.xopen = null; UI.from = null;
  const t = T(), cards = prodCards(t);
  // «интересная» карточка — текущая, иначе с наибольшим числом циклов
  const pick = cards.find(c => c.state === 'run') || cards.find(c => c.state === 'stall' || c.state === 'wait') || [...cards].sort((a, b) => b.cycles - a.cycles)[0];
  if (S.s === 'stage' || S.s === 'card' || S.s === 'task') UI.open = 'prod';
  if (S.s === 'card' || S.s === 'task') UI.card = pick && pick.ref;
  if (S.s === 'task' && pick) { UI.from = { open:'prod', card:pick.ref, xopen:null, y:0 }; UI.task = pick.lastWork.id; }
  render();
  if (S.s === 'card') { const el = document.querySelector(`[data-card="${cssEsc(pick.ref)}"]`); if (el) el.scrollIntoView({ block:'center' }); }
  if (S.s === 'pin') {
    const ivs = [...document.querySelectorAll('[data-lane="prod"] .iv')];
    const el = ivs.find(e => e.classList.contains('live')) || ivs[ivs.length - 1];
    if (el) { if (isM()) showSheet('prod', +el.dataset.i); else showPop(el, true); }
  }
}

document.querySelectorAll('.mk .grp').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S[g.dataset.k] = b.dataset.v;
  if (g.dataset.k === 'm' || g.dataset.k === 's' || g.dataset.k === 'v') applyScene(); else { render(); if (S.s === 'pin') applyScene(); }
}));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('ov').children.length) { e.preventDefault(); closeOv(); } });
document.addEventListener('click', e => { if (UI.pin && !e.target.closest('.pop, .sheet, .iv, .mk')) closeOv(true); });
window.addEventListener('scroll', () => { if (document.querySelector('.pop.tip')) closeOv(true); }, { passive:true });
readHash();
applyScene();
</script>
