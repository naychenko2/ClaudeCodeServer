  --c-border:#3D3830; --c-border-light:#34302A; --c-track:#453F37;
  --c-success:#7CB86A; --c-warning:#E0AC5A; --c-warning-bg:#322717; --c-warning-text:#E7B96E;

* { box-sizing:border-box; }
body { margin:0; font-family:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,sans-serif; font-size:13px; line-height:1.5; }

.col { flex:1 1 440px; background:var(--c-bg-main); color:var(--c-text-primary); padding:24px; }
.col h2 { font-family:"PT Serif",Georgia,serif; font-size:20px; font-weight:600; color:var(--c-text-heading); margin:0 0 4px; }
.col p.note { margin:0 0 16px; color:var(--c-text-secondary); max-width:80ch; font-size:12px; }

/* ===== Остров панели: C.bgPanel, рамка C.borderLight, R.xxl (14), SHADOW.island; мобила — лист R.sheet (22) ===== */

.isl.sheet .hd { background:transparent; }
.isl .hd .x { margin-left:auto; color:var(--c-text-muted); font-weight:400; }
.isl .grab { width:36px; height:4px; border-radius:999px; background:var(--c-track); margin:8px auto 0; }

.seg .on { background:var(--c-accent-light); color:var(--c-accent); font-weight:600; }
.tabdot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.ic { display:inline-block; vertical-align:-2px; flex:none; }

/* Card: C.bgCard, рамка C.borderLight, R.xl (12), паддинг SP.md (12) */

.ch { display:flex; align-items:center; gap:8px; margin-bottom:8px; min-width:0; }
.ch h3 { margin:0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--c-text-muted); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card.danger .ch h3 { color:var(--c-danger-text); }
.ch .age { font-size:11px; color:var(--c-text-muted); white-space:nowrap; }
.sum { font-size:12px; color:var(--c-text-secondary); margin:-2px 0 6px; overflow-wrap:anywhere; }

.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.d-ok { background:var(--c-success); } .d-warn { background:var(--c-warning); } .d-danger { background:var(--c-danger); }

.p-ok { background:var(--c-bg-inset); color:var(--c-success); }

.p-warn { background:var(--c-warning-bg); color:var(--c-warning-text); }

.na { color:var(--c-text-muted); font-style:italic; font-weight:400; }

/* Notice-баннер: C.warningBg / C.warningText или C.dangerBg / C.dangerText, R.lg (10) */
.banner { display:flex; gap:8px; align-items:flex-start; border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.4; }
.banner.warn { background:var(--c-warning-bg); color:var(--c-warning-text); }
.banner.danger { background:var(--c-danger-bg); color:var(--c-danger-text); border:1px solid var(--c-danger-border); }

.banner .ic { margin-top:1px; }

.kv { display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:2px 0; min-width:0; }
.kv > span:first-child { color:var(--c-text-secondary); white-space:nowrap; flex:none; }
.kv > span:last-child { font-family:"JetBrains Mono",monospace; font-weight:500; color:var(--c-text-primary); text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kv > span.t-warn { color:var(--c-warning-text) !important; white-space:normal; } .kv > span.t-danger { color:var(--c-danger-text) !important; }

/* «Сейчас в работе» */
.file { display:flex; align-items:center; gap:6px; min-width:0; }
.file .fn { font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:600; color:var(--c-text-heading); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }

.step.cur i { background:var(--c-accent); } .step.cur { color:var(--c-accent); font-weight:600; }
.step span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

details.q summary:focus-visible { outline:2px solid var(--c-accent); outline-offset:1px; border-radius:6px; }

/* Строка встречи — PressableArea; касание открывает .md во «Встречах» */
.mt { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:2px 8px; align-items:center; padding:8px; margin:0 -8px; border-radius:8px; cursor:pointer; min-height:44px; }
.mt + .mt { border-top:1px solid var(--c-border-light); border-radius:0 0 8px 8px; }
.mt:hover { background:var(--c-bg-selected); }
.mt:focus-visible { outline:2px solid var(--c-accent); outline-offset:-2px; }
.mt .nm { font-size:12px; font-weight:600; color:var(--c-text-heading); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mt .tm { font-size:11px; color:var(--c-text-muted); white-space:nowrap; font-family:"JetBrains Mono",monospace; }
.mt .sub { grid-column:2 / span 2; display:flex; flex-wrap:wrap; gap:2px 8px; align-items:center; font-size:11px; color:var(--c-text-secondary); }
.mt .cm { grid-column:2 / span 2; font-size:11px; color:var(--c-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mt .cm.t-danger { color:var(--c-danger-text); white-space:normal; }
.mt.nolink { cursor:default; } .mt.nolink:hover { background:transparent; }
.more { font-size:12px; color:var(--c-accent); font-weight:600; margin-top:4px; cursor:pointer; display:inline-flex; min-height:32px; align-items:center; }

/* Сверка с Dify — таблица из трёх строк */
.tbl { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
.tbl th { font-size:10px; font-weight:600; color:var(--c-text-muted); text-align:right; padding:0 0 4px; }
.tbl th:first-child, .tbl td:first-child { text-align:left; }
.tbl td { padding:4px 0; border-top:1px solid var(--c-border-light); text-align:right; font-family:"JetBrains Mono",monospace; color:var(--c-text-primary); }
.tbl .pill { font-family:"Hanken Grotesk",sans-serif; }

.tbl col.c1 { width:auto; } .tbl col.cn { width:56px; } .tbl col.cs { width:96px; }

/* Зависимости */
.dep { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:0 8px; align-items:center; padding:4px 0; }
.dep + .dep { border-top:1px solid var(--c-border-light); }
.dep .dn { font-size:12px; font-weight:600; color:var(--c-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dep .dd { grid-column:2 / span 2; font-size:11px; color:var(--c-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Устаревшие данные: значения гаснут до C.textMuted */
.stale .tv, .stale .file .fn, .stale .facts b, .stale .step.cur { color:var(--c-text-muted) !important; }
.stale .step.cur i { background:var(--c-track) !important; }

/* Скелет загрузки: C.bgInset */
.sk { background:var(--c-bg-inset); border-radius:6px; height:12px; margin:6px 0; }

  stale: { title:'Завис?', cap:'state.json не обновлялся 23 минуты при живом процессе. Значения блока «Сейчас» гаснут, на вкладке — красная точка.',
    stale:true, banner:['danger','Конвейер не отчитывался 23 мин', 'state.json обновляется каждые ~10 с. Похоже, процесс завис на файле ниже — загляните в журнал сервиса.'],
    svc:{ pill:['p-danger','Завис?'], age:'23 мин назад', ageLv:'t-danger', host:'worker', pid:41233, out:['worker · ~/meetings','ok'] },
    now:{ fn:'2026-11-18 Обсуждение бюджета.mp4', f:'Video-GPB', stage:0, run:'26 мин', runLv:true, dur:52, batch:'2 из 5' },
    q:{ asr:3, sum:1, asrNext:['2026-11-18 Стендап.mp4','2026-11-18 Встреча с юристами.mp4','2026-11-18 Разбор инцидента.mp4'] },
    fails:[], recent:RECENT, dify:DIFY_OK, difyAge:'21 мин назад', deps:DEPS({ asr:'warn' }), dot:'danger' },
  fail: { title:'Сбои + расхождение', cap:'Случай 18.11: конвейер работает, но пишет на ai, и четыре встречи SIAM не доехали до Dify. Плюс два сбоя за сутки и упавшее распознавание.',
    banner:['warn','4 встречи не попали в Dify', 'Video-SIAM: локально 41, в Dify 37. Конвейер пишет на ai, а «Встречи» читают с worker.'],
    svc:{ pill:['p-run','Идёт пачка'], age:'6 с назад', host:'ai', pid:9917, out:['ai · ~/meetings — не та машина','t-warn'] },
    now:{ fn:'2026-11-18 Разбор инцидента.mp4', f:'Video-RR', stage:1, run:'48 с', dur:24, batch:'1 из 1' },
    q:{ asr:0, sum:2, asrNext:[] }, fails:FAILS, recent:RECENT, dify:DIFY_BAD, difyAge:'4 мин назад',
    deps:DEPS({ asr:'danger', dify:'ok' }), dot:'danger' },
  down: { title:'Остановлен', cap:'systemd-сервис не активен (или узел не отвечает). Остальные блоки — последний известный снимок, приглушены.',
    stale:true, banner:['danger','Сервис transcription-supervisor остановлен', 'Новые записи не обрабатываются с 07:12. Запустить можно на worker: systemctl --user start transcription-supervisor.'],
    svc:{ pill:['p-danger','Остановлен'], age:'4 ч 31 мин назад', ageLv:'t-danger', host:'worker', pid:null, out:['worker · ~/meetings','ok'] },
    now:null, idleSince:'процесса нет',
    q:{ asr:2, sum:0, asrNext:['2026-11-18 Стендап.mp4','2026-11-18 Встреча с юристами.mp4'], asrStale:true }, fails:[], recent:RECENT, dify:DIFY_OK, difyAge:'4 ч 33 мин назад',
    deps:DEPS({ asr:'none', llm:'none', dify:'none', share:'none' }), dot:'danger' },
  loading: { title:'Загрузка', cap:'Первый снимок ещё не пришёл: скелеты вместо значений, без «нулей».', loading:true, dot:null },
};

// ===== Блоки вкладки =====
const DEPWORD = { ok:['d-ok','в норме'], warn:['d-warn','медленно'], danger:['d-danger','не отвечает'], none:['d-none','не проверялось'] };
const DEPCLR = { ok:'var(--c-text-secondary)', warn:'var(--c-warning-text)', danger:'var(--c-danger-text)', none:'var(--c-text-muted)' };

function banner(st) {
  if (!st.banner) return '';
  const [lv, t, d] = st.banner;
  return `<div class="banner ${lv}" role="status">${icon('TriangleAlert', 14)}<div><b>${t}.</b> ${d}</div></div>`;
}
function svcCard(st) {
  const s = st.svc;
  return `<div class="card"><div class="ch"><h3>Конвейер</h3><span class="pill ${s.pill[0]}">${s.pill[1]}</span></div>
    <div class="kv"><span>Обновлено</span><span class="${s.ageLv ?? ''}">${s.age}</span></div>
    <div class="kv"><span>Где работает</span><span>${s.host} · ${s.pid ? `pid ${s.pid}` : '<span class="na">нет процесса</span>'}</span></div>
    <div class="kv"><span>Пишет в</span><span class="${s.out[1] === 'ok' ? '' : s.out[1]}">${s.out[0]}</span></div></div>`;
}
function nowCard(st) {
  if (!st.now) return `<div class="card"><div class="ch"><h3>Сейчас</h3></div>
    <div class="empty"><span class="t">Ничего не обрабатывается</span>${st.idleSince}. Новые записи из сетевой папки конвейер подхватит сам.</div></div>`;
  const n = st.now, names = ['Распознавание', 'Сводка', 'В Dify'];
  const steps = names.map((t, i) => `<div class="step ${i < n.stage ? 'done' : i === n.stage ? 'cur' : ''}"><i></i><span>${t}</span></div>`).join('');
  return `<div class="card ${st.stale ? 'stale' : ''}"><div class="ch"><h3>Сейчас</h3><span class="age">пачка ${n.batch}</span></div>
    <div class="file">${icon('AudioLines', 14)}<span class="fn" title="${n.fn}">${n.fn}</span><span class="pill p-fold">${n.f}</span></div>
    <div class="steps" role="list" aria-label="Этап">${steps}</div>
    <div class="facts"><span>идёт <b style="${n.runLv ? 'color:var(--c-danger-text)' : ''}">${n.run}</b></span><span>запись <b>${n.dur} мин</b></span></div></div>`;
}
function queueCard(st) {
  const q = st.q;
  const list = q.asrNext.length ? `<details class="q"><summary>Что в очереди · ${q.asrNext.length}</summary>
    ${q.asrNext.map(f => `<div class="ql">${icon('Clock', 12)}<span class="fn" title="${f}">${f}</span><span class="w">ждёт ${q.asrStale ? '4 ч' : '6 мин'}</span></div>`).join('')}</details>` : '';
  return `<div class="card ${q.asrStale ? 'stale' : ''}"><div class="ch"><h3>Очередь</h3></div>
    <div class="tiles">
      <div class="tile"><div class="tl">Ждут распознавания</div><div class="tv">${q.asr}</div><div class="td">${q.asr ? 'в сетевой папке' : 'всё разобрано'}</div></div>
      <div class="tile"><div class="tl">Ждут сводку</div><div class="tv">${q.sum}</div><div class="td">${q.sum ? 'транскрипт готов' : 'всё разобрано'}</div></div>
    </div>${list}</div>`;
}
function meetRow(m) {
  return `<div class="mt ${m.ok ? '' : 'nolink'}" ${m.ok ? 'tabindex="0" role="link" aria-label="Открыть сводку: ' + m.nm + '"' : ''}>
    <span class="dot ${m.ok ? 'd-ok' : 'd-danger'}" aria-hidden="true"></span>
    <span class="nm" title="${m.nm}">${m.nm}</span>
    <span class="tm">${m.tm}</span>
    <span class="sub"><span class="pill p-fold">${m.f}</span><span>${m.dur} мин</span>${m.sp ? `<span>${m.sp} спикера</span>` : ''}${m.ok ? `<span style="display:inline-flex;align-items:center;gap:3px;color:var(--c-accent);font-weight:600">${icon('FileText', 12)}.md</span>` : ''}</span>
    <span class="cm ${m.ok ? '' : 't-danger'}">${m.cm}</span></div>`;
}
function failsCard(st) {
  if (!st.fails.length) return '';
  return `<div class="card danger"><div class="ch"><h3>Сбои за сутки · ${st.fails.length}</h3></div>${st.fails.map(meetRow).join('')}</div>`;
}
function recentCard(st) {
  return `<div class="card"><div class="ch"><h3>Последние встречи</h3><span class="age">касание — открыть сводку</span></div>
    ${st.recent.map(meetRow).join('')}<span class="more" role="button" tabindex="0">Показать ещё</span></div>`;
}
function difyCard(st) {
  const rows = st.dify.map(([f, loc, dify]) => {
    const d = dify - loc;
    const pill = d === 0 ? '<span class="pill p-ok">сходится</span>' : `<span class="pill p-warn" title="В Dify не хватает ${-d}">не хватает ${-d}</span>`;
    return `<tr><td title="${f}">${f.replace('Video-', '')}</td><td>${loc}</td><td>${dify}</td><td>${pill}</td></tr>`;
  }).join('');
  return `<div class="card ${st.stale ? 'stale' : ''}"><div class="ch"><h3>Сверка с Dify</h3><span class="age">${st.difyAge} · раз в 30 мин</span></div>
    <table class="tbl"><colgroup><col class="c1"><col class="cn"><col class="cn"><col class="cs"></colgroup>
    <thead><tr><th>Папка</th><th>Локально</th><th>В Dify</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function depsCard(st) {
  return `<div class="card"><div class="ch"><h3>Зависимости</h3></div>${st.deps.map(d => {
    const [dc, w] = DEPWORD[d.s];
    return `<div class="dep"><span class="dot ${dc}"></span><span class="dn">${d.n}</span><span class="ds" style="color:${DEPCLR[d.s]}">${w}</span><span class="dd">${d.d}</span></div>`;
  }).join('')}</div>`;
}
function loadingBody() {
  const sk = w => `<div class="sk" style="width:${w}%"></div>`;
  return ['Конвейер', 'Сейчас', 'Очередь', 'Последние встречи'].map(t => `<div class="card" aria-busy="true"><div class="ch"><h3>${t}</h3></div>${sk(70)}${sk(45)}</div>`).join('');
}
// Порядок: тревога → состояние → сейчас → очередь → сбои → история → сверка → зависимости
function tab(st) {
  if (st.loading) return loadingBody();
  return banner(st) + svcCard(st) + nowCard(st) + queueCard(st) + failsCard(st) + recentCard(st) + difyCard(st) + depsCard(st);
}

// ===== Обвязка панели =====
const TABS = [['LLM','MessageSquareText'], ['Медиа','Clapperboard'], ['Стенды','Cpu'], ['Встречи','AudioLines']];
function island(body, dot) {
  const mob = S.w < 380, narrow = S.w < 340;
  // На узкой ленте (лист <380) неактивные вкладки — только иконка с aria-label и Tooltip: четыре подписи не влезают в 296 px
  const tabs = `<span class="seg" role="tablist">${TABS.map(([t, ic]) => {
    const on = t === 'Встречи', io = narrow && !on;
    const d = t === 'Встречи' && dot ? `<i class="tabdot d-${dot}"></i>` : '';
    return `<span class="${on ? 'on' : ''} ${io ? 'io' : ''}" role="tab" aria-selected="${on}" ${io ? `aria-label="${t}" title="${t}"` : ''}>${icon(ic, 12)}${io ? '' : t}${d}</span>`;
  }).join('')}</span>`;
  return `<div class="isl ${mob ? 'sheet' : ''}" style="width:${S.w}px">${mob ? '<div class="grab"></div>' : ''}
    <div class="hd">${mob ? 'Ферма' : tabs}<span class="x">✕</span></div>
    <div class="body">${mob ? `<div>${tabs}</div>` : ''}${body}</div></div>`;
}
const S = { st:'work', th:'both', w:380 };
function render() {
  const st = STATES[S.st];
  const ths = S.th === 'both' ? ['light', 'dark'] : [S.th];
  document.getElementById('root').innerHTML = ths.map(th => `<div class="col" data-theme="${th}">
    <h2>${st.title} — ${th === 'light' ? 'светлая' : 'тёмная'} тема</h2>
    <p class="note">${st.cap}<br>${S.w < 380 ? `Мобильный лист ${S.w} CSS px: вкладки — строкой в теле${S.w < 340 ? ', неактивные только иконкой' : ''}.` : 'Остров рельса 380 px: вкладки в шапке.'}</p>
    ${island(tab(st), st.dot)}</div>`).join('');
  bar();
}
function tog(id, key, opts) {
  document.getElementById(id).innerHTML = opts.map(([v, t]) => `<button class="${S[key] === v ? 'on' : ''}" data-v="${v}">${t}</button>`).join('');
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => { S[key] = key === 'w' ? +b.dataset.v : b.dataset.v; render(); });
}
function bar() {
  tog('tSt', 'st', Object.entries(STATES).map(([k, v]) => [k, v.title]));
  tog('tTh', 'th', [['light','Светлая'], ['dark','Тёмная'], ['both','Обе']]);
  tog('tW', 'w', [[380,'Рельс 380'], [360,'Телефон 360'], [320,'Узкий 320']]);
}
render();
</script>
</body>
</html>
