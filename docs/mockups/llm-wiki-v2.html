  const auto = p.auto.length ? `<div class="pg chg"><div class="pgh">${I(ic.check,14)}<span class="nm" style="font-family:inherit;font-size:13px">Уже применено само</span>${badge('success',p.auto.length)}<span class="hint" style="margin-left:auto">неспорное, по политике</span></div>

      ${btn('pri','sm', nAcc ? `Применить (${nAcc})` : 'Применить решения', '', nDec < p.ops.length ? 'disabled title="Решите все спорные операции"' : '')}
    </div>`;
  return `<div class="doc" style="display:flex;flex-direction:column">
    <div class="docin" style="max-width:none;padding:16px 18px 0">

// ===== Отбор чатов (ADR-035, 12а) =====
function marks(c) {
  const m = S.marks[c.id];
  const dis = c.task ? 'disabled title="Чат исполнителя задачи: пометки не действуют, знание приходит итогом задачи"' : '';
  return `<span class="marks"><button class="mk2 ${m==='important'?'on':''}" data-act="mark" data-c="${c.id}" data-v="important" ${dis} aria-pressed="${m==='important'}">${I(ic.star,12)}Важный</button>
    <button class="mk2 skip ${m==='skip'?'on':''}" data-act="mark" data-c="${c.id}" data-v="skip" ${dis} aria-pressed="${m==='skip'}">${I(ic.ban,12)}Не разбирать</button></span>`;
}
function zoneOf(c) {
  const m = S.marks[c.id];
  if (c.task) return ZONE.excl;
  if (m === 'skip') return ['не разбирать','neutral'];
  if (m === 'important') return ['важный','accent'];
  return ZONE[c.z];
}
function triage() {
  const F = [['all','Все',638],['work','Разбирается',152],['gray','Серая зона',177],['skip','Пропущено',43],['excl','Не разбирается',266]];
  const head = setHead('chat','Отбор чатов','Какие разговоры Хранитель разбирает ночью и почему. Ваша пометка «Важный» или «Не разбирать» перекрывает автомат.');
  const ctl = `<div class="frow" style="margin-top:4px">${sel('Раздел: AI Home','sm')}<div class="srch" style="flex:1;min-width:180px">${I(ic.search,14)}<span>Поиск по названию чата…</span></div></div>
    <div class="pills" style="margin-top:8px">${F.map(([k,t,n]) => `<button class="${S.tf===k?'on':''}" data-act="tf" data-v="${k}">${t} <span class="mono" style="font-size:11px;color:var(--c-text-muted)">${n}</span></button>`).join('')}</div>`;
  const thr = `<div class="card"><div class="ch"><div class="w"><div class="ct">Пороги</div><div class="cs">Балл считает код по сигналам: реплики человека, формулировки решений, правки направления, документы, задачи и заметки из чата.</div></div></div>
    <div class="frow" style="margin-top:10px"><span style="font-size:12.5px">Разбирается от</span><span class="inp">${S.thr}</span><button class="ib" data-act="thr" data-v="-1" aria-label="Меньше">−</button><button class="ib" data-act="thr" data-v="1" aria-label="Больше">+</button>
      <span style="font-size:12.5px;margin-left:8px">серая зона от</span><span class="inp">6</span></div>
    ${S.thr !== 15 ? `<div class="ntc info" style="margin-top:10px;padding:7px 10px">${I(ic.refresh,15)}<div style="font-size:12.5px">При пороге ${S.thr}: ${S.thr<15 ? `+${(15-S.thr)*8} чатов перейдут в «разбирается»` : `${(S.thr-15)*9} чатов уйдут в серую зону`}. Применится со следующей ночи. ${btn('pri','xs','Сохранить')}</div></div>` : ''}</div>`;
  if (S.tri === 'empty') return `<div class="doc"><div class="docin new" style="max-width:860px">${head}${ctl}
    <div class="empty" style="padding:50px 20px"><div class="ei">${I(ic.chat,26)}</div><div class="et">В разделе пока нет разговоров</div>
      <div class="es">Чаты проекта появятся здесь после первого разговора. Отбор считает код, он бесплатный и идёт сам.</div></div></div></div>`;
  const run = S.tri === 'running';
  const list = run
    ? [0,1,2,3,4].map(() => `<div class="lrow"><div class="w"><div class="sk" style="width:45%;height:11px;margin:2px 0 6px"></div><div class="sk" style="width:75%;height:9px"></div></div><span class="sk" style="width:120px;height:22px"></span></div>`).join('')
    : CHATS.filter(c => S.tf === 'all' || c.z === S.tf || (S.tf==='excl' && c.z==='excl')).map(c => {
        const [zr, zt] = zoneOf(c);
        return `<div class="lrow"><span class="sc" title="Балл ступени 1">${c.sc}</span><div class="w">
          <div class="t">${c.t}${badge(zt, zr)}${c.pin ? `<span class="hint">${I(ic.star,11)} закреплён</span>` : ''}</div>
          <div class="s" style="${c.warn ? 'color:var(--c-warning-text)' : ''}"><b style="color:var(--c-text-muted);font-weight:600">Почему:</b> ${c.r}</div>
          <div class="m"><span>${c.d}</span>${c.cur ? `<span>${c.cur}</span>` : ''}${c.chr ? `<button class="lnk" data-go="chron" style="padding:0">Хроника →</button>` : ''}</div>
          ${S.m ? marks(c) : ''}</div>${S.m ? '' : marks(c)}</div>`;
      }).join('');
  return `<div class="doc"><div class="docin new" style="max-width:860px">${head}
    ${run ? `<div class="ntc info" style="margin-bottom:10px">${I(ic.refresh,16)}<div style="flex:1"><div class="nt"><span class="spin"></span> Первичный отбор идёт — 312 из 638 чатов</div>Балл считает код, бесплатно. Серую зону модель разберёт ночью. Список заполняется по мере подсчёта.

    ${ctl}${run ? '' : thr}
    <div class="listbox"><div class="lhd"><b style="color:var(--c-text-heading);font-size:13px;flex:1">${run ? 'Подсчитано 312' : 'Чаты раздела'}</b><span class="hint">балл · состояние · причина · пометка</span></div>${list}</div>
    <div class="hint" style="margin-top:8px">«Важный» минует балл и модель, но не исключение чатов исполнителя задач. Закреплённый чат и чат с «Итогом» считаются важными.</div>
  </div></div>`;
}

        <div class="hint" style="margin-top:6px">«Итог» больше не пишет заметку в «Сессии»: он разбирает чат сейчас и отвечает ссылкой на хронику. Без вики — как раньше.</div></div>
    </div></div></div>`;
}

// ===== Утренний бриф: «Что решили вчера» и свёрнутая просрочка =====
function brief() {
  const D = [
    ['Неспорное в вики применяется само, спорное — во «Входящие»','Проекты / AI Home / Неспорное — без ревью, с откатом','План шагов LLM-wiki'],
    ['Чаты исполнителей задач в вики не разбираются','Проекты / AI Home / Отбор чатов','План шагов LLM-wiki'],
    ['Звук ревьюит Глеб до пятницы, Вера — на QA видео','Проекты / AI Home / Ревью в AI Home','Ревью звука'],
    ['Встречи с МВД переносим на вторник','Проекты / Стратсессия / Хроника 26.10','Встреча с Гришей'],
    ['Расход моделей считаем по фактическому маршруту','Проекты / AI Home / Расход моделей','досье коммита'],
  ];
  return `<div class="doc"><div class="docin" style="max-width:780px">
    <div class="kicker">${I(ic.note,13)} Заметка · Journal/2026-10-27.md · секция «Утренний бриф»</div>
    <h2 class="pt" style="font-size:24px">${I(ic.sun,20)} Утренний бриф · вторник, 27 октября</h2>
    <h3 class="sh muted">Задачи дня <span class="n">без изменений</span></h3>
    <ul class="hist"><li>Андрей: 15 вопросов с эталонными ответами для базовой линии</li><li>Ревью макета LLM-wiki v2</li></ul>
    <div class="new" style="margin-top:4px"><h3 class="sh">Что решили вчера <span class="n">5</span></h3>
    <ul class="brief">${D.map(([t,p,c]) => `<li><span style="flex:1;min-width:220px;color:var(--c-text-heading)">${t}</span><span class="chips"><button class="pglink" title="${p}">${I(ic.book,12)}${p.split(' / ').slice(-1)[0]}</button><button class="mjump">${I(ic.chat,12)}${c}</button></span></li>`).join('')}</ul>
    <div class="hint" style="margin-top:6px">Только то, что уже применено в вики за сутки. Важные чаты — первыми.</div>
    <button class="row" data-go="inbox" style="min-height:36px;align-items:center;margin-top:6px">${I(ic.inbox,15)}<span class="w">Во «Входящих» 3 спорных правки за ночь</span>${I(ic.right,15)}</button></div>
    <h3 class="sh">Просрочено</h3>
    <ul class="hist"><li>«Ответить по eStatement» · просрочено 2 дня</li><li>«Обновить драйвер GPU2» · просрочено 5 дней</li></ul>
    <div class="row new" style="align-items:center;min-height:40px;background:var(--c-bg-inset);margin-top:6px">${I(ic.clock,15)}<span class="w" style="font-size:12.5px"><b style="color:var(--c-text-heading)">Давно просрочено 14</b> — самые старые: «Миграция бэкапа» (63 дн), «Скан LoRA» (48 дн), «Документация пульта» (41 дн)</span><button class="lnk">Показать все</button></div>
    <div class="hint" style="margin-top:6px">Свёрнуто то, что просрочено больше недели. Свежая просрочка — списком, как раньше.</div>
    <h3 class="sh muted">Git и команда <span class="n">без изменений</span></h3>
    <div class="hint">…</div>
  </div></div>`;
}

// ===== Здоровье =====
function spark(pts, color) {
  const max = Math.max(...pts), min = Math.min(...pts);
  const p = pts.map((v,i) => `${i*(100/(pts.length-1))},${28 - ((v-min)/((max-min)||1))*24}`).join(' ');
  return `<svg width="100%" height="30" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p}" fill="none" style="stroke:var(${color});stroke-width:1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function health() {
  const T = [
    ['Ссылки в пустоту (призраки)', '64%', '−6 п.п. к базовой линии 70%', 'success', [70,70,69,67,66,64], '--c-success', ''],
    ['Сироты', '45%', '−3 п.п. к 48%', 'success', [48,48,47,47,46,45], '--c-success', ''],
    ['Упоминания без ссылки', '96', '−16 к 112', 'success', [112,110,108,104,99,96], '--c-success', ''],
    ['Страницы без источников', '0', 'гейт держит ноль', 'success', [0,0,0,0,0,0], '--c-text-muted', ''],
    ['Дрейф', '1', 'Стенд разработки', 'danger', [0,0,0,1,0,1], '--c-danger', ''],
    ['Доля откатов, 30 дн', '3,1%', '7 дн — 2,4 % · класс выключен 1', 'warning', [0,1.2,2.8,3.4,3.0,3.1], '--c-warning', 'new'],
    ['Ответы из вики (S8)', '9 / 15', 'цель ≥ 10 после бэклога', 'warning', [3,3,5,7,8,9], '--c-accent', 'new'],
    ['Recall принёс страницу', '41', 'за неделю · +12', 'success', [4,9,15,22,29,41], '--c-success', 'new'],
  ];
  const W = 600, H = 150, xs = i => 30 + i * ((W-40)/5), yv = v => 130 - (v-30)/50*110;
  const line = (d, c, dash) => `<polyline points="${d.map((v,i)=>`${xs(i)},${yv(v)}`).join(' ')}" fill="none" style="stroke:var(${c});stroke-width:2${dash?';stroke-dasharray:4 4':''}"/>`;
  return `<div class="doc"><div class="docin" style="max-width:920px">
    <div class="kicker">${I(ic.pulse,13)} lint 27.10 в 03:00 · <span class="pfx chg">Проекты / AI Home</span> · 142 страницы</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px"><h2 class="pt" style="margin:0;flex:1;min-width:180px">Здоровье вики</h2>
      <div class="pills chg"><button class="${S.scope==='sec'?'on':''}" data-act="scope" data-v="sec">Этот раздел</button><button class="${S.scope==='all'?'on':''}" data-act="scope" data-v="all">Вся вики</button></div>
      ${btn('gh','sm',I(ic.refresh,14)+'Проверить сейчас')}</div>
    <div class="tiles" style="grid-template-columns:repeat(${S.m?2:4},minmax(0,1fr))">${T.map(([l,v,d,tone,pts,c,n]) => `<button class="tile ${n}"><span class="lb">${l}</span><span class="v">${v}</span><span class="dl" style="color:var(--c-${tone}-text)">${d}</span>${spark(pts,c)}</button>`).join('')}</div>
    <div class="card new" style="margin-top:12px"><div class="kv"><div><b>18 %</b><span>разборов «нечего добавить»</span></div><div><b>31 %</b><span>серой зоны ушло в «разбирается»</span></div><div><b>2</b><span>повторных вопроса агентов за неделю</span></div><div><b>−52 %</b><span>к базовой линии повторов</span></div></div></div>
    <div class="chart"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px"><b style="color:var(--c-text-heading)">Динамика за 6 недель</b>
      <div class="lg"><span><i style="background:var(--c-accent)"></i>призраки, %</span><span><i style="background:var(--c-info)"></i>сироты, %</span><span><i style="background:var(--c-text-muted)"></i>базовая линия</span></div></div>
      <svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Доля призраков упала с 70 до 64 процентов, сирот — с 48 до 45">
        ${[40,60,80].map(v => `<line x1="30" x2="${W-10}" y1="${yv(v)}" y2="${yv(v)}" style="stroke:var(--c-border-light)"/><text x="4" y="${yv(v)+4}" style="fill:var(--c-text-muted);font:10px 'JetBrains Mono',monospace">${v}</text>`).join('')}
        ${line([70,70,70,70,70,70],'--c-text-muted',true)}${line([70,70,69,67,66,64],'--c-accent')}${line([48,48,47,47,46,45],'--c-info')}
        ${['15.09','22.09','29.09','06.10','13.10','20.10'].map((d,i) => `<text x="${xs(i)-(i===5?30:14)}" y="146" style="fill:var(--c-text-muted);font:10px 'JetBrains Mono',monospace">${d}</text>`).join('')}
      </svg><div class="hint">Базовая линия снята до первой записи в вики. Замеры — metrics.jsonl.</div></div>
    ${S.m ? `<div style="margin-top:14px" class="isl">${healthSide()}</div>` : ''}
  </div></div>`;
}

// ===== Сборка =====
function center() {
  const s = S.screen;
  if (s === 'empty') return emptyCenter();
  if (s === 'local') return localCenter();
  if (s === 'orphan') return orphanCenter();
  if (s === 'chron') return chron();
  if (s === 'health') return health();
  if (s === 'inbox' || s === 'pkg') return pkg();
  if (s === 'journal' || s === 'jentry') return jentry();
  if (s === 'checks') return checks();
  if (s === 'settings' || s === 'night') return night();
  if (s === 'apply') return apply();
  if (s === 'personal') return personal();
  if (s === 'triage') return triage();
  if (s === 'backlog') return backlog();
  if (s === 'loading') return `<div class="doc"><div class="docin"><div class="sk" style="width:30%;height:10px"></div><div class="sk" style="width:55%;height:26px;margin:10px 0"></div><div class="sk" style="width:80%;height:12px;margin-bottom:22px"></div>${[0,1,2,3].map(()=>'<div class="sk" style="width:95%;height:11px;margin:8px 0"></div>').join('')}</div></div>`;
  return page();
}
function overlays() { return retractDlg() + consentDlg() + orphanDlg() + toast(); }
function rail() {
  return `<div class="rail">${[['home',0],['chat',0],['tasks',0],['note',1],['graph',0]].map(([k,on]) => `<span class="rb ${on?'on':''}">${I(ic[k],17)}</span>`).join('')}</div>`;
}
function desktop() {
  if (S.screen === 'chat') return rail() + `<div class="isl center">${chatScreen()}</div>` + overlays();
  if (S.screen === 'brief') return rail() + `<div class="isl center">${brief()}</div>`;
  return rail() + `<div class="isl side">${side()}</div><div class="isl center">${center()}</div>` + overlays();
}
const MTITLE = { page:'Глеб (ревьюер)', chron:'Хроника', drift:'Стенд разработки', orphan:'Мигранты.МВД', local:'Домашний NAS', pkg:'Пакет', jentry:'Запись журнала', checks:'Отбит проверками',
  night:'Ночной разбор', apply:'Применение', personal:'Личное и облако', triage:'Отбор чатов', backlog:'Старые разговоры', health:'Здоровье вики' };
const MBACK = { pkg:'inbox', jentry:'journal', checks:'journal', night:'settings', apply:'settings', personal:'settings', triage:'settings', backlog:'settings', orphan:'sections', local:'sections' };
function mobile() {
  if (S.screen === 'chat') return `<div class="mhead"><span class="ttl" style="padding-left:8px">Вики в чате</span></div><div class="isl">${chatScreen()}</div>` + overlays();
  if (S.screen === 'brief') return `<div class="mhead"><span class="ttl" style="padding-left:8px">Бриф</span></div><div class="isl">${brief()}</div>`;
  if (isDetail()) {
    return `<div class="mhead"><button class="ib" data-go="${MBACK[S.screen] || 'catalog'}" aria-label="Назад">${I(ic.back,20)}</button><span class="ttl">${MTITLE[S.screen]}</span><button class="ib" aria-label="Ещё">${I(ic.more,18)}</button></div>
      <div class="isl" style="position:static">${center()}</div>${fnSheet()}${overlays()}`;
  }
  const t = tab();
  const list = S.screen === 'empty' ? emptyCenter() : S.screen === 'sections' ? sectionsScreen() : t === 'inbox' ? inboxList() : t === 'journal' ? journalList() : t === 'settings' ? settingsNav() : catalogList();
  return `<div class="mhead" style="padding-left:14px"><span class="ttl serif" style="font-size:18px">Заметки</span>
      ${S.screen==='empty' ? '' : `<button class="ib new ${t==='health'?'on':''}" data-go="health" aria-label="Здоровье вики">${I(ic.pulse,18)}</button><button class="ib new ${t==='settings'?'on':''}" data-go="settings" aria-label="Настройки вики">${I(ic.gear,18)}</button>`}</div>
    <div class="ctl" style="padding-top:8px;background:var(--c-bg-white)">
      <div class="pills fill"><button>Заметки</button><button class="on">Вики</button><button>Граф</button></div>
      ${S.screen === 'empty' ? '' : `<div class="pills fill chg"><button class="${t==='catalog'?'on':''}" data-go="catalog">Каталог</button><button class="${t==='inbox'?'on':''}" data-go="inbox">Входящие <span class="cnt">${inboxN}</span></button><button class="${t==='journal'?'on':''}" data-go="journal">Журнал</button></div>`}
    </div><div class="isl">${list}</div>${overlays()}`;
}

function mk() {
  const sub = [];
  if (['inbox','pkg'].includes(S.screen)) sub.push(['Пакет', PKORDER.map(k => [k, {sup:'замещение',drift:'дрейф',pub:'личное→общее',url:'ссылка',dup:'дубль',cls:'класс выключен',rep:'ремонт'}[k]]), 'pk', S.pk]);
  if (S.screen === 'triage') sub.push(['Отбор', [['list','список'],['running','первичный отбор идёт'],['empty','пусто']], 'tri', S.tri]);
  if (S.screen === 'backlog') sub.push(['Бэклог', [['idle','не запущен'],['run','идёт'],['pause','на паузе'],['done','завершён']], 'bl', S.bl]);
  if (['night','settings'].includes(S.screen)) sub.push(['Роль', [['1','администратор'],['0','не админ']], 'admin', S.admin ? '1' : '0']);
  if (['jentry','journal','chron','page'].includes(S.screen)) sub.push(['Откат', [['0','закрыт'],['1','подтверждение']], 'retractmk', S.retract ? '1' : '0']);
  if (S.screen === 'personal') sub.push(['Облако', [['0','запрещено'],['1','разрешено'],['dlg','диалог']], 'consentmk', S.cdlg ? 'dlg' : S.consent ? '1' : '0']);
  if (S.screen === 'orphan') sub.push(['Диалог', [['0','закрыт'],['1','удалить раздел']], 'odlgmk', S.odlg ? '1' : '0']);
  document.getElementById('mk').innerHTML = `<h1>LLM-wiki · v2</h1>
    ${SCREENS.map(([g, list]) => `<div class="grp"><span class="lbl">${g}</span><div class="pills">${list.map(([k,t]) => `<button class="${S.screen===k?'on':''}" data-go="${k}">${t}</button>`).join('')}</div></div>`).join('')}
    ${sub.map(([l, opts, act, cur]) => `<div class="grp"><span class="lbl">${l}</span><div class="pills">${opts.map(([k,t]) => `<button class="${cur===k?'on':''}" data-act="${act}" data-v="${k}">${t}</button>`).join('')}</div></div>`).join('')}
    <div class="grp"><div class="pills"><button class="${!S.dark?'on':''}" data-act="theme" data-v="0">Светлая</button><button class="${S.dark?'on':''}" data-act="theme" data-v="1">Тёмная</button></div>
      <div class="pills"><button class="${!S.m?'on':''}" data-act="w" data-v="0">1240</button><button class="${S.m?'on':''}" data-act="w" data-v="1">360</button></div>
      <label><input type="checkbox" data-act="calm" ${S.nonew?'checked':''}> без пометок</label></div>`;
  document.getElementById('note').innerHTML = `Пунктир <b>C.accentMuted</b> — нового в продукте; пунктир <b>C.planBorder</b> — изменено против v1; серый пунктир — следующая фича. На 360 «Здоровье» и «Настройки» — иконки в шапке. Диплинки: <span class="mono">#pkg&amp;pk=pub&amp;dark&amp;m</span>, <span class="mono">#jentry&amp;retract</span>, <span class="mono">#backlog&amp;bl=run</span>.`;
}
function render() {
  document.documentElement.dataset.theme = S.dark ? 'dark' : 'light';
  document.body.classList.toggle('nonew', S.nonew);
  const app = document.getElementById('app');
  app.className = 'app' + (S.m ? ' m' : '');
  app.innerHTML = S.m ? mobile() : desktop();
  mk();
  const parts = [S.screen];
  if (['inbox','pkg'].includes(S.screen) && S.pk !== 'sup') parts.push('pk=' + S.pk);
  if (S.screen === 'triage' && S.tri !== 'list') parts.push('tri=' + S.tri);
  if (S.screen === 'backlog' && S.bl !== 'idle') parts.push('bl=' + S.bl);
  if (S.retract) parts.push('retract'); if (S.cdlg) parts.push('cdlg'); if (S.odlg) parts.push('odlg');
  if (S.consent) parts.push('consent'); if (!S.admin) parts.push('user'); if (!S.night) parts.push('off');
  if (S.dark) parts.push('dark'); if (S.m) parts.push('m'); if (S.nonew) parts.push('calm');
  history.replaceState(null, '', '#' + parts.join('&'));
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && !g.disabled) {
    S.screen = g.dataset.go; S.tip = null;
    if (g.dataset.pk) S.pk = g.dataset.pk;
    render(); return;
  }
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const k = a.dataset.act, v = a.dataset.v, s = +a.dataset.s;
  const key = S.pk + ':' + s;
  if (k === 'theme') S.dark = v === '1';
  else if (k === 'w') S.m = v === '1';
  else if (k === 'calm') S.nonew = a.checked;
  else if (k === 'pk') S.pk = v;
  else if (k === 'tri') S.tri = v;
  else if (k === 'bl') S.bl = v;
  else if (k === 'admin') S.admin = v === '1';
  else if (k === 'retractmk') S.retract = v === '1';
  else if (k === 'consentmk') { S.cdlg = v === 'dlg'; S.consent = v === '1'; }
  else if (k === 'odlgmk' || k === 'odlg') S.odlg = k === 'odlg' ? true : v === '1';
  else if (k === 'oclose') S.odlg = false;
  else if (k === 'scope') S.scope = v;
  else if (k === 'acc') S.dec[key] = 'acc';
  else if (k === 'rej') S.dec[key] = 'rej';
  else if (k === 'undo') delete S.dec[key];
  else if (k === 'accall') { for (const o of PK[S.pk].ops) if (!S.dec[S.pk+':'+o.seq]) S.dec[S.pk+':'+o.seq] = 'acc'; }
  else if (k === 'tip') S.tip = S.tip === +a.dataset.n ? null : +a.dataset.n;
  else if (k === 'tipclose') S.tip = null;
  else if (k === 'driftdiff') S.driftDiff = !S.driftDiff;
  else if (k === 'src') S.srcOpen = !S.srcOpen;
  else if (k === 'go-drift') S.screen = 'drift';
  else if (k === 'go-apply') S.screen = 'apply';
  else if (k === 'retract') { S.retract = true; S.chatMenu = S.screen === 'chat' ? false : S.chatMenu; }
  else if (k === 'rclose') S.retract = false;
  else if (k === 'rdo') { S.retract = false; S.toast = true; }
  else if (k === 'tclose') S.toast = false;
  else if (k === 'jf') S.jf = v;
  else if (k === 'tf') S.tf = v;
  else if (k === 'thr') S.thr = Math.max(6, Math.min(30, S.thr + +v));
  else if (k === 'mark') { const c = a.dataset.c; S.marks[c] = S.marks[c] === v ? null : v; }
  else if (k === 'night') S.night = !S.night;
  else if (k === 'applyAll') S.applyAll = !S.applyAll;
  else if (k === 'clsOn') delete S.clsOff[a.dataset.c];
  else if (k === 'clsOff') S.clsOff[a.dataset.c] = 'manual';
  else if (k === 'consent') { if (S.consent) S.consent = false; else S.cdlg = true; }
  else if (k === 'cclose') S.cdlg = false;
  else if (k === 'cyes') { S.cdlg = false; S.consent = true; }
  else if (k === 'ble') S.ble = v;
  else if (k === 'blgo') S.bl = 'run';
  else if (k === 'blpause') S.bl = 'pause';
  else if (k === 'bldone') S.bl = 'done';
  else if (k === 'itog') S.itog = v;
  else return;
  render();
});
// Наведение на операцию подсвечивает её цитату в карточке источника
document.addEventListener('mouseover', e => {
  const op = e.target.closest('.op');
  document.querySelectorAll('mark.hl').forEach(m => m.classList.toggle('hot', !!op && m.dataset.op.split(',').includes(op.dataset.seq)));
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.tip || S.retract || S.cdlg || S.odlg) { S.tip = null; S.retract = false; S.cdlg = false; S.odlg = false; render(); }
});
render();
</script>
</body>
