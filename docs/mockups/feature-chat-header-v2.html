  list:'<path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/>',
  hour:'<path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  task:'<rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4M13 6h8M13 12h8M13 18h8"/>',
  arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>',
};
const ic = (k, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

// Кольцо RingIcon (viewBox 20, r=9, полоса 2, скруглённые концы). slots: [{pct, color}] снаружи внутрь
function ring(slots, size = 20) {
  const R = [9, 6, 3];
  let g = '';
  slots.forEach((s, i) => {
    if (!s) return;
    const r = R[i], L = 2 * Math.PI * r, arc = s.pct == null ? 0 : Math.max(L * s.pct / 100, 3);
    g += `<circle cx="10" cy="10" r="${r}" fill="none" stroke-width="2" style="stroke:var(--c-progress-track)"/>`;
    if (arc > 0) g += `<circle cx="10" cy="10" r="${r}" fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="${Math.max(arc - 2, .01)} ${L}" style="stroke:${s.color}"/>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 20 20" aria-hidden="true"><g transform="rotate(-90 10 10)">${g}</g></svg>`;
}

// ===== Данные фичи (с бэка: stepProgress + inMaster, brief.active/next/estimate, tracker) =====
const F = {
  title:'Правда о прогрессе фичи', pct:54, total:13,
  buckets:[['m',3,'в master'],['a',4,'принято'],['r',2,'в ревью'],['w',2,'в работе'],['n',2,'не заведено']],
  now:[['Полина','Ш8 · вёрстка шапки','24 мин'],['Тимур','Ш6 · проекция мержа','1 ч 10'],['Глеб','ревью Ш5','8 мин']],
  next:[['Ш9','e2e шапки · Вера'],['Финал','приёмка · Александр']],
  est:{ ready:'60 %', readyBy:'оценка Софьи · 18:02', eta:'≈ 2 ч 40', etaBy:'к 18:30 · с запасом' },
  disc:['Ш4 снят в трекере, но остался в плане','Ш10 заведён без шага плана'],
  role:'Ш8 · фронт', more:1,
};
const ST = {
  run:  { tone:null, color:'var(--c-success)', short:'Сейчас <b>Полина</b> +2', pill:'≈ 18:30' },
  wait: { tone:'warn', color:'var(--c-warning)', short:'Ждёт вас · Полина спрашивает про отступы', pill:'ждёт вас', act:'Ответить', alarm:'<b>Ждёт вас.</b> Полина спрашивает про отступы карточки — ответ нужен в этом чате.' },
  stop: { tone:'stop', color:'var(--c-danger)', short:'Стоит · у Тимура упала сборка', pill:'стоит', act:'Чат Тимура', alarm:'<b>Стоит.</b> У Тимура упала сборка Ш6 · 14 мин назад.' },
};

const S = { v:'A', st:'run', open:false, theme:'light', disc:false };

// ===== Общие кирпичики =====
function bar() {
  return `<div class="bar">${F.buckets.map(([k, n]) => `<i class="k-${k}" style="flex:${n}"></i>`).join('')}</div>`;
}
function legend() {
  return `<div class="leg">${F.buckets.map(([k, n, l]) => `<span><i class="k-${k}"></i>${l} ${n}</span>`).join('')}</div>`;
}
function rows(list, timed) {
  return list.map(r => `<div class="br"><span class="w"><b>${r[0]}</b> — ${r[1]}</span>${timed ? `<span class="v">${r[2]}</span>` : ''}</div>`).join('');
}
// Содержимое раскрытия, по приоритету. cols — две колонки (вариант В на десктопе)
// noAlarm — тревога с действием уже стоит в самой строке (вариант В), второй раз её не повторяем
function body(mob, cols, noAlarm) {
  const st = ST[S.st];
  const alarm = st.alarm && !noAlarm ? `<div class="alarm ${st.tone}"><span class="tx">${st.alarm}</span><button class="btn sm ${mob ? 'tap' : ''}" data-act>${st.act}</button></div>` : '';
  const now = `<div class="sec">Сейчас · ${F.now.length}</div>${rows(F.now, true)}`;
  const next = `<div class="sec">Дальше</div>${rows(F.next, false)}`;
  const pair = `<div class="pair">
      <div class="cell"><div class="k">Готовность</div><div class="val">${F.est.ready}</div><div class="s">${F.est.readyBy}</div></div>
      <div class="cell"><div class="k">Срок</div><div class="val">${F.est.eta}</div><div class="s">${F.est.etaBy}</div></div></div>`;
  const meter = `<div class="meter"><div class="body">
      <div class="hd"><span class="lb">По трекеру</span><span class="vl">${F.pct} % · 7 из ${F.total}</span></div>
      ${bar()}${legend()}</div></div>`;
  const disc = `<button class="coll" data-disc aria-expanded="${S.disc}">${ic('chevR', 12)}Трекер расходится · ${F.disc.length}</button>
      ${S.disc ? `<ul class="disc">${F.disc.map(d => `<li>${d}</li>`).join('')}</ul>` : ''}`;
  const foot = `<div class="foot">этот чат — <span class="role">${F.role}</span><button class="lnk" data-page>Страница фичи ${ic('arrow', 12)}</button></div>`;
  const head = cols ? '' : `<div class="pt"><span class="ttx">${F.title}</span><button class="more" data-more>· ещё ${F.more}</button></div>`;
  if (cols) return `<div class="col">${alarm}${now}${next}</div><div class="col">${pair}${meter}${disc}</div>${foot}`;
  return `${head}${alarm}${now}${next}${pair}${meter}${disc}${foot}`;
}

// Поповер BadgeShell: десктоп — absolute под чипом справа (min 280 у ring), мобила — fixed под тулбаром
function pop(mob, anchor) {
  if (!S.open) return '';
  const geo = mob
    ? 'top:62px; right:8px; width:min(340px, calc(100% - 16px)); max-height:calc(100% - 130px);'
    : anchor === 'meta' ? 'top:calc(100% + 6px); left:82px; width:380px; max-height:540px;'
    : 'top:calc(100% + 6px); right:120px; width:380px; max-height:540px;';
  return `<div class="pop" role="dialog" aria-label="Фича этого чата" style="${geo}">${body(mob, false)}</div>`;
}

// ===== Вариант-зависимые куски шапки =====
const ctxPill = mob => `<div class="shell"><button class="pill" title="Контекст и лимиты"><span class="ring">${ring([{pct:38,color:'var(--c-text-muted)'},{pct:22,color:'var(--c-text-muted)'},{pct:61,color:'var(--c-warning)'}])}</span>38%</button></div>`;

// А: пилюля фичи — тот же BadgeShell ring, одно внешнее кольцо = процент по трекеру
function featPill(mob) {
  const st = ST[S.st];
  const cls = st.tone === 'warn' ? 'warn' : st.tone === 'stop' ? 'danger' : '';
  // На мобиле у пилюли только кольцо и процент: тревогу несут тон и пульс-точка, слово — в поповере
  const sub = mob ? '' : `<span class="sub">${st.pill}</span>`;
  return `<div class="shell" data-feature-chip>
    <button class="pill ${cls}" aria-expanded="${S.open}" data-toggle title="Фича «${F.title}» · ${F.pct} % по трекеру">
      <span class="ring">${ring([{pct:F.pct,color:st.color}])}</span>${F.pct}%${sub}</button>
    ${st.tone ? `<span class="pulse" style="background:${st.color}"></span>` : ''}
  </div>`;
}

// Б: плашка в мета-строке (ui/Badge с onClick) + действие тревоги рядом
function metaBadge(mob) {
  const st = ST[S.st];
  const tone = st.tone === 'warn' ? 'warning' : st.tone === 'stop' ? 'danger' : 'neutral';
  const text = st.tone
    ? (mob ? st.pill[0].toUpperCase() + st.pill.slice(1) : st.short)
    : (mob ? `<b>${F.pct} %</b> · Полина +2` : `<b>${F.pct} %</b> · Сейчас <b>Полина</b> +2`);
  return `<button class="bdg ${tone} ${mob ? 'sm' : ''}" data-toggle data-feature-chip aria-expanded="${S.open}" aria-haspopup="dialog" title="Фича «${F.title}»" style="${mob ? 'min-height:24px' : ''}">
      ${ring([{pct:F.pct,color:st.color}], 12)}<span class="tx">${text}</span>${ic(S.open ? 'chevU' : 'chevD', 12)}</button>
    ${st.act && !mob ? `<button class="btn" data-act>${st.act}</button>` : ''}
    ${!st.tone && !mob ? `<span class="eff">≈ 18:30</span>` : ''}`;
}
function edge() {
  const st = ST[S.st];
  if (st.tone) return `<div class="edge"><i style="flex:${F.pct};background:${st.color}"></i><i style="flex:${100 - F.pct};background:var(--c-border-light)"></i></div>`;
  return `<div class="edge">${F.buckets.map(([k, n]) => `<i class="k-${k}" style="flex:${n}"></i>`).join('')}</div>`;
}

// В: вторая строка шапки (слот contextBar)
function row2(mob) {
  const st = ST[S.st];
  const ph = st.tone
    ? `<span class="ph ${st.tone === 'warn' ? 't-warn' : 't-stop'}">${mob ? st.pill[0].toUpperCase() + st.pill.slice(1) + (S.st === 'wait' ? ' · Полина' : ' · Тимур') : st.short}</span>`
    : `<span class="ph">Сейчас <b>Полина</b> — Ш8 · вёрстка шапки +2</span>`;
  const right = st.tone
    ? `<button class="btn sm ${mob ? 'tap' : ''}" data-act style="margin-left:auto">${mob && S.st === 'stop' ? 'Чат' : st.act}</button>`
    : `<span class="bdg neutral" style="margin-left:auto;flex-shrink:0"><span class="tx">${mob ? '≈ 18:30' : '≈ 2 ч 40 · к 18:30'}</span></span>`;
  return `<div class="row2" data-feature-chip>
      ${ring([{pct:F.pct,color:st.color}], 16)}<span class="pct">${F.pct} %</span>
      ${mob ? '' : `<span class="ft" title="${F.title}">${F.title}</span><span class="eff">·</span>`}
      ${ph}${right}
      ${mob || S.open ? '' : `<button class="lnk" data-page>Страница фичи ${ic('arrow', 12)}</button>`}
      <button class="chev" data-toggle aria-expanded="${S.open}" aria-label="${S.open ? 'Свернуть' : 'Подробнее о фиче'}">${ic(S.open ? 'chevU' : 'chevD', 16)}</button>
    </div>
    ${S.open ? `<div class="exp2">${mob ? body(true, false, true).replace(/<div class="pt">.*?<\/div>/, '') : body(false, true, true)}</div>` : ''}`;
}

// ===== Десктоп: шапка-остров =====
function desk() {
  const v = S.v;
  const meta = `<div class="meta">
      <span class="cn">Ш8 · вёрстка шапки</span>
      <span class="origin">${ic('task', 11)}из задачи</span>
      ${v === 'B' ? metaBadge(false) : ''}
      ${v !== 'B' ? '<span class="eff">высокое усилие</span>' : ''}
    </div>`;
  const hero = `<div class="hero" style="${v === 'B' ? 'border-bottom-color:transparent' : ''}">
    <div class="hero-row">
      <button class="ib" title="Открыть панель">${ic('menu')}</button>
      <div class="tblock"><div class="face">П</div>
        <div style="min-width:0;flex:1"><div class="ttl28">Полина</div>${meta}</div></div>
      <div class="rc">
        ${v === 'A' ? featPill(false) : ''}
        ${ctxPill(false)}
        <div class="ghost"><button class="ib">${ic('pencil')}</button><button class="ib">${ic('list')}</button><button class="ib">${ic('hour')}</button><button class="ib">${ic('bell')}</button></div>
        <button class="ib" title="Ещё">${ic('more')}</button>
      </div>
    </div>
    ${v === 'C' ? row2(false) : ''}
    ${v === 'B' ? edge() : ''}
    ${v === 'A' ? pop(false, 'pill') : v === 'B' ? pop(false, 'meta') : ''}
  </div>`;
  return hero + feed(false) + `<div class="dock"><div class="field">Сообщение Полине…</div></div>`;
}

// ===== Мобила: Toolbar 56 =====
function mob() {
  const v = S.v;
  const tb = `<div class="tbar">
    <div class="mtitle">
      <button class="ib back" title="Назад к списку">${ic('chevL', 20)}</button>
      <div style="min-width:0;flex:1">
        <div class="sw"><span class="ttl16">Полина</span><span style="color:var(--c-text-muted)">${ic('chevD', 14)}</span></div>
        <div class="meta"><span class="origin io">${ic('task', 11)}</span>${v === 'B' ? metaBadge(true) : ''}</div>
      </div>
    </div>
    <div class="mrc">
      ${v === 'A' ? featPill(true) : ''}
      <span style="width:${v === 'A' ? 6 : 0}px"></span>${ctxPill(true)}
      <button class="ib" title="Ещё">${ic('more', 18)}</button>
    </div>
    ${v === 'B' ? edge() : ''}
  </div>`;
  return tb + (v === 'C' ? row2(true) : '') + (v !== 'C' ? pop(true) : '') + feed(true) + `<div class="dock"><div class="field">Сообщение…</div></div>`;
}

function feed(m) {
  return `<div class="feed">
    <div class="msg">Сверстала шапку: кольцо фичи стоит рядом с пилюлей контекста, поповер — тот же, что у неё.</div>
    <div class="msg me">А на 360 не тесно?</div>
    <div class="msg">${m ? 'На 360 у пилюли остаются кольцо и процент.' : 'На 360 у пилюли остаются кольцо и процент, срок уходит в поповер.'}</div>
  </div>`;
}

const NOTES = {
  A:'<b>А · Пилюля фичи.</b> Ещё одна пилюля BadgeShell рядом с кольцевой: одно кольцо — процент по трекеру, справа срок. Тревога — тон warn/danger пилюли и пульс-точка, как у workflow. Раскрытие — поповер BadgeShell (на мобиле fixed под тулбаром). Высота шапки +0.',
  B:'<b>Б · Плашка в мета-строке + кромка.</b> Фича встаёт в мета-строку рядом с «из задачи» кликабельным Badge: процент и кто сейчас (название — в заголовке поповера). Нижняя линия шапки становится полосой прогресса по трекеру (5 корзин). Тревога — тон плашки и кнопка рядом. Высота шапки +0 (кромка 2 px на месте линии).',
  C:'<b>В · Вторая строка шапки.</b> Строка в слоте contextBar под заголовком, внутри того же острова: кольцо, процент, название, «Сейчас», срок, «Страница фичи». Раскрытие идёт вниз внутри острова, на десктопе в две колонки. Высота шапки +42 (на мобиле +40).',
};

function render() {
  document.documentElement.dataset.theme = S.theme;
  document.getElementById('desk').innerHTML = desk();
  document.getElementById('mob').innerHTML = mob();
  document.getElementById('note').innerHTML = NOTES[S.v] + ' Точек этапов и списка этапов в чате нет: они живут на странице фичи («Хронология»).';
  document.querySelectorAll('[data-ctl]').forEach(g => {
    const cur = g.dataset.ctl === 'open' ? String(+S.open) : S[g.dataset.ctl];
    g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === cur));
  });
}
document.querySelector('[data-mk]').addEventListener('click', e => {
  const b = e.target.closest('button[data-val]'); if (!b) return;
  const k = b.parentElement.dataset.ctl;
  if (k === 'open') S.open = b.dataset.val === '1'; else S[k] = b.dataset.val;
  render();
});
document.querySelector('.stage').addEventListener('click', e => {
  if (e.target.closest('[data-toggle]')) { S.open = !S.open; render(); return; }
  if (e.target.closest('[data-disc]')) { S.disc = !S.disc; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) { S.open = false; render(); } });
render();
</script>
</body>
</html>
