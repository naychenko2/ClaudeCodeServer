[Service]
# Решение Андрея 2026-09-19 по итогам эксперимента: размышления с бюджетом 512 + фраза перехода
# (--reasoning-config в .env стенда vLLM).
Environment=THINKING_MODE=budget THINKING_BUDGET=512
# Прунинг старых выводов и тел Write/Edit; PRUNE_THINKING — ещё и старых размышлений.
# Оба проверены живьём 2026-09-22 (CLI шлёт thinking обратно, vLLM принимает блок без подписи).
Environment=PRUNE_TOOL_RESULTS=on PRUNE_THINKING=on
