<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Погода</title>
<!--
  Панель «Погода» (шаг B1): главный экран — «сейчас» и 7 дней для Ярославля.
  Хост инжектит кит (классы .cc-*) и токены текущей темы --cc-*; своей палитры
  у панели нет — только var(--cc-*) и color-mix от них.
  Данные: Open-Meteo через мост ccsPlugin.call('net.fetch', …) — состав запроса
  и разбор current/daily по §1 плана. Строки времени из ответа не превращаются
  в Date в поясе браузера: даты разбираются руками, день недели — через Date.UTC.
  Время в подвале берётся из тех же данных, что и «Сейчас» (current.time), —
  иначе «сейчас» и «обновлено» расходятся (правка приёмки 22.10).
  Иллюстрации героя (шаг B2): шесть сцен по таблице WMO и ночной вариант по
  is_day. Фон сцены — CSS-градиенты от --cc-* через color-mix(), слой
  осадков/тумана и крупный инлайновый глиф; тема перекрашивается сообщением
  хоста без перезагрузки.
  Выбор города (шаг C1): поиск через геокодер с дебаунсом 400 мс (правила §1),
  одна пакетная загрузка температур для найденных, выбор — главный экран с новым
  городом. Без права на геокодер — notice в режиме выбора, главный экран работает.
  Запоминание города — через операцию хоста storage (решение 22.10): без права
  storage панель работает полностью, просто не запоминает (denied/unavailable —
  молча). Подсказка «Город запоминается в этом браузере» показывается только при
  выданном праве storage (правка приёмки 22.10). Операций storage в хосте ещё
  нет (F2): без них правило не проверяется вживую, слой данных панели к нему готов.
-->
<style>
  .wx { display: flex; flex-direction: column; gap: 12px; }
  .wx-top { display: flex; align-items: center; gap: 8px; }
  .wx-city { flex: 1; min-width: 0; justify-content: flex-start; border-color: transparent; padding-left: 8px; }
  .wx-city .nm { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wx-city .chev { color: var(--cc-fg-muted); }
  .ico { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .err-ico { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; width: 40px; height: 40px; color: var(--cc-fg-muted); margin-bottom: 8px; }
  .wx-icobtn { width: 40px; padding: 0; color: var(--cc-fg-muted); }

  /* Герой: подложка-иллюстрация по сцене (B2) — градиенты от токенов темы,
     слой осадков/тумана (::before) и крупный глиф (.art); звёзды — только ночью */
  .hero { position: relative; overflow: hidden; border-radius: 14px; padding: 16px; min-height: 188px;
    border: 1px solid color-mix(in srgb, var(--cc-border) 70%, transparent); isolation: isolate; }
  .hero::before { content: ''; position: absolute; inset: 0; z-index: -1; }
  .hero .art { position: absolute; right: -10px; top: -6px; width: 132px; height: 132px; z-index: -1; }
  .hero .stars { position: absolute; inset: 0; z-index: -1; }
  .hero .when { font-size: 12px; color: var(--cc-fg-muted); }
  .hero .temp { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; margin-top: 8px; }
  .hero .cond { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .hero .hl { font-size: 12px; color: var(--cc-fg-muted); margin-top: 2px; }
  /* Подписи героя не заходят под иллюстрацию (.art, 132 px с выступом −10):
     текстовый блок ограничен, длинные метки WMO переносятся (правка приёмки 22.10) */
  .hero .when, .hero .temp, .hero .cond, .hero .hl { max-width: calc(100% - 134px); }
  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  .metric { border-radius: 10px; padding: 8px; background: color-mix(in srgb, var(--cc-surface) 72%, transparent); }
  .metric .k { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--cc-fg-muted); white-space: nowrap; }
  .metric .k .ico { width: 12px; height: 12px; }
  .metric .v { font-size: 14px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .metric .v small { font-size: 11px; font-weight: 400; color: var(--cc-fg-muted); }

  /* Фоны сцен (макет, строки 180–199): только var(--cc-*) и color-mix от них.
     Ночной вариант — класс .night: ясно/облачно/туман/снег уходят в холодную
     ночь, дождь и гроза — в более тёмную. */
  .sc-clear { background: radial-gradient(120% 90% at 92% 0%, color-mix(in srgb, var(--cc-warning) 34%, transparent), transparent 60%),
    linear-gradient(170deg, color-mix(in srgb, var(--cc-warning) 16%, var(--cc-surface)), color-mix(in srgb, var(--cc-accent) 6%, var(--cc-surface))); }
  .sc-clouds { background: linear-gradient(170deg, color-mix(in srgb, var(--cc-fg-muted) 22%, var(--cc-surface)), color-mix(in srgb, var(--cc-fg-muted) 6%, var(--cc-surface))); }
  .sc-rain { background: linear-gradient(170deg, color-mix(in srgb, var(--cc-info) 24%, var(--cc-surface)), color-mix(in srgb, var(--cc-fg-muted) 10%, var(--cc-surface))); }
  .sc-storm { background: linear-gradient(170deg, color-mix(in srgb, color-mix(in srgb, var(--cc-info) 60%, var(--cc-fg-muted)) 34%, var(--cc-surface)), color-mix(in srgb, var(--cc-info) 12%, var(--cc-surface))); }
  .sc-snow { background: linear-gradient(170deg, color-mix(in srgb, var(--cc-info) 12%, var(--cc-surface)), var(--cc-surface)); }
  .sc-fog { background: linear-gradient(180deg, color-mix(in srgb, var(--cc-fg-muted) 16%, var(--cc-surface)), color-mix(in srgb, var(--cc-fg-muted) 26%, var(--cc-surface))); }
  .night.sc-clear, .night.sc-clouds, .night.sc-fog, .night.sc-snow { background: linear-gradient(170deg,
    color-mix(in srgb, color-mix(in srgb, var(--cc-info) 45%, var(--cc-bg-inset)) 40%, var(--cc-surface)),
    color-mix(in srgb, var(--cc-info) 8%, var(--cc-surface))); }
  .night.sc-rain, .night.sc-storm { background: linear-gradient(170deg,
    color-mix(in srgb, color-mix(in srgb, var(--cc-info) 55%, var(--cc-bg-inset)) 46%, var(--cc-surface)),
    color-mix(in srgb, var(--cc-info) 12%, var(--cc-surface))); }
  .sc-rain::before, .sc-storm::before { background: repeating-linear-gradient(105deg, transparent 0 14px,
    color-mix(in srgb, var(--cc-info) 16%, transparent) 14px 15px); opacity: .9; }
  .sc-snow::before { background-image: radial-gradient(circle, color-mix(in srgb, var(--cc-info) 30%, transparent) 1.4px, transparent 1.8px),
    radial-gradient(circle, color-mix(in srgb, var(--cc-info) 22%, transparent) 1px, transparent 1.4px);
    background-size: 26px 26px, 17px 17px; background-position: 0 0, 9px 7px; }
  .sc-fog::before { background: repeating-linear-gradient(180deg, transparent 0 18px,
    color-mix(in srgb, var(--cc-surface) 55%, transparent) 18px 30px); }

  /* Неделя */
  .sec { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
  .sec h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--cc-fg-muted); }
  .sec span { font-size: 11px; color: var(--cc-fg-muted); }
  .week { list-style: none; margin: 0; padding: 4px 0; }
  .day { display: grid; grid-template-columns: 66px 24px 40px 30px minmax(32px, 1fr) 30px; align-items: center;
    gap: 8px; min-height: 40px; padding: 0 12px; font-size: 13px; }
  .day + .day { border-top: 1px solid color-mix(in srgb, var(--cc-border) 60%, transparent); }
  .day .dn { font-weight: 600; white-space: nowrap; }
  .day .dn small { display: block; font-size: 11px; font-weight: 400; color: var(--cc-fg-muted); }
  .day .ic { width: 24px; height: 24px; }
  .day .pr { font-size: 11px; color: var(--cc-fg-muted); display: flex; align-items: center; gap: 2px; }
  .day .pr.wet { color: var(--cc-fg); }
  .day .pr svg { width: 10px; height: 10px; }
  .drop { fill: var(--cc-info); }
  .day .lo { text-align: right; color: var(--cc-fg-muted); }
  .day .hi { font-weight: 600; }
  .range { position: relative; height: 6px; border-radius: 999px; background: var(--cc-bg-inset); }
  .range i { position: absolute; top: 0; bottom: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--cc-info), color-mix(in srgb, var(--cc-info) 40%, var(--cc-warning)) 55%, var(--cc-warning)); }
  .foot { font-size: 11px; color: var(--cc-fg-muted); text-align: center; padding: 4px 0 0; }

  /* Выбор города (C1): поиск, строки результатов, подсказка — по макету */
  .wx-back { border-color: transparent; padding-left: 4px; }
  .wx-title { font-size: 16px; font-weight: 600; }
  .search-wrap { position: relative; }
  .search-wrap .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--cc-fg-muted); pointer-events: none; }
  .search-wrap .cc-input { padding-left: 36px; }
  .city .nm { font-weight: 600; }
  .city .rg { color: var(--cc-fg-muted); font-size: 12px; }
  .city .cn { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .city .t { font-size: 12px; color: var(--cc-fg-muted); }
  .city mark { background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--cc-accent); text-underline-offset: 3px; }
  .hint { font-size: 12px; color: var(--cc-fg-muted); padding: 0 4px; }
  .notice-row { display: flex; gap: 8px; align-items: flex-start; }
  .notice-row .ico { margin-top: 2px; }
  .notice-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  /* Иконки погоды: заливки и штрихи — от токенов темы */
  .f-sun { fill: var(--cc-warning); }
  .s-sun { stroke: var(--cc-warning); stroke-width: 1.8; stroke-linecap: round; fill: none; }
  .f-moon { fill: color-mix(in srgb, var(--cc-warning) 60%, var(--cc-surface)); stroke: color-mix(in srgb, var(--cc-warning) 80%, var(--cc-fg-muted)); stroke-width: 1; }
  .f-cloud { fill: color-mix(in srgb, var(--cc-fg-muted) 22%, var(--cc-surface)); stroke: var(--cc-fg-muted); stroke-width: 1.3; stroke-linejoin: round; }
  .f-cloud-d { fill: color-mix(in srgb, var(--cc-fg-muted) 52%, var(--cc-surface)); stroke: var(--cc-fg-muted); stroke-width: 1.3; stroke-linejoin: round; }
  .s-rain { stroke: var(--cc-info); stroke-width: 1.8; stroke-linecap: round; fill: none; }
  .f-bolt { fill: var(--cc-warning); stroke: color-mix(in srgb, var(--cc-warning) 70%, var(--cc-fg)); stroke-width: .8; stroke-linejoin: round; }
  .s-snow { stroke: var(--cc-info); stroke-width: 1.5; stroke-linecap: round; fill: none; }
  .s-fog { stroke: var(--cc-fg-muted); stroke-width: 1.8; stroke-linecap: round; fill: none; }
  .f-star { fill: color-mix(in srgb, var(--cc-warning) 50%, var(--cc-fg-muted)); }

  /* Узкая колонка (мобила 320): подписи без иконок, строки плотнее */
  @media (max-width: 330px) {
    .metrics { gap: 4px; }
    .metric { padding: 8px 6px; }
    .metric .k .ico { display: none; }
    .day { gap: 6px; padding: 0 4px; }
  }
</style>
</head>
<body>
  <div class="wx" id="wx"></div>

  <script>
  (function () {
    'use strict';

    // ---------- Слой данных (§1 плана) ----------
    var FORECAST_HOST = 'api.open-meteo.com';
    var GEO_HOST = 'geocoding-api.open-meteo.com';
    // Текущий город: Ярославль по умолчанию; если хост хранит выбор (storage) —
    // стартуем с него (C1, решение 22.10).
    var city = { name: 'Ярославль', lat: 57.62987, lon: 39.87368 };

    function forecastUrl(lat, lon) {
      return 'https://' + FORECAST_HOST + '/v1/forecast' +
        '?latitude=' + lat + '&longitude=' + lon +
        '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
        '&wind_speed_unit=ms&timezone=auto&forecast_days=7';
    }

    // Таблица WMO: код → подпись состояния (§1). Сцены: 0–1 ясно · 2–3 облачно ·
    // 45,48 туман · 51–67,80–82 дождь · 71–77,85–86 снег · 95–99 гроза.
    var WMO_LABEL = {
      0: 'Ясно', 1: 'Преимущественно ясно', 2: 'Частично облачно', 3: 'Пасмурно',
      45: 'Туман', 48: 'Изморось',
      51: 'Небольшой дождь', 53: 'Умеренный дождь', 55: 'Сильный дождь',
      56: 'Ледяной дождь', 57: 'Ледяной дождь',
      61: 'Небольшой дождь', 63: 'Умеренный дождь', 65: 'Сильный дождь',
      66: 'Ледяной дождь', 67: 'Ледяной дождь',
      71: 'Небольшой снег', 73: 'Умеренный снег', 75: 'Сильный снег', 77: 'Снег',
      80: 'Ливень', 81: 'Ливень', 82: 'Сильный ливень',
      85: 'Снежный ливень', 86: 'Сильный снежный ливень',
      95: 'Гроза', 96: 'Гроза с градом', 99: 'Гроза с градом',
    };
    function sceneOf(code) {
      if (code <= 1) return 'clear';
      if (code <= 3) return 'clouds';
      if (code === 45 || code === 48) return 'fog';
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
      if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
      if (code >= 95 && code <= 99) return 'storm';
      return 'clouds';
    }

    // ---------- Иконки: объект I и глифы погоды — из макета (строки 309–349) ----------
    var I = {
      pin: '<path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
      chev: '<path d="m7 10 5 5 5-5"/>',
      refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
      wind: '<path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/>',
      hum: '<path d="M12 3c-3 4-6 7.2-6 10.5a6 6 0 0 0 12 0C18 10.2 15 7 12 3z"/>',
      cloudoff: '<path d="M3 3l18 18"/><path d="M8.4 8.4A5.5 5.5 0 0 0 6.5 19h11"/><path d="M20.6 16.6A4 4 0 0 0 18.1 11 5.5 5.5 0 0 0 11.4 6.6"/>',
      wifioff: '<path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.4-1.6"/><path d="M2 9.3a15 15 0 0 1 4.3-2.6"/><path d="M22 9.3A15 15 0 0 0 11 5.1"/><circle cx="12" cy="20" r=".6"/>',
      shield: '<path d="M12 3 5 6v5c0 4.4 3 8.3 7 10 4-1.7 7-5.6 7-10V6z"/><path d="M12 8v5M12 16.5v.01"/>',
      therm: '<path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
      back: '<path d="m15 18-6-6 6-6"/>',
      search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
    };
    function ico(k, cls) {
      return '<svg class="' + (cls || 'ico') + '" viewBox="0 0 24 24" aria-hidden="true">' + I[k] + '</svg>';
    }

    var CLOUD = 'M6.5 19h11a4 4 0 0 0 .6-7.95 5.5 5.5 0 0 0-10.6-1.3A4.6 4.6 0 0 0 6.5 19z';
    function rays(cx, cy, r1, r2) {
      var out = '';
      for (var i = 0; i < 8; i++) {
        var a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
        out += '<line x1="' + (cx + c * r1).toFixed(2) + '" y1="' + (cy + s * r1).toFixed(2) + '" x2="' + (cx + c * r2).toFixed(2) + '" y2="' + (cy + s * r2).toFixed(2) + '"/>';
      }
      return out;
    }
    function SUN(cx, cy, r) {
      return '<circle class="f-sun" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/><g class="s-sun">' + rays(cx, cy, r + 2.2, r + 4.4) + '</g>';
    }
    function MOON(tx, ty, k) {
      return '<path class="f-moon" transform="translate(' + tx + ' ' + ty + ') scale(' + k + ')" d="M15.6 3.6a8 8 0 1 0 4.8 13.9A7 7 0 0 1 15.6 3.6z"/>';
    }
    function glyph(sc, night) {
      var lift = '<g transform="translate(0 -3)">';
      var behind = night ? MOON(9, -1, .55) : SUN(16.5, 7, 3.1);
      switch (sc) {
        case 'clear': return night ? MOON(0, 0, 1) : SUN(12, 12, 4.2);
        case 'clouds': return behind + '<path class="f-cloud" d="' + CLOUD + '"/>';
        case 'rain': return lift + '<path class="f-cloud" d="' + CLOUD + '"/></g><g class="s-rain"><line x1="8.5" y1="18.5" x2="7.5" y2="21.5"/><line x1="12.5" y1="18.5" x2="11.5" y2="21.5"/><line x1="16.5" y1="18.5" x2="15.5" y2="21.5"/></g>';
        case 'storm': return lift + '<path class="f-cloud-d" d="' + CLOUD + '"/></g><path class="f-bolt" d="M12.8 14.5 9.6 19.2h2.6l-1.1 4 3.9-5.4h-2.7l1.4-3.3z"/>';
        case 'snow': return lift + '<path class="f-cloud" d="' + CLOUD + '"/></g><g class="s-snow"><path d="M8 19.2v2.6M6.7 20.5h2.6"/><path d="M12 20v2.6M10.7 21.3h2.6"/><path d="M16 19.2v2.6M14.7 20.5h2.6"/></g>';
        default: return '<g class="s-fog"><line x1="4" y1="9" x2="20" y2="9"/><line x1="6" y1="13" x2="18" y2="13"/><line x1="4" y1="17" x2="17" y2="17"/></g>';
      }
    }
    function wxIcon(sc, night, cls) {
      return '<svg class="' + (cls || 'ic') + '" viewBox="0 0 24 24" aria-hidden="true">' + glyph(sc, night) + '</svg>';
    }
    var DROP = '<svg viewBox="0 0 10 10" aria-hidden="true"><path class="drop" d="M5 .8C3.6 3 2.2 4.6 2.2 6.3a2.8 2.8 0 0 0 5.6 0C7.8 4.6 6.4 3 5 .8z"/></svg>';

    // Звёзды для ночного героя — фиксированные точки, как в макете (строки 360–364).
    function stars() {
      var pts = [[18, 22], [44, 14], [70, 30], [120, 12], [150, 34], [200, 18], [236, 40], [96, 48], [176, 58]];
      var out = '';
      for (var i = 0; i < pts.length; i++) {
        out += '<circle class="f-star" cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="' + (i % 3 ? 1 : 1.5) + '"/>';
      }
      return '<svg class="stars" viewBox="0 0 280 190" preserveAspectRatio="xMinYMin slice" aria-hidden="true">' + out + '</svg>';
    }

    // ---------- Форматирование ----------
    var MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    var WEEKDAYS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    var COMPASS = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];

    // Температура: округление, типографский минус «−», «+» у положительных.
    function fmt(n) {
      n = Math.round(n);
      return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n) + '°';
    }
    // Дата из ответа («2026-10-22») разбирается руками; день недели — по UTC-дате
    // города, никогда через Date в поясе браузера (§1).
    function weekDay(iso) {
      var p = iso.split('-');
      return WEEKDAYS[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()];
    }
    function dateShort(iso) {
      var p = iso.split('-');
      return (+p[2]) + ' ' + MONTHS[+p[1] - 1];
    }
    function compass(deg) { return COMPASS[Math.round(deg / 45) % 8]; }
    // Имена городов приходят из ответа геокодера — в разметку их кладем экранированными.
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ---------- Разметка главного экрана (состав и порядок — по макету) ----------
    var root = document.getElementById('wx');

    function topBar() {
      return '<div class="wx-top">' +
        '<button class="cc-btn cc-btn--ghost wx-city" type="button" id="citybtn" aria-label="Сменить город: ' + esc(city.name) + '">' +
          ico('pin') + '<span class="nm">' + esc(city.name) + '</span>' + ico('chev', 'ico chev') +
        '</button>' +
        '<button class="cc-btn cc-btn--ghost cc-btn--sm wx-icobtn" type="button" aria-label="Обновить" title="Обновить" id="refresh">' + ico('refresh') + '</button>' +
      '</div>';
    }

    // Скелетон той же геометрии, что готовый экран.
    function skeleton() {
      var row = '<li class="day"><span class="cc-skeleton" style="width:48px"></span><span class="cc-skeleton" style="width:24px;height:24px;border-radius:50%"></span><span></span><span class="cc-skeleton"></span><span class="cc-skeleton" style="height:6px"></span><span class="cc-skeleton"></span></li>';
      return topBar() +
        '<div class="cc-skeleton" style="height:188px;border-radius:14px"></div>' +
        '<div class="sec"><span class="cc-skeleton" style="width:120px"></span></div>' +
        '<ul class="week">' + row + row + row + row + row + row + row + '</ul>';
    }

    // Состояния ошибок (C2): карточка, как в макете (.cc-card > .cc-empty).
    // Право на прогноз — ключ net:{хост}, собранный из своего URL: в тексте
    // отказа хост приходит без префикса (§1, п. 2).
    var offlineShown = false;
    function renderProblem(kind) {
      root.setAttribute('aria-busy', 'false');
      offlineShown = kind === 'offline';
      var icon, title, text, extra;
      if (kind === 'denied') {
        icon = 'shield'; title = 'Нужен доступ к сервису погоды';
        text = 'Панели не выдано право ходить на\u00a0' + FORECAST_HOST + '. Выдайте его в плашке выше или в настройках плагина.';
        extra = '<span class="cc-badge cc-badge--warning" style="margin-top:12px">net:' + FORECAST_HOST + '</span>';
      } else if (kind === 'offline') {
        icon = 'wifioff'; title = 'Нет подключения к интернету';
        text = 'Погода обновится, как только связь вернётся.';
        extra = '<button class="cc-btn cc-btn--ghost" type="button" id="retry">Повторить</button>';
      } else {
        icon = 'cloudoff'; title = 'Сервис погоды не ответил';
        text = 'Open-Meteo вернул ошибку. Обычно это проходит за минуту.';
        extra = '<button class="cc-btn cc-btn--primary" type="button" id="retry">Повторить</button>';
      }
      root.innerHTML = topBar() +
        '<div class="cc-card"><div class="cc-empty">' + ico(icon, 'err-ico') +
        '<div class="cc-empty__title">' + title + '</div>' +
        '<div class="cc-empty__text">' + text + '</div>' + extra + '</div></div>';
    }
    function renderError() { renderProblem('upstream'); }

    // ---------- Выбор города (C1) ----------
    var query = '', found = [], geoDenied = false, searchTimer = 0;

    // Подпись строки результата: «Ярославская Область» → «Ярославская обл.» (§1, грабли).
    function regionText(r) {
      var parts = [];
      if (r.admin1) parts.push(String(r.admin1).replace(/\s+[Оо]бласть$/, ' обл.'));
      if (r.country) parts.push(r.country);
      return parts.join(', ');
    }
    // Подсветка совпавшего начала запроса, как в макете.
    function hl(nm) {
      var q = query.toLowerCase();
      if (q && nm.toLowerCase().startsWith(q)) {
        return '<mark>' + esc(nm.slice(0, q.length)) + '</mark>' + esc(nm.slice(q.length));
      }
      return esc(nm);
    }

    function openSearch() {
      root.setAttribute('aria-busy', 'false');
      // Подсказка про запоминание — только когда право storage действительно выдано
      // (правка приёмки 22.10): без него панель ничего не запоминает.
      var hint = hasStorageRight() ? '<div class="hint">Город запоминается в этом браузере.</div>' : '';
      // Поле поиска не пересоздаётся при каждом результате: обновляется только #geo.
      root.innerHTML =
        '<div class="wx-top">' +
          '<button class="cc-btn cc-btn--ghost cc-btn--sm wx-back" type="button" id="back">' + ico('back') + 'Назад</button>' +
          '<span class="wx-title">Выбор города</span>' +
        '</div>' +
        '<div class="search-wrap">' + ico('search') +
          '<input class="cc-input" id="q" value="' + esc(query) + '" placeholder="Город, например Ярославль" aria-label="Поиск города">' +
        '</div>' +
        '<div id="geo"></div>' + hint;
      var input = root.querySelector('#q');
      input.focus(); // фокус сразу в поле — не надо тапать второй раз (правка приёмки 22.10)
      input.addEventListener('input', function () {
        query = input.value;
        if (searchTimer) clearTimeout(searchTimer);
        if (query.length < 2) { found = []; renderGeo(); return; } // поиск с 2 символов (§1)
        searchTimer = setTimeout(function () { searchCity(query); }, 400);
      });
      renderGeo();
    }

    function renderGeo() {
      var el = root.querySelector('#geo');
      if (!el) return;
      if (geoDenied) {
        // Человеческий текст, ключ права — отдельным бейджем, как в карточке
        // отказа по прогнозу (правка приёмки 22.10).
        el.innerHTML = '<div class="cc-notice cc-notice--info notice-row" role="status">' + ico('info') +
          '<div class="notice-col"><span>Поиск города недоступен — панели не выдано право на геокодер. Выдайте его в настройках плагина.</span>' +
          '<span class="cc-badge cc-badge--warning">net:' + GEO_HOST + '</span></div></div>';
        return;
      }
      if (!found.length) {
        el.innerHTML = query.length >= 2
          ? '<div class="cc-empty"><div class="cc-empty__title">Город не найден</div>' +
            '<div class="cc-empty__text">Проверьте написание или введите название по-английски — например, Yaroslavl.</div></div>'
          : '';
        return;
      }
      el.innerHTML = '<div class="sec"><h3>Найдено</h3><span>' + found.length + '</span></div>' +
        '<ul class="cc-list" role="listbox" aria-label="Найденные города">' +
        found.map(function (c, i) {
          var active = c.lat === city.lat && c.lon === city.lon;
          return '<li class="cc-list-item city' + (active ? ' is-active' : '') + '" role="option" tabindex="0" aria-selected="' + (active ? 'true' : 'false') + '" data-i="' + i + '">' +
            '<span class="cn"><span class="nm">' + hl(c.name) + '</span><span class="rg">' + esc(c.region) + '</span></span>' +
            (c.temp === null ? '' : '<span class="t">' + fmt(c.temp) + '</span>') +
            '</li>';
        }).join('') + '</ul>';
    }

    function searchCity(q) {
      // Правила §1: count=10, language=ru, кириллица только закодированная.
      ccsPlugin.call('net.fetch', {
        url: 'https://' + GEO_HOST + '/v1/search?name=' + encodeURIComponent(q) + '&count=10&language=ru&format=json',
      }).then(function (res) {
        if (!res || res.status !== 200) { found = []; renderGeo(); return; }
        var data;
        try { data = JSON.parse(res.body); } catch (e) { found = []; renderGeo(); return; }
        var list = (data && data.results) || []; // при пустом ответе ключа results нет вовсе (§1)
        list.sort(function (a, b) { return (b.population || 0) - (a.population || 0); }); // без населения — в конец
        found = list.slice(0, 6).map(function (r) {
          return { name: r.name, lat: r.latitude, lon: r.longitude, region: regionText(r), temp: null };
        });
        renderGeo();
        if (!found.length) return;
        // Одна пакетная загрузка температур для всех найденных (§1): координаты через запятую.
        ccsPlugin.call('net.fetch', {
          url: 'https://' + FORECAST_HOST + '/v1/forecast?latitude=' + found.map(function (c) { return c.lat; }).join(',') +
            '&longitude=' + found.map(function (c) { return c.lon; }).join(',') +
            '&current=temperature_2m,weather_code&timezone=auto',
        }).then(function (res) {
          if (!res || res.status !== 200) return;
          var arr;
          try { arr = JSON.parse(res.body); } catch (e) { return; }
          if (!Array.isArray(arr)) return;
          found.forEach(function (c, i) {
            var cur = arr[i] && arr[i].current;
            if (cur && typeof cur.temperature_2m === 'number') c.temp = cur.temperature_2m;
          });
          renderGeo();
        }).catch(function () { /* пакет не ответил — строки без температуры */ });
      }).catch(function (err) {
        if (err && err.code === 'denied') geoDenied = true; // нет права на геокодер (§2)
        found = [];
        renderGeo();
      });
    }

    function selectCity(c) {
      city = { name: c.name, lat: c.lat, lon: c.lon };
      rememberCity();
      load(); // главный экран с новым городом
    }

    // ---------- Запоминание города в хосте (C1, решение 22.10) ----------
    // Без права storage панель работает полностью, просто не запоминает:
    // denied/unavailable — молча, без ошибок и плашек.
    var CITY_KEY = 'city';
    // Право storage в списке выданных — как net:{host}; нужен панели, чтобы
    // честно обещать запоминание (правка приёмки 22.10).
    function hasStorageRight() {
      var st = ccsPlugin.state;
      return !!(st && Array.isArray(st.granted) &&
        st.granted.some(function (g) { return String(g).slice(0, 7) === 'storage'; }));
    }
    function readStoredCity() {
      return ccsPlugin.call('storage.get', { key: CITY_KEY }).then(function (res) {
        var v = res && (typeof res === 'string' ? res : res.value);
        // Контракт storage: значение — любой JSON, сериализует сам хост (C1-д).
        // Строку всё равно принимаем: старые записи панели лежат как строки.
        if (typeof v === 'string') {
          try { v = JSON.parse(v); } catch (e) { return; } /* мусор в значении — дефолт */
        }
        if (v && typeof v.lat === 'number' && typeof v.lon === 'number' && typeof v.name === 'string') {
          city = { name: v.name, lat: v.lat, lon: v.lon };
        }
      }).catch(function () { /* нет права или операции ещё нет (F2) — без запоминания */ });
    }
    function rememberCity() {
      // Объект, не строка: сериализацию делает хост (C1-д).
      ccsPlugin.call('storage.set', { key: CITY_KEY, value: city }).catch(function () {});
    }

    function renderMain(data) {
      var cur = data.current, daily = data.daily;
      var cond = WMO_LABEL[cur.weather_code] || 'Облачно';
      // Сцена героя — по коду WMO и is_day из данных (§1), не вручную.
      var sc = sceneOf(cur.weather_code);
      var night = cur.is_day === 0;

      var tmin = daily.temperature_2m_min || [], tmax = daily.temperature_2m_max || [];
      var wcodes = daily.weather_code || [], pmax = daily.precipitation_probability_max || [];
      var lo = tmin.length ? Math.min.apply(null, tmin) : 0;
      var hi = tmax.length ? Math.max.apply(null, tmax) : 0;
      var span = Math.max(1, hi - lo);

      var rows = '';
      for (var i = 0; i < daily.time.length; i++) {
        var pr = pmax[i] || 0;
        rows += '<li class="day">' +
          '<span class="dn">' + (i === 0 ? 'Сегодня' : weekDay(daily.time[i])) + '<small>' + dateShort(daily.time[i]) + '</small></span>' +
          wxIcon(sceneOf(wcodes[i]), false) +
          '<span class="pr' + (pr >= 50 ? ' wet' : '') + '" title="Вероятность осадков">' + (pr ? DROP + pr + '%' : '') + '</span>' +
          '<span class="lo">' + fmt(tmin[i] || 0) + '</span>' +
          '<span class="range" aria-hidden="true"><i style="left:' + (((tmin[i] || 0) - lo) / span * 100).toFixed(1) + '%;right:' + ((hi - (tmax[i] || 0)) / span * 100).toFixed(1) + '%"></i></span>' +
          '<span class="hi">' + fmt(tmax[i] || 0) + '</span>' +
        '</li>';
      }

      root.setAttribute('aria-busy', 'false');
      // состав и порядок кадра #state=main: шапка → герой → секция → неделя → подвал
      root.innerHTML =
        topBar() +
        '<section class="hero sc-' + sc + (night ? ' night' : '') + '" aria-label="Сейчас: ' + fmt(cur.temperature_2m) + ', ' + cond + '">' +
          (night ? stars() : '') +
          '<svg class="art" viewBox="0 0 24 24" aria-hidden="true">' + glyph(sc, night) + '</svg>' +
          '<div class="when">Сейчас · ' + cur.time.slice(11, 16) + '</div>' +
          '<div class="temp">' + fmt(cur.temperature_2m) + '</div>' +
          '<div class="cond">' + cond + '</div>' +
          '<div class="hl">Днём ' + fmt(tmax[0] || 0) + ', ночью ' + fmt(tmin[0] || 0) + '</div>' +
          '<div class="metrics">' +
            '<div class="metric"><div class="k">' + ico('therm') + 'Ощущается</div><div class="v">' + fmt(cur.apparent_temperature) + '</div></div>' +
            '<div class="metric"><div class="k">' + ico('wind') + 'Ветер</div><div class="v">' + Math.round(cur.wind_speed_10m) + ' <small>м/с, ' + compass(cur.wind_direction_10m) + '</small></div></div>' +
            '<div class="metric"><div class="k">' + ico('hum') + 'Влажность</div><div class="v">' + Math.round(cur.relative_humidity_2m) + ' <small>%</small></div></div>' +
          '</div>' +
        '</section>' +
        '<div class="sec"><h3>Прогноз на 7 дней</h3><span>макс / мин</span></div>' +
        '<ul class="week">' + rows + '</ul>' +
        // Время в подвале — из тех же данных, что и «Сейчас» в герое: две разные
        // минуты в одном экране сбивают (правка приёмки 22.10).
        '<div class="foot">Данные: Open-Meteo · данные на ' + cur.time.slice(11, 16) + '</div>';
    }

    function load() {
      if (navigator.onLine === false) { renderProblem('offline'); return; }
      offlineShown = false;
      root.setAttribute('aria-busy', 'true');
      root.innerHTML = skeleton();
      // net.fetch: ошибочный HTTP-статус внешнего хоста приходит как успех с
      // status (§1) — смотрим status, а не только catch. Отказ по правам —
      // отклонение с кодом denied, его не путаем с сетевым сбоем.
      ccsPlugin.call('net.fetch', { url: forecastUrl(city.lat, city.lon) }).then(function (res) {
        if (!res || res.status !== 200) { renderError(); return; }
        var data;
        try { data = JSON.parse(res.body); } catch (e) { renderError(); return; }
        if (!data || !data.current || !data.daily || !data.daily.time || !data.daily.time.length) {
          renderError();
          return;
        }
        try { renderMain(data); } catch (e) { renderError(); }
      }).catch(function (err) {
        if (err && err.code === 'denied') renderProblem('denied');
        else if (navigator.onLine === false) renderProblem('offline');
        else renderError();
      });
    }

    // Связь вернулась — панель повторяет запрос сама, без «Повторить».
    window.addEventListener('online', function () { if (offlineShown) load(); });

    // Один обработчик кликов на корне: кнопки пересоздаются вместе с разметкой,
    // поэтому следим через closest().
    root.addEventListener('click', function (e) {
      if (e.target.closest('#refresh') || e.target.closest('#retry')) { load(); return; }
      if (e.target.closest('#citybtn')) { openSearch(); return; }
      if (e.target.closest('#back')) { load(); return; }
      var li = e.target.closest('.city');
      if (li) selectCity(found[+li.getAttribute('data-i')]);
    });
    // Строки результатов доступны с клавиатуры (role=option, tabindex).
    root.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var li = e.target.closest('.city');
      if (li) selectCity(found[+li.getAttribute('data-i')]);
    });

    // init — первая информация о плагине; если он уже прошёл до подписки,
    // состояние доступно сразу (как в заглушке A1). Перед первым запросом
    // читаем запомненный город (C1); неудача чтения молча оставляет Ярославль.
    var started = false;
    function startOnce() {
      if (started) return;
      started = true;
      // Скелетон — сразу, не дожидаясь чтения запомненного города (мелочь
      // приёмки 22.10): при медленном хранилище панель не остаётся пустой.
      root.setAttribute('aria-busy', 'true');
      root.innerHTML = skeleton();
      readStoredCity().then(load);
    }
    ccsPlugin.on('init', startOnce);
    if (ccsPlugin.state && ccsPlugin.state.plugin) startOnce();
  })();
  </script>
</body>
</html>
