name: CI

on:
  push:
    # feat/test-speedup — временно, проверка матрицы шардов до PR; убрать перед мержем
    branches: [master, feat/test-speedup]
  pull_request:

jobs:
  # Backend разнесён на сборку и прогон (фича «Ускорение тестов», Э2): сборка идёт ОДИН раз,
  # её bin/obj едут артефактом в матрицу прогонов — три шарда монолита ClaudeHomeServer.Tests
  # по классам (scripts/test-shards.py, раскладка по профилю прошлого прогона) плюс шарды «Llm.Tests» и «rest»
  # (остальные тестовые проекты slnx). Состав не сокращается: объединение шардов скрипт
  # сверяет с `dotnet test --list-tests` и падает при расхождении.
  backend-build:
    name: Backend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Проекты на net10.0. Раньше тут стояло 9.0.x, и сборка проходила лишь потому,
          # что на образе раннера случайно оказался предустановленный SDK 10.x — при
          # обновлении образа это молча сломалось бы.
          dotnet-version: 10.0.x
          # Кэш NuGet общий со сборкой шардов: им нужен restore (см. backend-test)
          cache: true
          cache-dependency-path: backend/**/*.csproj
      # Предупреждения компилятора — ошибка сборки, но только здесь, а не в
      # Directory.Build.props: локально они не должны мешать отладке (временно
      # неиспользуемая переменная — норма в процессе работы, а не повод глушить
      # предупреждение прагмой). Гейт стоит там, где решается попадание в master.
      # Список кодов, выведенных из-под гейта (NuGet-предупреждения, зависящие от
      # сети и внешних advisory), — в свойстве WarningsNotAsErrors там же, в props.
      #
      # NoWarn: "NU1903" — точечное исключение из-под гейта:
      #
      # NU1903 (NuGet audit, high-severity): restore-таск NuGet (SDK 10.0.112) НЕ
      # применяет WarningsNotAsErrors к audit-предупреждениям, так что под -warnaserror
      # NU1903 становится ошибкой; единственный способ не превращать его в ошибку —
      # NoWarn. Держим env-переменной на ЭТОЙ команде, а не в общем props: (1) в
      # локальной dev-сборке (без -warnaserror) NU1903 остаётся видимым warning —
      # уязвимости светятся; (2) решение явно в workflow, а не спрятано в общем файле;
      # (3) глушим только high-severity — NU1901/NU1902/NU1904 в CI по-прежнему видны.
      #
      # Env, а не -p:NoWarn=: -p: задаёт ГЛОБАЛЬНОЕ свойство MSBuild, которое перебивает
      # per-project <NoWarn>$(NoWarn);…</NoWarn> в .csproj (и не умеет list-value:
      # ; = разделитель свойств). Env-переменная — обычное свойство, поэтому per-project
      # подавления (CA1822/CA1805/CS1591/CA2255) дописываются сами и дублировать их
      # в CI-флаге не нужно.
      - name: Build
        env:
          NoWarn: "NU1903"
        run: dotnet build backend/ClaudeHomeServer.slnx -warnaserror
      # Сторож кросс-сборки агента устройства (agent-distribution AD-1): выкатка собирает
      # win-x64 на Linux, и мост ConPTY обязан ехать в тот же каталог. Условие в csproj
      # по ОС сборки вместо целевого RID молча выкинуло бы мост — здесь это падение.
      - name: Publish DeviceAgent (win-x64)
        run: |
          dotnet publish backend/ClaudeHomeServer.DeviceAgent/ClaudeHomeServer.DeviceAgent.csproj \
            -c Release -r win-x64 --self-contained -warnaserror -o "$RUNNER_TEMP/agent-win-x64"
          for f in ai-home-agent.exe ConPtyBridge.exe ConPtyBridge.dll; do
            test -f "$RUNNER_TEMP/agent-win-x64/$f" || { echo "нет $f в publish агента win-x64" >&2; exit 1; }
          done
        shell: bash
      # Гейт кодировки: все .cs в backend/ должны быть валидным UTF-8. Ловит
      # побочные повреждения, когда файл пересохраняется в системной кодовой странице
      # (CP1251 на Windows, KOI8-R где-то ещё) и локально собирается из-за windows-фолбэка
      # Roslyn, а на ubuntu-latest — нет (CI гоняет Linux). Сторож: см. ревью 3c280eaa
      # (коммит 215aaebe обнулил/перекодировал три файла, прогон остался зелёным).
      # Дешёвая проверка через python3 — есть на ubuntu-latest из коробки.
      - name: Check UTF-8 (no CP1251)
        run: |
          python3 -c "
          import os, sys
          failed = []
          for root, _, files in os.walk('backend'):
              for f in files:
                  if not f.endswith('.cs'):
                      continue
                  p = os.path.join(root, f)
                  try:
                      open(p, 'r', encoding='utf-8').read()
                  except UnicodeDecodeError as e:
                      failed.append((p, str(e)))
          if failed:
              for p, e in failed:
                  print(f'FAIL: {p}: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'OK: {sum(1 for r,_,fs in os.walk(\"backend\") for f in fs if f.endswith(\".cs\"))} файлов .cs — валидный UTF-8')
          "
        shell: bash
      # Тесты скриптов профиля и шардов: линейка всей фичи не должна врать молча
      - name: Test scripts (profile, shards)
        run: |
          python3 -I scripts/test_test_profile.py
          python3 -I scripts/test_test_shards.py
      # Список тестов монолита снимается один раз — по нему каждый шард строит свой фильтр
      - name: List monolith tests
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: dotnet test backend/ClaudeHomeServer.Tests --no-build --list-tests > monolith-tests.txt
      # В артефакт — только bin (obj шард восстанавливает restore) и только нативные рантаймы
      # linux-x64: остальные платформы (SkiaSharp и пр. с pdb) раздували архив до 4,6 ГБ
      - name: Pack build output
        run: |
          find backend -type d -name bin -prune -print0 \
            | tar --null --exclude='backend/*/bin/Release' \
                --exclude='*/runtimes/win*' --exclude='*/runtimes/osx*' --exclude='*/runtimes/linux-musl*' \
                --exclude='*/runtimes/linux-arm*' --exclude='*/runtimes/browser*' --exclude='*/runtimes/maccatalyst*' \
                --exclude='*/runtimes/ios*' --exclude='*/runtimes/android*' --exclude='*/runtimes/freebsd*' \
                -cf - -T - monolith-tests.txt | zstd -T0 -3 -q -o "$RUNNER_TEMP/backend-build.tar.zst"
          ls -lh "$RUNNER_TEMP/backend-build.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: ${{ runner.temp }}/backend-build.tar.zst
          compression-level: 0
          retention-days: 1

  backend-test:
    name: Backend (test ${{ matrix.name }})
    needs: backend-build
    runs-on: ubuntu-latest
    # История: тесты на Linux-раннере зависали насмерть (прогоны умирали на дефолтном
    # 6-часовом таймауте). Потолок джобы — страховка от сгоревших часов; виновника
    # зависания ищет blame-режим прогона ниже.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "monolith 1/3", key: m1, shard: "1/3" }
          - { name: "monolith 2/3", key: m2, shard: "2/3" }
          - { name: "monolith 3/3", key: m3, shard: "3/3" }
          # Llm.Tests — отдельной строкой: параллель коллекций там выключена (inotify), и в общем
          # шарде он один был критическим путём
          - { name: "Llm.Tests", key: llm, shard: "llm" }
          - { name: "rest", key: rest, shard: "rest" }
    env:
      DOTNET_CLI_UI_LANGUAGE: en
      # Fast — исключение категорий, а не перечень меток (Э3). Единственная копия фильтра в CI;
      # в скриптах — FAST_FILTER в scripts/test-profile.py, в предгейте — Pregate:Checks.
      FAST: "Category!=Host&Category!=Slow&Category!=Integration&Category!=Node&Category!=Bench"
      NOT_FAST: "(Category=Host|Category=Slow|Category=Integration|Category=Bench)&Category!=Node"
      # Порог сторожа длительности в CI — единственное место. Стена теста на 4 vCPU раннера
      # под параллелью шумит в разы (сторож Host локально 1,9 с, здесь ~10 с), поэтому CI ловит
      # только грубые регрессии; гейт 5 с (CHECK_THRESHOLD в scripts/test-profile.py) — локально
      # и в предгейте, где машина своя
      DURATION_GUARD_THRESHOLD: "30"
    steps:
      - uses: actions/checkout@v4
      # ffmpeg для тестов монтажа без ИИ модуля «Звук» (ADR-021, этап 5).
      # В ubuntu-latest он есть в репозитории universe, но ставится явно — без
      # зависимости от состава предустановленного софта в будущих образах.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/*.csproj
      # Без restore свежий раннер не видит пакетов Test SDK, и `dotnet test --no-build` молча
      # ничего не запускает (код 0, ни одного TRX) — так прошёл первый прогон матрицы
      - name: Restore
        run: dotnet restore backend/ClaudeHomeServer.slnx
      - uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ${{ runner.temp }}
      - name: Unpack build output
        run: zstd -d -q -c "$RUNNER_TEMP/backend-build.tar.zst" | tar -xf -
      # Профиль прошлого прогона (job backend-profile) — веса раскладки; нет его — раскладка
      # по стабильному хешу имени класса, покрытие от этого не зависит
      - uses: actions/cache/restore@v4
        with:
          path: test-profile.json
          key: test-profile-${{ github.run_id }}
          restore-keys: test-profile-
      # Цель и фильтр шарда. Категория "Node" — за бортом: нужен Node + frontend/node_modules,
      # не ставим. Категория "Dns" на ubuntu-latest НЕ исключается: внешний DNS-резолв в CI
      # работает штатно (исторический прогон 02.09: 1317 passed), а выкинуть её — потерять
      # рабочие тесты, в т.ч. SSRF-страховку Reader. Шард «rest» гоняет slnx без монолита:
      # вынесенные тестовые проекты должны идти в том же гейте master.
      - name: Shard filter
        run: |
          case "${{ matrix.shard }}" in
            llm)
              echo "TARGET=backend/ClaudeHomeServer.Llm.Tests" >> "$GITHUB_ENV"
              echo "SHARD=" >> "$GITHUB_ENV" ;;
            rest)
              grep -v -e 'ClaudeHomeServer.Tests/ClaudeHomeServer.Tests.csproj' -e 'ClaudeHomeServer.Llm.Tests/ClaudeHomeServer.Llm.Tests.csproj' \
                backend/ClaudeHomeServer.slnx > backend/ClaudeHomeServer.Rest.slnx
              echo "TARGET=backend/ClaudeHomeServer.Rest.slnx" >> "$GITHUB_ENV"
              echo "SHARD=" >> "$GITHUB_ENV" ;;
            *)
              SHARD=$(python3 -I scripts/test-shards.py --list monolith-tests.txt --shard "${{ matrix.shard }}" --timings test-profile.json)
              echo "TARGET=backend/ClaudeHomeServer.Tests" >> "$GITHUB_ENV"
              echo "SHARD=($SHARD)&" >> "$GITHUB_ENV" ;;
          esac
      # Два прохода на шард: набор Fast отдельно — его TRX проверяет сторож длительности,
      # остальное (Host/Slow/Integration/Bench) — вторым проходом; вместе это весь шард.
      # Blame-режим: молчание тестового процесса дольше 5 минут — VSTest снимает дамп,
      # пишет в лог ИМЕНА тестов, выполнявшихся в этот момент, и валит шаг. По mini-дампу
      # дедлок не разобрать (dumpasync требует метаданных, которых в mini нет) — берём full.
      # Флаги vstest-консоли (--diagnostic и пр.) сюда нельзя: dotnet test в MSBuild-режиме
      # передаёт их MSBuild как неизвестные свитчи (MSB1001).
      - name: Test (Fast)
        run: >
          dotnet test "$TARGET" --no-build
          --filter "${SHARD}${FAST}"
          --logger "trx;LogFilePrefix=fast" --results-directory "$RUNNER_TEMP/trx/fast"
          --blame-hang-timeout 5m --blame-hang-dump-type full
      - name: Test (Host, Slow, Integration, Bench)
        if: success() || failure()
        run: >
          dotnet test "$TARGET" --no-build
          --filter "${SHARD}(${NOT_FAST})"
          --logger "trx;LogFilePrefix=rest" --results-directory "$RUNNER_TEMP/trx/rest"
          --blame-hang-timeout 5m --blame-hang-dump-type full
      # Сторож Э3: тест набора Fast дольше порога — нехостовый тест без метки Slow (гейт, блокирующий);
      # порог CI — DURATION_GUARD_THRESHOLD выше, тесты между 2 с и порогом печатаются без падения
      - name: Duration guard (Fast)
        run: python3 -I scripts/test-profile.py "$RUNNER_TEMP/trx/fast" --check --threshold "$DURATION_GUARD_THRESHOLD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trx-${{ matrix.key }}
          path: ${{ runner.temp }}/trx/**/*.trx
          retention-days: 7
      # Дампы и Sequence.xml blame складывает в TestResults — при падении выгружаем,
      # иначе они умирают вместе с раннером.
      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-artifacts-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/trx/**
            backend/**/TestResults/**

  # Профиль всего прогона в лог и в кэш: следующий прогон раскладывает шарды по нему
  backend-profile:
    name: Backend (profile)
    needs: backend-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: trx-m*
          path: trx
      - name: Profile
        run: |
          python3 -I scripts/test-profile.py trx
          python3 -I scripts/test-profile.py trx --json > test-profile.json
      - uses: actions/cache/save@v4
        with:
          path: test-profile.json
          key: test-profile-${{ github.run_id }}

  # ADR-016 2.5. Агент устройства (`backend/ClaudeHomeServer.DeviceAgent`) работает на
  # Linux и Windows, но основная задача `backend` гоняет только ubuntu-latest — платформенные
  # ветки (Job Object, DPAPI, `claude.cmd`, пути с буквами дисков, `FileSystemWatcher`)
  # проверялись бы только руками. Задача собирает и тестирует ТОЛЬКО DeviceAgent + .Tests
  # (не весь `slnx` — дорого и не нужно), отдельным прогоном на windows-latest. Общие
  # триггеры с `backend`, без `continue-on-error` — падение валит CI.
  device-agent-windows:
    name: DeviceAgent (windows)
    runs-on: windows-latest
    # 10 минут по требованию задачи: проект маленький (одна зависимость
    # `Microsoft.Extensions.Logging.Abstractions` плюс xunit), встроенный NuGet-кеш
    # `setup-dotnet` держит холодный старт ниже потолка. Превышение — сигнал поломки
    # кеша или неожиданной тяжёлой зависимости.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Тот же SDK, что у Linux-задачи `backend`: проекты на net10.0.
          dotnet-version: 10.0.x
          # Встроенный NuGet-кеш setup-dotnet: ключ по csproj двух проектов — попадание
          # в кеш не зависит от правок в остальной части репозитория. `cache: true` для
          # setup-dotnet работает на всех ОС, включая Windows.
          cache: true
          cache-dependency-path: |
            backend/ClaudeHomeServer.DeviceAgent/ClaudeHomeServer.DeviceAgent.csproj
            backend/ClaudeHomeServer.DeviceAgent.Tests/ClaudeHomeServer.DeviceAgent.Tests.csproj
      # Явный restore отдельным шагом: без него `dotnet build --no-restore` ниже упадёт
      # на отсутствующем project.assets.json — на чистом раннере obj/ нет. Тот же csproj,
      # что и Build, чтобы NuGet-кеш `setup-dotnet` (cache-dependency-path выше) попал
      # точно в прогрев. Вынос restore из build держит его лог читаемым при разборе падений.
      - name: Restore
        run: dotnet restore backend/ClaudeHomeServer.DeviceAgent.Tests/ClaudeHomeServer.DeviceAgent.Tests.csproj
      # Сборка тестового проекта (DeviceAgent.Tests) подтянет DeviceAgent по ProjectReference
      # транзитивно. Отдельный шаг сборки основного проекта не нужен — он уже в графе.
      # --no-restore обязателен: без него restore сольётся с build в один лог и провал
      # restore в общем потоке не разобрать.
      - name: Build
        run: dotnet build backend/ClaudeHomeServer.DeviceAgent.Tests/ClaudeHomeServer.DeviceAgent.Tests.csproj -warnaserror --no-restore
      # console;verbosity=normal — имена тестов в логе. Счётчик skipped валится глазами,
      # как требует задача: на windows-latest пропускаются `На_Unix_копия_исполняемая`
      # (права Unix) и `Платформа_Linux_определяется_ключом_манифеста` (ветка Linux), а
      # `Платформа_Windows_определяется_ключом_манифеста` — passed.
      - name: Test
        run: dotnet test backend/ClaudeHomeServer.DeviceAgent.Tests/ClaudeHomeServer.DeviceAgent.Tests.csproj --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # В коде ~116 существующих lint-ошибок — шаг информационный,
      # пока бэклог не расчищен; жёсткий гейт — typecheck и сборка
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
      # Сторож импортов MF-модулей «Редактор картинок» (ADR-018 §10.3) и «Звук» (ADR-021 §3) —
      # жёсткий гейт отдельным конфигом: в общем линте выше он тонул бы в легаси-долге
      # Видео — ADR-022, хосты контекста хода — ADR-023 §Д6
      - name: Lint remote guard (image-editor, audio-editor, video-editor, хосты контекста)
        run: npx eslint --config eslint.remote.config.js src/features/imageEditor src/features/audioEditor src/features/videoEditor src/components/chat src/components/generation
      - name: Build (tsc -b + vite)
        run: npm run build
      - name: Test
        run: npm test --if-present
