[Service]
# Решение Андрея 2026-09-19: размышления с бюджетом 512 + фраза перехода (--reasoning-config
# в .env стенда vLLM). 2026-09-23 бюджет поднят до 1024 после серии по обрезке thinking:
# старые блоки текущего хода снимает прокси, блоки прошлых ходов отбрасывает шаблон Qwen3.
Environment=THINKING_MODE=budget THINKING_BUDGET=1024
# Прунинг старых выводов инструментов и тел Write/Edit.
# PRUNE_INPUTS включён после повторов 2026-09-22 с честным лимитом вывода: метка в истории на
# письмо модели не влияет (12 из 12 запросов — полноценный текст), прежняя тревога о подражании
# была обрывом по лимиту 2500.
#
# PRUNE_THINKING ВЫКЛЮЧЕН по итогу опыта 2026-09-23 (задача f5983982). Прежнее включение опиралось
# на серию прямых запросов: отчёты с обрезкой несли те же факты, что контроль. Контролируемый
# прогон реальной задачи показал обратное — считает модель именно в черновых блоках, и без них
# она заканчивает фразу по памяти. Два прогона, отличавшиеся ТОЛЬКО этим флагом:
#   on : 12 ошибок фактов (3 major), неверны 5 чисел из 5 проверенных, документ 333 строки
#   off:  8 ошибок фактов (0 major), неверны 6 чисел из 32,            документ 796 строк
# Взамен обрезка не покупает ничего: прогон без неё даже короче (18,1 против 19,7 мин), пик
# занятости окна тот же (176 907 против 179 317). Подробности — README и итог задачи.
Environment=PRUNE_TOOL_RESULTS=on PRUNE_INPUTS=on PRUNE_THINKING=off
# Мера 4 (a68ac431): запрос автосжатия уходит на MiniMax вместо локали — 20,7 с против 330–450 с
# на локальной модели, сводка содержательнее. Ключ прокси читает сам из appsettings.Local.json,
# здесь только адрес. Без этой строки сжатие молча возвращается на локаль (`"compact": "off"`
# в /__proxy/stats).
Environment=COMPACT_UPSTREAM=https://api.minimax.io/anthropic
# Карточка обрезки контекста в ленте чата (3533ae5a): прокси шлёт событие бэкенду. Хост именно
# localhost — 127.0.0.1 нет в AllowedHosts прода. Без строки обрезка происходит молча.
Environment=BACKEND_EVENTS_URL=http://localhost/api/internal/llm-proxy/events
# ВАЖНО: этот файл — источник правды для боевой машины. Всё, что добавлено только в
# /etc/systemd/system/thinking-strip-proxy.service.d/, теряется при следующей раскатке отсюда:
# ровно так 2026-09-23 были потеряны две строки выше (сжатие ушло с облака на локаль, карточка
# обрезки перестала слаться) — правку на машине не перенесли сюда.
